name: refine-record
version: 1
description: >
  Per-iteration record written by `record` each loop pass. Declared with
  per_iteration: true on the output, so the engine injects the {iteration}
  counter into the path (data/refine-record_1.json, _2.json, ...).
type: object
required:
  - pass
  - iteration
  - note
properties:
  pass:
    type: integer
    description: "0-based pass index (from refine-current)."
  iteration:
    type: integer
    description: "The engine's iteration number, taken from the resolved output path."
  note:
    type: string
    description: "One short sentence."
