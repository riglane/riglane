<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow Trace Viewer</title>
<style>
  :root {
    --bg: #f4f6f9;
    --bg-card: #ffffff;
    --bg-hover: #eef0f5;
    --bg-section: #f8f9fb;
    --text: #1c1f2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #c2c9d6;
    --border-light: #b8bfce;
    --accent: #4a6fe8;
    --accent-light: #eaeffb;
    --green:    #2f9e5a;   --green-bg:   #edf7f2;
    --red:      #d94747;   --red-bg:     #fdeaea;
    --amber:    #b87316;   --amber-bg:   #fef5e4;
    --blue:     #3878c2;   --blue-bg:    #e8f0fb;
    --purple:   #7048c8;   --purple-bg:  #f0ebff;
    --teal:     #0e8a8a;   --teal-bg:    #e4f5f5;
    --rose:     #c2367e;   --rose-bg:    #fdeaf4;
    /* Lanes — a TRUE orange in the narrow hue gap between the delegation
       amber (~34) and red; same values as the workflow editor. */
    --orange:   #e05a1c;   --orange-bg:  #fdeee6;
    /* ONE COLOUR PER MECHANISM, shared with the workflow editor: whatever a
       mechanism looks like in the graph, it looks like here. These three names
       are the contract — never hardcode a hex for repetition/branching/
       delegation again (the two views had drifted into SWAPPED colours: the
       graph drew loops rose and routes teal, the trace drew loops teal and
       routes violet). */
    --mech-loop:       var(--rose);
    --mech-loop-bg:    var(--rose-bg);
    --mech-route:      var(--teal);
    --mech-route-bg:   var(--teal-bg);
    --mech-delegation: var(--amber);
    --mech-delegation-bg: var(--amber-bg);
    --mech-lanes:      var(--orange);
    --mech-lanes-bg:   var(--orange-bg);
    --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 7px;
    --radius-xs: 4px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-hover: #1e242c;
    --bg-section: #1a2030;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6a7585;
    --border: #2d343d;
    --border-light: #252c36;
    --accent: #7090f4;
    --accent-light: #131e40;
    --green:    #52c880;   --green-bg:   #0d2618;
    --red:      #e87070;   --red-bg:     #2d1010;
    --amber:    #d4963a;   --amber-bg:   #261a00;
    --blue:     #6aa8e8;   --blue-bg:    #0c1f36;
    --purple:   #a882e8;   --purple-bg:  #1a1030;
    --teal:     #4bc6c6;   --teal-bg:    #06282c;
    --rose:     #ee7ab4;   --rose-bg:    #2d0f21;
    --orange:   #f5884a;   --orange-bg:  #2e1408;
    --shadow: 0 1px 4px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.2);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Scrollbars are chrome, not content: thin, quiet, and only as visible as
     they need to be to say the area scrolls. Both themes redefine --border and
     --text-muted, so this follows the theme without restating any colour. */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px;
    border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────── */
  .header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
  .header-logo span { opacity: 0.45; font-weight: 400; margin-left: 2px; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    font-family: var(--font);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn-primary:hover { opacity: 0.88; background: var(--accent); }

  /* ── Drop zone ─────────────────────────────────────── */
  .drop-zone {
    max-width: 640px;
    margin: 80px auto;
    padding: 60px 40px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    text-align: center;
    transition: all 0.2s;
    background: var(--bg-card);
    box-shadow: var(--shadow);
  }
  .drop-zone.dragover { border-color: var(--accent); background: var(--accent-light); }
  .drop-zone h2 { font-size: 18px; margin-bottom: 8px; font-weight: 600; }
  .drop-zone p { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
  .drop-zone input[type="file"] { display: none; }

  /* ── Main ──────────────────────────────────────────── */
  .main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  /* ── Workflow card ─────────────────────────────────── */
  .wf-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .wf-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border-light);
  }
  .wf-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wf-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .wf-version {
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-hover);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .wf-meta { margin-top: 7px; font-size: 12px; color: var(--text-secondary); display: flex; gap: 18px; flex-wrap: wrap; }
  .wf-meta strong { color: var(--text); font-weight: 600; }

  /* Card sections */
  .wf-section {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-light);
  }
  .wf-section:last-child { border-bottom: none; }
  .wf-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 9px;
  }

  /* Description */
  .wf-description {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── Param table ───────────────────────────────────── */
  .param-table { display: flex; flex-direction: column; }
  .param-row {
    display: flex;
    gap: 0;
    align-items: flex-start;
  }
  .param-row + .param-row { border-top: 1px solid var(--border-light); }
  .param-name {
    width: 140px;
    min-width: 100px;
    flex-shrink: 0;
    padding: 9px 16px 9px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    font-family: var(--mono);
    line-height: 1.4;
  }
  .param-value-cell { flex: 1; padding: 9px 0; min-width: 0; }
  .param-value {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    word-break: break-word;
  }
  .param-value.unset { color: var(--text-muted); font-style: italic; font-weight: 400; }
  .param-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }

  /* ── Gate chips ────────────────────────────────────── */
  .wf-bottom-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .wf-bottom-col { flex: 0 0 auto; }
  .wf-bottom-col-right { flex: 0 0 auto; margin-left: auto; }

  .gate-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
  .gate-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .gate-chip-on  { background: var(--green-bg); color: var(--green); }
  .gate-chip-off { background: var(--bg-hover); color: var(--text-muted); border-color: var(--border-light); }
  .gate-chip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .gate-chip-on  .gate-chip-dot { background: var(--green); }
  .gate-chip-off .gate-chip-dot { background: var(--text-muted); }
  .gate-retries { font-size: 11px; color: var(--text-muted); }

  /* ── Tooltips ── */
  [data-tip] {
    cursor: pointer;
  }
  .tip-hint {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-muted);
    color: var(--bg-card);
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
    font-family: var(--sans);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    transition: opacity 0.1s;
  }
  .tip-popup {
    position: fixed;
    white-space: pre-line;
    background: var(--text);
    color: var(--bg);
    font-size: 11px;
    font-weight: 400;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    white-space: normal;
    max-width: 340px;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    pointer-events: none;
    animation: tipFadeIn 0.12s ease-out;
  }
  @keyframes tipFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Context */
  .context-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .context-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 4px 11px;
    background: var(--blue-bg);
    color: var(--blue);
    border-radius: 20px;
    font-weight: 500;
  }
  .context-chip-key { opacity: 0.75; }
  .context-chip-val { font-family: var(--mono); font-size: 11px; font-weight: 700; }

  /* ── Stats ─────────────────────────────────────────── */
  .stats { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stat-val { font-weight: 700; font-size: 20px; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text-muted); }

  /* ── Status pill ───────────────────────────────────── */
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .pill-completed     { background: var(--green-bg);  color: var(--green);  }
  .pill-failed        { background: var(--red-bg);    color: var(--red);    }
  .pill-in_progress,
  .pill-in-progress   { background: var(--blue-bg);   color: var(--blue);   }
  .pill-paused        { background: var(--amber-bg);  color: var(--amber);  }
  .pill-pending       { background: var(--bg-hover);  color: var(--text-secondary); }
  /* Live wheel next to IN PROGRESS — shown only while the run's engine process
     is actually ALIVE (state 'running' from /api/runs.json), so an in_progress
     label over a dead run never spins. currentColor keeps the pill's hue. */
  .live-spin {
    display: inline-block; width: 9px; height: 9px; margin-left: 6px;
    border: 1.5px solid currentColor; border-top-color: transparent;
    border-radius: 50%; vertical-align: -1px;
    animation: live-spin-rot 0.9s linear infinite;
  }
  @keyframes live-spin-rot { to { transform: rotate(360deg); } }

  /* ── Orchestration panel ──────────────────────────── */
  .orch-panel { margin-bottom: 20px; }
  .orch-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; cursor: pointer; user-select: none;
  }
  .orch-header:hover { background: var(--bg-hover); border-radius: var(--radius); }
  .orch-header .step-chevron {
    font-size: 10px; color: var(--text-muted);
    transition: transform 0.2s;
  }
  .orch-panel.open .orch-header .step-chevron { transform: rotate(90deg); }
  .orch-title { font-size: 14px; font-weight: 600; }
  .orch-meta { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
  .orch-body {
    display: none; padding: 4px 20px 16px;
    border-top: 1px solid var(--border-light);
  }
  .orch-panel.open .orch-body { display: block; }
  .orch-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; font-size: 13px;
    border-bottom: 1px solid var(--border-light);
  }
  .orch-row:last-child { border-bottom: none; }
  .orch-row-fail { background: var(--red-bg); border-radius: var(--radius-xs); padding: 5px 6px; }
  .orch-time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); min-width: 70px; }
  .orch-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .orch-dot-blue   { background: var(--blue); }
  .orch-dot-purple { background: var(--purple); }
  .orch-dot-green  { background: var(--green); }
  .orch-dot-amber  { background: var(--amber); }
  .orch-dot-gray   { background: var(--text-muted); }
  .orch-dot-fail   { background: var(--red); }
  .orch-tool { font-family: var(--mono); font-size: 12px; font-weight: 600; min-width: 140px; }
  .orch-step { font-size: 12px; color: var(--accent); }
  .orch-dur { font-size: 11px; color: var(--text-muted); font-family: var(--mono); min-width: 45px; text-align: right; }
  .orch-summary { font-size: 12px; color: var(--text-secondary); }
  .orch-error { font-size: 12px; color: var(--red); }

  /* ── Timeline ──────────────────────────────────────── */
  .timeline {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .timeline-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; }
  .timeline-bar { display: flex; height: 32px; border-radius: var(--radius-sm); overflow: hidden; gap: 3px; }
  .timeline-seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.93);
    cursor: pointer;
    transition: opacity 0.15s;
    min-width: 24px;
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: var(--radius-xs);
  }
  .timeline-seg:hover { opacity: 0.8; }
  .timeline-seg.completed   { background: var(--green); }
  .timeline-seg.failed      { background: var(--red); }
  .timeline-seg.in_progress,
  .timeline-seg.in-progress { background: var(--blue); }
  .timeline-seg.paused      { background: var(--amber); }
  .timeline-seg.pending     { background: var(--border); color: var(--text-secondary); }
  .timeline-durations { display: flex; gap: 3px; margin-top: 4px; }
  .timeline-dur {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Step cards ────────────────────────────────────── */
  .step-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  /* Phase 61: planning step visual distinction. Mirrors workflow-editor.html
     `.step-card-planning` styling so the user gets the same color cue across
     authoring + execution viewing. */
  .step-card.step-card-planning {
    background: var(--purple-bg);
    border-color: var(--purple);
  }
  .step-card.step-card-planning .step-header:hover { background: var(--purple-bg); filter: brightness(0.96); }
  /* Phase B: loop phase divider — horizontal rule with a pill label, the
     engine-flow-visualizer "STEP LOOP" idiom. Teal: distinct from planning
     (blue/purple) and delegation (amber). */
  .loop-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .loop-divider::before { content: ''; width: 16px; border-top: 2px dashed var(--mech-loop); opacity: 0.6; }
  .loop-divider::after { content: ''; flex: 1; border-top: 2px dashed var(--mech-loop); opacity: 0.6; }
  .loop-divider-label { padding: 3px 12px; border: 1.5px solid var(--mech-loop); color: var(--mech-loop); background: var(--mech-loop-bg); border-radius: 12px; font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .loop-divider.loop-divider-exit::before, .loop-divider.loop-divider-exit::after { border-top-style: solid; }
  /* Phase R: route transition divider — same shape as the loop divider, in the
     ROUTE mechanism colour (the graph's branch chips use the same one). Marks
     where execution moved between the main flow and a conditional route (or
     between nested routes). */
  .route-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .route-divider::before { content: ''; width: 16px; border-top: 2px dashed var(--mech-route); opacity: 0.6; }
  .route-divider::after { content: ''; flex: 1; border-top: 2px dashed var(--mech-route); opacity: 0.6; }
  .route-divider-label { padding: 3px 12px; border: 1.5px solid var(--mech-route); color: var(--mech-route); background: var(--mech-route-bg); border-radius: 12px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; cursor: help; }

  /* Lanes: the fork/join dividers and the side-by-side lane containers. */
  .lanes-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
  .lanes-divider::before { content: ''; width: 28px; border-top: 2px dashed var(--mech-lanes); }
  .lanes-divider::after { content: ''; flex: 1; border-top: 2px dashed var(--mech-lanes); }
  .lanes-divider.lanes-divider-join::before,
  .lanes-divider.lanes-divider-join::after { border-top-style: solid; }
  .lanes-divider-label { padding: 3px 12px; border: 1.5px solid var(--mech-lanes); color: var(--mech-lanes); background: var(--mech-lanes-bg); border-radius: 12px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; cursor: help; }
  /* Lane groups stack VERTICALLY, one full-width group per row: side-by-side
     columns squeezed every card (unreadable at 3+ lanes) and fought the
     expandable card layout. Concurrency is conveyed by the lane stamps and
     timestamps, not by horizontal placement. */
  .lanes-row { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
  .lane-group { border-left: 3px solid var(--mech-lanes); border-radius: 6px; padding: 6px 8px; background: color-mix(in srgb, var(--mech-lanes-bg) 40%, var(--bg)); }
  .lane-group-header { display: flex; align-items: center; gap: 8px; font: 700 10.5px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mech-lanes); padding: 2px 2px 6px; }


  /* F7: delegation block divider — same shape as loop/route dividers, amber
     to match the delegation card family. Marks where execution enters the
     delegated child workflow's steps (embedded block) and returns. */
  .delegation-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .delegation-divider::before { content: ''; width: 16px; border-top: 2px dashed var(--amber); opacity: 0.6; }
  .delegation-divider::after { content: ''; flex: 1; border-top: 2px dashed var(--amber); opacity: 0.6; }
  .delegation-divider-label { padding: 3px 12px; border: 1.5px solid var(--mech-delegation); color: var(--mech-delegation); background: var(--mech-delegation-bg); border-radius: 12px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; cursor: help; }
  .delegation-divider.delegation-divider-exit::before, .delegation-divider.delegation-divider-exit::after { border-top-style: solid; }

  /* Delegation step visual distinction (amber). Mirrors planning pattern. */
  .step-card.step-card-delegation {
    background: var(--amber-bg);
    border-color: var(--amber);
  }
  .step-card.step-card-delegation .step-header:hover { background: var(--amber-bg); filter: brightness(0.96); }
  .delegate-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: var(--mono); background: var(--amber-bg); color: var(--amber); }
  .delegation-panel { padding: 14px 20px 14px 56px; border-bottom: 1px solid var(--border-light); }
  .delegation-header { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 10px; }
  /* Child workflow group — indented steps below planning/delegation parent */
  .child-workflow-group {
    margin: 4px 0 12px 40px;
    padding: 12px 16px 8px;
    border-left: 3px solid var(--purple);
    border-radius: 0 var(--radius) var(--radius) 0;
    background: color-mix(in srgb, var(--purple-bg) 40%, var(--bg));
  }
  .child-workflow-group.child-workflow-group-delegation {
    border-left-color: var(--amber);
    background: color-mix(in srgb, var(--amber-bg) 40%, var(--bg));
  }
  .child-workflow-group-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
  }
  .child-workflow-group-header .pill { font-size: 9px; }
  .child-workflow-group .step-card { margin-bottom: 8px; }
  /* Auto-refresh toast notification */
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: #fff; z-index: 9999; pointer-events: none; animation: toastFade 2.5s ease forwards; }
  .toast-updated { background: var(--green); }
  .toast-info { background: var(--blue); }
  @keyframes toastFade { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }
  /* Auto-refresh button active state */
  .btn-auto-refresh-on { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .btn-auto-refresh-on::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  /* Planning panel inside step details. */
  .planning-panel { padding: 14px 20px 14px 56px; border-bottom: 1px solid var(--border-light); }
  .planning-header { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 10px; }
  .planning-phase-pill { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  .planning-phase-pill.planning,
  .planning-phase-pill.validating { background: var(--blue-bg); color: var(--blue); }
  .planning-phase-pill.executing { background: var(--amber-bg); color: var(--amber); }
  .planning-phase-pill.completed { background: var(--green-bg); color: var(--green); }
  .planning-phase-pill.failed { background: var(--red-bg); color: var(--red); }
  .planning-attempts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .planning-attempt { display: flex; gap: 10px; padding: 6px 10px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 4px; font-size: 12px; align-items: flex-start; }
  .planning-attempt-num { font-weight: 600; font-family: var(--mono); color: var(--text-secondary); flex-shrink: 0; min-width: 28px; }
  .planning-attempt-ts { font-size: 10px; color: var(--text-muted); font-family: var(--mono); flex-shrink: 0; min-width: 90px; }
  .planning-attempt-ok { color: var(--green); flex-shrink: 0; }
  .planning-attempt-fail { color: var(--red); flex-shrink: 0; }
  .planning-attempt-summary { flex: 1; word-break: break-word; line-height: 1.5; }

  /* Phase 61 Slice U4 — child trace inline rendering. The child block sits
     under the planning step's panel; its inner steps reuse the standard
     .step-card markup, but the wrapper indents + adds a left border so the
     parent/child relationship is visually obvious. */
  .child-trace-block {
    margin-top: 12px;
    padding: 10px 0 0 16px;
    border-left: 3px solid var(--blue);
  }
  .child-trace-block-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    margin-bottom: 8px;
  }
  .child-trace-block-header .pill { text-transform: none; letter-spacing: 0; }
  .child-trace-load-btn {
    padding: 6px 12px; font-size: 12px; font-family: var(--mono);
    background: var(--bg-card); color: var(--blue);
    border: 1px solid var(--blue); border-radius: 4px; cursor: pointer;
    transition: background 0.15s;
  }
  .child-trace-load-btn:hover { background: var(--blue-bg); }
  .child-trace-error {
    margin-top: 8px; padding: 8px 12px; font-size: 12px;
    color: var(--red); background: var(--red-bg);
    border: 1px solid var(--red); border-radius: 4px;
  }
  .child-trace-fallback {
    margin-top: 8px; padding: 8px 12px; font-size: 12px;
    color: var(--text-secondary); background: var(--bg-card);
    border: 1px dashed var(--border); border-radius: 4px;
  }
  .child-trace-fallback input[type=file] { font-size: 11px; margin-top: 4px; }
  .child-trace-loading {
    font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px 0;
  }
  .step-header {
    padding: 13px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.12s;
    user-select: none;
  }
  .step-header:hover { background: var(--bg-hover); }
  .step-chevron { width: 16px; height: 16px; transition: transform 0.2s; color: var(--text-muted); flex-shrink: 0; }
  .step-card.open .step-chevron { transform: rotate(90deg); }
  .step-index {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }
  .step-index.completed   { background: var(--green-bg);  color: var(--green);  }
  .step-index.failed      { background: var(--red-bg);    color: var(--red);    }
  .step-index.in_progress,
  .step-index.in-progress { background: var(--blue-bg);   color: var(--blue);   }
  .step-index.pending     { background: var(--bg-hover);  color: var(--text-secondary); }
  /* Pending step card: faded appearance */
  .step-card-pending { opacity: 0.45; }
  .step-card-pending .step-header:hover { opacity: 0.7; }

  /* ── Run-inbox dialog (human gate waiting for an answer) ── */
  .step-card-inbox-waiting { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber-bg); }
  .inbox-await-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; background: var(--amber-bg); color: var(--amber); animation: inboxPulse 2s ease-in-out infinite; }
  @keyframes inboxPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .inbox-dlg { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--bg-section); }
  .inbox-dlg.waiting { border-color: var(--amber); background: var(--amber-bg); }
  .inbox-dlg-kind { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--purple); }
  .inbox-dlg-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 4px 0 2px; }
  .inbox-dlg-body { font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 5px; }
  .inbox-dlg-req { margin: 8px 0 0; padding: 7px 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; font-family: var(--mono); font-size: 11.5px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .inbox-dlg-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .inbox-btn { height: 28px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-card); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .inbox-btn.accept { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .inbox-btn.reject { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .inbox-btn.send { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }
  /* Predefined alternatives: a vertical pick-one list in amber — distinct
     from yes/no (green/red) and from free text / Send (purple). */
  .inbox-choicecap { margin-top: 9px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--amber); }
  .inbox-choicelist { display: flex; flex-direction: column; align-items: stretch; gap: 5px; margin-top: 5px; max-width: 440px; }
  .inbox-choice { display: flex; align-items: center; gap: 9px; text-align: left; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--amber); background: var(--bg-card); font: inherit; font-size: 12px; color: var(--text); cursor: pointer; transition: background .12s ease; }
  .inbox-choice::before { content: ''; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--amber); background: transparent; flex: 0 0 auto; }
  .inbox-choice:hover { background: var(--amber-bg); }
  .inbox-choice.sel { background: var(--amber-bg); font-weight: 700; box-shadow: inset 0 0 0 1px var(--amber); }
  .inbox-choice.sel::before { background: var(--amber); box-shadow: inset 0 0 0 2.5px var(--bg-card); }
  /* The agent's suggestion (request.recommended): a badge, never a preselect —
     the same tag the terminal entry carries, so every channel shows it. */
  .inbox-choice .rec { margin-left: auto; flex: 0 0 auto; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--amber); border: 1px solid var(--amber); border-radius: 999px; padding: 1px 7px; }
  /* Stale-page banner: the served tool changed under a long-open viewer. */
  .stale-banner { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--amber); background: var(--amber-bg); color: var(--text); font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
  .stale-banner button { height: 26px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--amber); background: var(--amber); color: #fff; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .inbox-dlg-text { width: 100%; min-height: 48px; margin-top: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; font: inherit; font-size: 12px; resize: vertical; background: var(--bg-card); color: var(--text); }
  .inbox-dlg-answered { margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
  .inbox-dlg-anstext { color: var(--text); }
  .inbox-item { margin-top: 9px; padding: 8px 11px; border: 1px solid var(--border); border-left: 3px solid var(--purple); border-radius: 8px; background: var(--bg-card); }
  .inbox-item-t { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .inbox-btn.sel { outline: 2px solid currentColor; outline-offset: 1px; }
  /* A marked verdict must be unmistakable (live: a selected Accept read as
     unselected) — the selected button flips to a solid fill. */
  .inbox-btn.accept.sel { background: var(--green); border-color: var(--green); color: #fff; outline: none; }
  .inbox-btn.reject.sel { background: var(--red); border-color: var(--red); color: #fff; outline: none; }
  .step-name  { font-weight: 600; font-size: 14px; font-family: var(--mono); }
  .step-model { font-size: 11px; color: var(--purple); font-family: var(--mono); padding: 2px 8px; background: var(--purple-bg); border: 1px solid var(--purple); border-radius: 10px; margin-right: auto; opacity: 0.85; }
  .step-stats { display: flex; gap: 12px; font-size: 11px; color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
  .step-stats span { white-space: nowrap; }

  /* Step details */
  .step-details { display: none; border-top: 1px solid var(--border-light); }
  .step-card.open .step-details { display: block; }

  .detail-block {
    padding: 14px 20px 14px 56px;
    border-bottom: 1px solid var(--border-light);
  }
  .detail-block:last-child { border-bottom: none; }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  /* Step config chips */
  .step-config-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .step-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .step-chip-key { opacity: 0.75; }
  .step-chip-on      { background: var(--green-bg);  color: var(--green);  }
  .step-chip-off     { background: var(--bg-hover);  color: var(--text-muted);  border-color: var(--border-light); }
  .step-chip-inherit { background: var(--purple-bg); color: var(--purple); }
  .step-chip-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .step-chip-on  .step-chip-dot { background: var(--green); }
  .step-chip-off .step-chip-dot { background: var(--text-muted); }

  /* Gate results */
  .gate-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .gate-icon { font-size: 13px; }
  .gate-pass { color: var(--green); }
  .gate-fail { color: var(--red); }
  .gate-info { color: var(--text-secondary); font-size: 12px; }

  /* Invocations */
  .invocation {
    background: var(--bg-section);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .invocation-header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .invocation-iter { font-weight: 600; font-size: 12px; }

  /* Retry badges */
  .retry-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .retry-gate { background: var(--amber-bg); color: var(--amber); }
  .branch-badge { background: var(--blue-bg); color: var(--blue); }

  /* Subagent group (nested view) */
  .subagent-group {
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .subagent-header {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--bg-section);
    cursor: pointer;
    user-select: none;
    font-size: 13px;
  }
  .subagent-header:hover { background: var(--bg-hover); }
  .subagent-toggle { font-size: 10px; color: var(--text-muted); transition: transform 0.15s; }
  .subagent-group.open .subagent-toggle { transform: rotate(90deg); }
  .subagent-label { font-weight: 600; font-size: 12px; }
  .subagent-body {
    display: none;
    padding: 0 14px 8px;
    border-top: 1px solid var(--border-light);
  }
  .subagent-group.open .subagent-body { display: block; }
  .subagent-children {
    display: none;
    padding: 4px 14px 8px 28px;
    border-top: 1px solid var(--border-light);
  }
  .subagent-group.open .subagent-children { display: block; }

  .subagent-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

  /* ── Subagent Timeline (Gantt) ── */
  .gantt-container {
    margin-top: 8px;
    padding: 12px 0 4px;
  }
  .gantt-axis {
    position: relative;
    height: 20px;
    margin: 0 0 2px 130px;
    border-bottom: 1px solid var(--border);
  }
  .gantt-tick {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    font-size: 9px;
    font-family: var(--mono);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .gantt-tick::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    width: 1px;
    height: 5px;
    background: var(--border);
  }
  .gantt-row {
    display: flex;
    align-items: center;
    height: 26px;
    margin: 2px 0;
  }
  .gantt-label {
    width: 130px;
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-secondary);
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    padding-right: 8px;
    text-align: right;
    font-family: var(--mono);
  }
  .gantt-track {
    flex: 1;
    position: relative;
    height: 18px;
    background: var(--bg-section);
    border-radius: 3px;
  }
  .gantt-bar {
    position: absolute;
    top: 2px;
    height: 14px;
    border-radius: 3px;
    min-width: 3px;
    transition: opacity 0.15s;
  }
  .gantt-bar:hover {
    opacity: 0.85;
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .gantt-bar-pass   { background: var(--green); }
  .gantt-bar-fail   { background: var(--red); }
  .gantt-bar-retry  { background: var(--amber); opacity: 0.5; }
  .gantt-bar-text {
    position: absolute;
    top: 0;
    left: 6px;
    line-height: 14px;
    font-size: 9px;
    font-family: var(--mono);
    color: #fff;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .gantt-legend {
    display: flex;
    gap: 14px;
    margin: 8px 0 0 130px;
    font-size: 10px;
    color: var(--text-muted);
  }
  .gantt-legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 3px;
    vertical-align: middle;
  }

  .gate-retry-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-light);
  }
  .gate-retry-row:last-child { border-bottom: none; }

  /* ── Attempt blocks within subagent ── */
  .attempt-block {
    border-top: 1px solid var(--border-light);
    padding: 10px 14px;
    position: relative;
  }
  .attempt-block:first-child { border-top: none; }
  .attempt-block-retry {
    background: color-mix(in srgb, var(--amber) 15%, var(--bg-card));
    border-left: 3px solid var(--amber);
  }
  .attempt-block-pass {
    background: color-mix(in srgb, var(--green) 15%, var(--bg-card));
    border-left: 3px solid var(--green);
  }
  .attempt-block-fail {
    background: color-mix(in srgb, var(--red) 15%, var(--bg-card));
    border-left: 3px solid var(--red);
  }
  .attempt-header {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .attempt-label {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .attempt-label-primary { background: var(--blue-bg); color: var(--blue); }
  .attempt-label-retry { background: var(--blue-bg); color: var(--blue); }
  .attempt-stats {
    display: flex;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
  }

  /* ── Gate section (separated from invocation body) ── */
  .gate-section {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    background: var(--bg-section);
  }
  .gate-section-pass {
    border-color: var(--green);
    border-left-width: 3px;
  }
  .gate-section-fail {
    border-color: var(--red);
    border-left-width: 3px;
  }
  .gate-header-row {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .gate-type-label {
    font-weight: 600;
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* ── Feedback arrow (gate → next retry) ── */
  .feedback-arrow {
    margin: 6px 0 2px;
    padding: 6px 12px;
    background: var(--amber-bg);
    border: 1px dashed var(--amber);
    border-radius: var(--radius-sm);
    font-size: 11px;
    color: var(--amber);
    position: relative;
  }
  .feedback-arrow::before {
    content: '↓ feedback sent to next attempt';
    display: block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .feedback-arrow-text {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 120px;
    overflow-y: auto;
  }

  /* Invocation detail sections */
  .inv-meta { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .inv-meta-item { font-size: 11px; color: var(--text-muted); }
  .inv-meta-item strong { color: var(--text-secondary); font-weight: 600; }
  .inv-expandable {
    margin-top: 8px;
    border-top: 1px solid var(--border-light);
    padding-top: 8px;
  }
  .inv-expandable summary {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .inv-expandable summary:hover { text-decoration: underline; }
  .inv-prompt-text, .inv-summary-text {
    margin-top: 6px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xs);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    color: var(--text-secondary);
  }
  .retry-step { background: var(--blue-bg);  color: var(--blue);  }

  /* Warnings banner */
  .warnings-banner {
    background: var(--amber-bg);
    border: 1px solid var(--amber);
    border-left-width: 4px;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin: 12px 0;
  }
  .warnings-title {
    font-weight: 700;
    font-size: 13px;
    color: var(--amber);
    margin-bottom: 6px;
  }
  .warnings-list {
    margin: 0;
    padding-left: 18px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .warnings-list li { margin-bottom: 2px; }

  /* Gate failure */
  .gate-failure-detail {
    margin-top: 8px;
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-left-width: 3px;
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .gate-failure-header {
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gate-failure-header:hover { opacity: 0.8; }
  .gate-failure-toggle { font-size: 9px; transition: transform 0.15s; }
  .gate-failure-detail.open .gate-failure-toggle { transform: rotate(90deg); }
  .gate-failure-body {
    display: none;
    padding: 0 12px 8px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--red);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
  }
  .gate-failure-detail.open .gate-failure-body { display: block; }

  /* Goal text */
  .goal-text {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-section);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
    max-height: 280px;
    overflow-y: auto;
  }

  /* IO paths */
  .io-group + .io-group { margin-top: 10px; }
  .io-group-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .io-list { list-style: none; font-size: 12px; }
  .io-list li { padding: 3px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .io-path { font-family: var(--mono); color: var(--text-secondary); font-size: 11px; }
  .io-tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 500;
    background: var(--bg-hover);
    color: var(--text-secondary);
  }
  .io-tag-warn { background: var(--amber-bg); color: var(--amber); }
  /* Resolved-IO section (polish): collapsed by default via native <details>. */
  .io-section > summary.io-section-summary {
    cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 0; list-style: revert;
  }
  .io-section[open] > summary.io-section-summary { margin-bottom: 6px; }
  .io-file-list { list-style: none; margin: 2px 0 4px 14px; width: 100%; }
  .io-file-list > li { padding: 2px 0; display: block; }
  .io-empty { font-size: 11px; color: var(--text-muted); font-style: italic; }
  .io-preview { margin-top: 3px; }
  .io-preview > summary { cursor: pointer; font-size: 10px; color: var(--blue); }
  .io-pre {
    font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow: auto; margin-top: 4px; padding: 6px 8px;
    background: var(--bg-section); border-radius: 4px; color: var(--text-secondary);
  }

  /* Modified files */
  .file-list { list-style: none; font-family: var(--mono); font-size: 11px; margin-top: 6px; }
  .file-list li { padding: 2px 0; color: var(--text-secondary); }
  .file-list li::before { content: '↳ '; color: var(--text-muted); }

  /* Details/summary */
  details { margin-top: 4px; }
  details summary { font-size: 12px; color: var(--accent); cursor: pointer; user-select: none; }
  details summary:hover { text-decoration: underline; }
  details[open] summary { margin-bottom: 6px; }

  /* Timing */
  .timing-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
  .timing-row strong { color: var(--text); }

  /* Summary */
  .summary-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  /* ── Tool call rows (per-step) ───────────────────── */
  .tool-call-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; flex-wrap: wrap; cursor: pointer; }
  /* Collapse-by-default: only the one-line row shows; click to reveal args+result. */
  .tool-call-caret { display: inline-block; width: 9px; font-size: 9px; color: var(--text-muted); transition: transform 0.1s; }
  .tool-call.expanded .tool-call-caret { transform: rotate(90deg); }
  .tool-call-detail { display: none; margin: 2px 0 4px 20px; }
  .tool-call.expanded .tool-call-detail { display: block; }
  .tool-call-kv { font-family: var(--mono); font-size: 10px; color: var(--text-muted); background: var(--bg-section); padding: 4px 8px; border-radius: 4px; margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
  .tool-call-kv-tag { color: var(--text-secondary); font-weight: 600; margin-right: 6px; text-transform: uppercase; font-size: 9px; }
  .tool-call-name { font-weight: 600; color: var(--purple); }
  .tool-call-source { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; text-transform: uppercase; }
  .tool-call-source-script { background: var(--green-bg); color: var(--green); }
  .tool-call-source-mcp { background: var(--purple-bg); color: var(--purple); }
  .tool-call-source-builtin { background: var(--amber-bg); color: var(--amber); }
  .tool-call-source-shell { background: var(--bg-section); color: var(--text-secondary); }
  .tool-call-source-other { background: var(--bg-section); color: var(--text-muted); }
  .tool-call-args { font-family: var(--mono); font-size: 10px; color: var(--text-secondary); }
  .tool-call-preview { font-family: var(--mono); font-size: 10px; color: var(--text-muted); background: var(--bg-section); padding: 3px 8px; border-radius: 4px; margin: 2px 0 2px 20px; max-height: 40px; overflow: hidden; cursor: pointer; white-space: pre-wrap; word-break: break-all; }
  .tool-call-preview.expanded { max-height: none; }
  .tool-calls-section { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border-light); }
  .tool-calls-section-title { font-size: 11px; font-weight: 600; color: var(--purple); margin-bottom: 4px; }
  .tool-warning-box { background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--radius-sm); padding: 8px 12px; margin: 6px 0; }
  .tool-warning-row { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--amber); padding: 3px 0; }
  .tool-warning-icon { flex: 0 0 auto; font-size: 14px; line-height: 1; }
  .tool-warning-text { flex: 1; }
  .tool-warning-tool { font-weight: 600; }
  .tool-warning-type { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; text-transform: uppercase; background: var(--amber-bg); border: 1px solid var(--amber); }
  .timeline-tc-marker { width: 6px; height: 6px; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 2; opacity: 0.9; }
  .timeline-tc-marker:hover { opacity: 1; transform: translateY(-50%) scale(1.5); }
  .timeline-tc-marker-script { background: var(--green); }
  .timeline-tc-marker-mcp { background: var(--purple); }
  .timeline-tc-marker-builtin { background: var(--amber); }
  .timeline-tc-marker-shell { background: var(--text-secondary); }
  .timeline-tc-marker-other { background: var(--text-muted); }

  /* Utility */
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }
</style>
</head>
<body>
  <div class="header">
    <div class="header-logo">Trace Viewer <span>| Riglane</span> <span style="font-size:10px;opacity:0.35">v2.5 (2026-08-06)</span></div>
    <div class="header-actions">
      <button class="btn hidden" id="btnLoad" onclick="openFilePicker()">Load Trace</button>
      <button class="btn hidden" id="btnAutoRefresh" onclick="toggleAutoRefresh()">Auto-refresh</button>
      <input type="file" id="fileInput" accept=".json,.trace.json">
      <button class="btn" id="btnTheme" onclick="toggleTheme()">Dark</button>
    </div>
  </div>

  <div id="dropZone" class="drop-zone">
    <h2>Load a Trace File</h2>
    <p>Drag & drop a <code>.trace.json</code> file here, or click to browse</p>
    <button class="btn btn-primary" onclick="openFilePicker()">Choose File</button>
  </div>

  <div id="content" class="main hidden"></div>

  <script>
    // ─── Workflow Studio integration ─────────────────────
    // Opened top-level (not embedded), redirect to the unified Workflow Studio
    // (Traces section), preserving the ?trace= deep link so the engine's
    // auto-open lands in the new tool. Inside the studio iframe (window.top
    // differs) this is skipped and the viewer runs verbatim.
    if (window.self === window.top) {
      try {
        const _p = new URLSearchParams(location.search);
        const _t = _p.get('trace');
        // The per-serve token MUST survive this hop — the engine's auto-open
        // URL carries it, and every token-gated POST the studio makes (inbox
        // respond, save, validate) 403s without it.
        const _tok = _p.get('rl_token');
        window.location.replace('workflow-studio.html?section=traces'
          + (_t ? '&trace=' + encodeURIComponent(_t) : '')
          + (_tok ? '&rl_token=' + encodeURIComponent(_tok) : ''));
      } catch (e) {}
    }
    // ─── State ───────────────────────────────────────────
    let trace = null;
    let fileHandle = null;       // FileSystemFileHandle for auto-refresh
    let autoRefreshTimer = null; // setInterval ID
    let lastTraceJson = '';      // raw JSON for change detection

    // Workflow Studio hook: render a trace from raw JSON text (studio "Load
    // trace" file picker hands the text in). Function-hoisted; runs after
    // render() is defined.
    window.__studioLoadTraceText = function (text) {
      try { trace = JSON.parse(text); lastTraceJson = text; render(); }
      catch (e) { try { alert('Invalid trace JSON: ' + e.message); } catch (x) {} }
    };

    // ─── Toast notification ──────────────────────────────
    function showToast(msg, type = 'updated') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // ─── Auto-refresh (File System Access API) ───────────
    function toggleAutoRefresh() {
      if (autoRefreshTimer) { stopAutoRefresh(); return; }
      startAutoRefresh();
    }

    async function startAutoRefresh() {
      // If no file handle yet, try to acquire one from the already-loaded file.
      if (!fileHandle) {
        if (!window.showOpenFilePicker) {
          showToast('Auto-refresh requires Chrome/Edge (File System Access API)', 'info');
          return;
        }
        // Ask user to re-select the same file (needed for FS handle permission).
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'Trace JSON', accept: { 'application/json': ['.json'] } }],
          });
          fileHandle = handle;
        } catch {
          return; // User cancelled
        }
      }
      // Snapshot current content for change detection.
      try {
        const file = await fileHandle.getFile();
        lastTraceJson = await file.text();
      } catch {}
      const btn = document.getElementById('btnAutoRefresh');
      btn.classList.add('btn-auto-refresh-on');
      btn.textContent = 'Auto-refresh';
      autoRefreshTimer = setInterval(pollFile, 5000);
      showToast('Auto-refresh ON (5s)', 'info');
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
      const btn = document.getElementById('btnAutoRefresh');
      btn.classList.remove('btn-auto-refresh-on');
      btn.textContent = 'Auto-refresh';
    }

    // Apply a freshly-read trace JSON string: diff vs current, re-render, and
    // show an informative toast. Shared by the File System Access API poll
    // (pollFile) and the http URL poll (pollUrl). No-op if unchanged.
    function applyNewTraceText(text) {
      if (text === lastTraceJson) return; // No change
      lastTraceJson = text;
      const prev = trace;
      trace = JSON.parse(text);

      // Detect what changed for toast message
      const prevSteps = (prev && prev.steps) ? prev.steps.length : 0;
      const curSteps = (trace.steps || []).length;
      const lastStep = curSteps > 0 ? trace.steps[curSteps - 1] : null;
      let toastMsg = 'Trace updated';
      if (curSteps > prevSteps && lastStep) {
        toastMsg = `Step ${curSteps}: ${lastStep.name} (${lastStep.status || 'new'})`;
      } else if (lastStep && lastStep.status === 'completed' && prev) {
        const prevStep = prev.steps && prev.steps.find(s => s.name === lastStep.name);
        if (prevStep && prevStep.status !== 'completed') {
          toastMsg = `Step completed: ${lastStep.name}`;
        }
      }
      if (trace.status === 'completed' || trace.status === 'failed') {
        toastMsg = `Workflow ${trace.status}`;
        stopAutoRefresh();
      }

      render();
      showToast(toastMsg);
    }

    async function pollFile() {
      if (!fileHandle) { stopAutoRefresh(); return; }
      try {
        const file = await fileHandle.getFile();
        applyNewTraceText(await file.text());
      } catch {
        // File read error — skip this poll cycle
      }
    }

    // ─── Theme ───────────────────────────────────────────
    function toggleTheme() {
      const d = document.documentElement;
      const dark = d.getAttribute('data-theme') === 'dark';
      d.setAttribute('data-theme', dark ? 'light' : 'dark');
      document.getElementById('btnTheme').textContent = dark ? 'Dark' : 'Light';
    }

    // ─── File loading ─────────────────────────────────────
    const dz = document.getElementById('dropZone');
    const fi = document.getElementById('fileInput');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', async e => {
      e.preventDefault(); dz.classList.remove('dragover');
      // Try to get FileSystemFileHandle from drop (Chrome 86+).
      const items = e.dataTransfer.items;
      if (items && items.length > 0 && items[0].getAsFileSystemHandle) {
        try {
          const handle = await items[0].getAsFileSystemHandle();
          if (handle && handle.kind === 'file') { fileHandle = handle; }
        } catch {}
      }
      if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    // Primary file open: use showOpenFilePicker (gives persistent handle for
    // auto-refresh) with fallback to <input type="file"> for Firefox.
    async function openFilePicker() {
      if (window.showOpenFilePicker) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'Trace JSON', accept: { 'application/json': ['.json'] } }],
          });
          fileHandle = handle;
          const file = await handle.getFile();
          loadFile(file);
        } catch { /* user cancelled */ }
      } else {
        fi.click(); // Fallback
      }
    }
    dz.addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') openFilePicker(); });
    fi.addEventListener('change', () => { if (fi.files.length) loadFile(fi.files[0]); });

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          lastTraceJson = e.target.result;
          trace = JSON.parse(lastTraceJson);
          render();
          // Auto-start refresh if we have a file handle and trace is in_progress.
          if (fileHandle && !autoRefreshTimer && trace.status === 'in_progress') {
            startAutoRefresh();
          }
        }
        catch (err) { alert('Invalid JSON: ' + err.message); }
      };
      reader.readAsText(file, 'UTF-8');
    }

    // ─── Auto-load via ?trace= URL param (served over http) ──
    // When opened by the engine (auto_open_trace_viewer) the page is served
    // over http://127.0.0.1, so fetch() of the trace works (unlike file://).
    // Live updates use plain re-fetch polling — no File System Access API, so
    // this path works in every browser including Firefox.
    function startUrlAutoRefresh(url) {
      if (autoRefreshTimer) return;
      const btn = document.getElementById('btnAutoRefresh');
      btn.classList.remove('hidden');
      btn.classList.add('btn-auto-refresh-on');
      btn.textContent = 'Auto-refresh';
      autoRefreshTimer = setInterval(() => pollUrl(url), 5000);
      showToast('Auto-refresh ON (5s)', 'info');
    }

    async function pollUrl(url) {
      try {
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) return;
        applyNewTraceText(await resp.text());
      } catch {
        // Network/read error — skip this poll cycle (server may have stopped).
      }
      void pollInbox();
      void checkToolVersion();
    }

    // ─── Stale-page detection ─────────────────────────────────────────────
    // This page is served live from the installed tools directory, which is
    // refreshed whenever Riglane is upgraded or the server restarts. A viewer
    // left open across an upgrade keeps running the OLD script forever — its
    // auto-refresh renews the DATA, never the code — so fixed defects look
    // unfixed. Poll our own URL (HEAD, no body) and compare Last-Modified.
    let _toolStamp = null;
    let _staleShown = false;
    async function checkToolVersion() {
      try {
        const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
        if (!r.ok) return;
        const stamp = r.headers.get('Last-Modified');
        if (!stamp) return;
        if (_toolStamp === null) { _toolStamp = stamp; return; }
        if (stamp !== _toolStamp && !_staleShown) { _staleShown = true; showStaleBanner(); }
      } catch { /* offline — try again next cycle */ }
    }
    function showStaleBanner() {
      const bar = document.createElement('div');
      bar.className = 'stale-banner';
      bar.innerHTML = '<span>This viewer was updated on disk — you are running the older page.</span>';
      const btn = document.createElement('button');
      btn.textContent = 'Reload';
      btn.onclick = () => location.reload();
      bar.appendChild(btn);
      document.body.appendChild(bar);
    }

    // ─── Run inbox (human-gate dialog on the step cards) ──────────────────
    // Served traces only: the run's inbox rides the same server. A step whose
    // human gate uses the inbox channel gets an answer dialog right on its
    // card; the POST carries the per-serve token this page was opened with.
    let inboxCtx = null;      // { base, runId, token } — null when not served
    let inboxMsgs = [];
    let _inboxSig = '';
    const _ivDraft = {};      // message_id → { choice, text }

    function initInbox(traceUrl) {
      const m = /^(.*?)\/local\/workflow_runs\/([^/]+)\/trace\.json/.exec(traceUrl || '');
      if (!m) return;
      let token = null;
      try { token = new URLSearchParams(location.search).get('rl_token'); } catch (e) { token = null; }
      inboxCtx = { base: m[1] || '', runId: m[2], token };
      void pollInbox();
    }
    async function pollInbox() {
      if (!inboxCtx) return;
      try {
        const r = await fetch(inboxCtx.base + '/api/inbox.json?run=' + encodeURIComponent(inboxCtx.runId), { cache: 'no-store' });
        if (!r.ok) return;
        const list = await r.json();
        if (!Array.isArray(list)) return;
        const sig = JSON.stringify(list.map(x => [x.message_id, msgState(x), x.response ? x.response.type : null]));
        if (sig !== _inboxSig) { _inboxSig = sig; inboxMsgs = list; if (trace) render(); }
      } catch (e) { /* inbox unreachable — cards simply carry no dialog */ }
      void pollRunActive();
    }
    /* Is the run's engine process actually ALIVE? Drives the live-spin wheel:
       an in_progress label over a dead run must not spin (that lie is what
       liveness surfaces exist to end). Unreachable API → no wheel. */
    let runActive = false;
    async function pollRunActive() {
      if (!inboxCtx) return;
      try {
        const r = await fetch(inboxCtx.base + '/api/runs.json', { cache: 'no-store' });
        if (!r.ok) return;
        const runs = await r.json();
        const me = Array.isArray(runs) ? runs.find(x => x.run_id === inboxCtx.runId) : null;
        const next = !!me && me.state === 'running';
        if (next !== runActive) { runActive = next; if (trace) render(); }
      } catch (e) { /* not served — the wheel simply stays off */ }
    }
    function liveSpin(statusish) {
      const s = String(statusish || '');
      return runActive && (s === 'in_progress' || s === 'in-progress')
        ? '<span class="live-spin" title="The engine process is alive and working"></span>'
        : '';
    }
    /* The same reading of state the engine uses (inbox.ts messageState): a
       question the run RETIRED (its step asked again after a continue) is not
       pending — offering its dialog would mean a press that comes back refused. */
    function msgState(m) {
      if (m.response) return 'answered';
      if (m.superseded_by) return 'superseded';
      return 'open';
    }
    function stepInboxPending(name) {
      return inboxMsgs.find(x => x.step === name && msgState(x) === 'open') || null;
    }
    function stepInboxAnswered(name) {
      const a = inboxMsgs.filter(x => x.step === name && x.response);
      return a.length ? a[a.length - 1] : null;
    }

    (async function initFromUrlParam() {
      let traceUrl;
      try { traceUrl = new URLSearchParams(location.search).get('trace'); } catch { traceUrl = null; }
      if (!traceUrl) return;
      try {
        const resp = await fetch(traceUrl, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        lastTraceJson = await resp.text();
        trace = JSON.parse(lastTraceJson);
        initInbox(traceUrl);
        render();
        if (trace.status === 'in_progress') startUrlAutoRefresh(traceUrl);
      } catch (err) {
        showToast('Could not auto-load trace: ' + err.message, 'info');
      }
    })();

    // ─── Formatting helpers ───────────────────────────────
    function fmtDuration(ms) {
      if (ms == null) return '--';
      if (ms < 1000) return ms + 'ms';
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), rs = s % 60;
      if (m < 60) return m + 'm' + (rs ? ' ' + rs + 's' : '');
      const h = Math.floor(m / 60), rm = m % 60;
      return h + 'h' + (rm ? ' ' + rm + 'm' : '');
    }
    function fmtTime(iso) {
      if (!iso) return '--';
      try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
      catch { return iso; }
    }
    function fmtDate(iso) {
      if (!iso) return '--';
      try { return new Date(iso).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }); }
      catch { return iso; }
    }
    // tool-trace rebuild: read the hook-ledger record shape with legacy fallbacks.
    // Badge by `kind` (mcp/script/builtin/shell) — NOT `source` (now always
    // 'hook', the capture mechanism, not the tool type). '' ⇒ no badge.
    function tcKind(tc) {
      if (tc.kind) return tc.kind;
      if (tc.source === 'tool_server') return 'script';   // legacy traces
      if (tc.source === 'mcp_transcript') return 'mcp';   // legacy traces
      return '';
    }
    function tcTs(tc) { return tc.ts || tc.timestamp || null; }
    function tcArgsObj(tc) { const a = tc.args != null ? tc.args : tc.arguments; return (a && typeof a === 'object') ? a : null; }
    function tcResult(tc) { return tc.result_preview || tc.output_preview || ''; }
    // Badge label: a workflow script tool (invoked via the workflow_tools MCP
    // server, kind 'script') shows as WF-TOOL to set it apart from external MCP
    // and from a shell-run script. The CSS class stays tool-call-source-script.
    function tcKindLabel(k) { return k === 'script' ? 'wf-tool' : k; }
    // Badge HTML for a tool call. Usually one badge (by kind). A shell call that
    // actually RAN a declared workflow script tool (wf_tool set — matched by the
    // engine on the script-file basename) gets TWO badges: WF-TOOL + BASH — it is
    // a workflow script tool, just invoked via the shell instead of the MCP server.
    function tcBadgesHtml(c) {
      const kind = tcKind(c);
      if (!kind) return '';
      if (c.wf_tool && kind === 'shell') {
        return '<span class="tool-call-source tool-call-source-script" title="ran declared script tool \'' + esc(c.wf_tool) + '\' via the shell">wf-tool</span>'
             + '<span class="tool-call-source tool-call-source-shell">bash</span>';
      }
      return '<span class="tool-call-source tool-call-source-' + kind + '">' + tcKindLabel(kind) + '</span>';
    }
    function statusClass(s) { return (s || 'pending').replace(/_/g, '-'); }

    const chevronSVG = `<svg class="step-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>`;

    // ─── Render ───────────────────────────────────────────
    function render() {
      document.getElementById('dropZone').classList.add('hidden');
      document.getElementById('btnLoad').classList.remove('hidden');
      document.getElementById('btnAutoRefresh').classList.remove('hidden');
      const c = document.getElementById('content');
      c.classList.remove('hidden');
      // Expansion lives only in the DOM ('open' classes) — a full innerHTML
      // rebuild would collapse every open card (live: marking an answer in a
      // grouped inbox dialog closed the dialog mid-answer; auto-refresh did
      // the same). Snapshot the open ids and re-apply after the rebuild.
      const openIds = Array.from(c.querySelectorAll('.step-card.open, .orch-panel.open'))
        .map((el) => el.id)
        .filter(Boolean);
      // A rebuild also loses the reading position and any half-typed answer's
      // focus — restore both, so marking one item does not scroll the dialog
      // out from under the cursor.
      const scrollY = window.scrollY;
      const active = document.activeElement;
      const activeKey = active && c.contains(active) && /^(INPUT|TEXTAREA)$/.test(active.tagName)
        ? (active.getAttribute('oninput') || active.getAttribute('onchange') || null) : null;
      // selectionStart throws on selection-less input types — never let a
      // caret nicety break the render.
      let selStart = null, selEnd = null;
      try {
        if (activeKey && active.selectionStart != null) { selStart = active.selectionStart; selEnd = active.selectionEnd; }
      } catch (e) { selStart = null; selEnd = null; }
      c.innerHTML = renderCard() + renderOrchestration() + renderToolCalls() + renderTimeline() + renderSteps();
      for (const id of openIds) {
        const el = document.getElementById(id);
        if (el) el.classList.add('open');
      }
      if (activeKey) {
        const back = c.querySelector('[oninput="' + CSS.escape(activeKey) + '"], [onchange="' + CSS.escape(activeKey) + '"]');
        if (back) {
          try {
            back.focus({ preventScroll: true });
            if (selStart != null && back.setSelectionRange) back.setSelectionRange(selStart, selEnd);
          } catch (e) { /* focus is a nicety, never a failure */ }
        }
      }
      window.scrollTo(0, scrollY);
    }

    // ── Workflow card ─────────────────────────────────────
    function renderCard() {
      const t = trace;
      const sc = statusClass(t.status);

      // Header row
      const headerHtml = `<div class="wf-header">
        <div class="wf-title-row">
          <span class="wf-name">${esc(t.workflow || 'Unknown')}</span>
          <span class="wf-version">v${t.workflow_version || '?'}</span>
          <span class="pill pill-${sc}">${esc(t.status || 'unknown')}${liveSpin(t.status)}</span>
        </div>
        <div class="wf-meta">
          <span>Run: <strong class="mono">${esc(t.run_id || '--')}</strong></span>
          <span>Started: <strong>${fmtDate(t.started_at)} ${fmtTime(t.started_at)}</strong></span>
          <span>Duration: <strong>${fmtDuration(t.total_duration_ms)}</strong></span>
        </div>
      </div>`;

      // Description section (optional)
      let descHtml = '';
      if (t.description) {
        descHtml = `<div class="wf-section">
          <div class="wf-section-label">Description</div>
          <div class="wf-description">${esc(t.description.trim())}</div>
        </div>`;
      }

      // Parameters section
      let paramsHtml = '';
      const params = t.params || {};
      const paramKeys = Object.keys(params);
      if (paramKeys.length) {
        const defs = {};
        (t.param_defs || []).forEach(d => { defs[d.name] = d; });

        const rows = paramKeys.map(k => {
          const v = params[k];
          const def = defs[k];
          const isUnset = v == null;
          const valHtml = isUnset
            ? `<div class="param-value unset">(not set)</div>`
            : `<div class="param-value">${esc(String(v))}</div>`;
          const descHtml = (def && def.description)
            ? `<div class="param-desc">${esc(def.description.trim())}</div>`
            : '';
          return `<div class="param-row">
            <div class="param-name">${esc(k)}</div>
            <div class="param-value-cell">${valHtml}${descHtml}</div>
          </div>`;
        }).join('');

        paramsHtml = `<div class="wf-section">
          <div class="wf-section-label">Parameters</div>
          <div class="param-table">${rows}</div>
        </div>`;
      }

      // Spawn-throttle indicator (workflow-level parallel_spawn_delay_ms).
      // Display only when feature is configured (>0). Helps users verify
      // throttle is active without inspecting workflow.yaml.
      const wfSpawnDelay = t.parallel_spawn_delay_ms;
      if (typeof wfSpawnDelay === 'number' && wfSpawnDelay > 0) {
        paramsHtml += `<div class="wf-section">
          <div class="wf-section-label">Spawn throttle</div>
          <div class="param-table">
            <div class="param-row">
              <div class="param-name">parallel_spawn_delay_ms</div>
              <div class="param-value-cell">
                <div class="param-value">${esc(String(wfSpawnDelay))}</div>
                <div class="param-desc">Workflow-level default: delay between first and subsequent parallel-subagent spawns (ms). Reduces prompt-cache misses by letting the first subagent populate cache before others spawn. Per-step parallel_spawn_delay_ms overrides.</div>
              </div>
            </div>
          </div>
        </div>`;
      }

      // Gate config (optional)
      let gateColHtml = '';
      const gc = t.gate_config;
      if (gc) {
        const gateTips = {
          structural: 'Validates outputs against struct schemas: file existence, field types, required fields, patterns. Deterministic, fast. Run by riglane gate-check.',
          semantic: 'LLM evaluates output completeness, correctness and coherence. Slower but catches quality issues that structural checks miss.',
          human: 'Requires explicit user approval before proceeding. Used for critical decision points.'
        };
        const chips = ['structural', 'semantic', 'human'].map(name => {
          const on = gc[name];
          const cls = on ? 'gate-chip gate-chip-on' : 'gate-chip gate-chip-off';
          return `<span class="${cls}" data-tip="${esc(gateTips[name])}"><span class="gate-chip-dot"></span>${esc(name)}</span>`;
        }).join('');
        gateColHtml = `<div class="wf-bottom-col">
          <div class="wf-section-label">Gate</div>
          <div class="gate-chips">${chips}</div>
          <div class="gate-retries"><span data-tip="Max in-place retries per subagent when structural gate fails. Same session, preserved context.">gate retries: ${gc.max_gate_retries ?? 5}</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span data-tip="Max new subagent spawns per step after gate retries are exhausted. Fresh context each time.">step retries: ${gc.max_step_retries ?? 3}</span></div>
          <div class="gate-retries" style="margin-top:4px"><span data-tip="When false (default), the engine refuses to advance from a parallel step until every failed branch is re-spawned and passes. When true, the workflow may continue with whatever results succeeded, skipping permanently-failed branches. Hard rule (cannot be overridden): if ALL branches fail, or a non-parallel step exhausts retries, the engine always halts.">allow_partial_step_complete: ${gc.allow_partial_step_complete === true ? 'true' : 'false'}</span></div>
        </div>`;
      }

      // Context section (optional)
      let contextColHtml = '';
      if (t.context && Object.keys(t.context).length) {
        const ctxTips = {
          carry_forward: {
            summary: 'After each step passes, orchestrator writes a summary to context/. Next step receives previous summaries injected into its task prompt. Individual steps can opt out with carry_forward: false.',
            none: 'No context is passed between steps. Each step starts with only its declared inputs. Individual steps can opt in with carry_forward: true.'
          }
        };
        const chips = Object.entries(t.context).map(([k, v]) => {
          const tip = (ctxTips[k] && ctxTips[k][v]) || (ctxTips[k] && ctxTips[k].summary) || '';
          return `<span class="context-chip"${tip ? ` data-tip="${esc(tip)}"` : ''}><span class="context-chip-key">${esc(k)}:</span><span class="context-chip-val">${esc(String(v))}</span></span>`;
        }).join('');
        contextColHtml = `<div class="wf-bottom-col">
          <div class="wf-section-label">Context</div>
          <div class="context-chips">${chips}</div>
        </div>`;
      }

      // Run environment: host + orchestrator model (optional — traces ≥2026-07-27).
      // Engine stamps it at workflow_init from the MCP clientInfo + a best-effort
      // read of the host's project config model pin.
      let hostColHtml = '';
      const th = t.host;
      if (th && (th.id || th.client_name)) {
        const hostLabel = th.id || th.client_name;
        const hostTip = `MCP clientInfo: ${th.client_name || 'unknown'}${th.client_version ? ' v' + th.client_version : ''}. The host application that drove this run (recorded at workflow_init).`;
        const modelVal = th.orchestrator_model || 'unknown';
        const modelTip = th.orchestrator_model
          ? 'Orchestrator model as CONFIGURED in the host\'s project config at workflow_init. The live session model may differ if switched host-side.'
          : 'This host keeps no model pin in project config — the engine cannot observe the live session model.';
        hostColHtml = `<div class="wf-bottom-col">
          <div class="wf-section-label">Host</div>
          <div class="context-chips">
            <span class="context-chip" data-tip="${esc(hostTip)}"><span class="context-chip-key">host:</span><span class="context-chip-val">${esc(String(hostLabel))}${th.client_version ? ' v' + esc(String(th.client_version)) : ''}</span></span>
            <span class="context-chip" data-tip="${esc(modelTip)}"><span class="context-chip-key">orchestrator model:</span><span class="context-chip-val">${esc(String(modelVal))}</span></span>
          </div>
        </div>`;
      }

      // Stats
      const statsHtml = `<div class="wf-bottom-col-right">
        <div class="wf-section-label">Run Stats</div>
        <div class="stats">
          <div class="stat"><span class="stat-val">${t.total_messages ?? '--'}</span><span class="stat-label">messages</span></div>
          <div class="stat"><span class="stat-val">${t.total_tool_calls ?? '--'}</span><span class="stat-label">tool calls</span></div>
          <div class="stat"><span class="stat-val">${t.total_modified_files ?? '--'}</span><span class="stat-label">files</span></div>
          <div class="stat"><span class="stat-val">${(t.steps || []).length}</span><span class="stat-label">steps</span></div>
          ${t.total_mcp_calls ? `<div class="stat"><span class="stat-val">${t.total_mcp_calls}</span><span class="stat-label">MCP calls</span></div>` : ''}
          ${t.total_tool_calls_proxy ? `<div class="stat"><span class="stat-val">${t.total_tool_calls_proxy}</span><span class="stat-label">tool calls (proxy)</span></div>` : ''}
        </div>
      </div>`;

      const bottomHtml = `<div class="wf-section">
        <div class="wf-bottom-row">${gateColHtml}${contextColHtml}${hostColHtml}${statsHtml}</div>
      </div>`;

      const warningsHtml = renderWarnings(t.warnings);
