      return `<div class="wf-card">${headerHtml}${descHtml}${paramsHtml}${bottomHtml}</div>${warningsHtml}`;
    }

    function renderWarnings(warnings) {
      if (!warnings || !warnings.length) return '';
      const items = warnings.map(w => `<li>${esc(String(w))}</li>`).join('');
      return `<div class="warnings-banner">
        <div class="warnings-title">&#9888; Warnings (${warnings.length})</div>
        <ul class="warnings-list">${items}</ul>
      </div>`;
    }

    // ── Orchestration (MCP calls) ────────────────────────
    function renderOrchestration() {
      const calls = trace.mcp_calls;
      if (!calls || !calls.length) return '';

      const totalMs = calls.reduce((s, c) => s + (c.duration_ms || 0), 0);

      const toolColors = {
        workflow_resolve: 'gray', workflow_init: 'blue', workflow_resume: 'blue',
        step_begin: 'purple', step_collect_result: 'amber',
        step_complete: 'green', workflow_finalize: 'blue',
        list_agent_files: 'gray'
      };

      const rows = calls.map((c, i) => {
        const color = toolColors[c.tool] || 'gray';
        const ok = c.success !== false;
        const dotCls = ok ? `orch-dot orch-dot-${color}` : 'orch-dot orch-dot-fail';
        const time = fmtTime(c.timestamp);
        const dur = c.duration_ms != null ? `${c.duration_ms}ms` : '';
        const step = c.step ? `<span class="orch-step">${esc(c.step)}</span>` : '';
        const summary = c.summary ? `<span class="orch-summary">${esc(c.summary)}</span>` : '';
        const errHtml = c.error ? `<span class="orch-error">${esc(c.error)}</span>` : '';
        return `<div class="orch-row${ok ? '' : ' orch-row-fail'}">
          <span class="orch-time">${time}</span>
          <span class="${dotCls}"></span>
          <span class="orch-tool">${esc(c.tool)}</span>
          ${step}
          <span class="orch-dur">${dur}</span>
          ${summary}${errHtml}
        </div>`;
      }).join('');

      return `<div class="wf-card orch-panel" id="orchPanel">
        <div class="orch-header" onclick="document.getElementById('orchPanel').classList.toggle('open')">
          <span class="step-chevron">&#9654;</span>
          <span class="orch-title">Orchestration</span>
          <span class="orch-meta">${calls.length} MCP calls &middot; ${totalMs}ms</span>
        </div>
        <div class="orch-body">${rows}</div>
      </div>`;
    }

    // ── Tool Calls (proxy) ─────────────────────────────────
    function renderToolCalls() {
      const calls = trace.tool_calls;
      if (!calls || !calls.length) return '';

      const totalMs = calls.reduce((s, c) => s + (c.duration_ms || 0), 0);
      const successes = calls.filter(c => c.success !== false).length;

      const rows = calls.map((c, i) => {
        const ok = c.success !== false;
        const dotCls = ok ? 'orch-dot orch-dot-green' : 'orch-dot orch-dot-fail';
        const time = fmtTime(tcTs(c));
        const toolName = c.tool_short || c.tool || '?';
        const stepBadge = c.step ? `<span class="orch-step">${esc(c.step)}</span>` : '';
        const dur = c.duration_ms != null ? `<span class="orch-dur">${c.duration_ms}ms</span>` : '';
        const argsObj = tcArgsObj(c);
        const args = argsObj && Object.keys(argsObj).length
          ? `<span class="tool-call-args">${esc(Object.entries(argsObj).map(([k,v]) => k + '=' + v).join(', '))}</span>`
          : '';
        const errHtml = c.error ? `<span class="orch-error">${esc(c.error)}</span>` : '';
        const outLen = c.output_length ? `<span class="orch-summary" title="output size">${c.output_length} chars output</span>` : '';
        const exitCode = c.exit_code != null && c.exit_code !== 0 ? `<span class="orch-error">exit ${c.exit_code}</span>` : '';
        return `<div class="orch-row${ok ? '' : ' orch-row-fail'}">
          <span class="orch-time">${time}</span>
          <span class="${dotCls}"></span>
          <span class="tool-call-name">${esc(toolName)}</span>
          ${tcBadgesHtml(c)}
          ${stepBadge}
          ${args}
          ${dur}
          ${outLen}${exitCode}${errHtml}
        </div>`;
      }).join('');

      return `<div class="wf-card orch-panel" id="toolCallsPanel">
        <div class="orch-header" onclick="document.getElementById('toolCallsPanel').classList.toggle('open')">
          <span class="step-chevron">&#9654;</span>
          <span class="orch-title" style="color:var(--purple)">Tool Calls (all steps)</span>
          <span class="orch-meta">${calls.length} calls &middot; ${successes} ok &middot; ${totalMs}ms</span>
        </div>
        <div class="orch-body">${rows}</div>
      </div>`;
    }

    // ── Timeline ──────────────────────────────────────────
    function renderTimeline() {
      const steps = trace.steps || [];
      if (!steps.length) return '';
      const totalMs = steps.reduce((s, st) => s + (st.duration_ms || 1000), 0);

      const segs = steps.map((st, i) => {
        const flex = Math.max(3, ((st.duration_ms || 1000) / totalMs) * 100);
        const cls = statusClass(st.status);
        // Tool-call dots live on the per-step Subagent Timeline (attributed to
        // the calling subagent), not here on the global step bar.
        return `<div class="timeline-seg ${cls}" style="flex:${flex} 1 0" onclick="scrollToStep(${i})" title="${esc(st.name)}: ${fmtDuration(st.duration_ms)}">${esc(st.name)}</div>`;
      }).join('');

      const durs = steps.map((st) => {
        const flex = Math.max(3, ((st.duration_ms || 1000) / totalMs) * 100);
        return `<div class="timeline-dur" style="flex:${flex} 1 0">${fmtDuration(st.duration_ms)}</div>`;
      }).join('');

      return `<div class="timeline">
        <div class="timeline-label">Timeline</div>
        <div class="timeline-bar">${segs}</div>
        <div class="timeline-durations">${durs}</div>
      </div>`;
    }

    // ── Step cards ────────────────────────────────────────
    // Emit one card (+ optional embedded child group) for a step entry.
    function emitCardWithChildren(parts, st, cardIdx, idPrefix) {
      parts.push(renderStepCard(st, cardIdx, idPrefix));
      // Child workflow group: show embedded child steps as indented cards
      // below the parent step. Works for both planning and delegation.
      const childTrace = st._embedded_child_trace;
      if (childTrace && childTrace.steps && childTrace.steps.length > 0) {
        const isDelegation = !!st.delegate_to;
        const groupClass = isDelegation ? ' child-workflow-group-delegation' : '';
        // Render full child workflow view: header + timeline + steps
        const savedTrace = trace;
        trace = childTrace;
        const childHeader = renderChildWorkflowHeader(childTrace);
        const childTimeline = renderTimeline();
        const childCards = childTrace.steps.map((cst, ci) =>
          renderStepCard(cst, ci, `${cardIdx}-child-`)
        ).join('');
        trace = savedTrace;
        // F7: delegation blocks get enter/exit dividers (amber) — the analog
        // of loop-phase (teal) and route (violet) dividers. The child runs as
        // its OWN run; its steps are embedded here for a single-trace view.
        if (isDelegation) {
          const childWfName = childTrace.workflow || st.delegate_to;
          const childRunId = st.delegation && st.delegation.child_run_id ? st.delegation.child_run_id : '';
          parts.push(delegationDivider(`→ delegated: ${childWfName}${childRunId ? ` ( ${childRunId} )` : ''}`, false));
        }
        parts.push(`<div class="child-workflow-group${groupClass}">${childHeader}${childTimeline}${childCards}</div>`);
        if (isDelegation) {
          parts.push(delegationDivider(`← return from ${childTrace.workflow || st.delegate_to}`, true));
        }
      }
    }

    function delegationDivider(label, exit) {
      return `<div class="delegation-divider${exit ? ' delegation-divider-exit' : ''}"><span class="delegation-divider-label" data-tip="Delegated workflow block: the child executed as its OWN run (separate manifest and trace); its steps are embedded here so the whole execution reads as one trace. Files flow back via param_bindings (scalars) and from_delegated outputs (artifacts).">${esc(label)}</span></div>`;
    }

    function loopDivider(label, exit) {
      return `<div class="loop-divider${exit ? ' loop-divider-exit' : ''}"><span class="loop-divider-label">${esc(label)}</span></div>`;
    }

    function renderSteps() {
      const parts = [];
      const steps = trace.steps || [];
      const events = trace.loop_events || [];
      const loopBacks = events.filter(e => e.kind === 'loop_back');
      const exitEv = events.find(e => e.kind === 'loop_exit');

      // Phase R: a route-transition divider is emitted whenever the route
      // context changes between consecutive cards. Each card carries its route
      // membership (st.route.route_id) or none (= main flow), so the path
      // reads e.g. "main → route: critical", "route: critical → route: hotfix",
      // "route: hotfix → main". Derived purely from the cards — no special
      // ordering needed, works in both the linear and loop-aware paths below.
      const routeCtx = st => (st && st.route && st.route.route_id) ? `route: ${st.route.route_id}` : 'main';
      let prevRouteCtx = 'main';
      const routeDivider = (from, to) =>
        `<div class="route-divider"><span class="route-divider-label" title="Conditional routing: execution moved from ${esc(from)} into ${esc(to)}. The engine chose this route after the previous step finished — only the selected route's steps run; the alternatives are skipped.">${esc(from)} &rarr; ${esc(to)}</span></div>`;
      // Lanes: cards carrying a lane stamp render inside their fork's lane
      // containers, not in the main card list — group them up front. The
      // block is emitted right after its FORK step's card, which works in
      // both the linear and the loop-aware paths below (the fork card goes
      // through emitCard either way). lane_events supply the join verdicts.
      const laneGroups = new Map();   // fork_step → Map(lane_id → cards[])
      steps.forEach(st => {
        if (!st.lane || !st.lane.fork_step) return;
        const fork = st.lane.fork_step;
        if (!laneGroups.has(fork)) laneGroups.set(fork, new Map());
        const perLane = laneGroups.get(fork);
        const id = st.lane.lane_id || '?';
        if (!perLane.has(id)) perLane.set(id, []);
        perLane.get(id).push(st);
      });
      const laneJoinOf = fork => (trace.lane_events || []).find(
        e => e.kind === 'lanes_join' && e.fork_step === fork);
      const lanesDivider = (label, join, title) =>
        `<div class="lanes-divider${join ? ' lanes-divider-join' : ''}"><span class="lanes-divider-label" title="${esc(title || '')}">${esc(label)}</span></div>`;
      let laneCi = 0;
      const emitLanesBlock = (parts, fork) => {
        const perLane = laneGroups.get(fork);
        if (!perLane) return;
        const join = laneJoinOf(fork);
        parts.push(lanesDivider(`\u21c9 lanes: ${perLane.size} in parallel`, false,
          `Fork: after step '${fork}' every lane below ran CONCURRENTLY; the engine returned the cursor past the fork only when all of them reached a terminal state.`));
        const row = [];
        for (const [laneId, cards] of perLane) {
          const verdict = join && join.verdicts ? join.verdicts[laneId] : null;
          const inner = [];
          let lanePrevCtx = `lane: ${laneId}`;
          // Order: loop passes first (a lane may loop within itself), then
          // definition order inside a pass; phase changes get the standard
          // loop divider so an in-lane loop reads like a top-level one.
          let prevPhase = null;
          cards
            .slice()
            .sort((a, b) => ((a.loop_phase ?? 0) - (b.loop_phase ?? 0)) || ((a.index ?? 0) - (b.index ?? 0)))
            .forEach(st => {
              const ph = st.loop_phase ?? null;
              if (ph != null && prevPhase != null && ph !== prevPhase && ph >= 2) {
                inner.push(loopDivider(`Begin Loop Back Phase ( ${ph} )`, false));
              }
              prevPhase = ph;
              const ctx = (st.route && st.route.route_id) ? `route: ${st.route.route_id}` : `lane: ${laneId}`;
              if (ctx !== lanePrevCtx) { inner.push(routeDivider(lanePrevCtx, ctx)); lanePrevCtx = ctx; }
              emitCardWithChildren(inner, st, laneCi++, 'lane-');
            });
          row.push(`<div class="lane-group"><div class="lane-group-header">` +
            `<span>parallel lane ${esc(laneId)}</span>` +
            (verdict ? `<span class="pill pill-${verdict === 'completed' ? 'completed' : 'failed'}">${esc(verdict)}</span>` : '') +
            `</div>${inner.join('')}</div>`);
        }
        parts.push(`<div class="lanes-row">${row.join('')}</div>`);
        if (join) {
          parts.push(lanesDivider(`join: require ${join.require || 'all'}`, true,
            `Join barrier passed — the run continued past the fork. Per-lane verdicts: ` +
            Object.entries(join.verdicts || {}).map(([k, v]) => `${k}: ${v}`).join(', ') +
            `. The engine wrote data/${fork}-join.json (the collection index).`));

        let ci = 0;

      // Phase B: loop-aware ordering, for AS MANY loops as the run has. The
      // engine archives each completed pass's cards (loop_archived +
      // loop_phase) and records loop_back / loop_exit events carrying the loop
      // range. A workflow may now hold several loops per sequence (nested or
      // disjoint), so the earlier single-loop reading — take loopBacks[0] and
      // treat everything after its range as "post-loop" — dropped the second
      // loop's phase grouping entirely: its passes appeared as one flat run of
      // cards with no dividers. Now every distinct range gets its own section.
      //
      // Render: cards before the first range → for each range, its passes
      // separated by "Begin Loop Back Phase (N)" dividers and closed by
      // "Exit Loop Phase" when that loop finished → cards between ranges →
      // … → cards after the last range. Every card is emitted exactly once;
      // a nested range is rendered inside its outermost container's section.
      const rangeOf = (ev) => {
        // Index-only events (oldest traces) carry no name list; their window
        // comes from to_index/from_index, which `has` below falls back to.
        const names = Array.isArray(ev.range) && ev.range.length ? new Set(ev.range) : null;
        return {
          owner: ev.from ?? '',
          names,
          toIdx: ev.to_index ?? 0,
          fromIdx: ev.from_index ?? (steps.length - 1),
          has: (st) => names
            ? names.has(st.name)
            : (st.index ?? 0) >= (ev.to_index ?? 0) && (st.index ?? 0) <= (ev.from_index ?? 0),
        };
      };
      // One entry per loop OWNER (a loop emits one event per pass). Older
      // traces wrote loop_exit without `from`; its range names it (the owner
      // is the range's last step), so both shapes attribute correctly.
      // Three trace generations to attribute: `from` (current), `range` (mid),
      // and index-only (oldest — a loop_exit written before either existed).
      // Falling through to '' dropped the Exit divider on those old traces,
      // which the single-loop reading used to show unconditionally.
      const nameAtIndex = (i) => {
        const hit = steps.find((st) => (st.index ?? -1) === i);
        return hit ? hit.name : '';
      };
      const ownerOfEvent = (ev) => ev.from
        || (Array.isArray(ev.range) && ev.range.length ? ev.range[ev.range.length - 1] : '')
        || (ev.from_index != null ? nameAtIndex(ev.from_index) : '')
        || '';

      for (const ev of events.filter((e) => e.kind === 'loop_back' || e.kind === 'loop_exit')) {
        const key = ownerOfEvent(ev);
        if (!key) continue;
        if (!loopsByOwner.has(key)) loopsByOwner.set(key, { ...rangeOf(ev), owner: key });
      }
      const loops = [...loopsByOwner.values()].map((r) => {
        let first = Infinity, last = -Infinity;
        steps.forEach((st, k) => { if (r.has(st)) { first = Math.min(first, k); last = Math.max(last, k); } });
        return { ...r, first, last, size: last - first };
      }).filter((r) => r.first !== Infinity)
        // Outer ranges first, so a nested range lands inside its container.
        .sort((a, b) => (a.first - b.first) || (b.size - a.size));
      const exitOwners = new Set(
        events.filter((e) => e.kind === 'loop_exit').map(ownerOfEvent).filter(Boolean),

      const lastPhaseOf = (owner) => loopBacks
        .filter((e) => ownerOfEvent(e) === owner)
        .reduce((m, e) => Math.max(m, e.next_phase || 0), 1);

      // Assign every card to the OUTERMOST loop section that contains it, or
      // to none (a standalone card between/around the loops).
      const sectionOf = new Map();     // card position → loop entry
      steps.forEach((st, k) => {
        const owner = loops.find((r) => r.has(st));
        if (owner) sectionOf.set(k, owner);
      });

      let ci = 0;
      const emitLoopSection = (loop) => {
        const cards = steps.filter((st, k) => sectionOf.get(k) === loop);
        const byPhase = new Map();
        for (const st of cards) {
          const phase = st.loop_phase != null ? st.loop_phase : lastPhaseOf(loop.owner);
          if (!byPhase.has(phase)) byPhase.set(phase, []);
          byPhase.get(phase).push(st);
        }
        [...byPhase.keys()].sort((a, b) => a - b).forEach((p) => {
          if (p >= 2) parts.push(loopDivider(`Begin Loop Back Phase ( ${p} )`, false));
          byPhase.get(p)
            .sort((a, b) => (a.index ?? 0) - (b.index ?? 0))
            .forEach((st) => emitCard(parts, st, ci++));
        });
        if (exitOwners.has(loop.owner)) parts.push(loopDivider('Exit Loop Phase', true));
      };

      const emitted = new Set();
      steps.forEach((st, k) => {
        const loop = sectionOf.get(k);
        if (!loop) { emitCard(parts, st, ci++); return; }
        if (emitted.has(loop)) return;       // its whole section is already out
        emitted.add(loop);
        emitLoopSection(loop);
      });
      return parts.join('');
    }

    // Compact header for embedded child workflow (used in child-workflow-group).

    // ── Run-inbox dialog on a step card ───────────────────────────────────

        ? `${m.request.action}${m.request.args && Object.keys(m.request.args).length ? '\n' + JSON.stringify(m.request.args, null, 2) : ''}` : '';

          if (o.reject) controls += `<button class="inbox-btn reject" title="Refuse — the step is re-run with your feedback" onclick="ivRespond('${esc(m.message_id)}','reject')">Reject</button>`;

          controls += `<textarea class="inbox-dlg-text" placeholder="Your answer…" oninput="ivText('${esc(m.message_id)}', this.value)">${esc(d.text)}</textarea>`;
          controls += `<div class="inbox-dlg-actions"><button class="inbox-btn send" title="Send your written answer" onclick="ivRespond('${esc(m.message_id)}','${respondAllowed ? 'respond' : 'edit'}')">Send</button></div>`;
        }

      } else {
        const r = answered.response;
        inner += `<div class="inbox-dlg-answered">Answered · <b>${esc(r.type)}</b> via ${esc(r.via)} · ${esc((r.responded_at || '').replace('T', ' ').slice(0, 16))}${r.text ? ` — <span class="inbox-dlg-anstext">${esc(r.text)}</span>` : ''}</div>`;

    function ivChoiceSend(id, c) { const d = _ivDraft[id] || (_ivDraft[id] = { choice: null, text: '' }); d.choice = c; void ivRespond(id, 'choice'); }
    function ivText(id, v) { const d = _ivDraft[id] || (_ivDraft[id] = { choice: null, text: '' }); d.text = v; }
    async function ivRespond(messageId, type) {

      const choices = m && m.request && Array.isArray(m.request.choices) ? m.request.choices : null;
      const body = { run: inboxCtx.runId, message_id: messageId, type };
      if (type === 'choice') {
        if (!d.choice) { showToast('Pick one of the offered choices first', 'info'); return; }
        if (!choices || choices.indexOf(d.choice) < 0) { showToast('That entry is not one of the offered choices', 'info'); return; }

      } else if (type === 'respond' || type === 'edit') {

      if (it.body) h += `<div class="inbox-dlg-body">${esc(it.body)}</div>`;
      if (rec) {

        if (o.accept) h += `<button class="inbox-btn accept${d.type === 'accept' ? ' sel' : ''}" title="Approve (marks the answer; Send all below submits)" onclick="ivItemPick('${esc(m.message_id)}','${esc(it.id)}','accept')">Accept</button>`;
        if (o.reject) h += `<button class="inbox-btn reject${d.type === 'reject' ? ' sel' : ''}" title="Refuse (marks the answer; Send all below submits)" onclick="ivItemPick('${esc(m.message_id)}','${esc(it.id)}','reject')">Reject</button>`;
        h += '</div>';
      }
      if (choices) {
        const sugg = it.request.recommended;
        h += `<div class="inbox-choicecap">Pick one</div><div class="inbox-choicelist">`;
        for (const c of choices) h += `<button class="inbox-choice${d.choice === c ? ' sel' : ''}" onclick="ivItemChoice('${esc(m.message_id)}','${esc(it.id)}','${esc(c)}')">${esc(c)}${c === sugg ? '<span class="rec">recommended</span>' : ''}</button>`;

      }
      if (canText) h += `<textarea class="inbox-dlg-text" placeholder="Your answer…" oninput="ivItemText('${esc(m.message_id)}','${esc(it.id)}', this.value)">${esc(d.text || '')}</textarea>`;

    }
    function ivItemDraft(msgId, itemId) {
      const d = _ivDraft[msgId] || (_ivDraft[msgId] = { choice: null, text: '', items: {} });
      if (!d.items) d.items = {};

    }
    function ivItemPick(msgId, itemId, type) {

    async function ivSendItems(messageId) {
