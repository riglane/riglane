        if (d.type === 'accept' || d.type === 'reject') { answers[it.id] = { type: d.type }; continue; }
        if (choices && d.choice) { answers[it.id] = { type: 'choice', text: d.choice }; continue; }
        const t = (d.text || '').trim();
        if (t && (o.respond || o.edit)) {
          if (o.edit && !o.respond) {
            let parsed = null; try { parsed = JSON.parse(t); } catch (e) {}
            answers[it.id] = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
              ? { type: 'edit', args: parsed } : { type: 'edit', text: t };
          } else answers[it.id] = { type: 'respond', text: t };
          continue;
        }
        showToast('Answer "' + it.title + '" first — a grouped message is sent in full', 'info');
        return;
      }
      const headers = { 'Content-Type': 'application/json' };
      if (inboxCtx.token) headers['X-Riglane-Token'] = inboxCtx.token;
      try {
        const r = await fetch(inboxCtx.base + '/api/inbox/respond', {
          method: 'POST', headers,
          body: JSON.stringify({ run: inboxCtx.runId, message_id: messageId, type: 'items', items: answers }),
        });
        let j = {}; try { j = await r.json(); } catch (e) {}
        if (r.ok && j.ok) { showToast('Answers recorded — the run continues', 'info'); delete _ivDraft[messageId]; _inboxSig = ''; void pollInbox(); }
        else if (r.status === 403) showToast('The page was opened without its access token - re-open from the URL riglane serve (or the run auto-open) printed, then answer again', 'info');
        else showToast('Respond failed: ' + (j.error || ('HTTP ' + r.status)), 'info');
      } catch (e) { showToast('Respond failed: ' + (e && e.message ? e.message : String(e)), 'info'); }
    }

    // Phase 61 Slice U3: planning-step panel inside step details. Shows
    // planning state (phase, child_run_id, child_workflow_path link) and a
    // chronological list of workflow_validate_dynamic attempts filtered from
    // trace.mcp_calls (which were tagged with parent_workflow/parent_step by
    // Slice U1a). Each attempt entry surfaces the summary text (which Slice
    // U1b extended to include error count + first error for failed validates).
    function renderPlanningPanel(st) {
      if (!st.planning) return '';
      const p = st.planning;
      const phase = p.phase || 'planning';
      const childRun = p.child_run_id ? `<span style="font-family:var(--mono);font-size:11px">child run: ${esc(p.child_run_id)}</span>` : '';
      const childPath = p.child_workflow_path ? `<span style="font-family:var(--mono);font-size:11px;color:var(--text-muted);word-break:break-all">${esc(p.child_workflow_path)}</span>` : '';
      const childTrace = st.child_trace_path ? `<div style="margin-top:6px"><span style="font-size:11px;color:var(--text-muted)">child trace:</span> <span style="font-family:var(--mono);font-size:11px;word-break:break-all">${esc(st.child_trace_path)}</span></div>` : '';

      // Filter validate_dynamic calls for THIS step (chronological order
      // preserved by trace.mcp_calls insertion order).
      const allCalls = trace.mcp_calls || [];
      const validateCalls = allCalls.filter(c => c.tool === 'workflow_validate_dynamic' && c.step === st.name);
      const invokeCalls = allCalls.filter(c => c.tool === 'workflow_invoke_dynamic' && c.step === st.name);
      const finalizeCalls = allCalls.filter(c => c.tool === 'workflow_finalize_dynamic' && c.step === st.name);

      let attemptsList = '';
      if (validateCalls.length > 0) {
        attemptsList = `<div class="planning-attempts">${validateCalls.map((c, i) => {
          const ok = c.success === true && !/errors:|Validate failed|Planning blocked/.test(c.summary || '');
          const okIcon = ok ? '<span class="planning-attempt-ok" title="validation passed">&#10003;</span>' : '<span class="planning-attempt-fail" title="validation failed">&#10007;</span>';
          const ts = c.timestamp ? new Date(c.timestamp).toISOString().slice(11, 19) : '';
          return `<div class="planning-attempt">
            <span class="planning-attempt-num">#${i + 1}</span>
            <span class="planning-attempt-ts">${esc(ts)}</span>
            ${okIcon}
            <span class="planning-attempt-summary">${esc(c.summary || '(no summary)')}</span>
          </div>`;
        }).join('')}</div>`;
      } else {
        attemptsList = `<div style="font-size:11px;color:var(--text-muted);font-style:italic">No workflow_validate_dynamic calls recorded for this step.</div>`;
      }

      const invokeRow = invokeCalls.length > 0
        ? `<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">Invoke: ${esc(invokeCalls[invokeCalls.length - 1].summary || '?')}</div>`
        : '';
      const finalizeRow = finalizeCalls.length > 0
        ? `<div style="margin-top:4px;font-size:12px;color:var(--text-secondary)">Finalize: ${esc(finalizeCalls[finalizeCalls.length - 1].summary || '?')}</div>`
        : '';

      // Child trace rendering moved to renderSteps() as indented group below
      // the parent step card. No inline rendering in planning panel anymore.
      let childLoader = '';

      return `<div class="planning-panel">
        <div class="planning-header">
          <span>Planning Step</span>
          <span class="planning-phase-pill ${esc(phase)}">${esc(phase)}</span>
          ${childRun}
        </div>
        ${childPath ? `<div style="margin-bottom:4px">${childPath}</div>` : ''}
        ${childTrace}
        <div style="margin-top:10px;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Validation attempts (${validateCalls.length})</div>
        ${attemptsList}
        ${invokeRow}
        ${finalizeRow}
        ${childLoader}
      </div>`;
    }

    // Delegation step panel: shows target workflow, status, and child trace
    // loader. Reuses the same loadChildTrace() as planning (Slice U4).
    function renderDelegationPanel(st) {
      if (!st.delegate_to) return '';
      const status = esc(st.status || 'unknown');
      const sc = st.status === 'completed' ? 'planning-phase-pill completed'
        : st.status === 'failed' ? 'planning-phase-pill failed'
        : 'planning-phase-pill executing';
      // Child trace rendering moved to renderSteps() as indented group.
      // The delegation linkage stamp names the exact child run.
      const childRunId = st.delegation && st.delegation.child_run_id ? st.delegation.child_run_id : null;
      const childRunLine = childRunId
        ? `<div style="font-size:12px;margin-top:4px">Child run: <span style="font-family:var(--mono)" data-tip="The exact child run this step is linked to (stamped by the child's workflow_init). param_bindings and from_delegated artifacts resolve against THIS run, never 'latest by name'.">${esc(childRunId)}</span></div>`
        : '';
      return `<div class="delegation-panel">
        <div class="delegation-header">
          <span>Delegation</span>
          <span class="${sc}">${status}</span>
        </div>
        <div style="font-size:12px">Delegates to: <span style="font-family:var(--mono);font-weight:600">${esc(st.delegate_to)}</span></div>
        ${childRunLine}
      </div>`;
    }

    // Slice U4: async-load child trace + render inline. Reuses the standard
    // renderSteps/renderStepCard machinery by temporarily swapping the
    // module-level `trace` variable to the child trace context. Restores on
    // completion (try/finally) so subsequent parent-level operations see
    // the original trace.
    //
    // Failure path: fetch() fails on file:// URLs in some browsers (Firefox
    // by default), or when child_trace_path is wrong. Fall back to a manual
    // file picker via FileReader so the user can still see the child run.
    async function loadChildTrace(stepName, path, btnEl) {
      const containerEl = document.getElementById('child-trace-' + stepName);
      if (!containerEl) return;
      containerEl.innerHTML = '<div class="child-trace-loading">Loading child trace…</div>';
      if (btnEl) btnEl.disabled = true;
      let childTrace = null;
      try {
        const resp = await fetch(path);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        childTrace = await resp.json();
      } catch (e) {
        renderChildTraceFallback(containerEl, path, e && e.message ? e.message : String(e));
        if (btnEl) btnEl.disabled = false;
        return;
      }
      renderChildTraceInto(containerEl, childTrace);
      if (btnEl) {
        btnEl.textContent = 'Reload';
        btnEl.disabled = false;
      }
    }

    /** Render a loaded child trace into the target container by temporarily
     *  swapping the module-level `trace` global. */
    function renderChildTraceInto(containerEl, childTrace) {
      const savedTrace = trace;
      try {
        trace = childTrace;
        const stepsHtml = (childTrace.steps || []).map((st, i) => renderStepCard(st, i)).join('');
        const wfHeader = childTrace.workflow
          ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;font-family:var(--mono)">workflow: ${esc(childTrace.workflow)} · status: ${esc(childTrace.status || '?')} · ${(childTrace.steps || []).length} step(s)</div>`
          : '';
        containerEl.innerHTML = wfHeader + stepsHtml;
      } finally {
        trace = savedTrace;
      }
    }

    /** Show file-picker fallback when fetch() fails (file:// CORS etc). */
    function renderChildTraceFallback(containerEl, path, errMsg) {
      const safePath = esc(path);
      const safeErr = esc(errMsg);
      containerEl.innerHTML = `
        <div class="child-trace-error">Could not fetch <code>${safePath}</code>: ${safeErr}</div>
        <div class="child-trace-fallback">
          File:// URLs may block fetch in some browsers. Select the child trace JSON manually:
          <br>
          <input type="file" accept=".json,application/json" onchange="loadChildTraceFromFile(this)" data-target="${containerEl.id}">
        </div>`;
    }

    /** Handler for manual file-picker fallback. */
    function loadChildTraceFromFile(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const targetId = inputEl.dataset.target;
      const containerEl = document.getElementById(targetId);
      if (!containerEl) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const childTrace = JSON.parse(e.target.result);
          renderChildTraceInto(containerEl, childTrace);
        } catch (err) {
          containerEl.innerHTML = `<div class="child-trace-error">Failed to parse JSON: ${esc(err.message || String(err))}</div>`;
        }
      };
      reader.readAsText(file);
    }

    function renderGoal(goal) {
      return `<div class="detail-block">
        <div class="detail-label">Goal <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0;font-weight:400">(from workflow.yaml)</span></div>
        <div class="goal-text">${esc(goal)}</div>
      </div>`;
    }

    function renderStepConfig(cfg, st) {
      if (!cfg) return '';
      const chips = [];
      const isPlanning = st && !!st.planning;
      const specOn = cfg.spec_check === true;
      const specAuthoring = cfg.spec_authoring === 'persist' || cfg.spec_authoring === 'validate' ? cfg.spec_authoring : '';
      const stepTips = {
        spec_check: 'Spec CONSUMPTION — the step must RESPECT the behavioral specs (opt-in).\n\nWhen ON, the engine:\n• whitelists spec_search + spec_link for the subagent (Claude Code);\n• injects guidance at step start — find the specs for the AREA being changed, honor Rule Statements, STOP on conflict, keep registry links updated;\n• adds a spec-compliance clause to the semantic gate.\n\nOFF = read-only step (analysis / reporting / audit).',
        spec_authoring_persist: 'Spec AUTHORING — persist: this step WRITES specs via spec_write.\n\nThe engine:\n• whitelists spec_write + spec_search + spec_link (Claude Code);\n• injects authoring guidance (target scope, existing domains, format);\n• AUTO-declares the .riglane/specs outputs shown on this card (write_proof: any_member) — they are not in the YAML.',
        spec_authoring_validate: 'Spec AUTHORING — validate: DRY-RUN preview, persists NOTHING.\n\nThe engine:\n• whitelists spec_write + spec_search + spec_link (Claude Code);\n• injects authoring guidance;\n• accepts spec_write ONLY with dry_run:true — a persisting call during this step is physically REJECTED.\n\nThe step declares its own report output (not .riglane/specs). Typical: a review step before the persist/commit step.',
        subagent: 'When ON, step spawns an isolated subagent with fresh context. When OFF, step executes directly in the orchestrator session.',
      };
      chips.push(`<span class="step-chip ${specOn ? 'step-chip-on' : 'step-chip-off'}" data-tip="${esc(stepTips.spec_check)}"><span class="step-chip-dot"></span><span class="step-chip-key">spec_check</span></span>`);
      // spec_authoring chip — shown only when the flag is set (absent = off).
      if (specAuthoring) {
        const saTip = specAuthoring === 'persist' ? stepTips.spec_authoring_persist : stepTips.spec_authoring_validate;
        chips.push(`<span class="step-chip step-chip-on" data-tip="${esc(saTip)}"><span class="step-chip-dot"></span><span class="step-chip-key">spec_authoring: ${specAuthoring}</span></span>`);
      }
      // Hide subagent chip for planning steps — they are always orchestrator-driven.
      if (!isPlanning) {
        chips.push(`<span class="step-chip ${cfg.subagent ? 'step-chip-on' : 'step-chip-off'}" data-tip="${esc(stepTips.subagent)}"><span class="step-chip-dot"></span><span class="step-chip-key">subagent</span></span>`);
      }

      // Show effective gate config: merge workflow-level defaults with step overrides.
      // Planning steps take no step-level gate (no-op) — show a note instead of
      // misleading gate chips. The workflow gate applies to the generated substeps
      // (inherited); per-substep gates are set in the drafted child workflow.
      const wfGate = trace.gate_config || {};
      const stepGate = cfg.gate || {};
      const hasOverride = cfg.gate && Object.keys(cfg.gate).length > 0;
      if (isPlanning) {
        chips.push(`<span class="step-chip step-chip-off" data-tip="Planning steps take no step-level gate — structural has no outputs to validate and semantic/human are not evaluated at the planning step. The workflow-level gate applies to the generated substeps (inherited); per-substep gates are set in the drafted workflow."><span class="step-chip-dot"></span><span class="step-chip-key">gates: on substeps</span></span>`);
      } else {
        ['structural', 'semantic', 'human'].forEach(name => {
          const isOverride = stepGate[name] != null;
          const effective = isOverride ? stepGate[name] : (wfGate[name] ?? false);
          const source = isOverride ? ' (step override)' : ' (from workflow)';
          const tip = {
            structural: 'Validate outputs against struct schemas: file existence, field types, required fields, patterns.' + source,
            semantic: 'LLM evaluates output completeness, correctness and coherence.' + source,
            human: 'Require explicit user approval before proceeding.' + source,
          }[name];
          const overrideMark = isOverride ? ' style="outline:1px dashed var(--accent);outline-offset:1px"' : '';
          chips.push(`<span class="step-chip ${effective ? 'step-chip-on' : 'step-chip-off'}"${overrideMark} data-tip="${esc(tip)}"><span class="step-chip-dot"></span><span class="step-chip-key">gate.${name}</span></span>`);
        });
      }

      // allow_partial_step_complete chip — shown when set explicitly at workflow
      // OR step level (only meaningful for parallel steps; the chip tells the
      // viewer how this step would resolve a partial-failure condition).
      const apscOverride = stepGate.allow_partial_step_complete != null;
      const apscWfSet = wfGate.allow_partial_step_complete === true;
      if (apscOverride || apscWfSet) {
        const apscEffective = apscOverride ? stepGate.allow_partial_step_complete : (wfGate.allow_partial_step_complete ?? false);
        const apscTip = (apscOverride ? '(step override) ' : '(from workflow) ')
          + 'Effective allow_partial_step_complete for this step. When false, the engine refuses to advance from a parallel step with any failed branch. When true, partial completion is permitted (but only if at least one branch succeeded — catastrophic failure always halts).';
        const apscMark = apscOverride ? ' style="outline:1px dashed var(--accent);outline-offset:1px"' : '';
        chips.push(`<span class="step-chip ${apscEffective ? 'step-chip-on' : 'step-chip-off'}"${apscMark} data-tip="${esc(apscTip)}"><span class="step-chip-dot"></span><span class="step-chip-key">gate.allow_partial_step_complete</span></span>`);
      }

      return `<div class="detail-block"><div class="detail-label">Step Config${hasOverride ? ' <span style="font-size:9px;opacity:0.5;font-weight:400">(dashed = step override)</span>' : ''}</div><div class="step-config-chips">${chips.join('')}</div></div>`;
    }

    function renderStepTiming(st, invocations) {
      const bc = (invocations || []).filter(v => v.retry_type === 'branch').length;
      const tb = bc > 0 ? bc + 1 : 0;
      return `<div class="detail-block">
        <div class="detail-label">Timing</div>
        <div class="timing-row">
          <span>Started: <strong>${fmtTime(st.started_at)}</strong></span>
          <span>Completed: <strong>${fmtTime(st.completed_at)}</strong></span>
          <span>Duration: <strong>${fmtDuration(st.duration_ms)}</strong></span>
          ${tb > 0 ? `<span>Branches: <strong>${tb}</strong></span>` : ''}
          <span>Retries: <strong>${st.retry_count || 0}</strong></span>
        </div>
      </div>`;
    }

    function renderGateDetails(invocations) {
      if (!invocations.length) return '';
      const rows = invocations.map(inv => {
        const g = inv.gate;
        if (!g) return '';
        const icon = g.passed
          ? `<span class="gate-icon gate-pass">&#10003;</span>`
          : `<span class="gate-icon gate-fail">&#10007;</span>`;
        let detail = `${g.checks || 0} checks, ${g.failures || 0} failures`;
        if (g.details && g.details.length) {
          detail += ' &mdash; ' + g.details.slice(0, 3).map(d => esc(String(d))).join('; ');
          if (g.details.length > 3) detail += ` (+${g.details.length - 3} more)`;
        }
        return `<div class="gate-row">
          ${icon}
          <span>${esc(g.type || 'structural')}</span>
          <span class="gate-info">${invocations.length > 1 ? `[iter ${inv.iteration}] ` : ''}${detail}</span>
        </div>`;
      }).filter(Boolean).join('');
      if (!rows) return '';
      return `<div class="detail-block"><div class="detail-label">Gate Results</div>${rows}</div>`;
    }

    function groupInvocations(invocations) {
      // Group invocations by subagent session.
      // Strategy 1 (preferred): group by subagent_id when available
      // Strategy 2 (fallback): infer from retry_type sequence
      const hasIds = invocations.some(inv => inv.subagent_id);
      if (hasIds) {
        // Group by subagent_id — accurate even with parallel interleaving
        const idMap = new Map();
        const order = [];
        for (const inv of invocations) {
          const id = inv.subagent_id || `_anon_${order.length}`;
          if (!idMap.has(id)) {
            const g = { primary: inv, retries: [] };
            idMap.set(id, g);
            order.push(g);
          } else {
            idMap.get(id).retries.push(inv);
          }
        }
        return order;
      }
      // Fallback: sequential heuristic (gate retries → preceding non-gate)
      // Note: may misattribute retries when parallel subagents interleave
      const groups = [];
      let current = null;
      for (const inv of invocations) {
        const isGateRetry = inv.retry_type === 'gate';
        if (isGateRetry && current) {
          current.retries.push(inv);
        } else {
          current = { primary: inv, retries: [] };
          groups.push(current);
        }
      }
      return groups;
    }

    function extractTaskHint(inv) {
      // Try to extract a short description of what this subagent does
      // Priority: description field > parallel_key > first line pattern from task_prompt
      if (inv.description) return inv.description;
      if (inv.parallel_key) return inv.parallel_key;
      const tp = inv.task_prompt || '';
      // Pattern: "for the **domain** domain"
      const domainMatch = tp.match(/for the \*\*([^*]+)\*\* domain/);
      if (domainMatch) return domainMatch[1];
      // Pattern: "Step N (NAME)"
      const stepMatch = tp.match(/Step \d+ \(([^)]+)\)/);
      if (stepMatch) return stepMatch[1].toLowerCase();
      // Very short prompt = likely phantom/test
      if (tp.length < 20) return tp || null;
      return null;
    }

    function renderSubagentTimeline(st, idx) {
      const invocations = st.invocations || [];
      if (!invocations.length) return '';
      const groups = groupInvocations(invocations);
      const totalInvocations = groups.reduce((s, g) => s + 1 + g.retries.length, 0);

      const stepStart = new Date(st.started_at).getTime();
      const stepEnd   = new Date(st.completed_at).getTime();
      const stepSpan  = stepEnd - stepStart;
      if (stepSpan <= 0) return '';

      // Compute bar data per subagent group
      const bars = groups.map((g, gi) => {
        const inv = g.primary;
        const lastInv = g.retries.length ? g.retries[g.retries.length - 1] : inv;
        const finalPassed = lastInv.gate ? lastInv.gate.passed : true;
        const hasRetries = g.retries.length > 0;

        // Detect phantom invocations (zero duration, toolu_/test- prefix ids)
        const isPhantom = !inv.duration_ms || inv.duration_ms === 0;

        // Start = completed_at - duration_ms (duration is cumulative from session start)
        let subStartMs = stepStart;
        let subEndMs   = stepEnd;
        if (inv.completed_at && inv.duration_ms) {
          subStartMs = new Date(inv.completed_at).getTime() - inv.duration_ms;
        } else if (inv.completed_at) {
          subStartMs = new Date(inv.completed_at).getTime();
          subEndMs = subStartMs; // phantom: point in time
        }
        if (lastInv.completed_at) {
          subEndMs = new Date(lastInv.completed_at).getTime();
        }
        // Clamp to step range
        subStartMs = Math.max(subStartMs, stepStart);
        subEndMs   = Math.min(subEndMs, stepEnd);

        const hint = extractTaskHint(inv) || `#${gi + 1}`;
        const durationLabel = isPhantom ? '' : fmtDuration(subEndMs - subStartMs);

        return { subStartMs, subEndMs, hint, durationLabel, finalPassed, hasRetries, retries: g.retries, inv, isPhantom, groupIndex: gi };
      });

      // Hosts whose hook payload carries no duration metric (e.g. Gemini's
      // AfterTool envelope) leave EVERY invocation phantom — completed_at is
      // the only per-branch instant, and the gantt used to render NOTHING.
      // Render honest APPROXIMATE bars instead: subagent spawns start at the
      // step's own start (parallel branches spawn together in one message),
      // so [step start → completed_at] is the true upper bound per branch.
      // Marked with a '~' duration so the approximation is visible —
      // structural fallback only where the data guarantees it, never a heuristic on hosts that DO report duration.
      if (bars.length && bars.every(b => b.isPhantom)) {
        for (const b of bars) {
          if (!b.inv || !b.inv.completed_at) continue;
          b.isPhantom = false;
          b.subStartMs = stepStart;
          b.subEndMs = Math.min(new Date(b.inv.completed_at).getTime(), stepEnd);
          b.durationLabel = '~' + fmtDuration(Math.max(0, b.subEndMs - b.subStartMs));
        }
      }

      // Show when there's at least 1 real (non-phantom) bar with duration
      const realBars = bars.filter(b => !b.isPhantom);
      if (!realBars.length) return '';

      // ── Tool-call dots on the subagent timeline ──────────────────────────
      // Place each of this step's tool calls on the ONE subagent bar whose
      // window contains its timestamp. We only draw a dot when attribution is
      // unambiguous (exactly one bar covers that instant) — i.e. "only where
      // we have the info". When the call's host gave no timestamp, or parallel
      // bars overlap at that instant, we skip the dot; the textual "Tool Calls"
      // list below still lists it. Pure viewer-side; no data-layer change.
      const stepCalls = (trace.tool_calls || [])
        .map((tc, gi) => ({ tc, gi, ms: tcTs(tc) ? new Date(tcTs(tc)).getTime() : NaN }))
        .filter(x => x.tc.step === st.name && !Number.isNaN(x.ms));
      const dotsByGroup = {};
      for (const c of stepCalls) {
        let gi2 = null;
        // Preferred: attribute by subagent identity (agent_id ↔ subagent_id) —
        // robust under parallel fan-out and immune to time-window edge cases
        // (e.g. an early call whose ts falls just outside the bar's computed span).
        if (c.tc.agent_id) {
          const bar = bars.find(b => !b.isPhantom && b.inv && b.inv.subagent_id === c.tc.agent_id);
          if (bar) gi2 = bar.groupIndex;
        }
        // Fallback: unambiguous time-window match (legacy records / no agent_id /
        // inline steps). Only when exactly one bar covers the instant.
        if (gi2 === null) {
          const owners = bars.filter(b => !b.isPhantom && c.ms >= b.subStartMs && c.ms <= b.subEndMs);
          if (owners.length === 1) gi2 = owners[0].groupIndex;
        }
        if (gi2 === null) continue;
        (dotsByGroup[gi2] = dotsByGroup[gi2] || []).push(c);
      }
      const dotHtml = (b) => {
        const cs = dotsByGroup[b.groupIndex];
        if (!cs || !cs.length) return '';
        return cs.map(c => {
          const pct = Math.max(1, Math.min(99, ((c.ms - stepStart) / stepSpan) * 100));
          const cls = 'timeline-tc-marker-' + (tcKind(c.tc) || 'other');
          const label = esc(c.tc.tool_short || c.tc.tool || '?');
          return `<span class="timeline-tc-marker ${cls}" style="left:${pct.toFixed(1)}%" title="${label}" onclick="event.stopPropagation();var el=document.getElementById('tc-detail-${c.gi}');if(el){el.classList.add('expanded');el.scrollIntoView({behavior:'smooth',block:'center'});}"></span>`;
        }).join('');
      };

      // Time axis ticks — 4-5 marks evenly spaced
      const tickCount = Math.min(5, Math.max(2, Math.floor(stepSpan / 60000) + 1));
      let ticks = '';
      for (let i = 0; i <= tickCount; i++) {
        const pct = (i / tickCount) * 100;
        const t = new Date(stepStart + (i / tickCount) * stepSpan);
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        const ss = String(t.getSeconds()).padStart(2, '0');
        ticks += `<span class="gantt-tick" style="left:${pct}%">${hh}:${mm}:${ss}</span>`;
      }

      // Render rows
      const rows = bars.map(b => {
        if (b.isPhantom) {
          // Phantom: thin marker line at the timestamp
          const posPct = ((b.subStartMs - stepStart) / stepSpan * 100).toFixed(2);
          return `<div class="gantt-row" style="opacity:0.45;height:18px">
            <span class="gantt-label" title="${esc(b.hint)} (phantom)" style="font-style:italic;font-size:10px">${esc(b.hint)} <span style="color:var(--text-muted);font-size:9px">(phantom)</span></span>
            <div class="gantt-track" style="height:10px">
              <div style="position:absolute;left:${posPct}%;top:1px;width:2px;height:8px;background:var(--text-muted);border-radius:1px" title="Phantom invocation at ${fmtTime(b.inv.completed_at)}"></div>
            </div>
          </div>`;
        }

        // Build bar segments with duration labels on each
        let barHtml = '';
        if (b.hasRetries) {
          // Primary bar (first attempt) — amber if failed (non-final), green if passed
          if (!b.inv.completed_at) return '';
          const primEnd = new Date(b.inv.completed_at).getTime();
          const primLeft = ((b.subStartMs - stepStart) / stepSpan * 100).toFixed(2);
          const primWidth = ((Math.min(primEnd, b.subEndMs) - b.subStartMs) / stepSpan * 100).toFixed(2);
          const primPassed = b.inv.gate ? b.inv.gate.passed : true;
          const primClass = primPassed ? 'gantt-bar-pass' : 'gantt-bar-retry'; // amber for non-final fail
          const primDur = fmtDuration(b.inv.duration_ms);
          barHtml += `<div class="gantt-bar ${primClass}" style="left:${primLeft}%;width:${primWidth}%;cursor:pointer" title="Attempt 1: ${primDur}" onclick="scrollToSubagent(${idx}, ${b.groupIndex}, 0);event.stopPropagation()">
            <span class="gantt-bar-text">${primDur}</span>
          </div>`;

          // Retry bars — amber for non-final, green/red for last attempt
          let prevEnd = primEnd;
          b.retries.forEach((r, ri) => {
            if (!r.completed_at) return;
            const rEnd = new Date(r.completed_at).getTime();
            const rStart = Math.max(prevEnd, b.subStartMs);
            const rLeft = ((rStart - stepStart) / stepSpan * 100).toFixed(2);
            const rWidth = ((rEnd - rStart) / stepSpan * 100).toFixed(2);
            const rPassed = r.gate ? r.gate.passed : true;
            const isLast = ri === b.retries.length - 1;
            const rClass = rPassed ? 'gantt-bar-pass' : (isLast ? 'gantt-bar-fail' : 'gantt-bar-retry');
            const rDur = fmtDuration(rEnd - rStart);
            barHtml += `<div class="gantt-bar ${rClass}" style="left:${rLeft}%;width:${rWidth}%;cursor:pointer" title="Retry ${ri + 1}: ${rDur}" onclick="scrollToSubagent(${idx}, ${b.groupIndex}, ${ri + 1});event.stopPropagation()">
              <span class="gantt-bar-text">${rDur}</span>
            </div>`;
            prevEnd = rEnd;
          });
        } else {
          const leftPct  = ((b.subStartMs - stepStart) / stepSpan * 100).toFixed(2);
          const widthPct = ((b.subEndMs - b.subStartMs) / stepSpan * 100).toFixed(2);
          const cls = b.finalPassed ? 'gantt-bar-pass' : 'gantt-bar-fail';
          barHtml = `<div class="gantt-bar ${cls}" style="left:${leftPct}%;width:${widthPct}%;cursor:pointer" title="${esc(b.hint)}: ${b.durationLabel}" onclick="scrollToSubagent(${idx}, ${b.groupIndex}, 0);event.stopPropagation()">
            <span class="gantt-bar-text">${esc(b.durationLabel)}</span>
          </div>`;
        }

        return `<div class="gantt-row">
          <span class="gantt-label" title="${esc(b.hint)}">${esc(b.hint)}</span>
          <div class="gantt-track">${barHtml}${dotHtml(b)}</div>
        </div>`;
      }).join('');

      const hasRetries = bars.some(b => b.hasRetries);
      const legend = `<div class="gantt-legend">
        <span><span class="gantt-legend-dot" style="background:var(--green)"></span>gate passed</span>
        ${hasRetries ? '<span><span class="gantt-legend-dot" style="background:var(--amber)"></span>retry (gate failed)</span>' : ''}
        <span><span class="gantt-legend-dot" style="background:var(--red)"></span>final fail</span>
        ${bars.some(b => b.isPhantom) ? '<span><span class="gantt-legend-dot" style="background:var(--text-muted)"></span>phantom</span>' : ''}
        <span style="font-style:italic">Total: ${fmtDuration(stepSpan)}</span>
      </div>`;

      return `<div class="detail-block">
        <div class="detail-label">Subagent Timeline (${realBars.length > 1 ? realBars.length + ' parallel' : totalInvocations > 1 ? totalInvocations + ' attempts' : '1 subagent'}${bars.some(b => b.isPhantom) ? ', ' + bars.filter(b => b.isPhantom).length + ' phantom' : ''})</div>
        <div class="gantt-container">
          <div class="gantt-axis">${ticks}</div>
          ${rows}
          ${legend}
        </div>
      </div>`;
    }

    function _matchBranchPrompt(inv, promptFiles) {
      // Match invocation to branch prompt by _branch_N in modified_files
      if (!promptFiles || !promptFiles.length) return null;
      const files = inv.modified_files || [];
      for (const f of files) {
        const m = f.match(/_branch_(\d+)/);
        if (m) {
          const bi = parseInt(m[1]);
          const pf = promptFiles.find(p =>
            (typeof p === 'object' ? p.branch_index : null) === bi
          );
          if (pf) return pf;
        }
      }
      // Fallback: match by invocation index if branches == invocations count
      return null;
    }

    function renderAttemptBlock(inv, label, labelClass, isLast, gi, ai, promptFiles) {
      const gate = inv.gate || {};
      const gatePassed = gate.passed !== false; // default true if no gate
      const hasGate = !!inv.gate;

      // Meta
      const metaItems = [];
      if (inv.model) metaItems.push(`<span class="inv-meta-item"><strong>Model:</strong> ${esc(inv.model)}</span>`);
      if (inv.note) metaItems.push(`<span class="inv-meta-item"><strong>Note:</strong> ${esc(inv.note)}</span>`);
      if (inv.parallel_key) metaItems.push(`<span class="inv-meta-item"><strong>Key:</strong> ${esc(inv.parallel_key)}</span>`);
      if (inv.subagent_id) metaItems.push(`<span class="inv-meta-item"><strong>ID:</strong> ${esc(inv.subagent_id.substring(0, 8))}…</span>`);
      const metaHtml = metaItems.length ? `<div class="inv-meta">${metaItems.join('')}</div>` : '';

      // Summary
      const summaryHtml = inv.subagent_summary
        ? `<div class="inv-expandable"><details><summary>Subagent Summary</summary><div class="inv-summary-text">${esc(inv.subagent_summary)}</div></details></div>`
        : '';

      // Task prompt (expandable)
      const promptHtml = inv.task_prompt
        ? `<div class="inv-expandable"><details><summary>Task Prompt (orchestrator → subagent)</summary><div class="inv-prompt-text">${esc(inv.task_prompt)}</div></details></div>`
        : '';

      // Branch prompt (parallel steps — the self-contained prompt file the subagent reads)
      const branchPrompt = _matchBranchPrompt(inv, promptFiles);
      let branchPromptHtml = '';
      if (branchPrompt && typeof branchPrompt === 'object') {
        const bIdx = branchPrompt.branch_index != null ? branchPrompt.branch_index : '?';
        const bPath = branchPrompt.path || '';
        const bContent = branchPrompt.content;
        const bId = `bp-${gi}-${ai}`;
        branchPromptHtml = `<div class="inv-expandable"><details><summary>Branch ${bIdx} Prompt <span style="font-size:10px;color:var(--text-muted);font-weight:normal">(self-contained task file read by subagent)</span></summary>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px"><code>${esc(bPath)}</code></div>
          ${bContent ? `<div class="inv-prompt-text" style="max-height:400px;overflow:auto">${esc(bContent)}</div>` : '<div style="font-size:11px;color:var(--text-muted)">Content not embedded in trace</div>'}
        </details></div>`;
      }

      // Transcript
      const tPath = inv.transcript_path;
      const transcriptHtml = tPath
        ? `<div class="inv-meta"><span class="inv-meta-item"><strong>Transcript:</strong> ${esc(tPath)}</span></div>`
        : '';

      // Modified files
      const files = inv.modified_files || [];
      const filesHtml = files.length
        ? `<details><summary>${files.length} file${files.length !== 1 ? 's' : ''} modified</summary><ul class="file-list">${files.map(f => `<li>${esc(f)}</li>`).join('')}</ul></details>`
        : '';

      // ── Gate section (visually separated) ──
      let gateSectionHtml = '';
      if (hasGate) {
        const gateIcon = gatePassed
          ? `<span class="gate-pass">&#10003;</span>`
          : `<span class="gate-fail">&#10007;</span>`;
        const gateClass = gatePassed ? 'gate-section-pass' : 'gate-section-fail';

        let gateDetailsHtml = '';
        if (!gatePassed && gate.details && gate.details.length) {
          const gfId = 'gf-' + gi + '-' + ai + '-' + Math.random().toString(36).substr(2,5);
          const allLines = gate.details.map(d => esc(String(d))).join('\n');
          const count = gate.details.length;
          gateDetailsHtml = `<div class="gate-failure-detail" id="${gfId}" onclick="document.getElementById('${gfId}').classList.toggle('open');event.stopPropagation()" style="margin-top:6px">
            <div class="gate-failure-header">
              <span class="gate-failure-toggle">&#9654;</span>
              ${count} issue${count !== 1 ? 's' : ''}: ${esc(String(gate.details[0]))}${count > 1 ? ' …' : ''}
            </div>
            <div class="gate-failure-body">${allLines}</div>
          </div>`;
        }

        gateSectionHtml = `<div class="gate-section ${gateClass}">
          <div class="gate-header-row">
            ${gateIcon}
            <span class="gate-type-label">${esc(gate.type || 'gate')}</span>
            <span style="font-size:11px;color:var(--text-muted)">${gate.checks || 0} checks, ${gate.failures || 0} failures</span>
          </div>
          ${gateDetailsHtml}
        </div>`;
      }

      // ── Feedback arrow (only if gate failed and there's a followup) ──
      let feedbackHtml = '';
      if (!gatePassed && inv.followup_message && !isLast) {
        feedbackHtml = `<div class="feedback-arrow" onclick="event.stopPropagation()">
          <div class="feedback-arrow-text">${esc(inv.followup_message)}</div>
        </div>`;
      }

      // Block styling: all attempts get colored left border + tinted bg
      // amber = gate failed (non-final), green = gate passed, red = final fail
      let blockClass;
      if (gatePassed) {
        blockClass = 'attempt-block-pass';
      } else if (isLast) {
        blockClass = 'attempt-block-fail';
      } else {
        blockClass = 'attempt-block-retry';
      }

      // Time range
      let timeStr = '';
      if (inv.completed_at && inv.duration_ms) {
        const endMs = new Date(inv.completed_at).getTime();
        const startMs = endMs - inv.duration_ms;
        timeStr = `${fmtTime(new Date(startMs).toISOString())} → ${fmtTime(inv.completed_at)}`;
      } else if (inv.completed_at) {
        timeStr = fmtTime(inv.completed_at);
      }

      return `<div class="attempt-block ${blockClass}" data-group="${gi}" data-attempt="${ai}">
        <div class="attempt-header">
          <span class="attempt-label ${labelClass}">${label}</span>
          <div class="attempt-stats">
            <span>${fmtDuration(inv.duration_ms)}</span>
            <span>${inv.message_count || 0} msg</span>
            <span>${inv.tool_call_count || 0} tools</span>
            ${timeStr ? `<span class="subagent-time">${timeStr}</span>` : ''}
          </div>
        </div>
        ${metaHtml}
        ${promptHtml}
        ${branchPromptHtml}
        ${summaryHtml}
        ${filesHtml}
        ${transcriptHtml}
        ${gateSectionHtml}
        ${feedbackHtml}
      </div>`;
    }

    function renderInvocations(invocations, promptFiles) {
      if (!invocations.length) return '';
      const groups = groupInvocations(invocations);
      const totalAttempts = invocations.length;
      const label = `Invocations (${groups.length} subagent${groups.length !== 1 ? 's' : ''}, ${totalAttempts} total)`;
      const pf = promptFiles || [];

      const html = groups.map((g, gi) => {
        const inv = g.primary;
        const retries = g.retries;
        const hasRetries = retries.length > 0;
        const lastInv = hasRetries ? retries[retries.length - 1] : inv;
        const finalPassed = lastInv.gate ? lastInv.gate.passed : true;
        const allInvocations = [inv, ...retries];

        // Compute overall start/end
        let startTimeStr = '';
        let endTimeStr = '';
        if (inv.completed_at && inv.duration_ms) {
          const endMs = new Date(inv.completed_at).getTime();
          const startMs = endMs - inv.duration_ms;
          startTimeStr = fmtTime(new Date(startMs).toISOString());
          endTimeStr = fmtTime(inv.completed_at);
        } else if (inv.completed_at) {
          endTimeStr = fmtTime(inv.completed_at);
        }
        if (hasRetries && lastInv.completed_at) {
          endTimeStr = fmtTime(lastInv.completed_at);
        }
        const timeRange = startTimeStr
          ? `<span class="subagent-time">${startTimeStr}${endTimeStr ? ' → ' + endTimeStr : ''}</span>`
          : '';

        // Aggregate stats
        const totalMsgs = Math.max(inv.message_count || 0, ...(retries.map(r => r.message_count || 0)));
        const totalTools = (inv.tool_call_count || 0) + retries.reduce((s, r) => s + (r.tool_call_count || 0), 0);

        const gateIcon = finalPassed
          ? `<span class="gate-pass">&#10003;</span>`
          : `<span class="gate-fail">&#10007;</span>`;

        const taskHint = extractTaskHint(inv);

        // Render all attempts as separate blocks
        const attemptBlocks = allInvocations.map((a, ai) => {
          const isLast = ai === allInvocations.length - 1;
          if (ai === 0) {
            return renderAttemptBlock(a, `Attempt 1`, 'attempt-label-primary', isLast, gi, ai, pf);
          } else {
            return renderAttemptBlock(a, `↻ Retry ${ai}`, 'attempt-label-retry', isLast, gi, ai, pf);
          }
        }).join('');

        return `<div class="subagent-group" onclick="this.classList.toggle('open');event.stopPropagation()">
          <div class="subagent-header">
            <span class="subagent-toggle">&#9654;</span>
            <span class="subagent-label">Subagent ${gi + 1}</span>
            ${inv.model ? `<span class="step-model">${esc(inv.model)}</span>` : ''}
            ${taskHint ? `<span style="font-size:11px;color:var(--text-secondary);font-style:italic">${esc(taskHint)}</span>` : ''}
            ${timeRange}
            ${inv.hook_status && inv.hook_status !== 'unknown' ? `<span class="pill pill-${inv.hook_status === 'completed' ? 'completed' : 'failed'}">${esc(inv.hook_status)}</span>` : ''}
            <span>${fmtDuration(inv.duration_ms)}</span>
            <span>${totalMsgs} msg</span>
            <span>${totalTools} tools</span>
            ${gateIcon}
            ${hasRetries ? `<span class="gate-info">${retries.length} retr${retries.length === 1 ? 'y' : 'ies'}</span>` : ''}
          </div>
          <div class="subagent-body" onclick="event.stopPropagation()">
            ${attemptBlocks}
          </div>
        </div>`;
      }).join('');
      return `<div class="detail-block"><div class="detail-label">${label}</div>${html}</div>`;
    }

    // ── Ledger-derived subagent fallback (hookless host surfaces) ──────────
    // Subagent visibility on hookless host surfaces (e.g. cursor-agent CLI,
    // where subagentStop never fires → invocations stay empty by construction
    // while the tool-call ledger still records every call WITH a stable
    // per-session key). PRECEDENCE IS STRUCTURAL, never heuristic:
    //   invocations.length > 0  → hook data is authoritative; this renders ''.
    //   invocations.length == 0 → pseudo-cards derived from the ledger.
    // The two paths can never double-render a subagent.

    // Group this step's tool calls by session key (agent_id when the host
    // provides it, else the hook-payload correlation id `corr`). Collapses
    // mixed-adapter duplicates: the same physical write reported through two
    // hook configs (host stamps differ, same session + file, ≤2.5s apart).
    function groupLedgerSessions(st) {
      const calls = (trace.tool_calls || []).filter(tc => tc.step === st.name);
      const byKey = new Map();
      for (const tc of calls) {
        const key = tc.agent_id || tc.corr;
        if (!key) continue;
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push(tc);
      }
      const groups = [];
      for (const [key, evts] of byKey) {
        evts.sort((a, b) => String(tcTs(a) || '').localeCompare(String(tcTs(b) || '')));
        const merged = [];
        for (const e of evts) {
          const eFile = (e.args && (e.args.file_path || e.args.filePath)) || null;
          const eTs = tcTs(e) ? new Date(tcTs(e)).getTime() : null;
          const prev = merged[merged.length - 1];
          const pFile = prev && ((prev.args && (prev.args.file_path || prev.args.filePath)) || null);
          const pTs = prev && tcTs(prev) ? new Date(tcTs(prev)).getTime() : null;
          if (prev && eFile && pFile && eFile === pFile && eTs != null && pTs != null &&
              Math.abs(eTs - pTs) <= 2500 && e.host !== prev.host) {
            prev._dupHosts = [...new Set([...(prev._dupHosts || [prev.host]), e.host])];
            continue;
          }
          merged.push({ ...e });
        }
        const firstTs = tcTs(merged[0]);
        const lastTs = tcTs(merged[merged.length - 1]);
        groups.push({ key, events: merged, rawCount: evts.length, firstTs, lastTs });
      }
      groups.sort((a, b) => String(a.firstTs || '').localeCompare(String(b.firstTs || '')));
      return groups;
    }

    function renderLedgerSubagents(st) {
      const inv = st.invocations || [];
      if (inv.length > 0) return ''; // hook data present → authoritative, no pseudo-cards
      const cfg = st.config || {};
      if (cfg.subagent === false) return ''; // inline step: 0 invocations is normal
      // Planning + delegation steps are driven by the ORCHESTRATOR directly, not
      // a spawned subagent — 0 subagent-lifecycle events is BY DESIGN there (the
      // planning child's substeps carry their own gates; a delegation step runs
      // the child workflow). Without this guard the "host did not emit subagent
      // hooks" banner fires misleadingly on every planning/delegation step, on
      // ALL hosts (surfaced via the copilot full-mechanics-demo audit 2026-07-31).
      if (st.planning) return '';
      if (st.delegate_to) return '';
      if (st.status === 'pending') return '';
      const groups = groupLedgerSessions(st);
      if (!groups.length) return '';

      // Host-aware banner: generic wording by default; a dedicated message when
      // the ledger stamps identify a Cursor CLI run (tool events carry host
      // 'cursor' while no subagent lifecycle events arrived — the CLI currently
      // implements only a subset of the hook events).
      const stepHosts = new Set(groups.flatMap(g => g.events.map(e => e.host).filter(Boolean)));
      const looksLikeCursorCli = stepHosts.has('cursor');
      const bannerText = looksLikeCursorCli
        ? `This appears to be a <strong>Cursor CLI</strong> (cursor-agent) run. The CLI currently emits only a subset of hook
           events and no subagent lifecycle events, so per-subagent gate telemetry is unavailable for this step.`
        : `The host did not emit subagent lifecycle hook events for this step, so per-subagent gate telemetry is unavailable.`;
      const banner = `<div style="background:rgba(230,160,30,0.08);border:1px solid var(--amber);border-radius:6px;padding:6px 10px;font-size:11px;margin-bottom:6px">
        &#9888; ${bannerText} Activity below is <strong>reconstructed from the tool-call ledger</strong>;
        outputs were still validated by the engine's built-in gate.
      </div>`;

      const cards = groups.map((g, gi) => {
        const tools = [...new Set(g.events.map(e => e.tool_short || e.tool).filter(Boolean))];
        const files = [...new Set(g.events
          .map(e => (e.args && (e.args.file_path || e.args.filePath)) || null)
          .filter(Boolean)
          .map(f => String(f).split(/[\\/]/).pop()))];
        const dupCount = g.events.filter(e => e._dupHosts && e._dupHosts.length > 1).length;
        const timeRange = g.firstTs
          ? `<span class="subagent-time">${fmtTime(g.firstTs)}${g.lastTs && g.lastTs !== g.firstTs ? ' → ' + fmtTime(g.lastTs) : ''}</span>`
          : '';
        const rows = g.events.map(e => {
          const f = (e.args && (e.args.file_path || e.args.filePath)) || '';
          const dup = e._dupHosts && e._dupHosts.length > 1
            ? ` <span class="pill" style="font-size:9px;background:var(--bg-secondary)" title="The same write was reported by ${e._dupHosts.length} hook configurations (${esc(e._dupHosts.join(', '))}) — shown once.">&times;${e._dupHosts.length} adapters</span>`
            : '';
          return `<div style="font-size:11px;padding:2px 0;font-family:var(--mono)">
            <span class="orch-time">${tcTs(e) ? fmtTime(tcTs(e)) : ''}</span>
            <strong>${esc(e.tool_short || e.tool || '?')}</strong>
            ${f ? `<span style="color:var(--text-muted);word-break:break-all"> ${esc(String(f).split(/[\\/]/).pop())}</span>` : ''}${dup}
          </div>`;
        }).join('');
        return `<div class="subagent-group" onclick="this.classList.toggle('open');event.stopPropagation()">
          <div class="subagent-header">
            <span class="subagent-toggle">&#9654;</span>
            <span class="subagent-label">Session ${gi + 1}</span>
            <span class="pill" style="font-size:9px;background:var(--bg-secondary)" title="Reconstructed from the tool-call ledger (session key: ${esc(String(g.key).slice(0, 12))}…) — no hook data for this step">ledger-derived</span>
            ${timeRange}
            <span>${g.events.length} tool call${g.events.length !== 1 ? 's' : ''}${dupCount ? ` (${g.rawCount} raw)` : ''}</span>
            ${tools.length ? `<span style="font-size:10px;color:var(--text-muted)">${esc(tools.join(', '))}</span>` : ''}
          </div>
          <div class="subagent-body" onclick="event.stopPropagation()">
            ${rows}
            ${files.length ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px">files: ${esc(files.join(', '))}</div>` : ''}
          </div>
        </div>`;
      }).join('');

      const label = `Subagent activity — ledger-derived (${groups.length} session${groups.length !== 1 ? 's' : ''})`;
      return `<div class="detail-block"><div class="detail-label">${label}</div>${banner}${cards}</div>`;
    }

    function renderToolWarnings(st) {
      const warnings = st.tool_warnings;
      if (!warnings || !warnings.length) return '';

      const rows = warnings.map(w => {
        const typeBadge = `<span class="tool-warning-type">${esc(w.type || '?')}</span>`;
        return `<div class="tool-warning-row">
          <span class="tool-warning-icon">&#9888;</span>
          <div class="tool-warning-text">
            <span class="tool-warning-tool">${esc(w.tool)}</span> ${typeBadge}
            <div style="font-size:11px;margin-top:2px">${esc(w.warning)}</div>
          </div>
        </div>`;
      }).join('');

      return `<div class="detail-block">
        <div class="tool-warning-box">
          <div style="font-size:11px;font-weight:600;margin-bottom:4px">&#9888; Tool Warnings (${warnings.length})</div>
          ${rows}
        </div>
      </div>`;
    }

    function renderPromptFiles(st) {
      const files = st.prompt_files;
      if (!files || !files.length) return '';
      // Support both old format (plain strings) and new format (objects with content)
      const rows = files.map((f, i) => {
        const isObj = typeof f === 'object' && f !== null;
        const path = isObj ? f.path : f;
        const content = isObj ? f.content : null;
        const idx = isObj && f.branch_index != null ? f.branch_index : i;
        const id = `prompt-${st.name}-${idx}`;
        const contentBlock = content
          ? `<div id="${id}" class="prompt-content" style="display:none;margin:4px 0 8px 0;max-height:400px;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:4px;padding:8px;font-size:11px;white-space:pre-wrap;font-family:var(--mono)">${esc(content)}</div>`
          : '';
        const toggleBtn = content
          ? `<span class="prompt-toggle" onclick="var el=document.getElementById('${id}');el.style.display=el.style.display==='none'?'block':'none';this.textContent=el.style.display==='none'?'▶':'▼'" style="cursor:pointer;font-size:10px;margin-right:4px;color:var(--text-muted)">▶</span>`
          : '<span style="font-size:10px;margin-right:4px;color:var(--text-muted)">·</span>';
        return `<li style="margin:2px 0">
          ${toggleBtn}<strong style="font-size:11px">Branch ${idx}</strong>
          <code style="font-size:10px;background:var(--bg-secondary);padding:1px 4px;border-radius:3px;margin-left:4px">${esc(path)}</code>
          ${contentBlock}
        </li>`;
      }).join('');
      return `<div class="detail-block">
        <div class="detail-label">Branch Prompts (${files.length} files)</div>
        <ul style="list-style:none;padding:0;margin:4px 0">${rows}</ul>
      </div>`;
    }

    function renderStepToolCalls(st, stepIdx) {
      if (!trace.tool_calls || !trace.tool_calls.length) return '';
      const calls = trace.tool_calls.map((tc, gi) => ({ ...tc, _gi: gi })).filter(tc => tc.step === st.name);
      if (!calls.length) return '';

      const rows = calls.map(tc => {
        const ok = tc.success !== false;
        const dotCls = ok ? 'orch-dot orch-dot-green' : 'orch-dot orch-dot-fail';
        const toolName = tc.tool_short || tc.tool || '?';
        const argsObj = tcArgsObj(tc);
        // Full args/result go INTO the block; CSS collapses it to ~40px and a click
        // expands to the FULL content (the logger caps args at 2000 / result at 500
        // chars, so "full" is the captured payload). Fixes the old result preview
        // that truncated the content itself → expanding revealed nothing more.
        const argsHtml = argsObj && Object.keys(argsObj).length
          ? `<div class="tool-call-kv"><span class="tool-call-kv-tag">args</span>${esc(JSON.stringify(argsObj, null, 2))}</div>`
          : '';
        const dur = tc.duration_ms != null ? `<span class="orch-dur">${tc.duration_ms}ms</span>` : '';
        const errHtml = tc.error ? `<span class="orch-error">${esc(tc.error)}</span>` : '';
        const exitHtml = tc.exit_code != null && tc.exit_code !== 0 ? `<span class="orch-error">exit ${tc.exit_code}</span>` : '';
        const outLen = tc.output_length ? `<span class="orch-summary" title="output size">${tc.output_length} chars output</span>` : '';
        const ts = tcTs(tc);
        const time = ts ? `<span class="orch-time">${fmtTime(ts)}</span>` : '';

        const resultStr = tcResult(tc);
        const previewHtml = resultStr
          ? `<div class="tool-call-kv"><span class="tool-call-kv-tag">result</span>${esc(resultStr)}</div>`
          : '';
        const detail = `${argsHtml}${previewHtml}`;
        const caret = detail
          ? '<span class="tool-call-caret">▸</span>'
          : '<span class="tool-call-caret"></span>';
        // Collapsed by default: only the summary row shows. Clicking it toggles
        // `.expanded` on the container → reveals the full args + result.
        const rowAttrs = detail
          ? ' onclick="this.parentElement.classList.toggle(\'expanded\');event.stopPropagation()"'
          : '';
        return `<div class="tool-call" id="tc-detail-${tc._gi}">
          <div class="tool-call-row"${rowAttrs}>
            ${caret}
            ${time}
            <span class="${dotCls}"></span>
            <span class="tool-call-name">${esc(toolName)}</span>
            ${tcBadgesHtml(tc)}
            ${dur}
            ${outLen}
            ${exitHtml}${errHtml}
          </div>
          ${detail ? `<div class="tool-call-detail">${detail}</div>` : ''}
        </div>`;
      }).join('');

      return `<div class="detail-block">
        <div class="tool-calls-section">
          <div class="tool-calls-section-title">Tool Calls (${calls.length})</div>
          ${rows}
        </div>
      </div>`;
    }

    function renderModifiedFiles(files) {
      if (!files.length) return '';
      return `<div class="detail-block">
        <details>
          <summary>${files.length} file${files.length !== 1 ? 's' : ''} modified across all attempts</summary>
          <ul class="file-list">${files.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
        </details>
      </div>`;
    }

    // One resolved file behind a declared input/output: path + badges +
    // collapsed content preview (native <details> — no JS, collapsed by default).
    function renderResolvedFile(f) {
      const badges = [];
      if (f.exists === false) badges.push('<span class="io-tag io-tag-warn">missing</span>');
      if (typeof f.size === 'number') badges.push(`<span class="io-tag">${f.size} B</span>`);
      if (f.binary) badges.push('<span class="io-tag">binary</span>');
      if (f.truncated) badges.push('<span class="io-tag">truncated</span>');
      const head = `<span class="io-path">${esc(f.path || '?')}</span> ${badges.join(' ')}`;
      const hasPreview = f.value_preview != null && f.value_preview !== '';
      const note = f.truncated ? '\n… (truncated — open the file for the full content)' : '';
      const preview = hasPreview
        ? `<details class="io-preview"><summary>preview</summary><pre class="io-pre">${esc(f.value_preview + note)}</pre></details>`
        : '';
      return `<li>${head}${preview}</li>`;
    }

    function renderResolvedList(resolved, emptyLabel) {
      const arr = resolved || [];
      if (!arr.length) return `<span class="io-empty">${esc(emptyLabel)}</span>`;
      return `<ul class="io-file-list">${arr.map(renderResolvedFile).join('')}</ul>`;
    }

    // START-of-step: declared inputs, resolved + populated. Collapsed section.
    function renderStepInputs(st) {
      const inputs = st.inputs || [];
      if (!inputs.length) return '';
      const items = inputs.map(inp => {
        const tags = [];
        if (inp.inject) tags.push(`<span class="io-tag">${esc(inp.inject)}</span>`);
        if (inp.struct) tags.push(`<span class="io-tag">struct: ${esc(inp.struct)}</span>`);
        return `<li><span class="io-path">${esc(inp.path || '?')}</span> ${tags.join(' ')}${renderResolvedList(inp.resolved, '(no file resolved)')}</li>`;
      }).join('');
      return `<div class="detail-block"><details class="io-section"><summary class="io-section-summary">Inputs (resolved) — ${inputs.length}</summary><ul class="io-list">${items}</ul></details></div>`;
    }

    // END-of-step: produced outputs + applied param_bindings. Collapsed section.
    function renderStepOutputs(st) {
      const outputs = st.outputs || [];
      const pb = st.param_bindings || {};
      const pbKeys = Object.keys(pb);
      if (!outputs.length && !pbKeys.length) return '';
      let inner = '';
      if (outputs.length) {
        const items = outputs.map(out => {
          const tags = [];
          if (out.struct) tags.push(`<span class="io-tag">struct: ${esc(out.struct)}</span>`);
          if (out.write_proof) tags.push(`<span class="io-tag">write_proof: ${esc(out.write_proof)}</span>`);
          if (out.optional) tags.push('<span class="io-tag">optional</span>');
          // F7: artifact handoff — this output was COPIED from the delegated
          // child's run dir by the engine at step_complete.
          if (out.from_delegated) tags.push(`<span class="io-tag io-tag-warn" data-tip="Artifact handoff (from_delegated): at step_complete the engine copied this file FROM the delegated child's run dir (source: ${esc(out.from_delegated)}, resolved against the CHILD's params) to this parent-side path, where it was gate-validated like a normal output.">from child: ${esc(out.from_delegated)}</span>`);
          return `<li><span class="io-path">${esc(out.path || '?')}</span> ${tags.join(' ')}${renderResolvedList(out.resolved, '(not produced)')}</li>`;
        }).join('');
        inner += `<div class="io-group"><div class="io-group-label">Outputs</div><ul class="io-list">${items}</ul></div>`;
      }
      if (pbKeys.length) {
        const rows = pbKeys.map(k => {
          const b = pb[k] || {};
          const val = (b.value !== null && typeof b.value === 'object') ? JSON.stringify(b.value) : String(b.value);
          return `<li><span class="io-path">${esc(k)}</span> <span class="io-tag">${esc(b.expr || '')}</span> = <code>${esc(val)}</code></li>`;
        }).join('');
        inner += `<div class="io-group"><div class="io-group-label">Param bindings</div><ul class="io-list">${rows}</ul></div>`;
      }
      return `<div class="detail-block"><details class="io-section"><summary class="io-section-summary">Outputs &amp; bindings</summary>${inner}</details></div>`;
    }

    function toggleStep(idx) { document.getElementById('step-' + idx).classList.toggle('open'); }

    function scrollToStep(idx) {
      const el = document.getElementById('step-' + idx);
      if (el) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }

    function scrollToSubagent(stepIdx, groupIdx, attemptIdx) {
      // Open the target step card and find the nth subagent-group within it
      const stepCard = document.getElementById('step-' + stepIdx);
      if (!stepCard) return;
      stepCard.classList.add('open');
      const groups = stepCard.querySelectorAll('.subagent-group');
      if (groups[groupIdx]) {
        groups[groupIdx].classList.add('open');
        // If attemptIdx given, scroll to the specific attempt block
        const target = typeof attemptIdx === 'number'
          ? groups[groupIdx].querySelector(`.attempt-block[data-attempt="${attemptIdx}"]`)
          : groups[groupIdx];
        const el = target || groups[groupIdx];
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // Brief highlight
        el.style.outline = '2px solid var(--accent)';
        el.style.outlineOffset = '2px';
        setTimeout(() => { el.style.outline = ''; el.style.outlineOffset = ''; }, 1800);
      }
    }

    // ── Tooltip system (click to show, ? hint follows cursor) ──
    (function() {
      let activeTip = null;
      let hint = null;

      // Create floating ? hint
      function ensureHint() {
        if (hint) return;
        hint = document.createElement('div');
        hint.className = 'tip-hint';
        hint.textContent = '?';
        hint.style.opacity = '0';
        document.body.appendChild(hint);
      }

      function closeTip() {
        if (activeTip) { activeTip.remove(); activeTip = null; }
      }

      // Show/hide ? near cursor when hovering data-tip elements
      document.addEventListener('mouseover', function(e) {
        const el = e.target.closest('[data-tip]');
        ensureHint();
        hint.style.opacity = el ? '1' : '0';
      });
      document.addEventListener('mouseout', function(e) {
        if (!e.target.closest('[data-tip]')) {
          ensureHint();
          hint.style.opacity = '0';
        }
      });
      document.addEventListener('mousemove', function(e) {
        if (!hint || hint.style.opacity === '0') return;
        hint.style.left = (e.clientX + 12) + 'px';
        hint.style.top = (e.clientY - 8) + 'px';
      });

      // Click to show tooltip popup.
      // NEVER swallow a click on a control. This handler runs in the capture
      // phase and stops propagation, so any interactive element that happens
      // to carry data-tip would become dead — which is exactly what happened
      // to the inbox dialog inside the studio: the studio's help bridge
      // rewrites `title` into `data-tip` on hover, so Accept/Reject went dead
      // after the first mouse-over while Send (no title) kept working.
      document.addEventListener('click', function(e) {
        if (e.target.closest('button, a, input, select, textarea, [onclick]')) { closeTip(); return; }
        const el = e.target.closest('[data-tip]');
        if (!el) { closeTip(); return; }
        e.stopPropagation();
        if (activeTip && activeTip._src === el) { closeTip(); return; }
        closeTip();
        const rect = el.getBoundingClientRect();
        const tip = document.createElement('div');
        tip.className = 'tip-popup';
        tip.textContent = el.dataset.tip;
        tip._src = el;
        document.body.appendChild(tip);
        const tipRect = tip.getBoundingClientRect();
        let left = rect.left + rect.width / 2 - tipRect.width / 2;
        let top = rect.top - tipRect.height - 8;
        if (left < 8) left = 8;
        if (left + tipRect.width > window.innerWidth - 8) left = window.innerWidth - tipRect.width - 8;
        if (top < 8) { top = rect.bottom + 8; }
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
        activeTip = tip;
      }, true);
      document.addEventListener('scroll', closeTip, true);
    })();

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
