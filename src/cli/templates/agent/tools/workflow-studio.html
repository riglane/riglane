           answer from either place, from an external program via the Local API, or in the terminal as
           before. Whichever channel answers first wins, and every answer becomes a durable record:
           who, what, when, through which channel. The engine refuses to complete the step until a
           fresh answer exists, so an approval can no longer be assumed — it is verified. Try it:
           run the <code>inbox-demo</code> example workflow.`,
  },
  {
    id: 'inbox-external-apps',
    eyebrow: 'New',
    title: 'Your own app can receive the questions — and answer them',
    sections: ['editor', 'messages'],
    body: `Building your own interface on top of Riglane (an exe, a python tool, a bot)? Point the run
           at it: the <b>Inbox webhook URL</b> field on the workflow form (a committed default), the
           <code>--inbox-webhook</code> flag / the <code>inbox_webhook</code> field of
           <code>POST /api/run</code> (per-run — the app that launches the run names its own callback),
           or env/config. Every question is then POSTed to that address as a <b>self-contained
           envelope</b>: the message plus a <code>respond</code> block carrying the URL, a one-shot
           token and the body template — your app shows the question in its own UI and answers with a
           single POST back. The token answers only that message and survives server restarts. Programs
           that would rather poll read <code>.riglane/local/serve.json</code> (base URL + token) and use
           <code>GET /api/inbox.json</code> + <code>POST /api/inbox/respond</code>.`,
  },
];

function hintDismissedIds() {
  try { const v = JSON.parse(localStorage.getItem(HINT_STORE) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; } // file:// or blocked storage — treat as nothing dismissed
}
function hintDismiss(id) {
  try {
    const ids = hintDismissedIds();
    if (!ids.includes(id)) { ids.push(id); localStorage.setItem(HINT_STORE, JSON.stringify(ids)); }
  } catch (e) { /* non-fatal: the hint simply reappears next session */ }
  savePrefs();   // the file is what survives a server restart, not the store
}
function hintUndismiss(id) {
  try {
    const ids = hintDismissedIds().filter(x => x !== id);
    localStorage.setItem(HINT_STORE, JSON.stringify(ids));
  } catch (e) { /* non-fatal — the hint stays dismissed until next session */ }
  savePrefs();
}
/* The hints this section can show, in list order. This IS the browsable list:
   the arrows walk it whole, dismissed entries included, because arrowing back
   to something you dismissed is the one way to find it again. Only the FIRST
   hint shown is chosen by dismissal (activeHint). */
function hintsForSection() {
  return STUDIO_HINTS.filter(h => (h.sections || ['editor']).includes(state.section));
}
function activeHint() {
  const done = hintDismissedIds();
  return hintsForSection().find(h => !done.includes(h.id)) || null;
}

/* Shown only on the Editor section (a hint about authoring is noise while
   reading a trace) and only once the boot delay has elapsed. Deliberately NOT
   gated on having a workflow open — an empty editor is exactly when "you can
   generate one with a skill" is most useful. */
function renderHint() {
  const el = document.getElementById('hintBubble');
  if (!el) return;
  const hint = activeHint();
  const wanted = state._hintReady && !!hint;
  if (!wanted) {
    if (el.classList.contains('open')) collapseHint();
    el.classList.add('hidden');
    return;
  }
  // Before the re-pop guard: the inset must keep tracking the scrollbar even
  // while the bubble is already up.
  measureHintScrollbar(el);
  if (!el.classList.contains('hidden')) {
    if (el.dataset.hintId === hint.id) return;   // same hint — don't re-pop
    collapseHint();                              // a different hint applies here
  }
  hintShow(hintsForSection().indexOf(hint));
  el.classList.remove('hidden');
  // Restart the entry animation (class must be re-added after a reflow).
  el.classList.remove('entering'); void el.offsetWidth; el.classList.add('entering');
}

/* Write ONE hint into the card — content only, never open/hidden state. That
   is what lets the same function serve the first render and every arrow press:
   arrowing swaps the text inside a card that is already up, instead of
   collapsing and re-popping it. The checkbox reflects the REAL dismissal of the
   hint on screen, so arrowing onto a dismissed one shows it ticked and
   unticking it brings that hint back. */
function hintShow(idx) {
  const list = hintsForSection();
  const hint = list[idx];
  const el = document.getElementById('hintBubble');
  if (!hint || !el) return;
  el.dataset.hintId = hint.id;
  el.dataset.hintIdx = String(idx);
  document.getElementById('hintEyebrow').textContent = hint.eyebrow;
  document.getElementById('hintTitle').textContent = hint.title;
  document.getElementById('hintBody').innerHTML = hint.body;
  document.getElementById('hintNever').checked = hintDismissedIds().includes(hint.id);
  const nav = document.getElementById('hintNav');
  const prev = document.getElementById('hintPrev');
  const next = document.getElementById('hintNext');
  const pos = document.getElementById('hintPos');
  if (nav) nav.style.visibility = list.length > 1 ? '' : 'hidden';
  if (prev) prev.disabled = idx <= 0;
  if (next) next.disabled = idx >= list.length - 1;
  if (pos) pos.textContent = (idx + 1) + ' / ' + list.length;
}

/* Move one hint along the browsable list. The card is taller or shorter for the
   next hint, and when it is OPEN its height is an explicit pixel value — so the
   geometry has to be re-committed or the new body clips or leaves a gap. */
function hintStep(delta) {
  const el = document.getElementById('hintBubble');
  if (!el) return;
  const idx = Number(el.dataset.hintIdx || 0) + delta;
  if (idx < 0 || idx >= hintsForSection().length) return;
  hintShow(idx);
  if (el.classList.contains('open')) hintMeasure();
}

/* Commit the card's geometry: measure at its FINAL width, then publish the
   height on the bubble. Shared by openHint (where `left` and `height` must
   animate as one motion) and by hintStep (where only the height changes). */
function hintMeasure() {
  const el = document.getElementById('hintBubble');
  const card = document.getElementById('hintCard');
  const main = document.getElementById('main');
  if (!el || !card || !main) return;
  const cs = getComputedStyle(el);
  const gap = parseFloat(cs.getPropertyValue('--hint-gap')) || 14;
  const sb = parseFloat(cs.getPropertyValue('--hint-sb')) || 0;
  card.style.width = Math.max(0, main.clientWidth - gap * 2 - sb) + 'px';
  const h = card.offsetHeight;
  card.style.width = '';
  el.style.height = h + 'px';
}

/* The embedded tool scrolls inside its own iframe, so #main's right edge sits
   BEHIND that scrollbar. Publish its width as --hint-sb so the visible gap
   matches the top inset. Re-measured on every render because a scrollbar
   appears and disappears with the loaded workflow's length. */
function measureHintScrollbar(el) {
  let sb = 0;
  const f = document.getElementById('editorFrame');
  if (f && !f.classList.contains('hidden')) {
    try {
      const w = f.contentWindow;
      const de = w && w.document && w.document.documentElement;
      if (de) sb = Math.max(0, Math.min(28, w.innerWidth - de.clientWidth));
    } catch (e) {
      sb = 15; // not readable yet — assume a classic bar rather than sit flush
    }
  }
  el.style.setProperty('--hint-sb', sb + 'px');
}

function openHint() {
  const el = document.getElementById('hintBubble');
  const card = document.getElementById('hintCard');
  const main = document.getElementById('main');
  if (!el || !card || !main) return;
  el.classList.remove('entering');
  measureHintScrollbar(el);
  // Measure the card at its FINAL width and commit the geometry in this same
  // frame, so `left` (from .open) and `height` animate as one motion. Measuring
  // after the widen (rAF) would start the height a couple of frames late and
  // the morph visibly kinks. Insets are read back from the custom properties so
  // the two sides cannot drift from the CSS.
  hintMeasure();
  el.classList.add('open');
  document.getElementById('hintOpen').setAttribute('aria-expanded', 'true');
  card.setAttribute('tabindex', '-1');
  card.focus({ preventScroll: true });
}

function collapseHint() {
  const el = document.getElementById('hintBubble');
  if (!el) return;
  el.classList.remove('open');
  el.style.height = '';
  const btn = document.getElementById('hintOpen');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function closeHint() {
  const el = document.getElementById('hintBubble');
  if (!el) return;
  const never = document.getElementById('hintNever');
  const dismissed = !!(never && never.checked);
  // Both directions: the box now MIRRORS the stored state (arrowing onto a
  // dismissed hint shows it ticked), so closing with it cleared is an explicit
  // "show this one again" and must undo the dismissal.
  if (el.dataset.hintId) {
    if (dismissed) hintDismiss(el.dataset.hintId);
    else hintUndismiss(el.dataset.hintId);
  }
  collapseHint();
  if (dismissed) {
    // Let the morph finish, then either queue the next hint or retire the
    // bubble. renderHint() re-pops only when a fresh hint is actually queued.
    window.setTimeout(() => { el.classList.add('hidden'); renderHint(); }, 460);
  }
}

document.addEventListener('keydown', (e) => {
  const el = document.getElementById('hintBubble');
  if (!el || !el.classList.contains('open')) return;
  if (e.key === 'Escape') { collapseHint(); return; }
  // Arrows browse the hints while the card has focus. Guarded on the open card
  // so they never steal the keys from the graph or a form underneath.
  if (e.key === 'ArrowLeft') { e.preventDefault(); hintStep(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); hintStep(1); }
});

/* ── Icons ── */
function iconSidebar() { return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.6"/></svg>'; }
function iconChevronLeft() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function iconCaret() { return '<svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function iconFolder() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" stroke="currentColor" stroke-width="1.5"/></svg>'; }
function iconPlus() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'; }
function iconUpload() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto"><path d="M12 15V4M8 8l4-4 4 4M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

/* ── Boot ── */
readUrl();
// Paint from the cache immediately, then let the server's copy correct it —
// the file is the source of truth precisely because it outlives the port.
applyPrefs(prefsFromCache());
renderTopbar(); renderSidebar(); renderMain(); renderLive(); renderPanel();
void loadPrefs().then(() => {
  renderTopbar(); renderSidebar(); renderMain(); renderPanel();
});
void refresh();
setInterval(() => void refresh(), POLL_MS);
setInterval(() => void checkToolsVersion(), POLL_MS);

/* ── Stale-page detection ──────────────────────────────────────────────────
   The studio and the tools it frames are served live from the installed
   tools directory, refreshed on every upgrade or server restart. A studio
   left open across an upgrade keeps running the OLD scripts forever — its
   polling renews the DATA, never the code — so a shipped fix reads as
   "still broken". Watch the served files' Last-Modified and offer a reload. */
const _toolStamps = {};
let _staleShown = false;
async function checkToolsVersion() {
  const files = [location.pathname, 'workflow-editor.html', 'trace-viewer.html'];
  for (const f of files) {
    try {
      const r = await fetch(f, { method: 'HEAD', cache: 'no-store' });
      if (!r.ok) continue;
      const stamp = r.headers.get('Last-Modified');
      if (!stamp) continue;
      if (_toolStamps[f] === undefined) { _toolStamps[f] = stamp; continue; }
      if (_toolStamps[f] !== stamp && !_staleShown) { _staleShown = true; showStaleBanner(); return; }
    } catch { /* offline — try again next cycle */ }
  }
}
function showStaleBanner() {
  const bar = document.createElement('div');
  bar.className = 'stale-banner';
  bar.innerHTML = '<span>These tools were updated on disk — you are running the older page.</span>';
  const btn = document.createElement('button');
  btn.textContent = 'Reload';
  btn.onclick = () => location.reload();
  bar.appendChild(btn);
  document.body.appendChild(bar);
}
// Hint bubble pops in after the boot delay — long enough that it reads as an
// offer rather than an interruption. Skipped entirely when every hint is
// already dismissed, so the timer costs nothing in that case.
if (STUDIO_HINTS.some(h => !hintDismissedIds().includes(h.id))) {
  window.setTimeout(() => { state._hintReady = true; renderHint(); }, HINT_DELAY_MS);
}
</script>
