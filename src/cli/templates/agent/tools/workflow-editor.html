// ═══════════════════════════════════════════════════════════════════════════
// GRAPH VIEW
// An alternative rendering of state.workflow: every step is a node, every edge
// is a transition. Route/loop deciders and gates are drawn ON the edges.
//
// Geometry polish ported from Projects/flow-trace (src/edges/index.tsx):
//   clipToBox   — end the line at the node border along its approach direction,
//                 so the arrowhead sits just outside and never grazes the box.
//   simplify    — drop near-collinear waypoints, else a straight run renders as
//                 a faint bow once corners are rounded.
//   roundedPath — polyline with rounded corners.
// Routing itself is OURS rather than dagre's: a workflow is not an arbitrary
// graph but a spine with lanes (main flow + one lane per route), so we can
// route deterministically along known lanes instead of guessing — and avoid
// vendoring a layout library into a hand-written template.
// ═══════════════════════════════════════════════════════════════════════════
// Sticky offsets are MEASURED, never hardcoded: .header wraps to two lines on
// narrow widths, and Workflow Studio hides it outright inside its iframe
// (`.header { display:none !important }`) — injected AFTER this document loads.
// A one-shot measurement would freeze the pre-injection height and push the
// whole tab/control stack down, so observe the elements instead.
function gvSyncChrome() {
  const h = document.querySelector('.header'), t = document.querySelector('.tab-bar');
  document.documentElement.style.setProperty('--hdr-h', (h ? h.offsetHeight : 0) + 'px');
  document.documentElement.style.setProperty('--tab-h', (t ? t.offsetHeight : 0) + 'px');
  const vb = document.getElementById('viewBar');
  if (vb && document.body.classList.contains('gv-on'))
    document.documentElement.style.setProperty('--gv-top', Math.round(vb.getBoundingClientRect().bottom) + 'px');
}
window.addEventListener('resize', gvSyncChrome);
if (typeof ResizeObserver === 'function') {
  const ro = new ResizeObserver(gvSyncChrome);
  ['.header', '.tab-bar', '#viewBar'].forEach(function (s) {
    const el = document.querySelector(s); if (el) ro.observe(el);
  });
}
setTimeout(gvSyncChrome, 0);

/* Scroll something into view and say so — a jump that lands silently in a long
   form leaves you hunting for what just moved. */
function reveal(sel, block) {
  requestAnimationFrame(function () {
    const el = document.querySelector(sel);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: block || 'center' });
    el.classList.add('just-here');
    setTimeout(function () { el.classList.remove('just-here'); }, 1300);
  });
}
function setWorkflowView(v) {
  if (state.ui.workflowView === v) return;
  // Carry the selection across the switch: whatever step you were looking at is
  // the step you get back, opened in the form or centred on the canvas.
  const keep = (typeof GV !== 'undefined' && GV.selected) ? GV.selected() : null;
  state.ui.workflowView = v;
  document.querySelectorAll('#viewSwitch button').forEach(b =>
    b.classList.toggle('on', b.dataset.view === v));
  const tools = document.getElementById('gvTools');
  if (tools) tools.classList.toggle('on', v === 'graph');
  yamlTouched = false;
  // Full-bleed canvas only while the graph is actually on screen.
  document.body.classList.toggle('gv-on', v === 'graph' && state.ui.activeTab === 'workflow');
  renderWorkflowTab();
  if (!keep) return;
  if (v === 'form') {
    const top = parseInt(String(keep).split('.')[0], 10);
    if (isNaN(top)) return;
    state.ui.openSteps.add(top);
    renderWorkflowTab();
    reveal('#workflowTab .step-card[data-idx="' + top + '"]');
  } else {
    GV.focus(keep);
  }
}

const GV = (function () {
  // Start BELOW the expand threshold so the very first paint is the compact
  // overview, whatever auto-fit later settles on.
  let scale = 0.9, tx = 40, ty = 40, vertical = true, spread = 1, sel = null, needsCenter = true, lastKey = '';
  let lastBox = {};   // id → measured box of the last draw (zoom anchoring needs it)
  let reflow = false;      // guards the one re-draw auto-fit may trigger
  let justAdded = null;    // addr of a freshly inserted card, so it can pop in
  let confirming = null;   // pending destructive action, awaiting our own dialog
  /* An expanded mechanism is a panel, not a 30px marker, so the room a rank
     needs cannot be guessed from the plan alone. The first draw estimates, the
     measurement corrects, and the corrected figures are fed back into the next
     draw — one extra pass, guarded so it can never loop. */
  let furnNeed = {}, furnPass = false;
  /* Where every edge marker and tool satellite ended up on the LAST draw, so a
     relayout can animate each one from its old spot instead of teleporting it. */
  let lastSlotPos = {}, lastSatPos = {};
  /* Where we came from, one workflow per level, when drilling through
     delegation steps. Shown in the bar so going in is never a one-way door. */
  const trail = [];
  /* Set for the single draw that crosses the expand threshold, so the cards
     that just changed size can animate into it. Every other draw is silent. */
  let justGrew = false;
  let selEdge = null;   // the connection being followed, as from>to>kind
  let diving = false;      // set while descending, so the trail survives the load
  // Zoom is a DETAIL control, not a magnifier. The percentage is literal render
  // scale: 100% = cards drawn at their natural size, and that is exactly where
  // they switch to the full detail view. Below 100% you get the compact overview
  // shrunk to fit. There is nothing above 100% — growing the font adds no
  // information, so the range simply ends there.
  const MIN_SCALE = 0.3, MAX_SCALE = 1.1, EXPAND_AT = 1.1;

  // ── model → graph ────────────────────────────────────────────────────────
  function build(wf) {
    const nodes = [], edges = [];
    const wfGate = wf.gate || {};
    const toolType = new Map((wf.tools || []).map(t => [t.name, t.type || 'script']));
    nodes.push({ id: '__start', kind: 'start', label: wf.name || '(unnamed)', meta: {
      version: wf.version, description: wf.description || '',
      params: (wf.params || []).map(p => p.name),
      tools: (wf.tools || []).map(t => ({ name: t.name, type: t.type || 'script' })),
      gate: wfGate, carry: (wf.context && wf.context.carry_forward) || 'none' } });
    if ((wf.steps || []).length) nodes.push({ id: '__end', kind: 'end', label: 'end' });

    const eff = st => ({
      structural: st.gate && st.gate.structural != null ? st.gate.structural : (wfGate.structural != null ? wfGate.structural : true),
      semantic:   st.gate && st.gate.semantic   != null ? st.gate.semantic   : (wfGate.semantic   != null ? wfGate.semantic   : false),
      human:      st.gate && st.gate.human      != null ? st.gate.human      : (wfGate.human      != null ? wfGate.human      : false) });
    const kindOf = stepKind;   // shared classifier — see stepKind()
    const toolsOf = st => {
      const raw = String(st.tools || '').trim();
      if (!raw) return { mode: 'none', list: [] };
      return { mode: 'subset', list: raw.split(',').map(s => s.trim()).filter(Boolean)
        .map(n => ({ name: n, type: toolType.get(n) || 'unknown' })) };
    };
    const dec = when => Object.keys(when || {}).filter(k => when[k] !== undefined && when[k] !== false && when[k] !== '');

    // `closer` = the identity an edge wears when it LEAVES this container.
    // A branch is one coloured thread inside itself, but the edge that closes
    // it belongs to the structure it returns INTO: a route that ends a lane is
    // closing the LANE, so it carries the lane's colour and its join barrier —
    // not the innermost mechanism that happened to run last. Null = main flow,
    // where a branch keeps its own colour because there is no outer mechanism.
    function walk(steps, prefix, incoming, exitTo, closer) {
      const at = i => prefix ? (prefix + '.' + i) : String(i);
      // Whole-branch tint: every edge INSIDE a route/lane keeps the
      // mechanism colour of its innermost container, so a branch reads as
      // one coloured thread instead of a coloured entry fading to grey.
      const tint = incoming.kind === 'lane' ? 'lane'
        : incoming.kind === 'route' ? 'route'
        : incoming.tint;
      // What an edge wears when it stays INSIDE this container. Null on the
      // main flow, which is not a mechanism: there a nested branch has no outer
      // colour to close into and keeps its own (see the routes recursion).
      const inner = tint ? { kind: 'seq', tint: tint, meta: null } : null;
      const plain = { kind: 'seq', tint: tint, meta: null };
      if (!steps.length) {
        // An empty branch: its one edge is entry AND exit at once, so it also
        // carries the barrier metadata when that exit is a join.
        edges.push(Object.assign({}, incoming, { to: exitTo }, (closer && closer.meta) || {}));
        return;
      }
      steps.forEach(function (st, i) {
        const addr = at(i), g = eff(st), tools = toolsOf(st);
        nodes.push({ id: addr, kind: 'step', label: st.name || '(unnamed)', stepKind: kindOf(st),
          step: st, gate: g, tools: tools,
          io: { inputs: (st.inputs || []).length, outputs: (st.outputs || []).length,
                structs: (st.outputs || []).filter(o => o.struct).length } });
        if (i === 0) edges.push(Object.assign({}, incoming, { to: addr }));
        if (st.loop_back && st.loop_back.to) {
          const ti = steps.findIndex(s => s.name === st.loop_back.to);
          edges.push({ from: addr, to: ti >= 0 ? at(ti) : null, kind: 'loop_back', backward: true,
            max_iterations: st.loop_back.max_iterations, deciders: dec(st.loop_back.when) });
        }
        const next = i < steps.length - 1 ? at(i + 1) : exitTo;
        // The last step's outgoing edge is the one that leaves this container.
        const isClosing = i === steps.length - 1;
        const wear = (isClosing ? closer : inner) || plain;
        if (st.routes && st.routes.define && st.routes.define.length) {
          const d = dec(st.routes.when);
          st.routes.define.forEach(function (r, j) {
            // A nested route inherits THIS container's closer only when its own
            // exit is this container's exit; otherwise it returns inward and
            // closes into this branch's colour. Null (main flow) hands the
            // route back its OWN colour — the outermost mechanism of that
            // branch is the route itself, so it must not fade to spine grey.
            walk(r.steps || [], addr + '.' + j, { from: addr, kind: 'route', route: r.id, deciders: d, gate: g },
              next, isClosing ? closer : inner);
          });
          // 'no branch' keeps the route hue (it IS a route-mechanism outcome),
          // but when it closes a lane it still crosses the barrier — so it
          // carries the join metadata even though it is not tinted lane.
          edges.push(Object.assign({ from: addr, to: next, kind: 'proceed', deciders: d, gate: g, tint: tint },
            (isClosing && closer && closer.meta) || {}));
        } else if (st.lanes && st.lanes.define && st.lanes.define.length) {
          // Lanes: every lane is walked with the SAME exit — the join point.
          // No 'proceed' edge exists (nothing is chosen; all lanes run) and
          // the rejoin at `next` IS the barrier — the join marker renders on
          // the convergence, not as a node.
          const joinReq = (st.lanes.join && st.lanes.join.require === 'any') ? 'any' : 'all';
          st.lanes.define.forEach(function (l, j) {
            // A lane always sets its OWN closer: whatever runs last inside it,
            // the edge reaching the join is the barrier approach. This is why
            // the barrier survives a route (or a nested lanes block) ending a
            // lane — it used to be lost, and with it the tick and the policy.
            walk(l.steps || [], addr + '.L' + j, { from: addr, kind: 'lane', lane: l.id, gate: g }, next,
              { kind: 'lane-exit', tint: 'lane', meta: { lane: l.id, join: joinReq, fork: addr } });
          });
        } else {
          edges.push(Object.assign({ from: addr, to: next, kind: wear.kind, gate: g, tint: wear.tint },
            wear.meta || {}));
        }
      });
    }
    // Main flow has no outer mechanism, so `closer` is null: a branch that ends
    // the workflow keeps its own colour rather than fading to the spine grey.
    walk(wf.steps || [], '', { from: '__start', kind: 'enter' }, '__end', null);
    // Drop any edge whose endpoints are not both on the canvas. An empty
    // workflow is the case that matters: the walk still emits start -> end, but
    // there is no end node until there is a step for it to follow.
    const ids = new Set(nodes.map(function (n) { return n.id; }));
    return { nodes: nodes, edges: edges.filter(function (e) { return e.to && ids.has(e.from) && ids.has(e.to); }) };
  }

  // ── rank / lane assignment (the spine-with-lanes shape) ──────────────────
  function place(wf) {
    const pos = {}; let lane = 0;
    function seq(steps, prefix, start, myLane) {
      let r = start;
      steps.forEach(function (st, i) {
        const addr = prefix ? (prefix + '.' + i) : String(i);
        pos[addr] = { rank: r, lane: myLane };
        let after = r + 1;
        if (st.routes && st.routes.define && st.routes.define.length) {
          let end = after;
          st.routes.define.forEach(function (rt, j) {
            end = Math.max(end, seq(rt.steps || [], addr + '.' + j, after, ++lane));
          });
          after = end;
        }
        if (st.lanes && st.lanes.define && st.lanes.define.length) {
          // Same geometry as routes: each lane a fresh side column, all
          // starting at the fork's next rank; the successor lands past the
          // LONGEST lane (which is exactly where the join barrier sits).
          let end = after;
          st.lanes.define.forEach(function (ln, j) {
            end = Math.max(end, seq(ln.steps || [], addr + '.L' + j, after, ++lane));
          });
          after = end;
        }
        r = after;
      });
      return r;
    }
    const last = seq(wf.steps || [], '', 1, 0);
    pos['__start'] = { rank: 0, lane: 0 };
    pos['__end'] = { rank: last, lane: 0 };
    return pos;
  }

  // ── geometry (ported from flow-trace) ────────────────────────────────────
  function clipToBox(box, from, gap) {

      // vanished from the step it belongs to.

             -> loop_back  on "loop" the cursor goes BACK; nothing after it runs
