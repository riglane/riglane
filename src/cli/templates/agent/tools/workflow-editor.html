      if (j < 0 || j >= p.seq.length) return;
      withFlip(function () {
        const t = p.seq[p.idx]; p.seq[p.idx] = p.seq[j]; p.seq[j] = t;
        sel = null; commit();
      });
    },
    /* Trade two siblings' places. Distinct from reorder, which slides one card
       into a gap and shifts everything after it along. */
    swap: function (id, toIdx) {
      const p = parentSeqOf(id); if (!p) return;
      if (toIdx === p.idx || toIdx < 0 || toIdx >= p.seq.length) return;
      withFlip(function () {
        const t = p.seq[p.idx]; p.seq[p.idx] = p.seq[toIdx]; p.seq[toIdx] = t;
        sel = null; commit();
      });
    },
    reorder: function (id, toIdx) {
      const p = parentSeqOf(id); if (!p) return;
      const to = Math.max(0, Math.min(p.seq.length - 1, toIdx));
      if (to === p.idx) return;
      withFlip(function () {
        const [it] = p.seq.splice(p.idx, 1);
        p.seq.splice(to, 0, it);
        sel = null; commit();
      });
    },
    /* Toggle one gate layer for the step this edge leaves. Writes an explicit
       per-step override (the workflow default stays untouched); when the
       override ends up empty it is dropped so the step goes back to inheriting. */
    gate: function (id, layer) {
      const st = resolveStepByPath(id); if (!st) return;
      const wf = state.workflow.gate || {};
      const eff = k => (st.gate && st.gate[k] != null) ? st.gate[k]
        : (wf[k] != null ? wf[k] : (k === 'structural'));
      const next = { structural: eff('structural'), semantic: eff('semantic'), human: eff('human') };
      next[layer] = !next[layer];
      const keep = {};
      Object.keys(st.gate || {}).forEach(function (k) {
        if (['structural', 'semantic', 'human'].indexOf(k) < 0) keep[k] = st.gate[k];
      });
      ['structural', 'semantic', 'human'].forEach(function (k) {
        const def = wf[k] != null ? wf[k] : (k === 'structural');
        if (next[k] !== def) keep[k] = next[k];
      });
      // A channel override without a human gate is dead config the validator
      // rejects - dropping the gate drops where its question would have gone.
      if (!next.human && keep.human_channel != null) delete keep.human_channel;
      st.gate = Object.keys(keep).length ? keep : null;
      commit(true);
    },
    del: function (ev, id) {
      ev.stopPropagation();
      const st = resolveStepByPath(id); if (!st) return;
      const nested = (st.routes && st.routes.define || []).reduce(function (n, r) {
        return n + (r.steps || []).length;
      }, 0);
      askConfirm({
        title: 'Delete this step?',
        body: '<b>' + esc(st.name || 'Untitled') + '</b> will be removed from the workflow' +
          (nested ? ', together with the ' + nested + ' step' + (nested > 1 ? 's' : '') + ' inside its branches' : '') +
          '. Nothing is written to disk until you export.',
        ok: 'Delete',
        go: function () { GV.confirmDel(id); },
      });
    },
    /* The removal itself, once the question has been answered. */
    confirmDel: function (id) {
      withPoof(id, function () {
        const p = parentSeqOf(id);
        p.seq.splice(p.idx, 1);
        if (String(id).indexOf('.') < 0) {
          // keep the form's open-step indices aligned for top-level removals
          const next = new Set();
          state.ui.openSteps.forEach(function (i) { if (i < p.idx) next.add(i); else if (i > p.idx) next.add(i - 1); });
          state.ui.openSteps = next;
        }
        commit();
      });
    },
    /* Drill into the workflow a delegation step hands off to. The step is zoomed
       into first, so the change of workflow reads as going INSIDE this step
       rather than as the canvas being swapped out from under you; the trail in
       the bar then says where you came from and takes you back. Only Workflow
       Studio can do this — it owns the workflow list and the frame — so the
       control is enabled purely on the presence of the hooks it lends us. */
    drill: function (ev, name) {
      ev.stopPropagation();
      if (typeof window.__studioOpenWorkflow !== 'function') return;
      const from = state.workflow.name || '';
      const node = ev.target.closest('.gv-node');
      const id = node && node.dataset.id;
      const go = function () {
        if (from) trail.push(from);
        diving = true;
        if (!window.__studioOpenWorkflow(name)) { trail.pop(); diving = false; return; }
        renderTrail();
      };
      const b = id && lastBox[id], vp = document.getElementById('gvCanvas');
      if (!b || !vp) { go(); return; }
      zoomTo(MAX_SCALE, b.cx * scale + tx, b.cy * scale + ty);
      if (b.el) b.el.classList.add('gv-dive');
      setTimeout(go, 210);
    },
    /* Step back out to whichever workflow in the trail was clicked. */
    ascend: function (i) {
      const name = trail[i];
      if (!name || typeof window.__studioOpenWorkflow !== 'function') return;
      trail.length = i;
      diving = true;
      window.__studioOpenWorkflow(name);
      renderTrail();
    },
    /* Open this one step in full, without hunting for the zoom level that does
       it. Same destination as a double-click, reachable from the card itself. */
    expand: function (ev, id) {
      ev.stopPropagation();
      const b = lastBox[id], vp = document.getElementById('gvCanvas');
      if (!vp) return;
      sel = id; surfaceSel();
      const px = b ? b.cx * scale + tx : vp.clientWidth / 2;
      const py = b ? b.cy * scale + ty : vp.clientHeight / 2;
      zoomTo(scale >= EXPAND_AT ? MIN_SCALE + 0.3 : MAX_SCALE, px, py);
    },
    openForm: function (ev, id) {
      ev.stopPropagation();
      const top = parseInt(String(id).split('.')[0], 10);
      if (!isNaN(top)) state.ui.openSteps.add(top);
      setWorkflowView('form');
    },
    /* Insert a step ON a connection: before the edge's target, in the target's
       own sequence. Targeting the synthetic end node appends after the source. */
    add: function (fromId, toId) {
      const st = blankStep();
      st.name = uniqueName('new-step');
      // The very first step has no sequence to be inserted into — it CREATES one.
      if (!(state.workflow.steps || []).length) {
        state.workflow.steps = [st];
        justAdded = '0'; sel = '0';
        commit(true);
        GV.focus('0', true);
        return;
      }
      let p, at;
      if (String(toId).indexOf('__') === 0) { p = parentSeqOf(fromId); at = p.idx + 1; }
      else { p = parentSeqOf(toId); at = p.idx; }
      withFlip(function () {
        p.seq.splice(at, 0, st);
        // Address of the card that just appeared, so it can pop in.
        const base = String(toId).indexOf('__') === 0 ? fromId : toId;
        const parts = String(base).split('.');
        parts[parts.length - 1] = String(at);
        justAdded = parts.join('.');
        sel = justAdded;
        const landed = justAdded;
        commit(true);
        // Glide to it: a step added on a connection off screen is a step you
        // cannot see arrive.
        GV.focus(landed, true);
      });
    },
    /* Expand or fold one mechanism in place. Nothing floats above the canvas:
       the marker on the line grows into its own editor and shrinks back. */
    toggleMech: function (key) {
      if (!key) return;
      if (state.ui.gvOpen.has(key)) state.ui.gvOpen.delete(key); else state.ui.gvOpen.add(key);
      draw();
    },
    /* Open one slot, creating what it edits if it does not exist yet. Asking for
       a loop back where none exists seeds a valid one first — the seeding
       mutator redraws, and the opened panel is part of that redraw. */
    io: function (addr, what) {
      const st = resolveStepByPath(addr); if (!st) return;
      state.ui.gvOpen.add(addr + '|' + what);
      if (what === 'loop' && !st.loop_back) { toggleLoopBack(addr); return; }
      if (what === 'routes' && !(st.routes && st.routes.define && st.routes.define.length)) { toggleRoutes(addr); return; }
      if (what === 'lanes' && !(st.lanes && st.lanes.define && st.lanes.define.length)) { toggleLanes(addr); return; }
      draw();
    },
    /* Toggle the problem list of a marked card. */
    errs: function (ev, id) {
      ev.stopPropagation();
      const k = 'err:' + id;
      if (state.ui.gvOpen.has(k)) state.ui.gvOpen.delete(k); else state.ui.gvOpen.add(k);
      draw();
    },
    /* A tool satellite points at a workflow-level DEFINITION — where the command
       and its schema live — so it goes to the inventory in the Form view and
       lands on the tool itself, not merely on the page that contains it. */
    tool: function (name) {
      switchTab('tools');
      renderToolsTab();
      reveal('#toolsTab [data-tool="' + String(name).replace(/"/g, '') + '"]', 'center');
    },
    /* Which tools this STEP may call — a different question, answered on the
       card, because it is a property of the step and not of the workflow. */
    tools: function (ev, id) {
      ev.stopPropagation();
      const k = id + '|tools';
      if (state.ui.gvOpen.has(k)) state.ui.gvOpen.delete(k); else state.ui.gvOpen.add(k);
      draw();
    },
    fit: function () { needsCenter = true; draw(); },
    flip: function () {
      vertical = !vertical;
      const l = document.getElementById('gvOrientLbl');
      if (l) l.textContent = vertical ? 'Top-down' : 'Left-right';
      needsCenter = true; draw();
    },
    spread: function (v) { spread = Math.max(0.6, Math.min(3.6, Number(v) / 100)); draw(); },
    zoom: function (dir) {
      const vp = document.getElementById('gvCanvas'); if (!vp) return;
      zoomTo(scale * (dir > 0 ? 1.07 : 1 / 1.07), vp.clientWidth / 2, vp.clientHeight / 2);
    }
  };
})();
</script>
</body>
</html>
