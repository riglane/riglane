    <div class="field-group">
      <label class="field-label"><span class="required">*</span> Goal ${helpBtn('step.goal')}</label>
      <textarea class="field-textarea goal" placeholder="Detailed instructions for the subagent..."
                onchange="updateStep('${addr}', 'goal', this.value)">${esc(s.goal)}</textarea>
    </div>`;

  // Step config chips (trace-viewer style)
  const cfgEffective = {
    spec_check: s.spec_check,
    subagent: s.subagent,
    carry_forward: s.carry_forward,
  };
  const wfGate = state.workflow.gate;
  const stepGate = s.gate || {};
  const hasGateOverride = s.gate && Object.keys(s.gate).length > 0;

  html += `<div style="margin-bottom:12px">
    <div class="field-label" style="margin-bottom:6px">Step Config${hasGateOverride ? ' <span style="font-size:9px;opacity:0.5;font-weight:400">(dashed = step override)</span>' : ''} ${helpBtn('step.subagent')}</div>
    <div class="step-config-chips">`;

  // spec_check chip
  html += `<span class="step-chip ${s.spec_check ? 'step-chip-on' : 'step-chip-off'}" data-help="step.spec_check" onclick="toggleStepChip('${addr}','spec_check')" title="Click to toggle."><span class="step-chip-dot"></span><span class="step-chip-key">spec_check</span></span>`;

  // spec_authoring chip (tri-state: off → persist → validate)
  const saVal = s.spec_authoring === 'persist' || s.spec_authoring === 'validate' ? s.spec_authoring : '';
  const saLabel = saVal === '' ? 'off' : saVal;
  const saClass = saVal !== '' ? 'step-chip-on' : 'step-chip-off';
  const saStyle = saVal === '' ? ' style="border-style:dashed"' : '';
  html += `<span class="step-chip ${saClass}"${saStyle} data-help="step.spec_authoring" onclick="cycleSpecAuthoring('${addr}')" title="Click to cycle (off → persist → validate)."><span class="step-chip-dot"></span><span class="step-chip-key">spec_authoring: ${saLabel}</span></span>`;

  // subagent chip — hidden for planning steps (always orchestrator-driven)
  if (s.type !== 'planning') {
    html += `<span class="step-chip ${s.subagent ? 'step-chip-on' : 'step-chip-off'}" data-help="step.subagent" onclick="toggleStepChip('${addr}','subagent')" title="Click to toggle."><span class="step-chip-dot"></span><span class="step-chip-key">subagent</span></span>`;
  }

  // shell chip (the step deny: [shell] lever) — only where it acts: a SUBAGENT
  // step (the deny lands in the generated per-step agent definition; an inline
  // step IS the orchestrator, a planning step is orchestrator-driven — there
  // the field is inert and lint says so). ON = allowed (the default, no YAML
  // field); OFF = deny: [shell].
  if (s.type !== 'planning' && s.subagent !== false) {
    const shellDenied = Array.isArray(s.deny) && s.deny.includes('shell');
    html += `<span class="step-chip ${shellDenied ? 'step-chip-off' : 'step-chip-on'}" data-help="step.deny" onclick="toggleDenyShell('${addr}')" title="Click to toggle. ON = the step keeps the harness shell tools (default, no YAML field). OFF = deny: [shell] — the generated per-step agent omits the shell tools (Bash/PowerShell, bash, execute, run_shell_command per host); on Cursor/Codex the deny is instruction-only (no per-step agent identity)."><span class="step-chip-dot"></span><span class="step-chip-key">shell${shellDenied ? ': denied' : ''}</span></span>`;
  }

  // carry_forward chip (tri-state: null=inherit, true, false)
  const cfLabel = s.carry_forward === true ? 'ON' : s.carry_forward === false ? 'OFF' : 'inherit';
  const cfClass = s.carry_forward === true ? 'step-chip-on' : s.carry_forward === false ? 'step-chip-off' : 'step-chip-off';
  const cfStyle = s.carry_forward == null ? ' style="border-style:dashed"' : '';
  html += `<span class="step-chip ${cfClass}"${cfStyle} data-help="step.carry_forward" onclick="cycleCarryForward('${addr}')" title="Click to cycle (inherit → ON → OFF)."><span class="step-chip-dot"></span><span class="step-chip-key">carry_forward: ${cfLabel}</span></span>`;

  // Gate chips — show effective config. Two step kinds get no meaningful
  // step-level gate, so hide the misleading chips (same hide-pattern as
  // allow_partial/model):
  //  • planning — the step-level gate is a FULL no-op (structural: no outputs;
  //    semantic/human not evaluated at the planning step). The WORKFLOW-level
  //    gate applies to the generated substeps (inherited) and the agent sets
  //    per-substep gates; the validator rejects a step-level gate here.
  //  • inline / delegation (subagent:false) — semantic/human never fire
  //    (step_collect_result Branch 1 returns needs_semantic_gate:false); only
  //    structural still runs (step_complete safety net).
  const planningNoGate = s.type === 'planning';
  const inlineStep = s.subagent === false && !planningNoGate;
  // On the graph the gate layers are configured on the EDGE (its gate chip
  // opens the same slots + channel), so repeating them inside the card would
  // be the same mechanism in two places.
  const gateLayers = onGraph ? [] : ['structural', 'semantic', 'human'];
  gateLayers.forEach(name => {
    if (planningNoGate) return;                        // hide all three for planning
    if (inlineStep && name === 'semantic') return;      // semantic never fires inline
    const isOverride = stepGate[name] != null;
    const effective = isOverride ? stepGate[name] : (wfGate[name] ?? false);
    const overrideClass = isOverride ? ' step-chip-override' : '';
    // An inline human gate is NOT a no-op: on external|both the engine still
    // refuses step_complete without a fresh recorded answer. Hiding the chip
    // here forced the only other route — turning the human gate on at the
    // WORKFLOW level, which arms every step.
    const tip = (inlineStep && name === 'human')
      ? 'Click to toggle override. On an inline step the TERMINAL channel is a no-op (no gate hook fires), but external|both is ENFORCED: step_complete refuses until every question of this pass carries a fresh answer. Lint advises inline-agent-gate — acknowledge it when this is deliberate.'
      : `Click to toggle override — ${isOverride ? 'currently a step override' : 'currently inherited from the workflow default'}`;
    html += `<div class="gate-row"><span class="step-chip ${effective ? 'step-chip-on' : 'step-chip-off'}${overrideClass}" data-help="gate.${name}" onclick="toggleGateChip('${addr}','${name}')" title="${esc(tip)}"><span class="step-chip-dot"></span><span class="step-chip-key">gate.${name}</span></span>`;
    // The human row carries WHERE its question goes — same line, one concern.
    if (name === 'human') {
      const effHuman = (stepGate.human != null) ? stepGate.human : (wfGate.human ?? false);
      html += viaPillsHtml('step', addr,
        stepGate.human_channel != null ? stepGate.human_channel : null,
        wfGate.human_channel || 'terminal', !!effHuman) + helpBtn('gate.human_channel');
    }
    html += `</div>`;
    // Conditional human gate: the script field IS the conditionality — empty
    // means a plain always-on gate, a command makes the engine decide at gate
    // time ({"human": true|false} on stdout). Typing here creates a step
    // override; an inherited workflow-level script shows as the placeholder.
    if (name === 'human') {
      const effHumanCfg = (stepGate.human != null) ? stepGate.human : (wfGate.human ?? false);
      if (effHumanCfg) {
        const inheritedScript = (stepGate.human == null && isCondHuman(wfGate.human)) ? wfGate.human.script : '';
        html += `<div class="gate-row" style="padding-left:16px"><span style="font-size:11px;color:var(--text-muted)">script:</span>
          <input class="field-input" style="flex:1;min-width:200px;padding:3px 6px;font-size:11px"
                 placeholder="${inheritedScript ? esc('inherited: ' + inheritedScript) : esc('optional — conditional gate: command printing {"human": true|false}')}"
                 value="${esc(isCondHuman(stepGate.human) ? stepGate.human.script : '')}"
                 onchange="updateStepGateHumanScript('${addr}', this.value)">${helpBtn('gate.human')}</div>`;
      }
    }
  });
  if (planningNoGate && !onGraph) {
    html += `<span class="step-chip step-chip-off" style="opacity:0.6;cursor:default" title="Planning steps take no step-level gate. Structural has no outputs to validate; semantic/human are not evaluated at the planning step. The workflow-level gate applies to the generated substeps (inherited), and the agent sets per-substep gates in the drafted workflow.">gates: on substeps</span>`;
  } else if (inlineStep && !onGraph) {
    html += `<span class="step-chip step-chip-off" style="opacity:0.6;cursor:default" title="Inline (subagent:false) steps run no semantic gate — it fires only on subagent steps via step_collect_result. Structural still runs at step_complete, and a human gate on external|both is still enforced there.">semantic: N/A (inline)</span>`;
  }

  // allow_partial_step_complete — only meaningful for parallel steps (a gate
  // field, so it travels with the gate: edge on the graph, card in the form)
  if (s.parallel && !onGraph) {
    const apscOverride = stepGate.allow_partial_step_complete != null;
    const apscEffective = apscOverride ? stepGate.allow_partial_step_complete : (wfGate.allow_partial_step_complete ?? false);
    const apscOverrideClass = apscOverride ? ' step-chip-override' : '';
    html += `<div class="gate-row"><span class="step-chip ${apscEffective ? 'step-chip-on' : 'step-chip-off'}${apscOverrideClass}" onclick="toggleGateChip('${addr}','allow_partial_step_complete')" title="Click to toggle override. Allow this parallel step to complete with some failed branches${apscOverride ? ' (step override)' : ' (from workflow)'}"><span class="step-chip-dot"></span><span class="step-chip-key">gate.allow_partial_step_complete</span></span>${helpBtn('step.gate.allow_partial_step_complete')}</div>`;
  }

  // Parallel toggle — always visible so user can disable from chip area.
  // (The Parallel subsection below has a redundant Disable button but it
  // is easy to miss; chip is the discoverable toggle.)
  const parallelOn = s.parallel === true;
  html += `<span class="step-chip ${parallelOn ? 'step-chip-on' : 'step-chip-off'}" onclick="updateStep('${addr}','parallel',${!parallelOn})" title="${parallelOn ? 'Click to disable parallel fan-out (parallel_key value preserved in state until you re-enable or save)' : 'Click to enable parallel fan-out'}" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">${parallelOn ? 'parallel' : '+ parallel'}</span></span>`;
  // Delegate toggle — same pattern. When delegate_to is empty, click
  // prompts for a target. When set, click clears the target.
  const delegateOn = !!s.delegate_to;
  if (delegateOn) {
    html += `<span class="step-chip step-chip-on" onclick="updateStep('${addr}','delegate_to','')" title="Click to clear delegation target (current: ${esc(s.delegate_to)})" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">delegate: ${esc(s.delegate_to)}</span></span>`;
  } else {
    html += `<span class="step-chip step-chip-off" onclick="promptDelegation('${addr}')" title="Click to set delegation target" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">+ delegate</span></span>`;
  }
  // Phase 61: Planning toggle. Activates dynamic mini-workflow lifecycle —
  // orchestrator drafts a workflow at runtime, engine validates + executes.
  // See `step.type` help for full semantics. Mutually-exclusive logic is
  // engine-side (validator rejects conflicting configs); UI permits the
  // user to flip toggles freely.
  const planningOn = s.type === 'planning';
  html += `<span class="step-chip ${planningOn ? 'step-chip-on' : 'step-chip-off'}" onclick="updateStep('${addr}','type',${planningOn ? "''" : "'planning'"})" title="${planningOn ? 'Click to disable planning step (revert to regular step)' : 'Click to mark this step as type: planning (orchestrator drafts a mini-workflow at runtime)'}" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">${planningOn ? 'planning' : '+ planning'}</span></span>`;

  // Phase B: loop_back toggle — same dashed opt-in pattern as parallel/
  // planning. Enabling seeds a valid default (self-loop + human decider) so
  // the panel below opens in a passing state; disabling clears the block.
  const loopOn = !!(s.loop_back);
  // The graph owns repetition on the flow: the loop chip on the edge adds,
  // configures and removes it, and the arc back is drawn there.
  if (!onGraph) html += `<span class="step-chip ${loopOn ? 'step-chip-on' : 'step-chip-off'}" onclick="toggleLoopBack('${addr}')" title="${loopOn ? 'Click to remove the loop_back block' : 'Click to add a loop_back block (engine-evaluated repetition of an earlier slice of the workflow). ' + esc(HELP['step.loop_back'])}" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">${loopOn ? 'loop_back' : '+ loop_back'}</span></span>`;

  // Phase R: routes toggle — same dashed opt-in pattern. Enabling seeds one
  // route with a human decider so the panel opens in a passing state.
  const routesOn = !!(s.routes);
  html += `<span class="step-chip step-chip-routes ${routesOn ? 'step-chip-on' : 'step-chip-off'}" onclick="toggleRoutes('${addr}')" title="${routesOn ? 'Click to remove the routes block' : 'Click to add a routes block (conditional forward branching — the engine runs one of several named routes after this step). ' + esc(HELP['step.routes'])}" style="border-style:dashed;cursor:pointer"><span class="step-chip-dot"></span><span class="step-chip-key">${routesOn ? 'routes' : '+ routes'}</span></span>`;

  // Lanes toggle — same dashed opt-in pattern (parallel execution lanes).
  const lanesOn = !!(s.lanes);
  html += `<span class="step-chip step-chip-lanes ${lanesOn ? 'step-chip-on' : 'step-chip-off'}" onclick="toggleLanes('${addr}')" title="${lanesOn ? 'Click to remove the lanes block' : 'Click to add a lanes block (parallel execution lanes — several step sequences run CONCURRENTLY after this step and rejoin at an engine-owned barrier). ' + esc(HELP['step.lanes'])}" style="border-style:dashed;cursor:pointer;${lanesOn ? 'border-color:var(--mech-lanes);color:var(--mech-lanes)' : ''}"><span class="step-chip-dot"></span><span class="step-chip-key">${lanesOn ? 'lanes' : '+ lanes'}</span></span>`;

  // (model field rendered separately below chips)

  html += `</div>`;

  // Model mode — only for subagent steps (inline steps run in the orchestrator's own session)
  if (s.subagent) html += `<div style="display:flex;align-items:center;gap:8px;margin-top:8px">
    <span class="field-label" style="margin:0;font-size:11px;min-width:130px">Model selection ${helpBtn('step.model')}</span>
    <select class="field-select" style="flex:1;min-width:0;padding:3px 8px;font-size:12px;font-family:var(--mono)"
      onchange="updateStep('${addr}','model',this.value)"
      title="${esc(HELP['step.model'])}">
      <option value=""${!s.model || s.model === 'auto' ? ' selected' : ''}>auto — orchestrator picks a fitting model (default)</option>
      <option value="inherit"${s.model === 'inherit' ? ' selected' : ''}>inherit — same model as the orchestrator</option>
      <option value="lightest"${s.model === 'lightest' ? ' selected' : ''}>lightest — cheapest/fastest model (mechanical steps)</option>
      <option value="strongest"${s.model === 'strongest' ? ' selected' : ''}>strongest — most capable model (judgment-heavy steps)</option>
    </select>
  </div>`;  // end model mode

  // Step tools — picked from the workflow's own inventory rather than typed:
  // a free-text list could name a tool that does not exist, and the author had
  // to remember the spelling of every one of them.
  if (state.workflow.tools.length > 0) {
    const picked = stepToolNames(s);
    const rest = state.workflow.tools.filter(t => picked.indexOf(t.name) < 0);
    const noneAtAll = !picked.length;
    html += `<div class="step-tools-row" style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
      <span class="field-label" style="margin:0;font-size:11px;min-width:130px">Step tools ${helpBtn('step.tools')}</span>
      ${picked.map(n => `<span class="tool-pick" title="Click to remove ${esc(n)} from this step"
          onclick="stepToolToggle('${addr}','${esc(n)}')">${ico2(toolIconFor(n))}${esc(n)}<b>&times;</b></span>`).join('')}
      ${noneAtAll ? `<span class="tool-pick none" title="This step names no tools, so it calls none of the workflow tools">no workflow tools</span>` : ''}
      <select class="field-select" style="max-width:210px;padding:3px 24px 3px 8px;font-size:11.5px"
        onchange="if(this.value==='__new'){stepToolNew('${addr}');}else if(this.value){stepToolToggle('${addr}',this.value);}">
        <option value="">+ add a tool…</option>
        ${rest.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}
        ${rest.length ? '<option disabled>──────────</option>' : ''}
        <option value="__new">Define a new tool…</option>
      </select>

    </div>`;
  }

  // Gate retry overrides + Clear — inline right after chips
  if (hasGateOverride) {
    html += `<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--text-muted)">retry overrides ${helpBtn('step.gate.retries_override')}</span>
      <span style="font-size:11px;color:var(--text-muted)">step retries:</span>
      <input type="number" class="field-input field-input-num" value="${s.gate.max_step_retries != null ? s.gate.max_step_retries : ''}" min="0" max="10" placeholder="—" style="width:50px;padding:3px 6px;font-size:11px"
             onchange="updateStepGate('${addr}', 'max_step_retries', this.value ? parseInt(this.value) : null)" title="Max step retries (new subagent spawns)">
      <span style="font-size:11px;color:var(--text-muted)">gate retries:</span>
      <input type="number" class="field-input field-input-num" value="${s.gate.max_gate_retries != null ? s.gate.max_gate_retries : ''}" min="0" max="25" placeholder="—" style="width:50px;padding:3px 6px;font-size:11px"
             onchange="updateStepGate('${addr}', 'max_gate_retries', this.value ? parseInt(this.value) : null)" title="Max gate retries (in-place self-correction)">
      <button class="btn btn-sm btn-danger" onclick="clearStepGate('${addr}')" style="font-size:10px;padding:2px 8px;margin-left:auto" title="Remove all gate overrides">Clear overrides</button>
    </div>`;
  }

  html += `</div>`;

  // Parallel (compact — inline when off)
  if (s.parallel) {
    html += `<div class="subsection">
      <div class="flex-between">
        <div class="subsection-title mb-0">Parallel ${helpBtn('step.parallel')}</div>
        <button class="btn btn-sm" onclick="updateStep('${addr}', 'parallel', false)" style="font-size:11px;padding:2px 8px">Disable</button>
      </div>
      <div class="field-group mt-8">
        <label class="field-label"><span class="required">*</span> Parallel key ${helpBtn('step.parallel_key')}</label>
        <input type="text" class="field-input" value="${esc(s.parallel_key)}" placeholder='manifest.tasks[status=pending]' style="font-size:12px;padding:5px 8px"
               onchange="updateStep('${addr}', 'parallel_key', this.value)">
      </div>
      <div class="field-group mt-8">
        <label class="field-label">Spawn delay (ms) ${helpBtn('step.parallel_spawn_delay_ms')}</label>
        <input type="number" class="field-input" value="${s.parallel_spawn_delay_ms != null ? s.parallel_spawn_delay_ms : ''}" min="0" max="600000" placeholder="0 (simultaneous) — recommended 3000-5000 for cache reuse" style="font-size:12px;padding:5px 8px"
               onchange="updateStep('${addr}', 'parallel_spawn_delay_ms', this.value ? parseInt(this.value) : null)">
      </div>
      <div class="flex-between mt-8">
        <div class="subsection-title mb-0">Branch profiles ${helpBtn('step.branch_profiles')}</div>
        <button class="add-btn" onclick="addBranchProfile('${addr}')">+ Add</button>
      </div>
      ${Object.entries(s.branch_profiles || {}).map(([pid, p]) => `
        <div class="list-item mt-8" style="padding:5px 8px;gap:6px;align-items:center">
          <input type="text" class="field-input" value="${esc(pid)}" placeholder="profile_id" style="max-width:130px;font-size:12px;padding:5px 8px" data-help="step.branch_profiles"
                 onchange="renameBranchProfile('${addr}', '${esc(pid)}', this.value)">
          <input type="text" class="field-input" value="${esc((p.tools || []).join(', '))}" placeholder="tools — subset of the step's tools, comma-separated" style="flex:1;min-width:0;font-size:12px;padding:5px 8px" data-help="step.branch_profiles"
                 onchange="updateBranchProfileTools('${addr}', '${esc(pid)}', this.value)">
          ${structDropdown(p.struct, `handleBranchProfileStruct(this, '${addr}', '${esc(pid)}')`).replace('style="max-width:180px"', 'style="max-width:130px;padding:5px 26px 5px 8px;font-size:11px" data-help="step.branch_profiles"')}
          <button class="list-remove" onclick="removeBranchProfile('${addr}', '${esc(pid)}')" style="margin:0">&times;</button>
        </div>
      `).join('')}
      ${(!s.branch_profiles || !Object.keys(s.branch_profiles).length) ? '<div class="field-hint mt-8">No profiles — every branch gets the step\'s full tool grant. A profile gives its branches a TOOL SUBSET (and optionally a struct override); each parallel_key item selects one via its <code>profile</code> field (else its <code>name</code>).</div>' : ''}
    </div>`;
  }

  // Delegation (compact — inline when off)
  if (s.delegate_to) {
    html += `<div class="subsection">
      <div class="subsection-title">Delegation ${helpBtn('step.delegate_to')}</div>
      <div class="field-group">
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" class="field-input" value="${esc(s.delegate_to)}" placeholder="workflow-name" style="flex:1;font-size:12px;padding:5px 8px"
                 onchange="updateStep('${addr}', 'delegate_to', this.value)">
          <button class="btn btn-sm" onclick="promptDelegation('${addr}')" title="Pick from the workflows in this project">Browse…</button>
        </div>
      </div>
      <div class="subsection-title mt-8">Params ${helpBtn('step.delegate_params')}</div>
      ${Object.entries(s.delegate_params || {}).map(([k, v], pi) => `
        <div class="field-row" style="margin-bottom:4px">
          <input type="text" class="field-input" value="${esc(k)}" placeholder="key" style="max-width:120px;font-size:12px;padding:4px 8px"
                 onchange="renameDelegateParam('${addr}', '${esc(k)}', this.value)">
          <input type="text" class="field-input" value="${esc(v)}" placeholder="value or {param}" style="font-size:12px;padding:4px 8px"
                 onchange="updateDelegateParam('${addr}', '${esc(k)}', this.value)">
          <button class="list-remove" onclick="removeDelegateParam('${addr}', '${esc(k)}')">&times;</button>
        </div>
      `).join('')}
      <button class="add-btn" onclick="addDelegateParam('${addr}')">+ Add Param</button>
    </div>`;
  }

  // Planning step restrictions panel (Phase 61). Shows max_substeps,
  // max_plan_attempts, allow_parallel, allow_delegation inputs only when
  // the step is marked `type: planning`. Engine defaults shown as
  // placeholder text so user knows what the runtime value will be when
  // the field is empty.
  if (s.type === 'planning') {
    html += `<div class="subsection">
      <div class="flex-between">
        <div class="subsection-title mb-0">Planning restrictions ${helpBtn('step.type')}</div>
        <button class="btn btn-sm" onclick="updateStep('${addr}', 'type', '')" style="font-size:11px;padding:2px 8px">Disable</button>
      </div>
      <div class="field-group mt-8" style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <label class="field-label" style="font-size:11px">max_substeps ${helpBtn('step.max_substeps')}</label>
          <input type="number" class="field-input" value="${s.max_substeps != null ? s.max_substeps : ''}" min="1" max="50" placeholder="7 (default)" style="font-size:12px;padding:5px 8px"
                 onchange="updateStep('${addr}', 'max_substeps', this.value ? parseInt(this.value) : null)">
        </div>
        <div style="flex:1;min-width:160px">
          <label class="field-label" style="font-size:11px">max_plan_attempts ${helpBtn('step.max_plan_attempts')}</label>
          <input type="number" class="field-input" value="${s.max_plan_attempts != null ? s.max_plan_attempts : ''}" min="1" max="20" placeholder="3 (default)" style="font-size:12px;padding:5px 8px"
                 onchange="updateStep('${addr}', 'max_plan_attempts', this.value ? parseInt(this.value) : null)">
        </div>
      </div>
      <div class="field-group mt-8" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
          <input type="checkbox" ${s.allow_parallel ? 'checked' : ''}
                 onchange="updateStep('${addr}', 'allow_parallel', this.checked)">
          <span>allow_parallel</span>
          ${helpBtn('step.allow_parallel')}
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
          <input type="checkbox" ${s.allow_delegation ? 'checked' : ''}
                 onchange="updateStep('${addr}', 'allow_delegation', this.checked)">
          <span>allow_delegation</span>
          ${helpBtn('step.allow_delegation')}
        </label>
      </div>
    </div>`;
  }

  // Phase B: Loop back panel. `to` is a dropdown limited to this step and
  // EARLIER steps (the backward-only invariant is enforced visually);
  // unnamed steps appear disabled until they get a name.
  if (s.loop_back && !onGraph) {
    const lb = s.loop_back;
    // Sibling logic: loop target set is this step's OWN sequence up to itself.
    const lbParent = parentSeqOf(addr);
    const lbSeq = lbParent.seq, lbIdx = lbParent.idx;
    const targetOptions = lbSeq.slice(0, lbIdx + 1).map((st, j) => {
      const label = st.name ? (j === lbIdx ? `${st.name} (this step — self redo)` : st.name) : `(step ${j + 1} — unnamed)`;
      return `<option value="${esc(st.name)}"${st.name && st.name === lb.to ? ' selected' : ''}${st.name ? '' : ' disabled'}>${esc(label)}</option>`;
    }).join('');
    html += `<div class="subsection">
      <div class="flex-between">
        <div class="subsection-title mb-0">Loop back ${helpBtn('step.loop_back')}</div>
        <button class="btn btn-sm" onclick="toggleLoopBack('${addr}')" style="font-size:11px;padding:2px 8px">Disable</button>
      </div>
      <div class="field-hint" style="margin:6px 0 8px">Evaluated AFTER all gates pass. On "loop" the engine resets every step from the target through this one and moves the cursor back. All conditions must agree to loop (AND); the first "proceed" wins.</div>
      <div class="field-group mt-8" style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <label class="field-label" style="font-size:11px"><span class="required">*</span> Back to step ${helpBtn('step.loop_back.to')}</label>
          <select class="field-select" style="width:100%;padding:5px 26px 5px 8px;font-size:12px;font-family:var(--mono)"
                  onchange="updateLoopBack('${addr}', 'to', this.value)">
            ${lb.to && !lbSeq.slice(0, lbIdx + 1).some(st => st.name === lb.to) ? `<option value="${esc(lb.to)}" selected>${esc(lb.to)} (not found!)</option>` : ''}
            ${targetOptions}
          </select>
        </div>
        <div style="flex:0 0 150px">
          <label class="field-label" style="font-size:11px"><span class="required">*</span> max_iterations ${helpBtn('step.loop_back.max_iterations')}</label>
          <input type="number" class="field-input" value="${lb.max_iterations != null ? lb.max_iterations : ''}" min="1" max="1000" placeholder="e.g. 10" style="font-size:12px;padding:5px 8px"
                 onchange="updateLoopBack('${addr}', 'max_iterations', this.value ? parseInt(this.value) : null)">
        </div>
      </div>
      <div class="field-group mt-8">
        <label class="field-label" style="font-size:11px">When — loop conditions (≥1 required) ${helpBtn('step.loop_back.when')}</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="field-label" style="margin:0;font-size:11px;min-width:70px">script</span>
            <input type="text" class="field-input" value="${esc(lb.when.script)}" placeholder='python scripts/has_more.py  (stdout: {"loop": true|false})' style="flex:1;font-size:12px;padding:5px 8px;font-family:var(--mono)"
                   onchange="updateLoopBackWhen('${addr}', 'script', this.value)">
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="field-label" style="margin:0;font-size:11px;min-width:70px">semantic</span>
            <input type="text" class="field-input" value="${esc(lb.when.semantic)}" placeholder="Condition the orchestrator LLM evaluates against the step outputs" style="flex:1;font-size:12px;padding:5px 8px"
                   onchange="updateLoopBackWhen('${addr}', 'semantic', this.value)">
          </div>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
            <input type="checkbox" ${lb.when.human ? 'checked' : ''}
                   onchange="updateLoopBackWhen('${addr}', 'human', this.checked)">
            <span>human — the user decides each iteration</span>
          </label>
          ${viaPillsHtml('loop', addr, lb.when.human_channel || null, undefined, !!lb.when.human) + helpBtn('gate.human_channel')}
        </div>
      </div>
    </div>`;
  }

  // Phase R: routes block. Each route step keeps a compact flat row
  // (name + goal + subagent) PLUS an "Edit ▾" toggle that expands the FULL
  // step-config editor (renderStepBody) inline beneath the row — recursing for
  // nested routes. The flat row controls are addr-uniform via updateStep(cAddr).
  if (s.routes) {
    const r = s.routes;
    html += `<div class="subsection step-routes-section">
      <div class="flex-between">
        <div class="subsection-title mb-0">Routes ${helpBtn('step.routes')}</div>
        <button class="btn btn-sm" onclick="toggleRoutes('${addr}')" style="font-size:11px;padding:2px 8px">Disable</button>
      </div>
      <div class="field-hint" style="margin:6px 0 8px">Evaluated AFTER all gates pass (and after loop_back, if any, proceeds). The engine picks ONE route by id — or "proceed" to take none — and runs its steps in-line; control then returns to the next step. Route selection is engine-owned.</div>
      <div class="field-group mt-8">
        <label class="field-label" style="font-size:11px">When — routing conditions (&ge;1 required) ${helpBtn('step.routes.when')}</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="field-label" style="margin:0;font-size:11px;min-width:70px">script</span>
            <input type="text" class="field-input" value="${esc(r.when.script)}" placeholder='python scripts/pick.py  (stdout: {"route": "&lt;id&gt;"|"proceed"})' style="flex:1;font-size:12px;padding:5px 8px;font-family:var(--mono)" onchange="updateRoutesWhen('${addr}', 'script', this.value)">
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="field-label" style="margin:0;font-size:11px;min-width:70px">semantic</span>
            <input type="text" class="field-input" value="${esc(r.when.semantic)}" placeholder="Condition the orchestrator LLM evaluates to a route id or proceed" style="flex:1;font-size:12px;padding:5px 8px" onchange="updateRoutesWhen('${addr}', 'semantic', this.value)">
          </div>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
            <input type="checkbox" ${r.when.human ? 'checked' : ''} onchange="updateRoutesWhen('${addr}', 'human', this.checked)">
            <span>human — the user picks the route (final authority)</span>
          </label>
          ${viaPillsHtml('routes', addr, r.when.human_channel || null, undefined, !!r.when.human) + helpBtn('gate.human_channel')}
        </div>
      </div>
      <div class="field-group mt-8">
        <div class="flex-between">
          <label class="field-label" style="font-size:11px">Routes ${helpBtn('step.routes.define')}</label>
          <button class="add-btn" onclick="addRoute('${addr}')">+ Add route</button>
        </div>`;
    (r.define || []).forEach((route, ri) => {
      html += `<div style="border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="field-label" style="margin:0;font-size:11px">id ${helpBtn('step.routes.id')}</span>
          <input type="text" class="field-input" value="${esc(route.id)}" placeholder="route-id" style="flex:1;font-size:12px;padding:4px 8px;font-family:var(--mono)" onchange="updateRouteId('${addr}', ${ri}, this.value)">
          <button class="btn btn-sm" onclick="removeRoute('${addr}', ${ri})" style="font-size:11px;padding:2px 8px" title="Remove this route">&times;</button>
        </div>`;
      (route.steps || []).forEach((st, sj) => {
        const cAddr = addr + '.' + ri + '.' + sj;
        const expanded = state.ui.openRouteSteps.has(cAddr);
        html += `<div style="display:flex;gap:6px;margin:6px 0 6px 12px;align-items:flex-start">
          <div style="flex:1;display:flex;flex-direction:column;gap:4px">
            <input type="text" class="field-input" value="${esc(st.name || '')}" placeholder="step name" style="font-size:12px;padding:4px 8px;font-family:var(--mono)" onchange="updateStep('${cAddr}', 'name', this.value)">
            <textarea class="field-input" placeholder="goal" rows="2" style="font-size:12px;padding:4px 8px;resize:vertical" onchange="updateStep('${cAddr}', 'goal', this.value)">${esc(st.goal || '')}</textarea>
            <label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer"><input type="checkbox" ${st.subagent === false ? '' : 'checked'} onchange="updateRouteStep('${addr}', ${ri}, ${sj}, 'subagent', this.checked)"><span>subagent (uncheck = inline)</span></label>
          </div>
          <button class="btn btn-sm" onclick="toggleRouteStepEdit('${cAddr}')" style="font-size:11px;padding:2px 8px" title="${expanded ? 'Collapse full step config' : 'Edit the full step config (inputs, outputs, tools, gate, loop_back, nested routes…)'}">Edit ${expanded ? '&#x25B4;' : '&#x25BE;'}</button>
          <button class="btn btn-sm" onclick="removeRouteStep('${addr}', ${ri}, ${sj})" style="font-size:11px;padding:2px 8px" title="Remove this step">&times;</button>
        </div>`;
        if (expanded) {
          normalizeStepForEdit(st);
          html += `<div style="margin:0 0 8px 12px;padding:0 12px;border-left:2px solid var(--accent);background:var(--bg-section);border-radius:0 6px 6px 0">${renderStepBody(st, cAddr)}</div>`;
        }
      });
      html += `<button class="add-btn" style="margin-left:12px" onclick="addRouteStep('${addr}', ${ri})">+ Add step</button>
      </div>`;
    });
    html += `</div>
    </div>`;
  }

  // Lanes block (parallel execution lanes). Mirrors the routes section: each
  // lane step keeps a compact flat row + "Edit" expanding the FULL step
  // editor inline (recursing). Lane hops address as "<addr>.L<li>.<sj>" —
  // the container discriminator keeps them out of routes.define.
  if (s.lanes) {
    const L = s.lanes;
    html += `<div class="subsection step-lanes-section" style="border-left:2px solid var(--mech-lanes);padding-left:10px">
      <div class="flex-between">
        <div class="subsection-title mb-0" style="color:var(--mech-lanes)">Lanes ${helpBtn('step.lanes')}</div>
        <button class="btn btn-sm" onclick="toggleLanes('${addr}')" style="font-size:11px;padding:2px 8px">Disable</button>
      </div>
      <div class="field-hint" style="margin:6px 0 8px">All lanes start CONCURRENTLY after this step (no condition — nothing is chosen) and rejoin at an engine-owned barrier. The barrier always waits for every lane; join.require only changes the verdict. Merge/judge the results in the ordinary step AFTER this one.</div>
      <div class="field-group mt-8">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="field-label" style="margin:0;font-size:11px">join.require ${helpBtn('step.lanes.require')}</span>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm" onclick="updateLanesRequire('${addr}', 'all')" style="font-size:11px;padding:2px 10px;${(!L.join || L.join.require !== 'any') ? 'background:var(--mech-lanes);color:#fff;border-color:var(--mech-lanes)' : ''}">all</button>
            <button class="btn btn-sm" onclick="updateLanesRequire('${addr}', 'any')" style="font-size:11px;padding:2px 10px;${(L.join && L.join.require === 'any') ? 'background:var(--mech-lanes);color:#fff;border-color:var(--mech-lanes)' : ''}">any</button>
          </div>
        </div>
      </div>
      <div class="field-group mt-8">
        <div class="flex-between">
          <label class="field-label" style="font-size:11px">Lanes ${helpBtn('step.lanes.define')}</label>
          <button class="add-btn" onclick="addLane('${addr}')">+ Add lane</button>
        </div>`;
    (L.define || []).forEach((lane, li) => {
      html += `<div style="border:1px solid var(--mech-lanes);border-radius:6px;padding:8px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="field-label" style="margin:0;font-size:11px">id ${helpBtn('step.lanes.id')}</span>
          <input type="text" class="field-input" value="${esc(lane.id)}" placeholder="lane-id" style="flex:1;font-size:12px;padding:4px 8px;font-family:var(--mono)" onchange="updateLaneId('${addr}', ${li}, this.value)">
          <button class="btn btn-sm" onclick="removeLane('${addr}', ${li})" style="font-size:11px;padding:2px 8px" title="Remove this lane">&times;</button>
        </div>`;
      (lane.steps || []).forEach((st, sj) => {
        const cAddr = addr + '.L' + li + '.' + sj;
        const expanded = state.ui.openRouteSteps.has(cAddr);
        html += `<div style="display:flex;gap:6px;margin:6px 0 6px 12px;align-items:flex-start">
          <div style="flex:1;display:flex;flex-direction:column;gap:4px">
            <input type="text" class="field-input" value="${esc(st.name || '')}" placeholder="step name" style="font-size:12px;padding:4px 8px;font-family:var(--mono)" onchange="updateStep('${cAddr}', 'name', this.value)">
            <textarea class="field-input" placeholder="goal" rows="2" style="font-size:12px;padding:4px 8px;resize:vertical" onchange="updateStep('${cAddr}', 'goal', this.value)">${esc(st.goal || '')}</textarea>
            <label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer"><input type="checkbox" ${st.subagent === false ? '' : 'checked'} onchange="updateLaneStep('${addr}', ${li}, ${sj}, 'subagent', this.checked)"><span>subagent (uncheck = inline)</span></label>
          </div>
          <button class="btn btn-sm" onclick="toggleRouteStepEdit('${cAddr}')" style="font-size:11px;padding:2px 8px" title="${expanded ? 'Collapse full step config' : 'Edit the full step config (inputs, outputs, tools, gate, loop_back, routes…)'}">Edit ${expanded ? '&#x25B4;' : '&#x25BE;'}</button>
          <button class="btn btn-sm" onclick="removeLaneStep('${addr}', ${li}, ${sj})" style="font-size:11px;padding:2px 8px" title="Remove this step">&times;</button>
        </div>`;
        if (expanded) {
          normalizeStepForEdit(st);
          html += `<div style="margin:0 0 8px 12px;padding:0 12px;border-left:2px solid var(--mech-lanes);background:var(--bg-section);border-radius:0 6px 6px 0">${renderStepBody(st, cAddr)}</div>`;
        }
      });
      html += `<button class="add-btn" style="margin-left:12px" onclick="addLaneStep('${addr}', ${li})">+ Add step</button>
      </div>`;
    });
    html += `</div>
    </div>`;
  }

  // Inputs (compact single-row)
  if (!onGraph) html += `<div class="subsection">
    <div class="flex-between">
      <div class="subsection-title mb-0">Inputs ${helpBtn('input.path')}</div>
      <button class="add-btn" onclick="addInput('${addr}')">+ Add</button>
    </div>
    ${s.inputs.map((inp, j) => `
      <div class="list-item mt-8" style="padding:5px 8px;gap:6px;align-items:center">
        <input type="text" class="field-input" value="${esc(inp.path)}" placeholder=".riglane/specs/**/*.md" style="flex:1;min-width:0;padding:5px 8px;font-size:12px" data-help="input.path"
               onchange="updateInput('${addr}', ${j}, 'path', this.value)">
        <select class="field-select" data-help="input.inject" onchange="updateInput('${addr}', ${j}, 'inject', this.value)" style="max-width:120px;padding:5px 26px 5px 8px;font-size:11px">
          <option value="file"${inp.inject === 'file' ? ' selected' : ''}>file</option>
          <option value="file_if_exists"${inp.inject === 'file_if_exists' ? ' selected' : ''}>if_exists</option>
          <option value="reference"${inp.inject === 'reference' ? ' selected' : ''}>reference</option>
        </select>
        ${structDropdown(inp.struct, `handleStructSelect(this, '${addr}', ${j}, 'input')`).replace('style="max-width:180px"', 'style="max-width:130px;padding:5px 26px 5px 8px;font-size:11px" data-help="input.struct"')}
        <button class="list-remove" onclick="removeInput('${addr}', ${j})" style="margin:0">&times;</button>
      </div>
    `).join('')}
    ${s.inputs.length === 0 ? '<div class="field-hint mt-8">No inputs defined.</div>' : ''}
  </div>`;

  // Outputs (compact single-row)
  if (!onGraph) html += `<div class="subsection">
    <div class="flex-between">
      <div class="subsection-title mb-0">Outputs ${helpBtn('output.path')}</div>
      <button class="add-btn" onclick="addOutput('${addr}')">+ Add</button>
    </div>
    ${s.outputs.map((out, j) => `
      <div class="list-item mt-8" style="padding:5px 8px;gap:6px;align-items:center">
        <input type="text" class="field-input" value="${esc(out.path)}" placeholder="data/output.json" style="flex:1;min-width:0;padding:5px 8px;font-size:12px" data-help="output.path"
               onchange="updateOutput('${addr}', ${j}, 'path', this.value)">
        ${structDropdown(out.struct, `handleStructSelect(this, '${addr}', ${j}, 'output')`).replace('style="max-width:180px"', 'style="max-width:130px;padding:5px 26px 5px 8px;font-size:11px" data-help="output.struct"')}
        <select class="field-select" data-help="output.write_proof" onchange="updateOutput('${addr}', ${j}, 'write_proof', this.value)" style="max-width:110px;padding:5px 26px 5px 8px;font-size:11px">
          <option value=""${!out.write_proof ? ' selected' : ''}>wp: default</option>
          <option value="required"${out.write_proof === 'required' ? ' selected' : ''}>required</option>
          <option value="all_members_fresh"${out.write_proof === 'all_members_fresh' ? ' selected' : ''}>all_fresh</option>
          <option value="any_member"${out.write_proof === 'any_member' ? ' selected' : ''}>any_member</option>
          <option value="off"${out.write_proof === 'off' ? ' selected' : ''}>off</option>
        </select>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;white-space:nowrap" data-help="output.optional"><input type="checkbox" ${out.optional ? 'checked' : ''} onchange="updateOutput('${addr}', ${j}, 'optional', this.checked)"><span>optional</span></label>
        ${state.workflow.steps.some(st => st.loop_back) ? `<label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;white-space:nowrap" data-help="output.per_iteration"><input type="checkbox" ${out.per_iteration ? 'checked' : ''} onchange="updateOutput('${addr}', ${j}, 'per_iteration', this.checked)"><span>per-iteration</span></label>` : ''}
        <button class="list-remove" onclick="removeOutput('${addr}', ${j})" style="margin:0">&times;</button>
      </div>
      ${s.delegate_to ? `<div class="list-item" style="padding:3px 8px 5px 8px;gap:6px;align-items:center;border-top:none;margin-top:0">
        <span style="font-size:11px;color:var(--amber,#b45309);white-space:nowrap" data-help="output.from_delegated">↳ from child:</span>
        <input type="text" class="field-input" value="${esc(out.from_delegated || '')}" placeholder="data/{run_id}-report.json — source in the delegated child's run dir (child params)" style="flex:1;min-width:0;padding:4px 8px;font-size:11px;font-family:var(--mono)" data-help="output.from_delegated"
               onchange="updateOutput('${addr}', ${j}, 'from_delegated', this.value)">
      </div>` : ''}
    `).join('')}
    ${s.outputs.length === 0 ? '<div class="field-hint mt-8">No outputs defined. Steps without outputs skip structural gate validation.</div>' : ''}
  </div>`;

  // Param bindings
  // On the graph, data flow (inputs, outputs and the param bindings read out
  // of those outputs) lives on the EDGES — the in/out chips carry the same
  // controls, so the card does not repeat them.
  const pbKeys = Object.keys(s.param_bindings || {});
  if (!onGraph && (pbKeys.length > 0 || s.outputs.length > 0)) {
    html += `<div class="subsection">
      <div class="flex-between">
        <div class="subsection-title mb-0">Param Bindings ${helpBtn('step.param_bindings')}</div>
        <button class="add-btn" onclick="addParamBinding('${addr}')">+ Add</button>
      </div>
      <div class="field-hint" style="margin:6px 0 8px">Update workflow params from step outputs after gate passes. Syntax: <code style="background:var(--bg-hover);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11px">data/output.json::field</code></div>
      ${pbKeys.map(k => `
        <div class="field-row" style="margin-bottom:6px">
          <input type="text" class="field-input" value="${esc(k)}" placeholder="param_name" style="max-width:140px"
                 onchange="renameParamBinding('${addr}', '${esc(k)}', this.value)">
          <input type="text" class="field-input" value="${esc(s.param_bindings[k])}" placeholder="data/output.json::field"
                 onchange="updateParamBinding('${addr}', '${esc(k)}', this.value)">
          <button class="list-remove" onclick="removeParamBinding('${addr}', '${esc(k)}')">&times;</button>
        </div>
      `).join('')}
      ${pbKeys.length === 0 ? '<div class="field-hint mt-8">No bindings defined. Add one to pipe step outputs into workflow params.</div>' : ''}
    </div>`;
  }

  return html;
}

// ── Render: Structs Tab ────────────────────────────────
/* The Tools tab. Tools and structs both belong to the workflow that is open;
   what differs is where they are written — a tool is inlined in workflow.yaml,
   a struct is its own file in the structs/ folder beside it. Both tabs say so
   in their header, because two tabs that look alike otherwise invite the
   assumption that one of them is a shared registry. */
/* The Tools tab. Unlike Structs — a project-level registry shared across
   workflows — these tools belong to THIS workflow and are written into its own
   YAML. The header says so, because a tab that looks like the Structs tab would
   otherwise read as another shared registry.
   Card shape follows the Structs tab deliberately: a collapsible header with the
   name and kind, then plain field groups. The old markup was a wall of inline
   styles with no visual hierarchy, which is what made it unreadable. */
function renderToolsTab() {
  const w = state.workflow;
  const badge = document.getElementById('toolCount');
  if (badge) { badge.textContent = w.tools.length; badge.classList.toggle('muted', !w.tools.length); }
  const host = document.getElementById('toolsTab');
  if (!host) return;

  let html = `<div class="tab-intro">
    <div class="tab-intro-t">Tools of <b>${esc(w.name || 'this workflow')}</b></div>
    <div class="tab-intro-d">Written inside this workflow's own <code>workflow.yaml</code> — they are not shared with other workflows. Each step may call all of them, a named subset, or none; that choice is made on the step itself.</div>
  </div>`;
  html += `<div class="flex-between" style="margin-bottom:12px">
    <div class="section-title" style="font-size:13px">TOOL DEFINITIONS</div>
    <button class="add-btn" onclick="addTool()">+ Add Tool</button>
  </div>`;
  if (!w.tools.length) {
    html += `<div class="empty-state">No tools yet. Click "Add Tool" to define one.<br><small>A tool is a command or MCP server this workflow's steps can call.</small></div>`;
  }
  w.tools.forEach((t, i) => { html += renderToolCard(t, i, !state.ui.openTools.has(i) ? false : true); });
  host.innerHTML = html;
}

function renderToolCard(t, i, open) {
  const collapsed = open ? '' : ' collapsed';
  const name = t.name || 'Untitled tool';
  const isScript = t.type === 'script';
  let html = `<div class="struct-card tool-card${collapsed}" data-tool="${esc(t.name || '')}" data-tool-idx="${i}">
    <div class="struct-header" onclick="toggleTool(${i})">
      ${chevronSVG}
      <span class="tool-icon ${isScript ? 'script' : 'mcp'}"><svg><use href="#gv-i-${isScript ? 'tool-script' : 'tool-mcp'}"/></svg></span>
      <span class="struct-name${t.name ? '' : ' empty'}">${esc(name)}</span>
      <span class="chip ${isScript ? 'chip-blue' : 'chip-purple'}">${isScript ? 'script' : 'mcp'}</span>
      ${t.description ? `<span class="tool-sub">${esc(t.description)}</span>` : ''}
      <span class="step-actions" onclick="event.stopPropagation()">
        <button class="btn-icon danger" onclick="removeTool(${i})" title="Delete tool">&times;</button>
      </span>
    </div>
    <div class="struct-details">
      <div class="field-row">
        <div class="field-group" style="flex:2">
          <label class="field-label"><span class="required">*</span> Name ${helpBtn('tool.name')}</label>
          <input type="text" class="field-input" value="${esc(t.name)}" placeholder="count_lines"
                 onchange="updateTool(${i}, 'name', this.value)">

          </select>
        </div>
      </div>`;

  if (isScript) {
    html += `
      <div class="field-group">
        <label class="field-label"><span class="required">*</span> Command ${helpBtn('tool.command')}</label>

               onchange="updateTool(${i}, 'command', this.value)">

      </div>
      <div class="field-group">
        <label class="field-label"><span class="required">*</span> Description ${helpBtn('tool.description')}</label>
        <input type="text" class="field-input" value="${esc(t.description)}" placeholder="Count lines and characters in a file"
               onchange="updateTool(${i}, 'description', this.value)">

      </div>

        <div class="flex-between">
          <div class="subsection-title mb-0">Input schema ${helpBtn('tool.input_schema')}</div>
          <button class="btn btn-sm" style="font-size:11px;padding:2px 8px" onclick="fillSchemaTemplate(${i})">Insert a starter</button>
        </div>

        <textarea class="field-input" style="width:100%;min-height:66px;font-family:var(--mono);font-size:11.5px;resize:vertical"
                  placeholder='{"type":"object","required":["file_path"],"properties":{"file_path":{"type":"string"}}}'
                  onchange="updateTool(${i}, 'input_schema', this.value)">${esc(t.input_schema)}</textarea>

               onchange="updateTool(${i}, 'expected_tools', this.value)">
        <div class="field-hint">Comma-separated names from this server that steps will use. <code>riglane init-workflow</code> writes them into each step's subagent whitelist as <code>mcp__&lt;server&gt;__&lt;tool&gt;</code>.</div>
      </div>

// ── Render: YAML Preview ───────────────────────────────
/* The workflow as its file: what the engine will actually read, editable in
   place. Parsing runs as you type so a mistake is named immediately, but the
   model is only replaced when you commit — reformatting mid-keystroke would
   fight whoever is typing. */
let yamlTouched = false;
function renderYamlView() {
  const host = document.getElementById('workflowTab');
  if (!host) return;
  const ta = host.querySelector('#yamlEdit');
  if (ta && yamlTouched && document.activeElement === ta) return;   // never clobber an edit in progress
  let text = '';
  try { text = generateWorkflowYAML(state.workflow); }
  catch (err) { text = '# This workflow cannot be written out yet:\n# ' + err.message; }
  host.innerHTML = `<div class="yaml-view">
    <div class="yaml-bar">
      <svg class="yaml-i"><use href="#gv-i-yaml"/></svg>
      <span class="yaml-name">${esc(state.workflow.name || 'workflow')}.yaml</span>
      <span class="yaml-status" id="yamlStatus">In sync with the editor</span>
      <button class="btn btn-sm" onclick="copyYAML()">Copy</button>
      <button class="btn btn-sm btn-primary" id="yamlApply" onclick="applyYaml()" disabled>Apply</button>
    </div>
    <textarea id="yamlEdit" class="yaml-edit" spellcheck="false" wrap="off"
      oninput="onYamlInput()" onkeydown="if(event.key==='Tab'){event.preventDefault();yamlIndent(this);}"
    >${esc(text)}</textarea>
    <div class="yaml-hint">Edits here replace the whole workflow when you apply them. Everything the Form and Graph views can express is in this file — and nothing else is.</div>
  </div>`;
  yamlTouched = false;
}
/* What the text in the editor actually is. The YAML parser here is lenient by
   design — it accepts a great deal rather than refusing to open a file — so
   "it parsed" is NOT the same as "this is a workflow", and saying Valid on that
   basis would be a promise the check never made. A fragment with no steps: is
   the dangerous case: applying it would quietly empty the workflow. */
function yamlCheck(text) {
  let parsed;
  try { parsed = parseYAML(text); }
  catch (err) { return { ok: false, msg: err.message }; }
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed))
    return { ok: false, msg: 'Not a YAML mapping — a workflow file starts with name:' };
  if (!Array.isArray(parsed.steps))
    return { ok: false, msg: 'No steps: — applying this would empty the workflow' };
  const n = parsed.steps.length;
  return { ok: true, msg: n + (n === 1 ? ' step' : ' steps') + ' — apply to replace the workflow' };
}
function onYamlInput() {
  yamlTouched = true;
  const ta = document.getElementById('yamlEdit');
  const st = document.getElementById('yamlStatus');
  const ap = document.getElementById('yamlApply');
  if (!ta || !st) return;
  const r = yamlCheck(ta.value);
  st.textContent = r.msg;
  st.className = 'yaml-status ' + (r.ok ? 'ok' : 'bad');
  if (ap) ap.disabled = !r.ok;
}
function applyYaml() {
  const ta = document.getElementById('yamlEdit');
  if (!ta) return;
  const r = yamlCheck(ta.value);
  if (!r.ok) { showToast('Could not apply: ' + r.msg); return; }
  try {
    loadWorkflowFromParsed(parseYAML(ta.value));
    autoDetectStructs();
    yamlTouched = false;
    markDirty();
    renderToolsTab();
    renderStructsTab();
    renderWorkflowTab();
    // Whether the file is a WORKING workflow is a separate question from whether
    // it could be read, and it is only answerable once it is loaded. Reported,
    // not enforced: an unfinished workflow is a legitimate thing to be holding.
    const errs = validateWorkflow();
    const st = document.getElementById('yamlStatus');
    if (st && errs.length) {
      st.textContent = errs.length + (errs.length === 1 ? ' problem: ' : ' problems, first: ') + errs[0];
      st.className = 'yaml-status warn';
    }
    showToast(errs.length ? 'Applied — ' + errs.length + ' validation problem' + (errs.length === 1 ? '' : 's')
      : 'Workflow replaced from YAML');
  } catch (err) {
    showToast('Could not apply: ' + err.message);
  }
}
/* Tab indents instead of leaving the field — in a YAML editor that is what the
   key is for, and losing focus mid-file is never what was meant. */
function yamlIndent(ta) {
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = ta.value.slice(0, a) + '  ' + ta.value.slice(b);
  ta.selectionStart = ta.selectionEnd = a + 2;
  onYamlInput();
}

/* The YAML view IS the preview now: an edit made anywhere else shows up in the
   file the moment it lands — unless the file is the thing being edited. */
function schedulePreview() {
  if (state.ui.workflowView !== 'yaml' || yamlTouched) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderYamlView, 200);
}

// ── State Mutations ────────────────────────────────────
function updateWF(field, value) {
  if (field === 'carry_forward') {
    state.workflow.context.carry_forward = value;
  } else {
    state.workflow[field] = value;
  }
  markDirty();
  renderWorkflowTab();
}

function updateGate(field, value) {
  if (value === undefined) delete state.workflow.gate[field];
  else state.workflow.gate[field] = value;
  markDirty();
  renderWorkflowTab();
}

/* ── conditional human gate ──────────────────────────────────────────────
   gate.human is false | true | {script: "<cmd>"}. The script is a decider:
   the engine runs it at gate time (after the step's outputs exist) and it
   prints {"human": true|false} — true means THIS run needs approval. In the
   editor the script field IS the conditionality: empty → plain true,
   non-empty → conditional. */
function isCondHuman(h) { return !!h && typeof h === 'object' && typeof h.script === 'string'; }
function humanGateYaml(h) {
  return isCondHuman(h) ? '{script: ' + JSON.stringify(h.script) + '}' : String(!!h);
}
function updateGateHumanScript(v) {
  const t = (v || '').trim();
  state.workflow.gate.human = t ? { script: t } : true;
  markDirty();
  renderWorkflowTab();
}
function updateStepGateHumanScript(addr, v) {
  const s = resolveStepByPath(addr);
  if (!s) return;
  if (!s.gate) s.gate = {};
  const t = (v || '').trim();
  s.gate.human = t ? { script: t } : true;
  markDirty();
  renderWorkflowTab();
}

/* ── via pills: one control for every human_channel surface ──────────────
   Segmented pills instead of a dropdown: the effective channel is visible at
   a glance and switching is one click. Contexts:
     fn 'wf'            - workflow gate default   (terminal = key removed)
     fn 'step'          - step gate override      (extra inherit pill)
     fn 'loop'/'routes' - the human deciders      (terminal = key removed)
   Data travels on data-attributes so the SAME markup works from template
   literals and from the graph's string-built panels (no quote escaping). */
function viaPillsHtml(fn, addr, override, inheritDefault, armed) {
  const hasInherit = inheritDefault !== undefined;
  // `armed` false = the human gate is OFF here. The pills stay VISIBLE and
  // clickable anyway: hiding them made the channel undiscoverable — the only
  // way to reach it was to arm the gate first and hope a control appeared,
  // which pushed people to the workflow-level gate (arming every step).
  // Clicking a channel while disarmed turns the gate ON for THIS surface and
  // sets the channel in one go.
  const off = armed === false;
  let h = '<span class="gv-via' + (off ? ' gv-via-off' : '') + '" data-help="gate.human_channel" title="' +
    esc(off ? 'The human gate is off here, so nothing is selected — there is no question to route yet. Pick a channel to turn the gate on and send its question there.'
            : (HELP['gate.human_channel'] || '')) + '">' +
    '<span class="gv-via-lbl">via</span>' +
    (off ? '<span class="gv-via-note">gate off</span>' : '');
  if (hasInherit) {
    h += '<button type="button" class="gv-via-p inh' + (override == null && !off ? ' on' : '') + '"' +
      ' data-fn="' + fn + '" data-addr="' + esc(addr) + '" data-val="__inherit"' +
      ' title="Follow the workflow gate default (' + esc(inheritDefault) + ') — this step stores no channel of its own. Only steps have this: the workflow defaults have nothing above them to inherit from."' +
      ' onclick="viaPick(this);event.stopPropagation()">inherit &middot; ' + esc(inheritDefault) + '</button>';
  }
  const eff = off ? null : (override != null ? override : (hasInherit ? null : 'terminal'));
  ['terminal', 'external', 'both'].forEach(function (v) {
    const tip = v === 'terminal' ? 'Ask in the agent conversation only (nothing recorded)'
      : v === 'external' ? 'Deliver externally - the run inbox: durable, answerable outside the terminal, enforced'
      : 'External AND the terminal - whichever answers first wins';
    h += '<button type="button" class="gv-via-p' + (eff === v ? ' on' : '') + '"' +
      ' data-fn="' + fn + '" data-addr="' + esc(addr) + '" data-val="' + v + '"' +
      (off ? ' data-arm="1"' : '') +
      ' title="' + (off ? 'Turn the human gate on here and ask ' + (v === 'terminal' ? 'in the terminal' : v === 'external' ? 'through the run inbox' : 'on both channels') : tip) +
      '" onclick="viaPick(this);event.stopPropagation()">' + v + '</button>';
  });
  return h + '</span>';
}
function viaPick(el) {
  const d = el.dataset;
  // Disarmed surface: arming and routing are one gesture (see viaPillsHtml).
  if (d.arm === '1' && d.val !== '__inherit') {
    if (d.fn === 'step') updateStepGateField(d.addr, 'human', true);
    else if (d.fn === 'wf') updateGate('human', true);
    else if (d.fn === 'loop') updateLoopBackWhen(d.addr, 'human', true);
    else if (d.fn === 'routes') updateRoutesWhen(d.addr, 'human', true);
  }
  if (d.fn === 'step') {

/**
 * Pick the delegation target from the workflows that actually exist in this
 * project instead of typing a name into a browser prompt (which offered no
 * list, no validation and no cancel affordance). Sources, in order: the
 * studio shell's lent enumerator, this tool's own server (`/api/workflows.json`
 * when it is served), and — always — a free-text field, because the target may
 * legitimately be a workflow that is not installed yet.
 */
function promptDelegation(addr) {
  const current = (resolveStepByPath(addr) || {}).delegate_to || '';
  const apply = function (name) {
    if (!name) return;
    resolveStepByPath(addr).delegate_to = name;
    markDirty();
    renderWorkflowTab();
  };
  const self = state.workflow.name || '';
  const fromShell = typeof window.__studioWorkflowNames === 'function'
    ? window.__studioWorkflowNames() : null;
  if (Array.isArray(fromShell)) {
    openWorkflowPicker(fromShell.filter(function (n) { return n !== self; }), current, apply);
    return;
  }
  // Served standalone: ask the server that is serving this page.
  fetch('../api/workflows.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      const names = (Array.isArray(list) ? list : [])
        .map(function (w) { return w && w.name; })
        .filter(function (n) { return n && n !== self; });
      openWorkflowPicker(names, current, apply);
    })
    .catch(function () { openWorkflowPicker([], current, apply); });
}

/** The picker itself: a list of names, a filter, and a free-text fallback. */
function openWorkflowPicker(names, current, onPick) {
  document.querySelectorAll('.gv-modal.wf-picker').forEach(function (m) { m.remove(); });
  const m = document.createElement('div');
  m.className = 'gv-modal wf-picker';
  const unique = [];
  (names || []).forEach(function (n) { if (unique.indexOf(n) < 0) unique.push(n); });
  m.innerHTML = '<div class="gv-modal-c" style="width:420px">' +
    '<div class="gv-modal-h" style="margin-bottom:9px">Delegate to which workflow?</div>' +
    '<div class="gv-modal-t" style="margin-bottom:9px">The step hands off to another workflow in this project; ' +
    'it runs with its own manifest and trace, and artifacts come back through outputs (from child) and param bindings.</div>' +
    (unique.length
      ? '<input class="field-input wf-pick-filter" placeholder="filter…" style="width:100%;margin-bottom:7px">' +
        '<div class="wf-pick-list">' + unique.map(function (n) {
          return '<button class="wf-pick-item' + (n === current ? ' on' : '') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>';
        }).join('') + '</div>'
      : '<div class="gv-pop-empty" style="margin-bottom:7px">No other workflows found in this project — type a name below.</div>') +
    '<div style="display:flex;gap:7px;margin-top:9px">' +
    '<input class="field-input wf-pick-free" placeholder="or type a workflow name" value="' + esc(current) + '" style="flex:1">' +
    '<button data-a="use">Use</button></div>' +
    '<div class="gv-modal-a"><button data-a="no">Cancel</button></div></div>';
  const close = function () { m.remove(); document.removeEventListener('keydown', key); };
  const key = function (ev) { if (ev.key === 'Escape') close(); };
  m.addEventListener('click', function (ev) {
    const item = ev.target.closest('.wf-pick-item');
    if (item) { ev.stopPropagation(); close(); onPick(item.dataset.n); return; }
    const b = ev.target.closest('button');
    if (b && b.dataset.a === 'use') {
      ev.stopPropagation();
      const v = (m.querySelector('.wf-pick-free') || {}).value || '';
      close(); onPick(v.trim());
      return;
    }
    if ((b && b.dataset.a === 'no') || ev.target === m) { ev.stopPropagation(); close(); }
  });
  m.addEventListener('input', function (ev) {
    if (!ev.target.classList.contains('wf-pick-filter')) return;
    const q = ev.target.value.toLowerCase();
    m.querySelectorAll('.wf-pick-item').forEach(function (b) {
      b.style.display = b.dataset.n.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
    });
  });
  m.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || !ev.target.classList.contains('wf-pick-free')) return;
    const v = ev.target.value.trim();
    close(); onPick(v);
  });
  document.addEventListener('keydown', key);
  document.body.appendChild(m);   // never inside the canvas the toolbars overlay
  const first = m.querySelector('.wf-pick-filter') || m.querySelector('.wf-pick-free');
  if (first) first.focus();
}

function handleStructSelect(select, addr, itemIdx, type) {

  if (type === 'input') {
    s.inputs[itemIdx].struct = val;

function newWorkflow() {

  state.workflow = {
    name: '', version: 1, description: '', inbox_webhook: '',
    params: [],

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = parseYAML(e.target.result);
      loadWorkflowFromParsed(parsed);
      autoDetectStructs();
      state.ui.openSteps = new Set();
      state.ui.openRouteSteps = new Set();
      state.ui.openStructs = new Set();
      state.ui.dirty = false;
      renderWorkflowTab();
      renderToolsTab();
      renderStructsTab();
    } catch (err) {
      alert('Error parsing YAML: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function handleFileInput(event) {
  const file = event.target.files[0];
  if (file) loadFile(file);
  event.target.value = '';
}

// Workflow Studio hook: load a workflow.yaml by URL (fetched over the same
// localhost origin the studio serves it from). Mirrors loadFile's parse→load→
// render path. Exposed on window so the parent shell can drive it.
window.__studioLoad = function (url) {
  fetch(url, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => {
      const parsed = parseYAML(text);
      loadWorkflowFromParsed(parsed);
      autoDetectStructs();
      state.ui.openSteps = new Set();
      state.ui.openRouteSteps = new Set();
      state.ui.openStructs = new Set();
      state.ui.dirty = false;
      renderWorkflowTab();
      renderToolsTab();
      renderStructsTab();
    })
    .catch(err => { try { showToast('Could not load workflow: ' + err.message); } catch (e) {} });
};

// Workflow Studio hooks for "Save to disk": expose the current workflow YAML
// and let the parent clear the dirty flag after a successful write.
window.__studioGetWorkflowYaml = function () {
  const errs = validateWorkflow();
  if (errs.length) throw new Error(errs[0]);
  return generateWorkflowYAML(state.workflow);
};
window.__studioGetWorkflowName = function () { return state.workflow.name; };
window.__studioMarkSaved = function () { state.ui.dirty = false; };
// Load a workflow from raw YAML text (studio "Load" file picker hands the text
// in). Mirrors loadFile's parse→load→render path.
window.__studioLoadText = function (text) {
  try {
    const parsed = parseYAML(text);
    loadWorkflowFromParsed(parsed);
    autoDetectStructs();
    state.ui.openSteps = new Set();
    state.ui.openRouteSteps = new Set();
    state.ui.openStructs = new Set();
    state.ui.dirty = false;
    renderWorkflowTab();
    renderToolsTab();
    renderStructsTab();
  } catch (err) { try { showToast('Error parsing YAML: ' + err.message); } catch (e) {} }
};

function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/yaml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportYAML() {
  const { errors } = await validateNow();
  if (errors.length > 0) {
    renderWorkflowTab();
    showToast(errors.length + ' problem' + (errors.length === 1 ? '' : 's') + ' — the marked elements say what is wrong');
    return;
  }
  renderWorkflowTab();
  const yaml = generateWorkflowYAML(state.workflow);
  downloadFile(yaml, 'workflow.yaml');
  state.ui.dirty = false;
}

async function exportAll() {
  const { errors } = await validateNow();
  if (errors.length > 0) {
    renderWorkflowTab();
    showToast(errors.length + ' problem' + (errors.length === 1 ? '' : 's') + ' — the marked elements say what is wrong');
    return;
  }
  renderWorkflowTab();
  // Download workflow.yaml
  downloadFile(generateWorkflowYAML(state.workflow), 'workflow.yaml');

  // Download struct schemas with delay
  state.structs.forEach((s, i) => {
    if (!s.name) return;
    setTimeout(() => {
      downloadFile(generateStructYAML(s), s.name + '.schema.yaml');
    }, (i + 1) * 300);
  });

  state.ui.dirty = false;
}

function copyYAML() {
  const yaml = generateWorkflowYAML(state.workflow);
  navigator.clipboard.writeText(yaml).then(() => {
    const btn = document.querySelector('.header-actions .btn-sm:nth-child(3)');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = yaml;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}
