function loadExample() {
  if (state.ui.dirty && !confirm('This will replace your current workflow. Continue?')) return;
  const parsed = parseYAML(EXAMPLE_WORKFLOW_YAML);
  loadWorkflowFromParsed(parsed);
  // Load pre-built structs instead of auto-detect
  state.structs = JSON.parse(JSON.stringify(EXAMPLE_STRUCTS));
  // Open key sections for visibility
  state.ui.openSections = new Set(['metadata', 'params', 'gate']);
  state.ui.openSteps = new Set([0, 1]);
  state.ui.openRouteSteps = new Set();
  state.ui.openStructs = new Set([0, 1]);
  state.ui.activeTab = 'workflow';
  renderWorkflowTab();
  renderToolsTab();
  renderStructsTab();
  refreshSaveButton();
  switchTab('workflow');
  showToast('Example workflow loaded — explore all features!');
}

// ── Utilities ──────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toggleTheme() {
  const d = document.documentElement;
  const dark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('btnTheme').textContent = dark ? 'Dark' : 'Light';
}

/* Saving to disk belongs to whoever owns the file. Standalone, the editor can
   only hand you a download; inside Workflow Studio there is a real destination,
   and the Studio lends us the hook that writes there. */
function refreshSaveButton() {
  const b = document.getElementById('tabSave');
  if (b) b.style.display = typeof window.__studioSaveRequest === 'function' ? '' : 'none';
}
function switchTab(tab) {
  state.ui.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('workflowTab').classList.toggle('hidden', tab !== 'workflow');
  document.getElementById('toolsTab').classList.toggle('hidden', tab !== 'tools');
  document.getElementById('structsTab').classList.toggle('hidden', tab !== 'structs');
  // The view switch belongs to the Workflow tab only; leaving the tab must also
  // drop the full-bleed graph canvas so the Structs form gets the page back.
  const vb = document.getElementById('viewBar');
  if (vb) vb.classList.toggle('on', tab === 'workflow');
  document.body.classList.toggle('gv-on', tab === 'workflow' && state.ui.workflowView === 'graph');
}

/* Kept under its old name because it is what the keyboard shortcut and the
   Studio call; what it means now is "show me the file". */
function togglePreview() {
  setWorkflowView(state.ui.workflowView === 'yaml' ? 'form' : 'yaml');
}

function structNames() {
  return state.structs.map(s => s.name).filter(Boolean);
}

function structDropdown(selected, onchangeExpr) {
  const names = structNames();
  let opts = `<option value="">-- none --</option>`;
  names.forEach(n => { opts += `<option value="${esc(n)}"${n === selected ? ' selected' : ''}>${esc(n)}</option>`; });
  opts += `<option value="__new__">+ Create new...</option>`;
  return `<select class="field-select" onchange="${onchangeExpr}" style="max-width:180px">${opts}</select>`;
}

// ── Validation ─────────────────────────────────────────
const V = {
  kebab: v => /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(v),
  posInt: v => Number.isInteger(Number(v)) && Number(v) > 0,
  required: v => v != null && String(v).trim().length > 0,
  uniqueStep: (name, steps, idx) => !steps.some((s, i) => i !== idx && s.name === name),
};

function validateWorkflow() {
  const w = state.workflow;
  const errors = [];
  if (!V.required(w.name)) errors.push('Workflow name is required');
  else if (!V.kebab(w.name)) errors.push('Workflow name must be kebab-case (e.g., "my-workflow")');
  if (!V.posInt(w.version)) errors.push('Version must be a positive integer');
  if (!V.required(w.description)) errors.push('Description is required');
  if (w.steps.length === 0) errors.push('At least one step is required');
  w.steps.forEach((s, i) => {
    if (!V.required(s.name)) errors.push(`Step ${i + 1}: name is required`);
    else if (!V.kebab(s.name)) errors.push(`Step ${i + 1} "${s.name}": name must be kebab-case`);
    else if (!V.uniqueStep(s.name, w.steps, i)) errors.push(`Step ${i + 1} "${s.name}": duplicate step name`);
    if (!V.required(s.goal) && !V.required(s.delegate_to)) errors.push(`Step ${i + 1}: goal is required (or use delegate_to)`);
    if (s.parallel && !V.required(s.parallel_key)) errors.push(`Step ${i + 1} "${s.name}": parallel_key is required when parallel is enabled`);
    // Branch profiles — mirror the engine's ruleBranchProfilesValid: parallel-only,
    // tools ⊆ the step's own list, struct override needs exactly one struct-bearing output.
    if (s.branch_profiles && Object.keys(s.branch_profiles).length) {
      if (!s.parallel) {
        errors.push(`Step ${i + 1} "${s.name}": branch_profiles requires parallel: true (profiles are selected by parallel_key items)`);
      }
      const stepTools = new Set(String(s.tools || '').split(',').map(t => t.trim()).filter(Boolean));
      const structBearing = (s.outputs || []).filter(o => V.required(o.struct)).length;
      for (const [pid, p] of Object.entries(s.branch_profiles)) {
        const outside = (p.tools || []).filter(t => !stepTools.has(t));
        if (outside.length) errors.push(`Step ${i + 1} "${s.name}" profile "${pid}": tools ${outside.join(', ')} are not in the step's own tools list (a profile narrows the grant, never widens)`);
        if (V.required(p.struct) && structBearing !== 1) errors.push(`Step ${i + 1} "${s.name}" profile "${pid}": struct override requires exactly ONE struct-bearing output (found ${structBearing})`);
      }
    }
  });
  // Phase B: loop_back rules — mirror the engine's ruleLoopBackValid, which
  // validates PER SEQUENCE: the main flow and each route's steps list count
  // independently, so main and a route may EACH own one loop. Two loops in the
  // SAME sequence are the v1 limit (the loop range is reset wholesale, which
  // overlapping ranges would break).
  // A sequence may own MANY loops; their ranges must be properly NESTED or
  // DISJOINT (blocks in a structured language). Partial overlap is refused —
  // it would run steps outside the loop that is mid-flight, leaving no defined
  // {iteration}. Mirrors the engine's ruleLoopBackValid.
  loopSequences(w).forEach(seq => {
    const ranges = [];
    seq.steps.forEach((st, si) => {
      const l = st.loop_back;
      if (!l || !V.required(l.to)) return;
      const ti = seq.steps.findIndex(x => x.name === l.to);
      if (ti < 0) {
        errors.push(`${seq.label}: step "${st.name || '?'}" loop_back target "${l.to}" is not a step in the same sequence`);
        return;
      }
      if (ti > si) {
        errors.push(`${seq.label}: step "${st.name || '?'}" loop_back target "${l.to}" is a LATER step — loop_back only points backward`);
        return;
      }
      const crossed = ranges.find(p => {
        const disjoint = ti > p.to || si < p.from;
        const nested = (ti >= p.from && si <= p.to) || (p.from >= ti && p.to <= si);
        return !disjoint && !nested;
      });
      if (crossed) {
        errors.push(
          `${seq.label}: loop range [${l.to} .. ${st.name || '?'}] partially overlaps [${seq.steps[crossed.from].name || '?'} .. ${crossed.owner}] ` +
          '— ranges must be fully nested or completely separate',
        );
        return;
      }
      ranges.push({ from: ti, to: si, owner: st.name || '?' });
    });
  });
  w.steps.forEach((s, i) => {
    const lb = s.loop_back;
    if (!lb) return;
    if (!V.required(lb.to)) { errors.push(`Step ${i + 1} "${s.name}": loop_back target step is required`); return; }
    const toIdx = w.steps.findIndex(st => st.name === lb.to);
    // Target resolution + direction are checked per sequence above; here the
    // range contents are checked for the MAIN sequence (the only one whose
    // steps this top-level walk can see).
    if (toIdx >= 0 && toIdx <= i) {
      for (let j = toIdx; j <= i; j++) {
        const r = w.steps[j];
        if (r.parallel || r.delegate_to || r.type === 'planning') {
          errors.push(`Step ${j + 1} "${r.name}" is inside the loop range [${lb.to} .. ${s.name}] but is not a plain regular step (parallel/delegation/planning) — forbidden in v1`);
        }
      }
    }
    if (!(lb.max_iterations >= 1)) errors.push(`Step ${i + 1} "${s.name}": loop_back max_iterations must be ≥ 1`);
    if (!lb.when.script && !lb.when.semantic && !lb.when.human) errors.push(`Step ${i + 1} "${s.name}": loop_back needs at least one when condition (script / semantic / human)`);
  });
  // Synthetic {iteration} guards.
  const hasLoop = loopSequences(w).some(seq => seq.steps.some(x => x.loop_back && x.loop_back.to));
  if (hasLoop && w.params.some(p => p.name === 'iteration')) {
    errors.push("Param 'iteration' collides with the engine-managed loop counter — rename it");
  }
  if (!hasLoop) {
    w.steps.forEach((s, i) => {
      (s.outputs || []).forEach(out => {
        if (out.per_iteration || (out.path || '').includes('{iteration}')) {
          errors.push(`Step ${i + 1} "${s.name}": output "${out.path}" uses per_iteration/{iteration} but no step has loop_back — the iteration counter only exists in loop workflows`);
        }
      });
    });
  }
  // Phase R: routes rules — mirror the engine (global id uniqueness, id != proceed,
  // ≥1 when condition, ≥1 step per route). Walks nested route steps too.
  const allRouteIds = [];
  const collectRoutes = (steps) => {
    (steps || []).forEach(st => {
      if (st && st.routes && Array.isArray(st.routes.define)) {
        const w2 = st.routes.when || {};
        if (!w2.script && !w2.semantic && !w2.human) {
          errors.push(`Step "${st.name || '?'}": routes needs at least one when condition (script / semantic / human)`);
        }
        st.routes.define.forEach(r => {
          if (!V.required(r.id)) errors.push(`Step "${st.name || '?'}": a route is missing its id`);
          else { if (r.id === 'proceed') errors.push(`Route id "proceed" is reserved — rename it`); allRouteIds.push(r.id); }
          if (!r.steps || r.steps.length === 0) errors.push(`Route "${r.id || '?'}" has no steps`);
          collectRoutes(r.steps);
        });
      }
    });
  };
  collectRoutes(w.steps);
  // Lanes rules — mirror the engine's ruleLanesValid: >=2 lanes, ids share the
  // route-id namespace (globally unique, not 'proceed'), routes+lanes on one
  // step refused, sibling-lane output paths disjoint. Walks nested steps.
  const collectLanes = (steps) => {
    (steps || []).forEach(st => {
      if (st && st.lanes && Array.isArray(st.lanes.define)) {
        if (st.routes && Array.isArray(st.routes.define) && st.routes.define.length) {
          errors.push(`Step "${st.name || '?'}": declares BOTH routes and lanes — nest one inside the other instead (the two move the cursor in incompatible ways)`);
        }
        if (st.lanes.define.length < 2) {
          errors.push(`Step "${st.name || '?'}": lanes needs at least 2 lanes — a single lane is just a linear sequence`);
        }
        const outOwner = {};
        st.lanes.define.forEach(l => {
          if (!V.required(l.id)) errors.push(`Step "${st.name || '?'}": a lane is missing its id`);
          else { if (l.id === 'proceed') errors.push(`Lane id "proceed" is reserved — rename it`); allRouteIds.push(l.id); }
          if (!l.steps || l.steps.length === 0) errors.push(`Lane "${l.id || '?'}" has no steps`);
          const walkOuts = (ss) => (ss || []).forEach(x => {
            (x.outputs || []).forEach(o => {
              const pth = typeof o === 'string' ? o : (o && o.path) || '';
              if (!pth) return;
              if (outOwner[pth] && outOwner[pth] !== l.id) {
                errors.push(`Lanes "${outOwner[pth]}" and "${l.id}" (step "${st.name || '?'}") both declare output "${pth}" — sibling lanes write into the shared run dir concurrently; give each lane its own path`);
              } else { outOwner[pth] = l.id; }
            });
            ((x.routes && x.routes.define) || []).forEach(r => walkOuts(r.steps));
            ((x.lanes && x.lanes.define) || []).forEach(nl => walkOuts(nl.steps));
          });
          walkOuts(l.steps);
          collectLanes(l.steps);
          collectRoutes(l.steps);
        });
      }
    });
  };
  collectLanes(w.steps);
  const dupRouteIds = [...new Set(allRouteIds.filter((id, idx) => allRouteIds.indexOf(id) !== idx))];
  if (dupRouteIds.length) errors.push(`Duplicate route/lane id(s): ${dupRouteIds.join(', ')} — route and lane ids share one namespace and must be globally unique within the workflow`);
  // F7: from_delegated rules — mirror the engine's ruleFromDelegatedValid (E-4).
  w.steps.forEach((s, i) => {
    (s.outputs || []).forEach(out => {
      if (!out.from_delegated) return;
      if (!s.delegate_to) {
        errors.push(`Step ${i + 1} "${s.name}": output "${out.path}" declares from_delegated but the step has no delegate_to — the handoff source resolves in the DELEGATED child's run dir`);
      }
      if (/[*?[]/.test(out.path || '')) {
        errors.push(`Step ${i + 1} "${s.name}": output "${out.path}" with from_delegated must be a CONCRETE destination (no globs) — put the dynamic part in from_delegated instead`);
      }
    });
  });
  return errors;
}

// ── YAML Generator ─────────────────────────────────────
function yamlStr(s) {
  if (s == null || s === '') return "''";
  s = String(s);
  if (s === 'true' || s === 'false' || s === 'null' || /^\d+$/.test(s)) return `"${s}"`;
  if (/[:{}\[\],&*?|>!%#@`"'\n]/.test(s) || s.startsWith(' ') || s.endsWith(' ')) {
    return `"${s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`;
  }
  return s;
}

function yamlBlock(s, indent) {
  const pad = ' '.repeat(indent);
  const lines = String(s).split('\n');
  return '>\n' + lines.map(l => pad + l).join('\n');
}

function jsonToYaml(obj, indent) {
  const pad = ' '.repeat(indent);
  let out = '';
  if (Array.isArray(obj)) {
    obj.forEach(item => {
      if (typeof item === 'object' && item !== null) {
        out += pad + '- ';
        const entries = Object.entries(item);
        entries.forEach(([k, v], idx) => {
          const prefix = idx === 0 ? '' : pad + '  ';
          if (typeof v === 'object' && v !== null) {
            out += prefix + k + ':\n' + jsonToYaml(v, indent + 4);
          } else {
            out += prefix + k + ': ' + JSON.stringify(v) + '\n';
          }
        });
      } else {
        out += pad + '- ' + JSON.stringify(item) + '\n';
      }
    });
  } else if (typeof obj === 'object' && obj !== null) {
    Object.entries(obj).forEach(([k, v]) => {
      if (typeof v === 'object' && v !== null) {
        out += pad + k + ':\n' + jsonToYaml(v, indent + 2);
      } else {
        out += pad + k + ': ' + JSON.stringify(v) + '\n';
      }
    });
  }
  return out;
}

function generateWorkflowYAML(w) {
  let y = '';
  y += `name: ${yamlStr(w.name)}\n`;
  y += `version: ${w.version}\n`;
  if (w.description.includes('\n')) {
    y += `description: ${yamlBlock(w.description, 2)}\n`;
  } else {
    y += `description: ${yamlStr(w.description)}\n`;
  }
  // Empty = the key is DELETED (minimal YAML): the run override / env /
  // config chain applies instead.
  if (w.inbox_webhook && w.inbox_webhook.trim()) {
    y += `inbox_webhook: ${yamlStr(w.inbox_webhook.trim())}\n`;
  }
  y += '\n';

  // params
  if (w.params.length > 0) {
    y += 'params:\n';
    w.params.forEach(p => {
      y += `  - name: ${yamlStr(p.name)}\n`;
      y += `    description: ${yamlStr(p.description)}\n`;
      if (p.required) y += `    required: true\n`;
      if (p.default && !p.required) y += `    default: ${yamlStr(p.default)}\n`;
    });
    y += '\n';
  }

  // tools
  if (w.tools.length > 0) {
    y += 'tools:\n';
    w.tools.forEach(t => {
      y += `  - name: ${yamlStr(t.name)}\n`;
      y += `    type: ${t.type}\n`;
      if (t.type === 'script') {
        y += `    command: ${yamlStr(t.command)}\n`;
        y += `    description: ${yamlStr(t.description)}\n`;
        if (t.input_schema) {
          try {
            const schema = JSON.parse(t.input_schema);
            y += '    input_schema:\n';
            y += jsonToYaml(schema, 6);
          } catch(e) {}
        }
      } else if (t.type === 'mcp') {
        y += `    required: ${t.required}\n`;
        // Phase 38: expected_tools for per-step subagent whitelist generation
        if (t.expected_tools && t.expected_tools.trim()) {
          const items = t.expected_tools.split(',').map(s => s.trim()).filter(Boolean);
          if (items.length > 0) {
            y += '    expected_tools:\n';
            items.forEach(item => {
              y += `      - ${yamlStr(item)}\n`;
            });
          }
        }
        if (t.server_config) {
          try {
            const cfg = JSON.parse(t.server_config);
            y += '    server_config:\n';
            y += jsonToYaml(cfg, 6);
          } catch(e) {}
        }
      }
    });
    y += '\n';
  }

  // gate
  y += 'gate:\n';
  y += `  structural: ${w.gate.structural}\n`;
  y += `  semantic: ${w.gate.semantic}\n`;
  y += `  human: ${humanGateYaml(w.gate.human)}\n`;
  if (w.gate.human && w.gate.human_channel && w.gate.human_channel !== 'terminal') {
    y += `  human_channel: ${w.gate.human_channel}\n`;
  }
  y += `  max_gate_retries: ${w.gate.max_gate_retries}\n`;
  y += `  max_step_retries: ${w.gate.max_step_retries}\n`;
  if (w.gate.allow_partial_step_complete) {
    y += `  allow_partial_step_complete: true\n`;
  }
  y += '\n';

  // context
  if (w.context.carry_forward !== 'none') {
    y += 'context:\n';
    y += `  carry_forward: ${w.context.carry_forward}\n`;
    y += '\n';
  }

  // steps
  y += 'steps:\n';
  w.steps.forEach(s => {
    y += `  - name: ${yamlStr(s.name)}\n`;
    y += `    spec_check: ${s.spec_check}\n`;
    // spec_authoring: emit ONLY when set — '' means absent (schema enum has no off value)
    if (s.spec_authoring === 'persist' || s.spec_authoring === 'validate') {
      y += `    spec_authoring: ${s.spec_authoring}\n`;
    }
    y += `    subagent: ${s.subagent}\n`;

    if (s.goal) {
      if (s.goal.includes('\n')) {
        y += `    goal: ${yamlBlock(s.goal, 6)}\n`;
      } else {
        y += `    goal: ${yamlStr(s.goal)}\n`;
      }
    }

    if (s.model) {
      y += `    model: ${yamlStr(s.model)}\n`;
    }

    // Only when something is named. An empty list and an absent key mean the
    // same thing, so the shorter one is written.
    {
      const toolList = String(s.tools || '').split(',').map(t => t.trim()).filter(Boolean);
      if (toolList.length) y += `    tools: [${toolList.join(', ')}]\n`;
    }

    // deny — same emission rule as tools: absent and [] are the same statement
    // (full native surface), so only a non-empty deny reaches the YAML. The
    // hand-built serializer is exactly where a field silently vanishes on
    // round-trip (the tools: [] lesson) — this line IS the round-trip.
    if (Array.isArray(s.deny) && s.deny.length > 0) {
      y += `    deny: [${s.deny.join(', ')}]\n`;
    }

    if (s.carry_forward != null) {
      y += `    carry_forward: ${s.carry_forward}\n`;
    }

    if (s.parallel) {
      y += `    parallel: true\n`;
      if (s.parallel_key) y += `    parallel_key: ${yamlStr(s.parallel_key)}\n`;
      if (s.parallel_spawn_delay_ms != null && s.parallel_spawn_delay_ms > 0) {
        y += `    parallel_spawn_delay_ms: ${s.parallel_spawn_delay_ms}\n`;
      }
      // branch_profiles — emitted only when present and non-empty (the other
      // half of the round-trip). Flow style per profile matches the docs.
      if (s.branch_profiles && Object.keys(s.branch_profiles).length) {
        y += `    branch_profiles:\n`;
        for (const [pid, p] of Object.entries(s.branch_profiles)) {
          const parts = [];
          if (Array.isArray(p.tools) && p.tools.length) parts.push(`tools: [${p.tools.join(', ')}]`);
          if (p.struct) parts.push(`struct: ${p.struct}`);
          y += `      ${pid}: ${parts.length ? `{ ${parts.join(', ')} }` : '{}'}\n`;
        }
      }
    }

    // Phase 61: planning-step type + restrictions. Restrictions are emitted
    // only when they differ from engine defaults (max_substeps=7,
    // max_plan_attempts=3, allow_parallel=false, allow_delegation=false) —
    // matches Python YAML "omit when default" idiom + keeps YAML clean.
    if (s.type === 'planning') {
      y += `    type: planning\n`;
      if (s.max_plan_attempts != null && s.max_plan_attempts !== 3) {
        y += `    max_plan_attempts: ${s.max_plan_attempts}\n`;
      }
      if (s.max_substeps != null && s.max_substeps !== 7) {
        y += `    max_substeps: ${s.max_substeps}\n`;
      }
      if (s.allow_parallel === true) y += `    allow_parallel: true\n`;
      if (s.allow_delegation === true) y += `    allow_delegation: true\n`;
    }

    if (s.delegate_to) {
      y += `    delegate_to: ${yamlStr(s.delegate_to)}\n`;
      if (s.delegate_params && Object.keys(s.delegate_params).length > 0) {
        y += `    params:\n`;
        Object.entries(s.delegate_params).forEach(([k, v]) => {
          y += `      ${k}: ${yamlStr(v)}\n`;
        });
      }
    }

    if (s.inputs && s.inputs.length > 0) {
      y += '    inputs:\n';
      s.inputs.forEach(inp => {
        y += `      - path: ${yamlStr(inp.path)}\n`;
        y += `        inject: ${inp.inject}\n`;
        if (inp.struct) y += `        struct: ${yamlStr(inp.struct)}\n`;
      });
    }

    if (s.outputs && s.outputs.length > 0) {
      y += '    outputs:\n';
      s.outputs.forEach(out => {
        y += `      - path: ${yamlStr(out.path)}\n`;
        if (out.struct) y += `        struct: ${yamlStr(out.struct)}\n`;
        if (out.write_proof) y += `        write_proof: ${yamlStr(out.write_proof)}\n`;
        if (out.optional === true) y += `        optional: true\n`;
        if (out.per_iteration === true) y += `        per_iteration: true\n`;
        if (out.from_delegated) y += `        from_delegated: ${yamlStr(out.from_delegated)}\n`;
      });
    }

    if (s.param_bindings && Object.keys(s.param_bindings).length > 0) {
      y += '    param_bindings:\n';
      Object.entries(s.param_bindings).forEach(([k, v]) => {
        y += `      ${k}: ${yamlStr(v)}\n`;
      });
    }

    if (s.gate) {
      const g = s.gate;
      const parts = [];
      if (g.structural != null) parts.push(`structural: ${g.structural}`);
      if (g.semantic != null) parts.push(`semantic: ${g.semantic}`);
      if (g.human != null) parts.push(`human: ${humanGateYaml(g.human)}`);
      if (g.human_channel != null && g.human_channel !== '') parts.push(`human_channel: ${g.human_channel}`);
      if (g.max_step_retries != null) parts.push(`max_step_retries: ${g.max_step_retries}`);
      if (g.max_gate_retries != null) parts.push(`max_gate_retries: ${g.max_gate_retries}`);
      if (g.allow_partial_step_complete != null) parts.push(`allow_partial_step_complete: ${g.allow_partial_step_complete}`);
      if (parts.length > 0) {
        y += '    gate:\n';
        parts.forEach(p => { y += `      ${p}\n`; });
      }
    }

    // Phase B: loop_back — emitted only with a target; `when` keys are
    // emitted only when set (empty string / false = absent).
    if (s.loop_back && s.loop_back.to) {
      const lb = s.loop_back;
      y += '    loop_back:\n';
      y += `      to: ${yamlStr(lb.to)}\n`;
      y += `      max_iterations: ${lb.max_iterations}\n`;
      y += '      when:\n';
      if (lb.when.script) y += `        script: ${yamlStr(lb.when.script)}\n`;
      if (lb.when.semantic) y += `        semantic: ${yamlStr(lb.when.semantic)}\n`;
      if (lb.when.human) y += `        human: true\n`;
      if (lb.when.human && lb.when.human_channel && lb.when.human_channel !== 'terminal') {
        y += `        human_channel: ${lb.when.human_channel}\n`;
      }
    }

    // Phase R: routes block. The `when` keys mirror loop_back; each route's
    // steps are emitted via the generic YAML emitter so ANY field on a route
    // step (outputs, nested routes, loop_back, …) round-trips, not just the
    // name/goal the UI edits.
    if (s.routes && Array.isArray(s.routes.define) && s.routes.define.length > 0) {
      const r = s.routes;
      y += '    routes:\n';
      y += '      when:\n';
      if (r.when.script) y += `        script: ${yamlStr(r.when.script)}\n`;
      if (r.when.semantic) y += `        semantic: ${yamlStr(r.when.semantic)}\n`;
      if (r.when.human) y += `        human: true\n`;
      if (r.when.human && r.when.human_channel && r.when.human_channel !== 'terminal') {
        y += `        human_channel: ${r.when.human_channel}\n`;
      }
      y += '      define:\n';
      r.define.forEach(route => {
        y += `        - id: ${yamlStr(route.id)}\n`;
        y += '          steps:\n';
        (route.steps || []).forEach(st => { y += emitYamlNode([st], 12); });
      });
    }

    // Lanes block (parallel execution lanes). Each lane's steps go through
    // the generic recursive emitter so arbitrary nested structure survives
    // a round-trip (the routes contract). join.require 'all' is the default
    // and is still emitted explicitly when a join block was present.
    if (s.lanes && Array.isArray(s.lanes.define) && s.lanes.define.length > 0) {
      const L = s.lanes;
      y += '    lanes:\n';
      y += '      define:\n';
      L.define.forEach(lane => {
        y += `        - id: ${yamlStr(lane.id)}\n`;
        y += '          steps:\n';
        (lane.steps || []).forEach(st => { y += emitYamlNode([st], 12); });
      });
      const req = (L.join && L.join.require === 'any') ? 'any' : 'all';
      y += '      join:\n';
      y += `        require: ${req}\n`;
    }

    // Unknown step keys carried by the _extra bucket — re-emitted verbatim so
    // a round-trip through this editor never destroys a field it predates.
    if (s._extra && typeof s._extra === 'object' && Object.keys(s._extra).length > 0) {
      y += emitYamlNode(s._extra, 4);
    }
  });

  // Unknown WORKFLOW keys (the top-level _extra bucket).
  if (w._extra && typeof w._extra === 'object' && Object.keys(w._extra).length > 0) {
    y += '\n' + emitYamlNode(w._extra, 0);
  }

  return y;
}

// Generic recursive YAML emitter — used for route steps so arbitrary nested
// structure survives a round-trip. Scalars go through yamlStr (strings) or
// String() (numbers/booleans). Empty arrays/undefined are skipped.
function yamlScalar(v) { return typeof v === 'string' ? yamlStr(v) : String(v); }
function emitYamlNode(val, indent) {
  const pad = ' '.repeat(indent);
  if (Array.isArray(val)) {
    let out = '';
    val.forEach(item => {
      if (item !== null && typeof item === 'object' && !Array.isArray(item)) {
        const entries = Object.entries(item).filter(([, v]) => v !== undefined);
        if (entries.length === 0) { out += `${pad}- {}\n`; return; }
        entries.forEach(([k, v], idx) => {
          const prefix = idx === 0 ? `${pad}- ` : `${pad}  `;
          if (v !== null && typeof v === 'object' && !(Array.isArray(v) && v.length === 0)) {
            out += `${prefix}${k}:\n` + emitYamlNode(v, indent + 4);
          } else if (!(Array.isArray(v) && v.length === 0)) {
            out += `${prefix}${k}: ${yamlScalar(v)}\n`;
          }
        });
      } else {
        out += `${pad}- ${yamlScalar(item)}\n`;
      }
    });
    return out;
  }
  if (val !== null && typeof val === 'object') {
    let out = '';
    Object.entries(val).forEach(([k, v]) => {
      if (v === undefined) return;
      if (Array.isArray(v) && v.length === 0) return;
      if (v !== null && typeof v === 'object') {
        out += `${pad}${k}:\n` + emitYamlNode(v, indent + 2);
      } else {
        out += `${pad}${k}: ${yamlScalar(v)}\n`;
      }
    });
    return out;
  }
  return `${pad}${yamlScalar(val)}\n`;
}

function generateStructYAML(s) {
  let y = '';
  y += `name: ${yamlStr(s.name)}\n`;
  y += `description: ${yamlStr(s.description)}\n`;
  y += `format: ${s.format}\n`;

  // json_schema / yaml_schema
  const schemaKey = s.format === 'yaml' ? 'yaml_schema' : 'json_schema';
  if ((s.format === 'json' || s.format === 'yaml') && s.required_fields && s.required_fields.length > 0) {
    y += `${schemaKey}:\n`;
    y += `  required_fields:\n`;
    s.required_fields.forEach(f => {
      y += `    - field: ${yamlStr(f.field)}\n`;
      y += `      type: ${f.type}\n`;
      if (f.pattern) y += `      pattern: ${yamlStr(f.pattern)}\n`;
      if (f.enum_values) y += `      enum: [${f.enum_values.split(',').map(v => yamlStr(v.trim())).join(', ')}]\n`;
      if (f.min_items != null && f.min_items !== '') y += `      min_items: ${f.min_items}\n`;
    });
  }

  // frontmatter
  if (s.format === 'markdown') {
    if (s.frontmatter && s.frontmatter.length > 0) {
      y += 'frontmatter:\n';
      y += '  required:\n';
      s.frontmatter.forEach(f => {
        y += `    - field: ${yamlStr(f.field)}\n`;
        y += `      type: ${f.type}\n`;
        if (f.pattern) y += `      pattern: ${yamlStr(f.pattern)}\n`;
        if (f.values) y += `      values: [${f.values.split(',').map(v => yamlStr(v.trim())).join(', ')}]\n`;
      });
    }
    if (s.required_sections && s.required_sections.length > 0) {
      y += 'required_sections:\n';
      s.required_sections.forEach(sec => {
        y += `  - ${yamlStr(sec)}\n`;
      });
    }
  }

  // file_checks
  if (s.file_checks) {
    const fc = s.file_checks;
    const parts = [];
    if (fc.exists === false) parts.push('exists: false');
    if (fc.min_size) parts.push(`min_size: ${fc.min_size}`);
    if (fc.max_size) parts.push(`max_size: ${fc.max_size}`);
    if (fc.name_pattern) parts.push(`name_pattern: ${yamlStr(fc.name_pattern)}`);
    if (parts.length > 0) {
      y += 'file_checks:\n';
      parts.forEach(p => { y += `  ${p}\n`; });
    }
  }

  return y;
}

// ── YAML Parser (minimal, for our subset) ──────────────
function parseYAML(text) {
  // Recursive indentation-based parser for the YAML subset workflow.yaml uses:
  // block maps/lists (ARBITRARY nesting), block scalars (>, |), and inline flow
  // ([...], {...}). Replaces the older depth-limited parser so deeply nested
  // structures like `routes` (define[].steps[].routes…) load correctly.
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

  const indentOf = (s) => { const m = s.match(/^( *)/); return m ? m[1].length : 0; };
  const isBlank = (s) => { const t = s.trim(); return t === '' || t.startsWith('#'); };
  const unquote = (k) => ((k[0] === '"' && k.endsWith('"')) || (k[0] === "'" && k.endsWith("'"))) ? k.slice(1, -1) : k;
  const KV = /^("[^"]*"|'[^']*'|[\w.\-]+)\s*:\s*(.*)$/;

  // Strip a trailing inline comment (a # preceded by whitespace, or a whole-line
  // comment), respecting quotes; flow values ([...]/{...}) are left intact.
  function stripComment(v) {
    v = v.trim();
    if (v === '' || v.startsWith('#')) return '';
    if (v[0] === '"' || v[0] === "'") {
      const q = v[0]; let p = 1;
      while (p < v.length) { if (v[p] === '\\') { p += 2; continue; } if (v[p] === q) { p++; break; } p++; }
      return v.slice(0, p).trim();
    }
    if (v[0] === '[' || v[0] === '{') return v;
    const m = v.match(/\s#/);
    return m ? v.slice(0, m.index).trim() : v;
  }

  function parseScalar(raw) {
    raw = raw.trim();
    if (raw === '' || raw === 'null' || raw === '~') return null;
    if (raw === 'true') return true;
    if (raw === 'false') return false;
    if (/^-?\d+$/.test(raw)) return parseInt(raw, 10);
    if (/^-?\d+\.\d+$/.test(raw)) return parseFloat(raw);
    if ((raw[0] === '"' && raw.endsWith('"')) || (raw[0] === "'" && raw.endsWith("'")))
      return raw.slice(1, -1).replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    if (raw[0] === '[' || raw[0] === '{') { try { return parseFlow(raw); } catch (e) { return raw; } }
    return raw;
  }

  // Minimal flow ([...], {...}) parser with nesting + quotes.
  function parseFlow(s) {
    let p = 0;
    const ws = () => { while (p < s.length && /\s/.test(s[p])) p++; };
    const readQuoted = () => { const q = s[p++]; let out = ''; while (p < s.length && s[p] !== q) { if (s[p] === '\\') { p++; out += s[p] === 'n' ? '\n' : s[p]; } else out += s[p]; p++; } p++; return out; };
    function value() {
      ws();
      const c = s[p];
      if (c === '[') { p++; const a = []; ws(); if (s[p] === ']') { p++; return a; } for (;;) { a.push(value()); ws(); if (s[p] === ',') { p++; continue; } break; } ws(); if (s[p] === ']') p++; return a; }
      if (c === '{') { p++; const o = {}; ws(); if (s[p] === '}') { p++; return o; } for (;;) { ws(); let k; if (s[p] === '"' || s[p] === "'") k = readQuoted(); else { const st = p; while (p < s.length && s[p] !== ':' && s[p] !== ',' && s[p] !== '}') p++; k = s.slice(st, p).trim(); } ws(); if (s[p] === ':') p++; o[k] = value(); ws(); if (s[p] === ',') { p++; continue; } break; } ws(); if (s[p] === '}') p++; return o; }
      if (c === '"' || c === "'") return readQuoted();
      const st = p; while (p < s.length && s[p] !== ',' && s[p] !== ']' && s[p] !== '}') p++; return parseScalar(s.slice(st, p).trim());
    }
    return value();
  }

  // A block-scalar header is `>` or `|` with an optional chomp indicator (+/-).
  const isBlockHeader = (v) => /^[|>][+-]?$/.test(v);

  // Block scalar (>, |): capture lines more-indented than parentIndent, de-indent
  // by their min indent. `header` is the full token (e.g. ">", "|", ">-", "|+").
  // `>` folds per YAML rules (single break→space; more-indented lines and blank
  // lines preserve breaks); `|` keeps every break literally. Chomp: clip (default)
  // keeps one trailing newline, strip (-) keeps none, keep (+) keeps all.
  function blockScalar(i, parentIndent, header) {
    const folded = header[0] === '>';
    const chomp = header.length > 1 ? header[1] : ''; // '', '-', '+'
    const out = [];
    while (i < src.length) {
      if (src[i].trim() === '') { out.push(''); i++; continue; }
      if (indentOf(src[i]) <= parentIndent) break;
      out.push(src[i]); i++;
    }
    // Count then drop trailing blank lines (re-added per chomp indicator below).
    let trailingBlanks = 0;
    while (out.length && out[out.length - 1] === '') { out.pop(); trailingBlanks++; }
    const nonEmpty = out.filter((l) => l.trim() !== '');
    const base = nonEmpty.length ? Math.min(...nonEmpty.map(indentOf)) : 0;
    const dedented = out.map((l) => (l.trim() === '' ? '' : l.slice(base)));

    let body;
    if (!folded) {
      body = dedented.join('\n');
    } else {
      body = '';
      let started = false, pendingBlanks = 0, prevMoreIndented = false;
      for (const ln of dedented) {
        if (ln === '') { pendingBlanks++; continue; }
        const moreIndented = /^\s/.test(ln);
        if (!started) { body = ln; started = true; }
        else if (pendingBlanks > 0) {
          // Trailing break of prev folds into the blanks, except when prev or
          // current line is more-indented (then that break stays literal too).
          body += '\n'.repeat(pendingBlanks + ((prevMoreIndented || moreIndented) ? 1 : 0));
          body += ln;
        } else {
          body += (prevMoreIndented || moreIndented) ? '\n' : ' ';
          body += ln;
        }
        prevMoreIndented = moreIndented;
        pendingBlanks = 0;
      }
    }

    let textOut;
    if (chomp === '-') textOut = body;
    else if (chomp === '+') textOut = body + '\n'.repeat(trailingBlanks + (body ? 1 : 0));
    else textOut = body + (body ? '\n' : ''); // clip: exactly one trailing newline
    return [textOut, i];
  }

  // Parse a block (map or list) whose lines sit at exactly `indent`.
  function parseBlock(i, indent) {
    while (i < src.length && isBlank(src[i])) i++;
    if (i >= src.length || indentOf(src[i]) !== indent) return [null, i];
    const t = src[i].trim();
    return (t.startsWith('- ') || t === '-') ? parseList(i, indent) : parseMap(i, indent);
  }

  // For a `key:` with empty value at parentIndent: parse the deeper block (if any).
  function nestedAfter(i, parentIndent) {
    let k = i; while (k < src.length && isBlank(src[k])) k++;
    if (k < src.length && indentOf(src[k]) > parentIndent) return parseBlock(k, indentOf(src[k]));
    return [null, k];
  }

  function parseMap(i, indent) {
    const obj = {};
    while (i < src.length) {
      if (isBlank(src[i])) { i++; continue; }
      const ci = indentOf(src[i]);
      if (ci !== indent) break;
      const t = src[i].trim();
      if (t.startsWith('- ') || t === '-') break;
      const m = t.match(KV);
      if (!m) { i++; continue; }
      const key = unquote(m[1]);
      const v = stripComment(m[2]);
      if (isBlockHeader(v)) { const [txt, nj] = blockScalar(i + 1, indent, v); obj[key] = txt; i = nj; }
      else if (v === '') { const [child, nj] = nestedAfter(i + 1, indent); obj[key] = child; i = nj; }
      else { obj[key] = parseScalar(v); i++; }
    }
    return [obj, i];
  }

  function parseList(i, indent) {
    const arr = [];
    while (i < src.length) {
      if (isBlank(src[i])) { i++; continue; }
      const ci = indentOf(src[i]);
      if (ci !== indent) break;
      const t = src[i].trim();
      if (!(t.startsWith('- ') || t === '-')) break;
      const rest = t === '-' ? '' : t.slice(2);
      if (rest === '') { const [child, nj] = nestedAfter(i + 1, indent); arr.push(child); i = nj; continue; }
      const km = rest.match(KV);
      if (!km) { arr.push(parseScalar(rest)); i++; continue; }
      const itemIndent = ci + 2; // keys of this item align at the column after "- "
      const obj = {};
      const key0 = unquote(km[1]);
      const v0 = stripComment(km[2]);
      if (isBlockHeader(v0)) { const [txt, nj] = blockScalar(i + 1, ci + 1, v0); obj[key0] = txt; i = nj; }
      else if (v0 === '') { const [child, nj] = nestedAfter(i + 1, itemIndent - 1); obj[key0] = child; i = nj; }
      else { obj[key0] = parseScalar(v0); i++; }
      while (i < src.length) {
        if (isBlank(src[i])) { i++; continue; }
        const ki = indentOf(src[i]); const kt = src[i].trim();
        if (ki < itemIndent) break;
        if (ki > itemIndent) { i++; continue; }
        if (kt.startsWith('- ') || kt === '-') break;
        const m2 = kt.match(KV); if (!m2) { i++; continue; }
        const k2 = unquote(m2[1]); const v2 = stripComment(m2[2]);
        if (isBlockHeader(v2)) { const [txt, nj] = blockScalar(i + 1, ki, v2); obj[k2] = txt; i = nj; }
        else if (v2 === '') { const [child, nj] = nestedAfter(i + 1, ki); obj[k2] = child; i = nj; }
        else { obj[k2] = parseScalar(v2); i++; }
      }
      arr.push(obj);
    }
    return [arr, i];
  }

  const [val] = parseBlock(0, 0);
  return (val && typeof val === 'object') ? val : {};
}


function autoDetectStructs() {
  // Scan workflow steps for struct references and create stubs for missing ones
  const existing = new Set(state.structs.map(s => s.name));
  const refs = new Set();
  state.workflow.steps.forEach(s => {
    (s.inputs || []).forEach(inp => { if (inp.struct) refs.add(inp.struct); });
    (s.outputs || []).forEach(out => { if (out.struct) refs.add(out.struct); });
  });
  refs.forEach(name => {
    if (!existing.has(name)) {
      state.structs.push({
        name,
        description: '(auto-detected from workflow)',
        format: 'json',
        required_fields: [],
        frontmatter: [],
        required_sections: [],
        file_checks: { exists: true }
      });
    }
  });
}

function loadWorkflowFromParsed(obj) {
  const w = state.workflow;
  w.name = obj.name || '';
  w.version = obj.version || 1;
  w.description = obj.description || '';
  w.inbox_webhook = typeof obj.inbox_webhook === 'string' ? obj.inbox_webhook : '';

  // _extra bucket — the OTHER half of every "whitelisting loader kills a
  // field" wound (the tools: [] lesson, twice re-learned): any top-level key
  // this editor does not model is carried verbatim and re-emitted on save,
  // so an editor build that predates a format feature (acknowledge_warnings,
  // workflow parallel_spawn_delay_ms, lanes, ...) can no longer destroy it.
  const WF_KNOWN_KEYS = ['name', 'version', 'description', 'inbox_webhook',
    'params', 'tools', 'gate', 'context', 'steps'];
  w._extra = {};
  Object.keys(obj).forEach(k => {
    if (!WF_KNOWN_KEYS.includes(k)) w._extra[k] = obj[k];
  });

  // params
  w.params = [];
  if (Array.isArray(obj.params)) {
    obj.params.forEach(p => {
      w.params.push({
        name: p.name || '',
        description: p.description || '',
        required: p.required === true,
        default: p.default || ''
      });
    });
  }

  // tools
  w.tools = [];
  if (Array.isArray(obj.tools)) {
    obj.tools.forEach(t => {
      w.tools.push({
        name: t.name || '',
        type: t.type || 'script',
        command: t.command || '',
        description: t.description || '',
        required: t.required !== false,
        input_schema: t.input_schema ? JSON.stringify(t.input_schema, null, 2) : '',
        // Phase 38: explicit list of tool names from external MCP servers,
        // used by `riglane init-workflow` to populate the per-step subagent
        // whitelist. Stored as comma-separated string for the UI textarea.
        expected_tools: Array.isArray(t.expected_tools) ? t.expected_tools.join(', ') : '',
        server_config: t.server_config ? JSON.stringify(t.server_config, null, 2) : '',
      });
    });
  }

  // gate
  if (obj.gate) {
    w.gate.structural = obj.gate.structural !== false;
    w.gate.semantic = obj.gate.semantic === true;
    w.gate.human = isCondHuman(obj.gate.human) ? { script: obj.gate.human.script } : obj.gate.human === true;
    w.gate.human_channel = typeof obj.gate.human_channel === 'string' ? obj.gate.human_channel : null;
    w.gate.max_step_retries = obj.gate.max_step_retries || 3;
    w.gate.max_gate_retries = obj.gate.max_gate_retries || 5;
    w.gate.allow_partial_step_complete = obj.gate.allow_partial_step_complete === true;
  }

  // context
  if (obj.context) {
    w.context.carry_forward = obj.context.carry_forward || 'none';
  }

  // steps
  w.steps = [];
  if (Array.isArray(obj.steps)) {
    obj.steps.forEach(s => {
      const step = {
        name: s.name || '',
        goal: s.goal || '',
        subagent: s.subagent !== false,
        spec_check: s.spec_check === true, // D3: absent = false (opt-in)
        spec_authoring:
          s.spec_authoring === 'persist' || s.spec_authoring === 'validate' ? s.spec_authoring : '',
        model: s.model || '',
        // A step calls the tools it NAMES and no others. An absent key and an
        // empty list are the same statement — both are "none" — so
        // one representation covers both.
        tools: Array.isArray(s.tools) ? s.tools.join(', ') : '',
        // Author-denied native capabilities (deny: [shell]) — absent and []
        // are the same statement (full native surface). Kept as an array;
        // the serializer emits it only when non-empty. This line is half of
        // the round-trip: a whitelisting loader is exactly where a field
        // silently dies (the tools: [] lesson).
        deny: Array.isArray(s.deny) ? s.deny.filter(d => typeof d === 'string') : [],
        carry_forward: s.carry_forward != null ? s.carry_forward : null,
        parallel: s.parallel === true,
        parallel_key: s.parallel_key || '',
        parallel_spawn_delay_ms: typeof s.parallel_spawn_delay_ms === 'number' ? s.parallel_spawn_delay_ms : null,
        // Branch profiles (static per-branch rights on a parallel step) —
        // an object map kept in {tools:[], struct:''} shape; null = absent.
        // Half of the round-trip: a whitelisting loader is exactly where a
        // field silently dies (the tools: [] lesson).
        branch_profiles: (s.branch_profiles && typeof s.branch_profiles === 'object' && !Array.isArray(s.branch_profiles))
          ? Object.fromEntries(Object.entries(s.branch_profiles).map(([pid, p]) => [pid, {
              tools: (p && Array.isArray(p.tools)) ? p.tools.filter(t => typeof t === 'string') : [],
              struct: (p && typeof p.struct === 'string') ? p.struct : '',
            }]))
          : null,
        delegate_to: s.delegate_to || '',
        delegate_params: {},
        param_bindings: {},
        // Phase 61: planning step type + restrictions. `type` is '' (regular)
        // or 'planning' (dynamic mini-workflow). Restrictions are present
        // in YAML only when planning; nullable in state so we can preserve
        // explicit defaults vs absent fields.
        type: s.type === 'planning' ? 'planning' : '',
        max_plan_attempts: typeof s.max_plan_attempts === 'number' ? s.max_plan_attempts : null,
        max_substeps: typeof s.max_substeps === 'number' ? s.max_substeps : null,
        allow_parallel: s.allow_parallel === true,
        allow_delegation: s.allow_delegation === true,
        inputs: [],
        outputs: [],
        gate: null,
        // Phase B: loop_back block (engine-evaluated repetition). null when
        // absent; `when` keys are always materialized as strings/bool so the
        // UI can bind inputs directly.
        loop_back: (s.loop_back && typeof s.loop_back === 'object') ? {
          to: s.loop_back.to || '',
          max_iterations: typeof s.loop_back.max_iterations === 'number' ? s.loop_back.max_iterations : 10,
          when: {
            script: (s.loop_back.when && s.loop_back.when.script) || '',
            semantic: (s.loop_back.when && s.loop_back.when.semantic) || '',
            human: !!(s.loop_back.when && s.loop_back.when.human),
            human_channel: (s.loop_back.when && typeof s.loop_back.when.human_channel === 'string')
              ? s.loop_back.when.human_channel : undefined
          }
        } : null,
        // Phase R: routes block (conditional forward branching). `when` keys are
        // materialized for direct binding; each route's `steps` are kept as raw
        // objects so advanced fields (outputs, nested routes, …) survive a
        // round-trip even though the UI edits only name/goal/subagent.
        routes: (s.routes && typeof s.routes === 'object' && Array.isArray(s.routes.define)) ? {
          when: {
            script: (s.routes.when && s.routes.when.script) || '',
            semantic: (s.routes.when && s.routes.when.semantic) || '',
            human: !!(s.routes.when && s.routes.when.human),
            human_channel: (s.routes.when && typeof s.routes.when.human_channel === 'string')
              ? s.routes.when.human_channel : undefined
          },
          define: s.routes.define.map(r => ({
            id: (r && r.id) || '',
            steps: (r && Array.isArray(r.steps)) ? r.steps.map(st => ({ ...st })) : []
          }))
        } : null,
        // Lanes block (parallel execution lanes + join barrier). Same
        // round-trip contract as routes: each lane's steps are raw objects so
        // advanced fields survive even though the UI edits only name/goal.
        lanes: (s.lanes && typeof s.lanes === 'object' && Array.isArray(s.lanes.define)) ? {
          define: s.lanes.define.map(l => ({
            id: (l && l.id) || '',
            steps: (l && Array.isArray(l.steps)) ? l.steps.map(st => ({ ...st })) : []
          })),
          join: {
            require: (s.lanes.join && s.lanes.join.require === 'any') ? 'any' : 'all'
          }
        } : null,
        // Per-step _extra bucket — same contract as the workflow-level one:
        // unknown step keys survive load -> save verbatim (via emitYamlNode).
        _extra: {}
      };
      const STEP_KNOWN_KEYS = ['name', 'goal', 'subagent', 'spec_check',
        'spec_authoring', 'model', 'tools', 'deny', 'carry_forward',
        'parallel', 'parallel_key', 'parallel_spawn_delay_ms',
        'branch_profiles', 'delegate_to', 'params', 'param_bindings', 'type',
        'max_plan_attempts', 'max_substeps', 'allow_parallel',
        'allow_delegation', 'inputs', 'outputs', 'gate', 'loop_back', 'routes',
        'lanes'];
      Object.keys(s).forEach(k => {
        if (!STEP_KNOWN_KEYS.includes(k)) step._extra[k] = s[k];
      });

      if (s.params && typeof s.params === 'object' && !Array.isArray(s.params)) {
        step.delegate_params = { ...s.params };
      }

      if (s.param_bindings && typeof s.param_bindings === 'object') {
        step.param_bindings = { ...s.param_bindings };
      }

      if (Array.isArray(s.inputs)) {
        s.inputs.forEach(inp => {
          step.inputs.push({
            path: inp.path || '',
            inject: inp.inject || 'file',
            struct: inp.struct || ''
          });
        });
      }

      if (Array.isArray(s.outputs)) {
        s.outputs.forEach(out => {
          step.outputs.push({
            path: out.path || '',
            struct: out.struct || '',
            per_iteration: out.per_iteration === true,
            // Round-trip ALL schema fields — anything the model
            // does not materialize is silently lost on save.
            write_proof: out.write_proof || '',
            optional: out.optional === true,
            from_delegated: out.from_delegated || ''
          });
        });
      }

      if (s.gate) {
        step.gate = {};
        if (s.gate.structural != null) step.gate.structural = s.gate.structural;
        if (s.gate.semantic != null) step.gate.semantic = s.gate.semantic;
        if (s.gate.human != null) step.gate.human = s.gate.human;
        if (typeof s.gate.human_channel === 'string') step.gate.human_channel = s.gate.human_channel;
        if (s.gate.max_step_retries != null) step.gate.max_step_retries = s.gate.max_step_retries;
        if (s.gate.max_gate_retries != null) step.gate.max_gate_retries = s.gate.max_gate_retries;
        if (s.gate.allow_partial_step_complete != null) step.gate.allow_partial_step_complete = s.gate.allow_partial_step_complete;
      }

      w.steps.push(step);
    });
  }
}

/**
 * Every SEQUENCE of a workflow: the main steps list, plus each route's own
 * steps list (recursively). This is the unit the engine validates loop_back
 * against — a loop lives inside one sequence and may target only a step in it.
 */
function loopSequences(w) {
  const out = [];
  const visit = (steps, label) => {
    out.push({ steps: steps || [], label });
    for (const st of steps || []) {
      for (const r of (st.routes && st.routes.define) || []) {
        visit(r.steps, `${label} → route '${r.id || '?'}'`);
      }
    }
  };
  visit(w.steps, 'main');
  return out;
}

/** The loop owner of the sequence `addr` belongs to, or null. Sequence-scoped:
 *  a loop inside a route never blocks the main flow (and vice versa). */
function loopOwnerInSequence(addr) {
  const parts = String(addr).split('.');
  let steps = state.workflow.steps;
  // Walk down route boundaries: addr '2.1.0' = main step 2 → route 1 → step 0.
  for (let i = 0; i + 1 < parts.length; i += 3) {
    const owner = steps[Number(parts[i])];
    const route = ((owner && owner.routes && owner.routes.define) || [])[Number(parts[i + 1])];
    if (!route) return null;
    steps = route.steps || [];
  }
  for (const st of steps || []) {
    if (st.loop_back && st.loop_back.to) return st.name || '(unnamed)';
  }
  return null;
}

// ── Render: Workflow Tab ───────────────────────────────
function renderWorkflowTab() {
  // Graph view is an alternative rendering of the SAME state.workflow model.
  // Every existing caller (addStep/removeStep/moveStep/updateStep…) re-enters
  // here after mutating, so edits made in either view show up in both.
  if (state.ui.workflowView === 'yaml') { renderYamlView(); return; }
  if (state.ui.workflowView === 'graph') { GV.render(); return; }
  const w = state.workflow;
  let html = '';

  // Workflow-level problems (name, params, tools, gate defaults) live above
  // the sections that own them.
  if (valMarks && !valMarks.byAddr['__start'] && valMarks.note) {
    // Nothing is wrong at workflow level, but what was checked still needs
    // saying — a subset that found nothing is not the same as a clean bill.
    html += `<div class="wf-errbar subtle">${ico2('warn')}<div class="val-note">${esc(valMarks.note)}</div></div>`;
  }
  if (valMarks && valMarks.byAddr['__start']) {
    html += `<div class="wf-errbar">${ico2('warn')}<div>${valMarks.byAddr['__start'].map(m => `<div>${esc(m)}</div>`).join('')}${valMarks.note ? `<div class="val-note">${esc(valMarks.note)}</div>` : ''}</div></div>`;
  }
  // Metadata (always open)
  html += renderWorkflowMeta();
  // Steps
  html += `<div class="flex-between" style="margin-bottom:12px">
    <div class="section-title" style="font-size:13px">STEPS</div>
    <button class="add-btn" onclick="addStep()">+ Add Step</button>
  </div>`;

  if (w.steps.length === 0) {
    html += `<div class="empty-state">No steps yet. Click "Add Step" to create your first step.</div>`;
  }

  w.steps.forEach((s, i) => {
    const open = state.ui.openSteps.has(i);
    html += renderStepCard(s, i, open);
  });

  // A whole-tab rebuild loses where you were: after toggling one chip the
  // page jumped and the field you just changed was off screen (you had to
  // scroll back to see its new value). Keep the viewport and the focused
  // field across the swap — the model is rebuilt, the reading position is not.
  withPreservedView(document.getElementById('workflowTab'), (host) => {
    host.innerHTML = html;
  });
  updateStructCount();
}

/**
 * Run an innerHTML swap without moving the user: remembers the scroll offsets
 * (the scrolling ancestor and the window) and the focused control — matched
 * after the rebuild by its stable identity (id, or the onchange/oninput
 * expression the template emits) — then restores both, caret included.
 */
function withPreservedView(host, swap) {
  if (!host) return;
  const scroller = (function () {
    let el = host;
    while (el && el !== document.body) {
      const st = getComputedStyle(el);
      if (/(auto|scroll)/.test(st.overflowY) && el.scrollHeight > el.clientHeight) return el;
      el = el.parentElement;
    }
    return null;
  })();
  const scrollTop = scroller ? scroller.scrollTop : window.scrollY;
  const active = document.activeElement;
  let key = null, selStart = null, selEnd = null;
  if (active && host.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) {
    key = active.id
      ? '#' + active.id
      : (active.getAttribute('onchange') || active.getAttribute('oninput') || null);
    // selectionStart THROWS on input types that have no selection (number,
    // checkbox, …) — reading it unguarded would break the whole re-render.
    try {
      if (active.selectionStart != null) { selStart = active.selectionStart; selEnd = active.selectionEnd; }
    } catch (e) { selStart = null; selEnd = null; }
  }
  swap(host);
  if (key) {
    const back = key.startsWith('#')
      ? host.querySelector(key)
      : host.querySelector('[onchange="' + CSS.escape(key) + '"], [oninput="' + CSS.escape(key) + '"]');
    if (back) {
      try {
        back.focus({ preventScroll: true });
        if (selStart != null && back.setSelectionRange) back.setSelectionRange(selStart, selEnd);
      } catch (e) { /* focus is a nicety, never a failure */ }
    }
  }
  if (scroller) scroller.scrollTop = scrollTop; else window.scrollTo(0, scrollTop);
}

function renderStepCard(s, i, open) {
  const collapsed = open ? '' : ' collapsed';
  const nameDisplay = s.name || 'Untitled step';
  const nameClass = s.name ? '' : ' empty';
  const chips = [];
  if (s.inputs.length) chips.push(`<span class="chip chip-blue">${s.inputs.length} input${s.inputs.length > 1 ? 's' : ''}</span>`);
  if (s.outputs.length) chips.push(`<span class="chip chip-purple">${s.outputs.length} output${s.outputs.length > 1 ? 's' : ''}</span>`);
  if (s.carry_forward != null) chips.push(`<span class="chip chip-blue">carry_forward: ${s.carry_forward ? 'on' : 'off'}</span>`);
  if (s.parallel) chips.push(`<span class="chip chip-amber">multiple subagents</span>`);
  if (s.delegate_to) chips.push(`<span class="chip chip-amber">delegate</span>`);
  if (s.type === 'planning') chips.push(`<span class="chip chip-purple">planning</span>`);
  if (s.gate) chips.push(`<span class="chip chip-amber">gate override</span>`);
  if (s.loop_back && s.loop_back.to) chips.push(`<span class="chip chip-amber">&#x27F2; loop &rarr; ${esc(s.loop_back.to)}</span>`);
  // Mechanism colours come from the --mech-* contract, never hardcoded (the
  // old literal here was a violet that matched NEITHER view's route teal).
  if (s.routes && Array.isArray(s.routes.define) && s.routes.define.length) chips.push(`<span class="chip" style="background:var(--teal-bg);color:var(--mech-route)">&#x2387; routes: ${s.routes.define.length}</span>`);
  if (s.lanes && Array.isArray(s.lanes.define) && s.lanes.define.length) chips.push(`<span class="chip" style="background:var(--orange-bg);color:var(--mech-lanes)">&#x2942; lanes: ${s.lanes.define.length}</span>`);
  if (Object.keys(s.param_bindings || {}).length) chips.push(`<span class="chip chip-purple">bindings</span>`);

  const marks = valMarks && valMarks.byAddr[String(i)];
  let html = `<div class="step-card${collapsed} step-card-${stepKind(s)}${marks ? ' step-card-verr' : ''}" data-idx="${i}">
    <div class="step-header" onclick="toggleStep(${i})">
      ${stepChevronSVG}
      <span class="step-num">${i + 1}</span>
      <span class="step-name${nameClass}">${esc(nameDisplay)}</span>
      ${marks ? `<button class="step-errbadge" title="${esc(marks.length + (marks.length === 1 ? ' problem' : ' problems') + ' — click to open')}"
        onclick="event.stopPropagation(); state.ui.openSteps.add(${i}); renderWorkflowTab(); reveal('#workflowTab .step-card[data-idx=&quot;${i}&quot;]')">!</button>` : ''}
      <span class="step-chips">${chips.join('')}</span>
      <span class="step-actions" onclick="event.stopPropagation()">
        <button class="btn-icon" onclick="moveStep(${i},-1)" title="Move up" ${i === 0 ? 'disabled style="opacity:0.3"' : ''}>&#x25B2;</button>
        <button class="btn-icon" onclick="moveStep(${i},1)" title="Move down" ${i === state.workflow.steps.length - 1 ? 'disabled style="opacity:0.3"' : ''}>&#x25BC;</button>
        <button class="btn-icon danger" onclick="removeStep(${i})" title="Delete step">&times;</button>
      </span>
    </div>
    <div class="step-details">`;

  if (marks) {
    html += `<div class="step-errlist">${marks.map(m => `<div>${esc(m)}</div>`).join('')}</div>`;
  }
  html += renderStepBody(s, String(i));

  html += `</div></div>`;
  return html;
}

// renderStepBody — the full step-config editor for the step at string `addr`.
// Used both inside the top-level step card (addr = "3") and recursively for
// route steps (addr = "3.1.2"). Returns inner HTML (no header, no card wrapper);
// the caller supplies the surrounding container.
/**
 * The step editor body, shared by the Form card and the expanded graph node.
 * `opts.onGraph` drops what the GRAPH already owns on the flow itself — the
 * gate layers (their slots live on the edge between the steps) and the
 * loop_back block (its own edge chip) — so the graph states each mechanism
 * once, where the flow shows it. The Form view keeps everything: it is the
 * only place some of these can be set.
 */
function renderStepBody(s, addr, opts) {
  const onGraph = !!(opts && opts.onGraph);
  let html = '';

  // Basic fields
  html += `
    <div class="field-row">
      <div class="field-group">
        <label class="field-label"><span class="required">*</span> Name ${helpBtn('step.name')}</label>
        <input type="text" class="field-input" value="${esc(s.name)}" placeholder="step-name"
               onchange="updateStep('${addr}', 'name', this.value)">
