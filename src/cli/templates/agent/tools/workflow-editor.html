  <symbol id="gv-i-tool-mcp" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 2.4v4M12.8 2.4v4"/><path d="M4.6 6.4h10.8v2.8a5.4 5.4 0 0 1-10.8 0z" fill="currentColor" fill-opacity=".2"/><path d="M4.6 6.4h10.8v2.8a5.4 5.4 0 0 1-10.8 0z"/><path d="M10 14.6v3"/></symbol>
  <symbol id="gv-i-struct" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 3h-.7a1.9 1.9 0 0 0-1.9 1.9v2.6L3.2 10l1.8 2.5v2.6A1.9 1.9 0 0 0 6.9 17h.7M12.4 3h.7a1.9 1.9 0 0 1 1.9 1.9v2.6L16.8 10 15 12.5v2.6a1.9 1.9 0 0 1-1.9 1.9h-.7"/></symbol>
  <!-- Data LEAVING a step: arrow rising out of the tray. -->
  <symbol id="gv-i-out" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11.6V2.8M6.6 6.2L10 2.8l3.4 3.4"/><path d="M3.4 12.6v2.6a1.8 1.8 0 0 0 1.8 1.8h9.6a1.8 1.8 0 0 0 1.8-1.8v-2.6" fill="currentColor" fill-opacity=".18"/></symbol>
  <symbol id="gv-i-yaml" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 2.6h7l4.2 4.2v10.6H4.4z" fill="currentColor" fill-opacity=".14"/><path d="M4.4 2.6h7l4.2 4.2v10.6H4.4z"/><path d="M11.2 2.7v4.3h4.3"/><path d="M6.8 11.4h6.4M6.8 14.2h4.2"/></symbol>
  <symbol id="gv-i-open" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 3.4H4.6a1.8 1.8 0 0 0-1.8 1.8v10.2a1.8 1.8 0 0 0 1.8 1.8h10.2a1.8 1.8 0 0 0 1.8-1.8v-5"/><path d="M12.4 2.8h4.8v4.8"/><path d="M8.6 11.4l8.4-8.4"/></symbol>
  <symbol id="gv-i-form" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.4 5.6h13.2M3.4 10h13.2M3.4 14.4h8"/></symbol>
  <symbol id="gv-i-graph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 5.8l6.6 3.4M6.6 14.2l6.6-3.4"/><circle cx="4.8" cy="4.8" r="2.3" fill="currentColor" fill-opacity=".22"/><circle cx="15.2" cy="10" r="2.3" fill="currentColor" fill-opacity=".22"/><circle cx="4.8" cy="15.2" r="2.3" fill="currentColor" fill-opacity=".22"/></symbol>
  <symbol id="gv-i-fit" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 7.2V4.4a1.6 1.6 0 0 1 1.6-1.6h2.8M17.2 7.2V4.4a1.6 1.6 0 0 0-1.6-1.6h-2.8M2.8 12.8v2.8a1.6 1.6 0 0 0 1.6 1.6h2.8M17.2 12.8v2.8a1.6 1.6 0 0 1-1.6 1.6h-2.8"/></symbol>
  <!-- ── Gate shields ────────────────────────────────────────────────────
       All three layers are SHIELDS, because all three are checkpoints. What
       differs is the emblem: a tick for the deterministic check, the
       orchestrator mark for the judgement it performs, a figure for the person
       whose approval is required. -->

<script>
// ── Workflow Studio integration ────────────────────────
// Opened top-level (not embedded), redirect to the unified Workflow Studio,
// which hosts this editor in an iframe. Inside the iframe (window.top differs)
// this is skipped and the editor runs verbatim. Zero behavior change when
// embedded; standalone opens route to the new tool per the redesign.
if (window.self === window.top) {
  try { window.location.replace('workflow-studio.html?section=editor'); } catch (e) {}
}
// ── SVG icons ──────────────────────────────────────────
const chevronSVG = `<svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>`;
const stepChevronSVG = `<svg class="step-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>`;

// ── State ──────────────────────────────────────────────
const state = {
  workflow: {
    name: '',
    version: 1,
    description: '',
    inbox_webhook: '',
    params: [],
    tools: [],
    gate: { structural: true, semantic: false, human: false, max_step_retries: 3, max_gate_retries: 5, allow_partial_step_complete: false },
    context: { carry_forward: 'none' },
    steps: []
  },
  structs: [],
  ui: {
    activeTab: 'workflow',
    // The graph is the default: a workflow is a flow, and that is the view
    // that shows what it does. The form stays one click away for field work.
    workflowView: 'graph',  // 'graph' | 'form' — two renderings of the SAME model
    gvSecs: new Set(),      // graph: per-node section fold state ("addr|key", "!addr|key")
    openSections: new Set(['metadata']),
    // Which edge mechanisms are expanded in place on the graph. Past the expand
    // threshold every one of them is open regardless of what is in here.
    gvOpen: new Set(),
    openTools: new Set([0]),
    openSteps: new Set(),
    openRouteSteps: new Set(),
    openStructs: new Set(),
    dirty: false
  }
};

/* Validation marks, produced by Save/Export and drawn on the offending
   elements in every view. Keyed by top-level step address ('__start' for
   workflow-level problems: name, params, tools, gate defaults). Problems from
   inside a step's branches roll UP to that step — the parent carries the badge
   until you reach the element itself, exactly so a fault can never hide inside
   something that is folded shut. */
let valMarks = null;

/* Every step name in the workflow → the TOP-LEVEL step it belongs to, walking
   into route branches. A problem reported against a step inside a branch marks
   the branch's owner, which is what keeps a fault from hiding inside something
   that is folded shut. */
function stepOwnerByName() {
  const idx = {};
  (state.workflow.steps || []).forEach(function (s, i) {
    (function walk(st) {
      if (st.name && idx[st.name] === undefined) idx[st.name] = i;
      ((st.routes && st.routes.define) || []).forEach(function (r) { (r.steps || []).forEach(walk); });
      ((st.lanes && st.lanes.define) || []).forEach(function (l) { (l.steps || []).forEach(walk); });
    })(s);
  });
  return idx;
}

/* Attach a set of problems to the elements they belong to.
   The two validators word things differently — the editor says
   `Step 3 "name": …`, the engine says `step 'name': …` or names no step at all
   — so the address is found by BOTH readings rather than by one fixed shape:
   the editor's leading index first, then any quoted name that is a real step,
   and workflow level when neither applies. */
function markErrors(errs, source, scope) {
  const note = source === 'engine'
    ? (scope === 'no-dir'
        ? 'Checked by the engine. This workflow is not on disk yet, so the three checks that read files (struct schemas, decider scripts, directory name) were skipped.'
        : '')
    : "Checked by the editor's own rules, which are a SUBSET of the engine's — a workflow that passes here can still be refused at load.";
  if (!errs || !errs.length) {
    // Nothing wrong — but WHAT WAS CHECKED still has to survive. Dropping the
    // record along with the errors threw the caveat away too, so a partial
    // check came back looking like a clean bill of health.
    valMarks = note ? { byAddr: {}, count: 0, source: source, scope: scope, note: note } : null;
    return;
  }
  const owner = stepOwnerByName();
  const by = {};
  errs.forEach(function (m) {
    const txt = String(m);
    let key = null;
    const lead = txt.match(/^Step (\d+)/);
    if (lead) key = String(Number(lead[1]) - 1);
    if (key === null) {
      const quoted = txt.match(/'([^']+)'|"([^"]+)"/g) || [];
      for (let i = 0; i < quoted.length; i++) {
        const nm = quoted[i].slice(1, -1);
        if (owner[nm] !== undefined) { key = String(owner[nm]); break; }
      }
    }
    if (key === null) key = '__start';
    (by[key] = by[key] || []).push(txt);
  });
  valMarks = { byAddr: by, count: errs.length, source: source, scope: scope, note: note };
}

/* Ask the engine if it can be reached, and the editor's own copy otherwise.
   The distinction is never hidden: what was checked is reported with the
   result, because "no problems found" means different things in the two
   cases. */
async function validateNow() {
  if (typeof window.__studioValidate === 'function') {
    let yaml = null;
    try { yaml = generateWorkflowYAML(state.workflow); } catch (e) { yaml = null; }
    if (yaml !== null) {
      let r = null;
      try { r = await window.__studioValidate(yaml); } catch (e) { r = null; }
      if (r && Array.isArray(r.errors)) {
        markErrors(r.errors, 'engine', r.scope || 'full');
        return { errors: r.errors, source: 'engine', scope: r.scope || 'full' };
      }
    }
  }
  const errs = validateWorkflow();
  markErrors(errs, 'editor', 'subset');
  return { errors: errs, source: 'editor', scope: 'subset' };
}

/* The editor-only path, kept for callers that cannot await. */
function computeValMarks() {
  const errs = validateWorkflow();
  markErrors(errs, 'editor', 'subset');
  return errs;
}
/* The Save in the tab bar: validate FIRST, and only hand the file to the
   Studio when the workflow has nothing to complain about. With problems, the
   save does not happen — the marks show where and why. */
/* Ask, without writing. Same check Save runs — the answer just stops there. */
async function validateFromTab() {
  const r = await validateNow();
  renderWorkflowTab();
  if (r.errors.length) {
    showToast(r.errors.length === 1 ? '1 problem — the marked element says what is wrong'
      : r.errors.length + ' problems — the marked elements say what is wrong');
    return;
  }
  showToast(r.source === 'engine'
    ? (r.scope === 'full' ? 'Valid — nothing to fix' : 'Valid so far — file checks wait until it exists')
    : "No problems in the editor's own checks");
}

async function saveFromTab() {
  const r = await validateNow();
  renderWorkflowTab();
  if (r.errors.length) {
    showToast(r.errors.length === 1 ? '1 problem — the marked element says what is wrong'
      : r.errors.length + ' problems — the marked elements say what is wrong');
    return;
  }
  showToast(r.source === 'engine'
    ? (r.scope === 'full' ? 'Valid — saving' : 'Valid so far (file checks skipped until it exists) — saving')
    : 'No problems in the editor\'s own checks — saving');
  if (typeof window.__studioSaveRequest === 'function') window.__studioSaveRequest();
}
let revalTimer = null;
function markDirty() {
  state.ui.dirty = true;
  // While marks are up, editing re-checks, so fixing a field clears its badge
  // without another Save. Deliberately NOT the local subset: marks that came
  // from the engine would be silently replaced by weaker ones, which is a
  // downgrade disguised as an update. Ask whoever answered last, debounced, and
  // re-render only when the set of problems actually changed.
  if (!valMarks) return;
  const before = JSON.stringify(valMarks.byAddr);
  clearTimeout(revalTimer);
  revalTimer = setTimeout(function () {
    validateNow().then(function () {
      const after = valMarks ? JSON.stringify(valMarks.byAddr) : '';
      if (after !== before) renderWorkflowTab();
    });
  }, 400);
}

// ── Step path addressing (route-step recursion) ─────────
// A step is addressed by a dot-joined path:
//   "3"        → state.workflow.steps[3]            (top-level)
//   "3.1.2"    → steps[3].routes.define[1].steps[2] (one route hop)
//   "3.1.2.0.4"→ …routes.define[0].steps[4]          (recurses)
// After the leading top-level index, the path is pairs of (routeIndex, stepIndex).
// Segments stay STRINGS: a container segment is a plain number for a ROUTE
// hop (back-compat with every stored addr) or "L<i>" for a LANES hop —
// without the discriminator a naive lanes addr would silently resolve into
// routes.define and corrupt the other block (the recon's data-loss warning).
function parsePath(addr){ return String(addr).split('.'); }
// containerSeg → the route/lane definition object under `s`.
function hopContainer(s, seg){
  return String(seg)[0] === 'L'
    ? s.lanes.define[Number(String(seg).slice(1))]
    : s.routes.define[Number(seg)];
}
function resolveStepByPath(addr){
  const p = parsePath(addr);
  let s = state.workflow.steps[Number(p[0])];
  for (let k=1; k<p.length; k+=2){ s = hopContainer(s, p[k]).steps[Number(p[k+1])]; }
  return s;
}
// the array that CONTAINS the step at addr, plus its local index — for sibling logic
function parentSeqOf(addr){
  const p = parsePath(addr);
  if (p.length===1) return { seq: state.workflow.steps, idx: Number(p[0]) };
  let s = state.workflow.steps[Number(p[0])];
  for (let k=1; k<p.length-2; k+=2){ s = hopContainer(s, p[k]).steps[Number(p[k+1])]; }
  const container = hopContainer(s, p[p.length-2]);
  return { seq: container.steps, idx: Number(p[p.length-1]) };
}
// Resolve the OWNER step of a routes block given the owner's addr (used by
// the route-management handlers which then index .routes.define[ri]/.steps[sj]).
function toggleRouteStepEdit(addr){
  if (state.ui.openRouteSteps.has(addr)) state.ui.openRouteSteps.delete(addr);
  else state.ui.openRouteSteps.add(addr);
  renderWorkflowTab();
}
// Fill in the fields renderStepBody expects (inputs/outputs arrays, default
// flags) WITHOUT clobbering anything already present. Route steps loaded from
// YAML or seeded by addRouteStep may carry only {name, goal}; the full-config
// editor needs the same shape a top-level step has. Only touched when a route
// step is expanded for editing, so untouched route steps stay minimal in YAML.
// ── Step kind — ONE classifier, both views ────────────────────────────────
// The Form card class (`step-card-<kind>`) and the Graph node class
// (`k-<kind>`) are derived from this, so a step can never read as one kind in
// one view and another kind in the other.
// Precedence matters and is not arbitrary: a delegation step is ALWAYS
// subagent:false, so "delegation" must outrank "inline" or every delegation
// would render as a plain orchestrator step; planning outranks everything
// because it rewrites what the step even is at runtime.
function stepKind(s) {
  if (!s) return 'subagent';
  if (s.type === 'planning') return 'planning';
  if (s.delegate_to) return 'delegation';
  if (s.parallel) return 'parallel';
  if (s.subagent === false) return 'inline';
  return 'subagent';
}

function normalizeStepForEdit(st){
  if (st.inputs == null) st.inputs = [];
  if (st.outputs == null) st.outputs = [];
  if (st.param_bindings == null) st.param_bindings = {};
  if (st.delegate_params == null) st.delegate_params = {};
  if (st.spec_check == null) st.spec_check = false; // D3: opt-in default
  if (st.spec_authoring == null) st.spec_authoring = ''; // '' = off (absent)
  if (st.subagent == null) st.subagent = true;
  if (st.carry_forward === undefined) st.carry_forward = null;
  if (st.parallel == null) st.parallel = false;
  if (st.parallel_key == null) st.parallel_key = '';
  if (st.delegate_to == null) st.delegate_to = '';
  if (st.model == null) st.model = '';
  if (st.tools == null) st.tools = '';
  if (!Array.isArray(st.deny)) st.deny = []; // [] ≡ absent (full native surface)
  if (st.branch_profiles === undefined) st.branch_profiles = null;
  if (st.gate === undefined) st.gate = null;
  if (st.loop_back === undefined) st.loop_back = null;
  if (st.routes === undefined) st.routes = null;
  if (st.lanes === undefined) st.lanes = null;
  if (st._extra === undefined) st._extra = {};
  return st;
}

// ── Help Text Database ─────────────────────────────────
const HELP = {
  'workflow.name': 'Unique workflow identifier in kebab-case (e.g., "my-workflow"). Used as the directory name under .riglane/workflows/templates/my_workflows/. (Runtime state is keyed by run_id, not by name.)',
  'workflow.version': 'Integer version number. Increment when making breaking changes to the workflow definition.',
  'workflow.description': 'Human-readable description of what this workflow accomplishes. Shown in workflow listings and trace logs.',
  'workflow.inbox_webhook': 'DEFAULT webhook URL for this workflow\'s runs: the engine POSTs every inbox question as a self-contained envelope ({message, respond: {url, token, body}, run}) to this address — a third-party app shows the question in its own UI and answers by POSTing back to respond.url with respond.token. Resolution chain: --inbox-webhook run override (or the /api/run inbox_webhook field) → THIS field → env RIGLANE_INBOX_WEBHOOK → config engine.inbox_webhook_url. Leave empty unless every machine running this workflow should notify the same address — a non-localhost URL in a committed file draws the webhook-url advisory. Reference: workflow_learn(topic="inbox").',
  'context.carry_forward': '"none" = each step starts with clean context (only its own inputs). "summary" = auto-generated summaries from completed steps are injected into subsequent step prompts, giving them awareness of prior work without full conversation history. Per-step override: set carry_forward to ON (force include) or OFF (force exclude) on individual steps.',
  'gate.structural': 'Validates output files: existence, JSON/YAML parsing, struct schema constraints (types, required fields, patterns, enums). Deterministic, fast (~1s). For subagent: true steps, runs as riglane gate-check via the subagentStop hook. For subagent: false (inline) steps, the engine runs the same validation synchronously inside the step_complete tool call as a safety net — same checks, just no hook. Default: true.',
  'gate.semantic': 'Run LLM-based quality check after structural gate passes. The orchestrator re-reads the step output and evaluates: completeness (did the subagent address all goal points?), correctness (are outputs consistent with inputs?), coherence (does the output make sense?). Non-deterministic — different runs may judge differently. Adds ~10-30s per step. Default: false.',
  'gate.human': 'Pause and ask the user for explicit approval before proceeding. The orchestrator presents a summary of the step output and waits for yes/no. Useful for high-stakes steps (e.g., discovery plan approval before expensive parallel scan). Can be set per-step to override workflow default. Default: false.\n\nCONDITIONAL: fill the script field next to the gate (YAML: human: {script: "<command>"}) and the ENGINE runs that command at gate time — after the step\'s outputs exist, so it can inspect them — expecting {"human": true|false} on stdout: true means THIS run needs approval, false waves it through. Same decider contract as loop_back/routes when.script (project-root cwd, RIGLANE_RUN_DIR injected, non-zero exit or malformed output stops the workflow). The verdict is evaluated once per step per run and recorded in the manifest (human_gate_verdict); step_begin announces the gate as "conditional" and the real answer arrives with step_collect_result. Empty script = plain always-on gate.',
  'gate.human_channel': 'WHERE the human question is delivered. terminal (default) — the orchestrator asks in the harness terminal, nothing is recorded. external — the question is posted to the run inbox as a durable message: answer it from the Agent Messages section, the trace viewer dialog, or an external program via the Local API; the engine REFUSES to complete the step until every question of the current pass carries a fresh response (verified from disk, not taken on faith). both — external AND the terminal; whichever answers first wins, and a terminal answer is recorded into the same store. Valid only next to human: true (a channel with no question to route is a load error). The same field exists on loop_back.when and routes.when for the human deciders. A message can offer predefined choices (they allow the pick on their own) or group several questions as items answered in one exchange. READING THE PILLS: a workflow default has three (terminal | external | both) and lights the one in force — terminal is the default, so with no channel set it lights terminal. A STEP has a fourth, "inherit", because a step can simply follow the workflow default instead of storing a channel of its own; it shows which value it would follow. When the human gate is OFF nothing is lit at all — there is no question to route yet — and clicking a channel turns the gate on for that surface and routes it in one go. Reference: workflow_learn(topic="inbox").',
  'gate.max_step_retries': 'Maximum fresh subagent spawns for a single step. When all gate retries within one subagent are exhausted, that subagent is discarded and a NEW one starts with clean context plus failure details from the previous attempt. Default: 3. Total worst-case attempts per step = max_gate_retries x max_step_retries.',
  'gate.max_gate_retries': 'Maximum in-place retries within a single subagent session. On gate failure, the subagent receives structured feedback (what failed, which schema constraint, the actual value) and self-corrects without losing its conversation context. Default: 5. When exhausted, triggers a step retry (fresh subagent).',
  'gate.allow_partial_step_complete': 'Controls how the engine handles parallel steps where some subagents succeeded and others failed permanently. Default: false (strict) — the engine refuses to advance to the next step until every failed branch is re-spawned and passes. Switching to true permits the workflow to continue with whatever results succeeded; failed branches are skipped. Only meaningful for parallel steps. Hard rule (cannot be overridden): when ALL branches fail, or when a non-parallel step exhausts its retries, the engine always halts regardless of this flag — partial completion requires at least one successful branch. Use true only when missing some parallel results is acceptable for the workflow (e.g. optional enrichment branches); leave false for data pipelines where every branch matters.',
  'step.gate.allow_partial_step_complete': 'Per-step override of the workflow-level setting. When set, takes precedence over `gate.allow_partial_step_complete` for this step only. Use to relax strict mode on a specific parallel step (e.g. an optional enrichment step inside an otherwise strict workflow), or to enforce strict mode on a critical step inside an otherwise permissive workflow. Same semantics as the workflow-level field.',
  'param.name': 'Parameter name, used in goal text and output paths as {name} placeholder. Use snake_case or kebab-case. Note: {run_id} is a built-in synthetic param (auto-generated per run) — do not define a param named run_id.',
  'param.description': 'Human-readable description shown when the orchestrator prompts for missing parameters at workflow start. Also visible in workflow listings and trace logs.',
  'param.required': 'If true, the workflow will not start without this parameter. The orchestrator asks the user to provide it. If false, the default value (if set) or null is used.',
  'param.default': 'Default value used when the parameter is not explicitly provided. Cannot be set together with required: true. String values — use "true"/"false" for boolean-like params (all param values are strings).',
  'tools': 'Workflow tool dependencies. Two types: "script" = shell command exposed as a normal MCP tool by the stable workflow_tools loader (registered in .mcp.json); "mcp" = external MCP server the workflow requires (user must enable it). Tools are declared at workflow level and optionally restricted per step.',
  'tool.name': 'Unique tool identifier. Used in step-level tools: filter to restrict which tools a step can use. Must be unique across all tools in the workflow.',
  'tool.type': '"script" = a shell command exposed as an MCP tool by the workflow_tools loader. The subagent sees it in its inventory as mcp__workflow_tools__<workflow>__<tool> with full description and schema. "mcp" = an external MCP server that must be running. Description comes from the server, not from workflow.yaml.',
  'tool.command': 'Shell command to execute when the tool is called (script type only). The loader runs this via subprocess. Arguments are passed as --key=value flags. Example: "python .riglane/workflows/templates/my_workflows/my-workflow/scripts/extract-tables.py"',
  'tool.description': 'Human-readable description shown to the LLM (script type only). The LLM uses this to decide when to call the tool. For MCP type, description comes from the server automatically.',
  'tool.input_schema': 'JSON Schema for tool arguments (script type, optional). Defines what arguments the tool accepts, their types, and which are required. Used both as LLM guidance and as input validation by the `riglane workflow-tool-validator` PreToolUse hook in Claude Code.',
  'tool.required': 'For MCP type: if true (default), workflow blocks at startup when this server is unavailable. The user must enable it before continuing. If false, workflow shows a warning but continues without the tool.',
  'tool.expected_tools': 'For MCP type (Phase 38, required for Claude Code): list of specific tool names from this server that workflow steps will use. The `riglane init-workflow` generator writes these into the per-step subagent\'s tools whitelist as mcp__<server>__<tool>. Without this field, Claude Code subagents will not see any tools from this server (their whitelist would have no MCP entries). Format: ["tool_a", "tool_b"]',
  'tool.server_config': 'Optional legacy field for inline start config (kept for backward compatibility). In Phase 38 the loader is registered in .mcp.json/.cursor/mcp.json and external MCP servers are managed by the user, so this field is rarely needed. Format: {"command": "python", "args": [".riglane/mcp/server.py"]}',
  'step.tools': 'Which workflow-level tools this step may call — it calls the ones it NAMES here and no others. Naming none (an empty list, or no list at all — the two are the same statement) is a step that calls none of them. Declare-to-use: like every other absent field in the format, saying nothing grants nothing. (The built-in tools are always available either way — they are not part of this list and cannot be granted or withheld here.) Example: "count_lines, transform_json" — only these two tools are available to this step\'s subagent.',
  'step.name': 'Unique step identifier within the workflow (kebab-case). Used as key in manifest.json, trace, and for resume targeting. Must be unique across all steps.',
  'step.goal': 'Detailed instructions for the subagent (or orchestrator if subagent: false). Supports multi-line text. Use {param_name} for parameter placeholders — replaced at runtime with actual values. For conditional steps, start with: IF param is "value": skip this step. The goal is the core prompt that drives the step\'s behavior.',
  'step.deny': 'Host-neutral capability ids this SUBAGENT step must NOT have. Default (no field) = the step inherits the harness\'s full native surface; this field only ever narrows, it never grants. v1 vocabulary: shell — removes the shell/terminal tools from the generated per-step agent definition (the engine owns the per-host spelling: Bash/PowerShell on Claude Code, bash on OpenCode, execute on Copilot, run_shell_command on Gemini). On Cursor/Codex there is no per-step agent identity, so the deny is delivered as an instruction in the step envelope — a stated seam, not enforcement. NOT a sandbox: a step without shell can still write files via its edit tools and reach the network via granted MCP tools. Inert on inline (subagent: false) and planning steps — lint warns (inline-noop-fields). Regenerate agent files (riglane init-workflow) + restart the host after changing it.',
  'step.subagent': 'true (default): spawn an isolated subagent with clean context. The subagent only sees its goal, inputs, and summaries. Gate hook fires on completion (via subagentStop). false: execute inline in the orchestrator session. Benefits: no spawn overhead (~5-10s saved), orchestrator retains full conversation context, can make nuanced decisions. Trade-off: no subagentStop hook fires, so no hook-based trace data and no in-place gate retry loop — but structural validation is still run synchronously by the engine inside step_complete (same checks as riglane gate-check). Tool-call warnings are also skipped for inline steps because the orchestrator-side MCP calls are not visible in any subagent transcript. Required for delegation steps (delegate_to).',
  'step.model': 'How the model for this step\'s subagent is chosen — a MODE, not a model name (you never type a concrete model; internal model identifiers differ per host and change over time). auto (default): the orchestrator judges the step\'s difficulty and picks a fitting model itself. inherit: the subagent runs on the same model as the orchestrator. lightest: the cheapest/fastest model available — for mechanical steps (extraction, formatting, summarizing). strongest: the most capable model available — for judgment-heavy steps where a failed attempt costs more than the model difference. The engine delivers the chosen mode as an explicit instruction to the orchestrator at step_begin.',
  'step.spec_check': 'Spec CONSUMPTION — "this step must RESPECT the project\'s behavioral specs". Default: OFF (opt-in).\n\nTurn it ON when the step MODIFIES the project (code, config, assets the specs govern). What the engine then does for you:\n• Whitelists the spec_search + spec_link engine tools for the subagent (Claude Code per-step agents).\n• Injects guidance at step start: find the specs for the AREA being changed, honor their Rule Statements, STOP on a conflict instead of silently overriding, and keep the spec↔file registry links updated.\n• Adds a spec-compliance clause to the semantic gate, so the orchestrator re-verifies compliance after the step.\n\nLeave OFF for read-only steps: analysis, scanning, reporting, auditing.',
  'step.spec_authoring': 'Spec AUTHORING — "this step works with spec_write". Default: off (flag absent).\n\nBoth modes whitelist the spec_write + spec_search + spec_link engine tools (Claude Code per-step agents) and inject authoring guidance at step start: target scope, list of existing domains (reuse, don\'t invent near-synonyms), the spec format, and how to register via spec_write.\n\npersist — the step CREATES/UPDATES specs:\n• The engine AUTO-DECLARES the outputs (.riglane/specs/{scope}/**/*.md + generic) at load — do NOT add them to outputs manually.\n• write_proof: any_member — at least one spec written this step proves real work; pre-existing specs don\'t fail the gate.\n• The workflow must declare a `scope` param (validated at load).\n\nvalidate — DRY-RUN preview, persists NOTHING:\n• spec_write is accepted ONLY with dry_run:true — the engine physically REJECTS a persisting call during this step.\n• Declare your own report output (e.g. data/validation-report.json), never .riglane/specs paths.\n• Typical use: a review/adjudication step (with a human gate) that previews validation + dedup BEFORE a later persist step commits the batch.\n\nThe editor sets only this flag — the outputs are engine-injected at load.',
  'step.carry_forward': 'Override workflow-level carry_forward for this step. ON = include auto-generated summaries from all completed steps (useful for steps that need broad context). OFF = no summaries, subagent works only with its declared inputs (useful for focused, isolated tasks). Inherit (default) = use the workflow-level setting.',
  'step.param_bindings': 'Re-bind workflow params from step outputs after gate passes. Syntax: "param_name: data/output.json::field.path". Supports dot notation for nested JSON fields (e.g., "lead: data/plan.json::metadata.reviewer"). Runs only after successful gate validation. Useful for passing discovered values to subsequent steps.',
  'step.parallel': 'Enable parallel fan-out: spawn one subagent per matching item in the parallel_key array. All subagents run concurrently and must complete before the step is marked done. Each subagent receives the same goal but operates on its assigned item (e.g., one domain per subagent).',
  'step.parallel_key': 'Expression pointing to an array in a previous step\'s output: <struct>.<field.path>, with an optional terminal [*] (all items — same as the bare path) or [field=value] (filter). E.g., "discovery-plan.domains[status=pending]". Each matching item spawns a separate subagent. Brackets anywhere else (index access, JSONPath spellings) are a LOAD error — navigation is dots-only.',
  'step.branch_profiles': 'Static per-branch rights on a parallel step. Each profile names a TOOL SUBSET of the step\'s own tools: list (a profile narrows the grant, never widens — the step list stays the union the workflow_tools server enforces) and optionally a struct override that replaces the schema of the step\'s single struct-bearing output for that profile\'s branches. Each parallel_key item SELECTS a profile via its `profile` field (else its `name`); an unmatched item stops the run loudly — never a silent fallback to the union. On the agent-file hosts (Claude Code, OpenCode, Copilot, Gemini) init-workflow generates one extra agent file per profile (<wf>-<step>--<profile>) whose whitelist is the subset; regenerate + restart after changing profiles. Use for heterogeneous fan-out (each branch its own data source/schema); homogeneous fan-out needs none.',
  'step.parallel_spawn_delay_ms': 'Delay in milliseconds between first and subsequent parallel-subagent spawns. 0 = simultaneous (default — current behavior). When >0, subsequent subagents wait until this many ms have elapsed since the first spawn — letting the prompt cache populate from the first request, so all later subagents hit cache (~10x cheaper input). Single delay window: only between first and second spawn; later subagents within the burst spawn immediately. Recommended: 3000-5000ms for typical 100K-300K shared prompts. Implemented via SubagentStart hook calling riglane spawn-throttle. Fail-open on errors.',
  'parallel_spawn_delay_ms': 'Workflow-level default for parallel_spawn_delay_ms applied to all parallel: true steps. Per-step parallel_spawn_delay_ms overrides this default. See step-level help for full mechanics.',
  'step.delegate_to': 'Name of another predefined workflow to invoke as a sub-workflow. The orchestrator loads the delegated workflow and executes it with its own manifest and trace. Only one level of delegation is allowed (no recursive delegation). The step MUST have subagent: false — delegation is always orchestrator-driven.',
  'step.type': 'Phase 61: `type: planning` marks this step as a dynamic planning step. The orchestrator drafts a mini-workflow at runtime, engine validates it via workflow_validate_dynamic (with retry budget), commits via workflow_invoke_dynamic, and drives child substeps via the *_dynamic wrapper tools. The engine emits a complete Step 0-6 procedure in the step_begin envelope (no SKILL.md needed — procedural-first defense vs paraphrasing). Use for tasks where exact substeps cannot be pre-defined (e.g. analysis → careful implementation). The generated workflow is restricted to regular steps only by default (no nested parallel/delegation/planning) — see allow_* flags to relax.',
  'step.max_substeps': 'Phase 61 (planning): max number of substeps the orchestrator may include in the drafted child workflow. Engine validator rejects drafts exceeding this. Default: 7. Increase for genuinely complex tasks; do NOT inflate to bypass discipline — many substeps usually means the planning step is too broad.',
  'step.max_plan_attempts': 'Planning steps: max workflow_validate_dynamic calls before the engine returns BLOCKED_PLANNING_FAILURE. Each call (regardless of validation outcome) consumes one attempt. Default: 3. After exhaustion the orchestrator MUST stop and surface the latest errors to the user — no auto-fallback.',
  'step.allow_parallel': 'Phase 61 (planning): when true, the generated child workflow may contain parallel substeps. Default: false. Leave off unless the planning task genuinely needs fan-out — parallel substeps in dynamic workflows are harder to debug.',
  'step.allow_delegation': 'Phase 61 (planning): when true, the generated child workflow may contain delegate_to substeps. Default: false. Leaving off preserves the max-depth-1 invariant (planning child cannot itself delegate). Currently no production use case for true.',
  'step.loop_back': 'Engine-evaluated repetition. After this step completes AND all gates pass, the engine evaluates the `when` conditions; on a "loop" verdict it resets the statuses of every step from the target through this one and moves the cursor back — the orchestrator only obeys the returned action (LOOP_BACK / AWAITING_LOOP_DECISION). Repetition is engine-owned control flow: the orchestrator can never re-run steps on its own initiative. Typical use: test cycles (design-scenario → execute → report, repeated until no scenarios remain). v1 limits: the loop range may contain only plain regular steps (no parallel/delegation/planning) and many loops are allowed, but their step ranges must be properly NESTED or DISJOINT — a partial overlap (e.g. ranges [a..c] and [b..e]) is refused, because the inner loop would return outside the loop that is mid-flight and {iteration} would have no defined meaning. The counter of a nested loop is reset on every pass of the loop containing it, and {iteration} always means the innermost loop the step belongs to. A loop may target only a step in its OWN sequence (main loops within main; a route loops within that route). Full reference: workflow_learn(topic="loop-back").',
  'step.loop_back.to': 'Target step to jump back to — this step itself (conscious self-redo) or any EARLIER step. Forward targets are rejected by the validator: loop_back only points backward; forward conditional skips are modeled inside step goals instead. Every step in the range [target .. this step] is reset to pending and re-executed on each iteration.',
  'step.loop_back.max_iterations': 'REQUIRED hard budget enforced by the engine — the maximum number of loop-backs this step may take (anti-runaway guard, analogous to max_step_retries). When the budget is exhausted the workflow proceeds forward regardless of the `when` conditions, and the audit trail records decided_by: budget_exhausted. The current count lives in manifest.steps[<step>].loop_state.iterations.',
  'step.loop_back.when': 'Navigation conditions — NOT quality gates (gates judge whether the step output is valid; `when` decides where the workflow goes next, and runs only AFTER all gates pass). Three decider types, all optional but at least one required: script — a shell command the ENGINE executes itself (must exit 0 and print {"loop": true|false} to stdout; deterministic, preferred); semantic — a condition the orchestrator LLM evaluates against the step outputs on engine assignment; human — the user decides, relayed by the orchestrator. ALL configured deciders must say "loop" (AND); the first "proceed" wins. Evaluation order is script → semantic → human, and a "proceed" from an earlier decider short-circuits the rest — e.g. a script returning loop=false proceeds immediately, without ever evaluating the semantic or human conditions (order is a cost optimization, cheapest decider first; it never changes the AND result). With semantic/human the engine returns AWAITING_LOOP_DECISION and the orchestrator answers via the loop_decision param of step_complete — the script verdict is cached and never re-executed during that round-trip.',
  'step.lanes': 'Parallel execution lanes. After this step completes and all gates pass (and after loop_back, if any, resolves to proceed), the engine starts EVERY lane CONCURRENTLY — unlike routes there is no when: nothing is chosen, all lanes always run. A lane is a full linear workflow segment (loop_back, routes, planning, parallel, delegation all work inside it, scoped to the lane). Lanes rejoin at an engine-owned JOIN BARRIER: the engine waits for every lane to reach a terminal state, applies join.require, writes data/<fork-step>-join.json (per-lane verdict + declared output paths) and returns the cursor to the step after this one. The join is NOT a step — merge or judge the lane results in the ordinary step AFTER this block (its tools / gate / routes). Mutually exclusive with routes: on the same step. Full reference: workflow_learn(topic="lanes").',
  'step.lanes.define': 'The parallel lanes — at least 2 (a single lane is just a linear sequence). Each lane has a unique id and its own ordered steps; all lanes run at the same time and their declared output paths must not collide with a sibling lane (they write into the SHARED run dir). To keep this editor readable, lane steps are shown flat with name and goal — use Edit to expand the full step config; advanced nested structure is preserved on save.',
  'step.lanes.id': 'Unique lane identifier (lowercase letters, digits, - and _). Shares one namespace with route ids (both appear in per-step stamps and trace events); must not be "proceed".',
  'step.lanes.require': '"all" (default): every lane must complete — a failed lane blocks the join (re-drive it or abort). "any": proceed when at least one lane completed; the next step sees which lanes failed. NOTE: the barrier NEVER finishes early — there is no way to cancel live subagents, so it always waits for every lane; the policy only changes the verdict.',
  'step.routes': 'Conditional forward branching ("alternative steps"). After this step completes and all gates pass (and after loop_back, if any, resolves to proceed), the engine evaluates the `when` conditions to pick ONE named route — or "proceed" to take none — and runs that route\'s steps in-line as ordinary steps. When the chosen route finishes, control returns to the step that follows this one. Route selection is engine-owned: the orchestrator only obeys the returned action (ENTER_ROUTE / AWAITING_ROUTE_DECISION). Unlike loop_back (backward repetition, yields true/false), routes go forward and yield which route. Route steps run in the SAME run — not a separate workflow. Full reference: workflow_learn(topic="routes").',
  'step.routes.when': 'How the route is chosen. Three decider types, all optional but at least one required: script — a shell command the engine runs itself (must exit 0 and print {"route": "<id>" | "proceed"} to stdout; deterministic, preferred); semantic — a condition the orchestrator LLM evaluates to a route id or "proceed"; human — the user picks. With a human decider the user is the final authority and sees the script/semantic results as advice. Without a human decider, when BOTH script and semantic are set they must AGREE on the same value — any disagreement takes no route and continues, with a note surfaced to the user. A single decider decides on its own.',
  'step.routes.define': 'The alternative routes. Add one or more; each has a unique id and its own ordered list of steps. Only the route the engine selects runs — the others are never executed. A route step can itself be any kind of step (including its own routes or a loop_back that stays within the route); to keep this editor readable, route steps are shown flat with their name and goal — open the YAML to add advanced fields or nested routes to a route step (they are preserved on save). Route ids must be globally unique within the workflow and cannot be the reserved word "proceed".',
  'step.routes.id': 'Unique identifier for this route (lowercase letters, digits, - and _). It is the value the decider returns to select this route, and it appears in the trace dividers. Must be unique across the whole workflow and must not be "proceed" (the reserved value meaning "take no route").',
  'output.per_iteration': 'Loop workflows only. When checked, the engine produces a DISTINCT file per loop iteration by injecting the synthetic {iteration} counter (0-based, engine-managed like run_id) into the path before the extension at load time: data/report.json → data/report_{iteration}.json. Unchecked, the file is OVERWRITTEN on every iteration (current-state dataflow — the next iteration reads the fresh file). Read the accumulated history in a later step with a glob input such as data/report_*.json. Validation rejects this flag in workflows without a loop_back step (the iteration counter never exists there).',
  'output.write_proof': 'Freshness check — detects the "claimed success but never actually wrote the file" failure: the engine snapshots the declared outputs at step_begin (mtime+hash+size baseline) and at the gate verifies the file was written DURING this step run. Modes: required (default for explicit paths) — the file must be touched this step; all_members_fresh (default for glob paths) — every glob match must be touched; any_member — at least one glob match touched; off — freshness not demanded (a stale/pre-existing file is acceptable). Note: existence is a separate axis — a declared, non-optional output must exist regardless of this mode (use the optional flag when absence is legitimate).',
  'output.optional': 'Existence axis. When checked, a missing file is NOT a failure — all checks (existence, struct, write_proof) are skipped when the file is absent; when the file IS present, all configured checks run normally. Use for genuinely conditional outputs (e.g. an issues report produced only when issues were found). Leave unchecked for pipeline outputs the next steps depend on.',
  'step.delegate_params': 'Parameters to pass to the delegated workflow. Supports {param} placeholders from the parent workflow. E.g., "source: {source_doc}" passes the parent\'s source_doc param as the delegated workflow\'s source param.',
  'output.from_delegated': 'Artifact handoff (delegation steps only). Source path in the DELEGATED child\'s run dir — at step_complete the engine copies the matched child file to this output\'s `path` (a concrete parent-side destination), making it a normal validated output of the delegation step. Later steps then declare the STATIC parent-side path as a plain input — never glob other runs or "hunt" for the child\'s files.\n\n• {param} placeholders resolve against the CHILD\'s params, including its synthetic run_id — e.g. "data/{run_id}-report.json" matches the child\'s dynamically-named report.\n• A glob is allowed but must match EXACTLY ONE file at runtime (ambiguity fails the step).\n• The output `path` must be concrete (no globs) — the dynamic part belongs here, not in the destination.\n• Missing source fails the step (FIX_AND_RETRY) unless the entry is optional.\n• write_proof has no effect on handoff entries (the engine\'s copy IS the write).\nScalars (single values) flow through param_bindings instead; from_delegated is for FILES. Full reference: workflow_learn(topic="delegation").',
  'input.path': 'File path for subagent input. Supports {param} placeholders (e.g., "data/{run_id}-plan.json") and glob patterns (e.g., ".riglane/specs/{domain}/*.md"). Paths are relative to the project root.',
  'input.inject': '"file" = orchestrator reads the file and injects full content into the subagent prompt. Best for small-medium files the subagent needs immediately. "file_if_exists" = same as file, but silently skipped if the file does not exist (no error). Useful for optional inputs like verified results. "reference" = only the path is mentioned in the prompt; subagent reads it via tools if needed. Best for large files or files the subagent may not need.',
  'input.struct': 'Struct schema name for pre-step input validation. The structural gate validates this input before the subagent starts. Ensures the input from a previous step is well-formed.',
  'output.path': 'Expected output file path written by the subagent. Supports {param} placeholders (e.g., "data/{run_id}-report.json") and glob patterns. The structural gate checks this file exists and validates against the struct schema if specified.\n\nIN A PARALLEL STEP the engine resolves each branch\'s path to a CONCRETE location — the subagent writes there and never fills a placeholder itself:\n• {param} — same value for every branch (null/unset → \'\': a directory level collapses, a filename fragment leaves a gap).\n• {parallel_key.<field>} — THIS branch\'s item field (e.g. {parallel_key.name}); the per-branch identity, and the ONLY correct way to give each branch its own path/name. NOT a {param} (one value → all branches collide).\n• {} — an explicit branch-index slot (stripped at merge).\n• a bare glob (data/x/*.md) — the engine isolates per branch and merges flat; you invent distinct filenames.\nLoad validation REJECTS an unmatched {x} (typo / retired convention) and a branch-invariant concrete path (no {parallel_key.<field>}, no glob → guaranteed collision). Full rules: workflow_learn(topic="parallel").',
  'output.struct': 'Struct schema name for post-step gate validation. After the subagent completes, riglane gate-check validates the output file against this schema (types, required fields, patterns). Only applies when gate.structural is true and subagent is true (hook must fire).',
  'struct.name': 'Schema name referenced by workflow step inputs/outputs (e.g., "extraction-manifest"). Must match exactly.',
  'struct.description': 'Human-readable description of what this schema validates.',
  'struct.format': 'Expected file format: "json", "yaml", "markdown", or "text". Determines which validation sections are available.',
  'struct.field': 'Dot-notation path to a field in the output. Use [] for array items: "tasks[].domain" means every item in the tasks array must have a domain field.',
  'struct.field_type': 'Expected type: string, number, boolean, array, or object.',
  'struct.pattern': 'Regular expression pattern the string field must match (e.g., "^[A-Z]+-\\d{3}$").',
  'struct.enum': 'Comma-separated list of allowed values for this field.',
  'struct.min_items': 'Minimum number of items required in an array field.',
  'struct.fm_field': 'Field name expected in the YAML frontmatter of a Markdown file.',
  'struct.fm_type': 'Frontmatter field type: string, number, enum, list, or boolean.',
  'struct.fm_values': 'Comma-separated allowed values for enum-type frontmatter fields.',
  'struct.required_sections': 'Required Markdown ## heading names. One per line.',
  'struct.file_exists': 'Require the output file to exist (default: true).',
  'struct.min_size': 'Minimum file size in bytes.',
  'struct.max_size': 'Maximum file size in bytes.',
  'struct.name_pattern': 'Regular expression the output filename must match.',
};

function helpBtn(key) {
  const text = HELP[key] || '';
  if (!text) return '';
  return `<span class="help-btn" data-help="${esc(key)}" onclick="event.stopPropagation(); showHelp(this, '${key}')">?</span>`;
}

// ── Help Modal System ──────────────────────────────────
function showHelp(btn, key) {
  event && event.stopPropagation();
  const text = HELP[key] || '';
  if (!text) return;
  const title = key.replace(/\./g, ' › ').replace(/_/g, ' ');
  document.getElementById('helpModalTitle').textContent = title;
  let html = `<div class="help-text">${esc(text)}</div>`;
  if (HELP_DIAGRAMS[key]) html += `<div class="help-diagram">${HELP_DIAGRAMS[key]()}</div>`;
  document.getElementById('helpModalBody').innerHTML = html;
  document.getElementById('helpModal').classList.add('visible');
}
function closeHelpModal() {
  document.getElementById('helpModal').classList.remove('visible');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelpModal(); });

// ── SVG Diagram Arrow Defs ────────────────────────────
const svgDefs = `<defs>
  <marker id="arrowHead" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--text-muted)"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--green)"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--red)"/>
  </marker>
</defs>`;

function svgNode(x, y, w, h, cls, label, labelCls='lbl') {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="node ${cls}"/>` +
         `<text x="${x+w/2}" y="${y+h/2}" class="${labelCls}">${label}</text>`;
}

// ── Diagram: Gate Flow ────────────────────────────────
function svgGateFlow(highlight) {
  // horizontal pipeline: Step Done → Structural → Semantic → Human → Pass / Retry
  const W=470, H=120;
  const bw=80, bh=32, gap=14, y1=20, y2=y1+bh/2;
  const stages = [
    { x:0,   label:'Step Done', cls:'node-muted', key:null },
    { x:94,  label:'Structural', cls:'node-blue', key:'structural' },
    { x:188, label:'Semantic',   cls:'node-purple', key:'semantic' },
    { x:282, label:'Human',      cls:'node-amber', key:'human' },
  ];
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${svgDefs}`;
  stages.forEach((st, i) => {
    const highlighted = highlight === 'all' || highlight === st.key;
    const opacity = highlighted || st.key === null ? 1 : 0.35;
    s += `<g style="opacity:${opacity}">`;
    s += svgNode(st.x, y1, bw, bh, st.cls, st.label);
    if (i < stages.length - 1) {
      s += `<line x1="${st.x+bw}" y1="${y2}" x2="${stages[i+1].x}" y2="${y2}" class="arrow"/>`;
    }
    s += `</g>`;
  });
  // Pass / Fail branches
  const lastX = 282 + bw;
  // Pass arrow → green box
  s += `<line x1="${lastX}" y1="${y2}" x2="${lastX+20}" y2="${y2}" class="arrow-green"/>`;
  s += svgNode(lastX+20, y1, 70, bh, 'node-green', '✓ Pass', 'lbl lbl-green');
  // Fail arrow → red box (below)
  const fy = y1 + bh + 20;
  s += `<line x1="${lastX-bw/2}" y1="${y1+bh}" x2="${lastX-bw/2}" y2="${fy}" class="arrow-red"/>`;
  s += svgNode(lastX-bw-10, fy, 90, bh, 'node-red', '✗ Retry', 'lbl lbl-red');
  // Label: retries
  s += `<text x="${lastX-bw/2+50}" y="${fy+bh/2}" class="lbl lbl-sm" text-anchor="start"> gate retries</text>`;
  s += `</svg>`;
  return s;
}

// ── Diagram: Retry Flow ───────────────────────────────
function svgRetryFlow(type) {
  const chip = (label, bg, color, border) =>
    `<span style="padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;background:${bg};color:${color};border:1.5px solid ${border};white-space:nowrap">${label}</span>`;
  const arrow = (color) =>
    `<span style="color:${color};font-size:12px;margin:0 2px">&#8594;</span>`;
  const note = (text) =>
    `<span style="font-size:10px;color:var(--text-muted);font-style:italic">${text}</span>`;

  if (type === 'gate') {
    return `<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${chip('Gate Fail','var(--red-bg)','var(--red)','var(--red)')}
        ${arrow('var(--text-muted)')}
        ${chip('retries &lt; max?','var(--accent-light)','var(--accent)','var(--accent)')}
      </div>
      <div style="padding-left:20px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="color:var(--green);font-size:11px;font-weight:600">YES</span>
          ${arrow('var(--green)')}
          ${chip('Same Agent','var(--green-bg)','var(--green)','var(--green)')}
          ${note('receives feedback, self-corrects in place')}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="color:var(--red);font-size:11px;font-weight:600;padding-right:3px">NO</span>
          ${arrow('var(--red)')}
          ${chip('Step Retry','var(--amber-bg)','var(--amber)','var(--amber)')}
          ${note('new subagent spawned with failure context')}
        </div>
      </div>
    </div>`;
  } else {
    return `<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${chip('Gate Max','var(--amber-bg)','var(--amber)','var(--amber)')}
        ${arrow('var(--text-muted)')}
        ${chip('step retries &lt; max?','var(--accent-light)','var(--accent)','var(--accent)')}
      </div>
      <div style="padding-left:20px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="color:var(--green);font-size:11px;font-weight:600">YES</span>
          ${arrow('var(--green)')}
          ${chip('New Subagent','var(--green-bg)','var(--green)','var(--green)')}
          ${note('clean context + failure details injected')}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="color:var(--red);font-size:11px;font-weight:600;padding-right:3px">NO</span>
          ${arrow('var(--red)')}
          ${chip('Step Failed','var(--red-bg)','var(--red)','var(--red)')}
          ${note('workflow pauses, human intervention needed')}
        </div>
      </div>
    </div>`;
  }
}

// ── Toast ─────────────────────────────────────────────
function showToast(msg, ms=2000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}

// ── Example Workflow ──────────────────────────────────
const EXAMPLE_WORKFLOW_YAML = `name: code-review-pipeline
version: 1
description: >
  Automated code review pipeline. Analyzes a repository branch,
  discovers the best reviewer, runs structured review, and generates
  a summary report.

params:
  - name: repo_path
    description: >
      Path to the repository root.
    required: true
  - name: branch
    description: >
      Branch to review. Defaults to main.
    required: false
    default: main
  - name: reviewer
    description: >
      Reviewer name (auto-discovered by analyze step if not provided).
    required: false

gate:
  structural: true
  semantic: true
  human: false
  max_gate_retries: 5
  max_step_retries: 3

context:
  carry_forward: summary

steps:
  - name: analyze
    goal: >
      Scan {repo_path} on branch {branch}. Identify changed files,
      complexity hotspots, and the best reviewer from git blame.
      Write findings to the analysis output.
    subagent: true
    spec_check: false
    inputs:
      - path: "{repo_path}/README.md"
        inject: file_if_exists
      - path: "{repo_path}/CONTRIBUTING.md"
        inject: reference
    outputs:
      - path: data/analysis.json
        struct: analysis-result
    param_bindings:
      reviewer: "data/analysis.json::lead_reviewer"

  - name: review
    goal: >
      Perform a thorough code review of {branch} in {repo_path}.
      Reviewer: {reviewer}. Check for bugs, security issues,
      style violations, and missing tests.
    subagent: true
    spec_check: true
    carry_forward: true
    gate:
      human: true
      max_step_retries: 1
    inputs:
      - path: data/analysis.json
        inject: file
        struct: analysis-result
    outputs:
      - path: data/review-report.json
        struct: review-report

  - name: report
    goal: >
      Generate a human-readable summary report from the review.
      Include stats, top issues, and recommendations.
    subagent: true
    spec_check: true
    parallel: false
    inputs:
      - path: data/review-report.json
        inject: file
    outputs:
      - path: data/summary.md
`;
