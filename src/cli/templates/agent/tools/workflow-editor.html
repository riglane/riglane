    const vpBox = document.getElementById('gvCanvas');
    const expW = Math.max(320, Math.min(FORM_W,
      Math.round(((vpBox && vpBox.clientWidth) || 900) / EXPAND_AT) - MARGIN * 2));
    // The cap is on the scrolling BODY, so the card's own header and padding
    // (~78px) come out of the budget too, or the card ends up taller than the
    // room reserved for it.
    const expH = Math.max(220,
      Math.round(((vpBox && vpBox.clientHeight) || 700) / EXPAND_AT) - MARGIN * 2 - 78);
    document.documentElement.style.setProperty('--gv-exph', expH + 'px');
    const W = exp ? expW : 248;
    // Gaps are CLEARANCE between boxes, not a fixed pitch — a fixed pitch made
    // tall cards (chips wrap to 2-3 lines) nearly touch. Ranks/lanes are placed
    // cumulatively from the MEASURED extent of everything on them.
    // Clearance, with a FLOOR derived from the busiest edge: every slot of edge
    // furniture needs room, so compacting can never squeeze two of them onto the
    // same spot. This is the same idea as flow-trace reserving an edge label's
    // real box in the layout — reserve first, then let the slider work above it.
    // PER-RANK clearance, not one global gap: each gap only has to be as tall as
    // the busiest edge that actually crosses IT. A bare connection collapses to
    // almost nothing while a connection carrying outputs + gates + inputs keeps
    // the room it needs — that is what "compact each edge as far as it can go"
    // means, and a single global gap could never express it.
    const byIdEarly = new Map(g.nodes.map(function (n) { return [n.id, n]; }));
    // v1 allows one loop_back per SEQUENCE (the engine validates main and each
    // route independently), so the "attach a loop" slot is offered unless THIS
    // step's own sequence already has one. A loop inside a route never blocks
    // the main flow — the earlier workflow-wide scan did, which is why the
    // graph refused a perfectly valid second loop.
    const plan = furnPlan(g, byIdEarly, () => null);   // loops are no longer gated
    // Room reserved per rank: enough for the busiest edge crossing it to lay its
    // furniture out end to end, plus clearance at each node. SLOT_H is a safe
    // upper bound on a chip's height — the real placement below uses measured
    // sizes and packs tighter, so this is a ceiling, never a stretcher.
    const SLOT_H = 27, SLOT_GAP = 9, EDGE_PAD = 17, BARE_GAP = vertical ? 52 : 90;
    const need = {};
    g.edges.forEach(function (e, i) {
      const pa = pos[e.from], pb = pos[e.to];
      if (!pa || !pb || pb.rank !== pa.rank + 1) return;  // longer spans already have slack
      const n = plan[i].length;
      need[pa.rank] = Math.max(need[pa.rank] || BARE_GAP, n * SLOT_H + (n - 1) * SLOT_GAP + 2 * EDGE_PAD + 26);
    });
    Object.keys(furnNeed).forEach(function (r) { need[r] = Math.max(need[r] || BARE_GAP, furnNeed[r]); });
    const base = (vertical ? 100 : 150) * spread;
    const gapForRank = function (r) { return Math.max(need[r] || BARE_GAP, base); };
    const LANE_GAP = Math.max(vertical ? 70 : 56, (vertical ? 80 : 64) * spread);
    const box = {}, byId = new Map(g.nodes.map(n => [n.id, n]));

    // pass 1 — create + measure
    g.nodes.forEach(function (n) {
      const p = pos[n.id]; if (!p) return;
      const term = n.kind === 'start' || n.kind === 'end';
      // The start node carries params/tools/gate — when expanded it needs the
      // SAME width as a step card, or its 2-column grid collapses to ~110px
      // columns and every value wraps one character per line.
      const w = term ? (exp && n.kind === 'start' ? W : 190) : W;
      const d = document.createElement('div');
      d.className = 'gv-node k-' + (n.stepKind || n.kind) + (exp ? ' exp' : '') + (term ? ' term' : '') +
        (sel === n.id ? ' sel' : '') + (justAdded === n.id ? ' gv-new' : '') +
        (justGrew ? ' gv-grew' : '') +
        (valMarks && valMarks.byAddr[n.id] ? ' gv-verr' : '');
      d.style.cssText = 'left:0;top:0;width:' + w + 'px;visibility:hidden';
      d.innerHTML = nodeHTML(n, exp);
      d.dataset.id = n.id;
      if (valMarks && valMarks.byAddr[n.id]) {
        const bad = valMarks.byAddr[n.id];
        d.insertAdjacentHTML('beforeend',
          '<button class="gv-errbadge" title="' + esc(bad.length + ' problem' + (bad.length === 1 ? '' : 's') +
          ' — click to read') + '" onclick="GV.errs(event,\'' + n.id + '\')">!</button>');
      }
      surface.appendChild(d);
      box[n.id] = { w: w, h: 0, rank: p.rank, lane: p.lane, el: d };
    });
    g.nodes.forEach(function (n) { const b = box[n.id]; if (b) b.h = b.el.offsetHeight; });

    // pass 2 — cumulative rank/lane offsets from the real extents
    const alongOf = b => vertical ? b.h : b.w;
    const acrossOf = b => vertical ? b.w : b.h;
    const rankExt = {}, laneExt = {};
    Object.keys(box).forEach(function (id) {
      const b = box[id];
      rankExt[b.rank] = Math.max(rankExt[b.rank] || 0, alongOf(b));
      laneExt[b.lane] = Math.max(laneExt[b.lane] || 0, acrossOf(b));
    });
    const cum = (ext, gapFor) => {
      const keys = Object.keys(ext).map(Number).sort((a, b) => a - b), out = {};
      let acc = 0;
      keys.forEach(function (k, i) { out[k] = acc; acc += ext[k] + (i < keys.length - 1 ? gapFor(k) : 0); });
      return { pos: out, total: acc };
    };
    const R = cum(rankExt, gapForRank), L = cum(laneExt, function () { return LANE_GAP; });

    // pass 3 — place for real, centring each node within its lane band
    let maxX = 0, maxY = 0, minX = Infinity, minY = Infinity;
    Object.keys(box).forEach(function (id) {
      const b = box[id];
      const along = R.pos[b.rank];
      const across = L.pos[b.lane] + (laneExt[b.lane] - acrossOf(b)) / 2;
      b.x = vertical ? across : along;
      b.y = vertical ? along : across;
      b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2;
      b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px'; b.el.style.visibility = '';
      maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
      minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    });
    const gutter = { min: vertical ? minX : minY };
    lastBox = box;
    justAdded = null;   // the pop class is applied once, on the draw right after the insert

    // ── Tool satellites ────────────────────────────────────────────────────
    // A tool is a resource the step may CALL, not a stage that runs after it —
    // so it hangs off the card on a short tether, clear of the main line where
    // it would read as "next". Only steps that NAME tools get satellites —
    // under declare-to-use a step that names none HAS none, so there is
    // nothing to draw, and the start node already carries the full workflow
    // inventory.
    const satBoxes = [], tethers = [], satPosNow = {};
    // Everything already on the canvas that a satellite must not land on.
    const cards = Object.keys(box).map(function (id) {
      const b = box[id]; return { x: b.x, y: b.y, w: b.w, h: b.h };
    });
    const hits = function (r, list) {
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        if (r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y) return true;
      }
      return false;
    };
    g.nodes.forEach(function (n) {
      if (n.kind !== 'step' || !n.tools || !n.tools.list.length) return;
      const b = box[n.id]; if (!b) return;
      let off = 0;
      n.tools.list.forEach(function (t) {
        const el = document.createElement('button');
        el.className = 'gv-tool';
        el.dataset.tool = t.name;
        el.title = 'Tool "' + t.name + '" (' + (t.type || 'script') +
          ') — named by this step. Click to open its definition.';
        el.innerHTML = ico(t.type === 'mcp' ? 'tool-mcp' : 'tool-script') +
          '<span>' + esc(t.name) + '</span><span class="gv-tool-t">' + esc(t.type || 'script') + '</span>';
        el.onclick = function (ev) { ev.stopPropagation(); GV.tool(t.name); };
        surface.appendChild(el);
        const tw = el.offsetWidth, th = el.offsetHeight;
        // Vertical flow keeps the spine free, so satellites go to the right;
        // left-right flow stacks them under the card (above is the loop gutter).
        // Preferred side first, then further out, then the other side entirely —
        // a satellite is attached to its card by a tether, so which side it hangs
        // off is free, but landing on someone else's card is not.
        const along = vertical ? (b.y + 4 + off) : (b.x + b.cx - b.cx + off);
        let x, y, ok = false;
        for (let k = 0; k < 8 && !ok; k++) {
          const push = k * 34;
          const flip = k >= 4;
          if (vertical) {
            x = flip ? (b.x - tw - 26 - (k - 4) * 34) : (b.x + b.w + 26 + push);
            y = along;
          } else {
            x = b.cx - tw / 2;
            y = flip ? (b.y - th - 26 - (k - 4) * 34) : (b.y + b.h + 26 + push);
          }
          ok = !hits({ x: x - 6, y: y - 4, w: tw + 12, h: th + 8 }, cards.concat(satBoxes));
        }
        off += th + 6;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.dataset.sat = n.id + '|' + t.name;
        satPosNow[el.dataset.sat] = { x: x, y: y };
        satBoxes.push({ x: x, y: y, w: tw, h: th });
        maxX = Math.max(maxX, x + tw); maxY = Math.max(maxY, y + th);
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        const left = x + tw / 2 < b.cx, above = y + th / 2 < b.cy;
        tethers.push(vertical
          ? { a: { x: left ? b.x : b.x + b.w, y: Math.min(b.y + b.h - 4, Math.max(b.y + 4, y + th / 2)) },
              b: { x: left ? x + tw : x, y: y + th / 2 } }
          : { a: { x: Math.min(b.x + b.w - 4, Math.max(b.x + 4, x + tw / 2)), y: above ? b.y : b.y + b.h },
              b: { x: x + tw / 2, y: above ? y + th : y } });
      });
    });

    const furnItems = [];
    let s = '<defs><marker id="gvArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">' +
            '<path d="M0,0 L8,3 L0,6 z" fill="currentColor"/></marker></defs>';
    // Tethers first, so a control-flow line always draws over them.
    tethers.forEach(function (t) {
      s += '<path d="M ' + t.a.x + ',' + t.a.y + ' L ' + t.b.x + ',' + t.b.y + '" fill="none" ' +
           'stroke="var(--gv-edge)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.55"/>';
    });
    // Where routes leave a step the split itself becomes visible: a junction dot
    // at the exit, so a fan-out reads as a branch point and not as several
    // unrelated lines that happen to start in the same place.
    const junction = {}, laneJunction = {};
    g.edges.forEach(function (e) {
      if (e.kind === 'route' || e.kind === 'proceed') junction[e.from] = true;
      if (e.kind === 'lane') laneJunction[e.from] = true;
    });
    // An empty workflow has no connection to hang the insert control on, so the
    // start node carries it directly: this is how a workflow is begun here.
    if (!g.edges.length && box['__start']) {
      const b0 = box['__start'];
      const seed = document.createElement('div');
      seed.className = 'gv-mech m-add';
      seed.innerHTML = '<button class="gv-mech-b" title="Add the first step of this workflow">' +
        ico('plus') + '<span class="gv-mech-t">first step</span></button>';
      seed.style.left = (vertical ? b0.cx : b0.x + b0.w + 46) + 'px';
      seed.style.top = (vertical ? b0.y + b0.h + 46 : b0.cy) + 'px';
      seed.querySelector('.gv-mech-b').onclick = function (ev) { ev.stopPropagation(); GV.add('__start', '__end'); };
      surface.appendChild(seed);
      maxX = Math.max(maxX, b0.x + b0.w + 120); maxY = Math.max(maxY, b0.y + b0.h + 120);
    }
    const loopArcs = [], elabCards = [];
    // Edge labels are PLANNED here and PLACED after the furniture settles:
    // they used to be drawn straight into the SVG (under the HTML chips), so
    // a marker landing on the same spot simply covered the text. Each plan
    // carries its own segment, so the placement pass can slide the label
    // along it to a clear spot.
    const labelPlan = [];
    // Every drawn polyline, for the overlap pass: markers must keep clear of
    // FOREIGN lines too, not only of cards and other markers — a bend from a
    // converging edge used to pass under a chip with zero collision cost.
    const edgePolys = [];
    let routeAnchorMissing = false;
    const anchorUsed = {};
    g.edges.forEach(function (e, ei) {
      const a = box[e.from], b = box[e.to]; if (!a || !b) return;
      // Deferred: a backward arc starts at its loop marker, and the marker's
      // final position is only known after the layout below has settled.
      if (e.kind === 'loop_back') { loopArcs.push(e); return; }
      let pts = route(e, a, b, gutter);
      pts = simplify(pts, 2.5);
      // clip both ends to the node border along the real approach direction
      pts[0] = clipToBox({ x: a.x, y: a.y, w: a.w, h: a.h }, pts[1] || pts[0], 4);
      pts[pts.length - 1] = clipToBox({ x: b.x, y: b.y, w: b.w, h: b.h }, pts[pts.length - 2] || pts[pts.length - 1], 6);
      // Branching starts where branching is CONFIGURED: a route line leaves the
      // routes marker, not the card edge above it. The marker's position is
      // known only after the furniture settles, so take the settled position
      // from the previous pass and ask for one extra pass when there is none
      // yet — the same two-pass mechanism the overlap resolution already uses.
      //
      // The anchored line is for DRAWING ONLY. The furniture on this connection
      // is always packed along the GEOMETRIC line (card edge to card edge),
      // because the anchor IS a chip's own settled position: pack on it and
      // every chip's place depends on where it landed last time. That
      // self-reference has no fixed point — the layout stopped being
      // idempotent, so a single click scattered the whole strip off the spine
      // and no later redraw ever put it back. Draw from the marker; lay out
      // from geometry.
      let drawPts = pts;
      if (e.kind === 'route' || e.kind === 'proceed') {
        const rm = lastSlotPos[e.from + '|routes'];
        if (rm) {
          const rr = Math.max(rm.w, rm.h) / 2 + 3;
          drawPts = pts.slice();
          drawPts[0] = vertical ? { x: rm.x, y: rm.y + rr } : { x: rm.x + rr, y: rm.y };
          // Where this line was drawn FROM, so the settle step below can tell
          // whether the marker has since moved (opening a panel shifts it) and
          // ask for the one extra pass that re-anchors it. Without this the
          // line kept starting where the marker USED to be.
          anchorUsed[e.from] = { x: rm.x, y: rm.y };
        } else {
          routeAnchorMissing = true;
        }
      }
      // Control flow gets its own two hues, held apart from the five step-kind
      // colours: branching and repetition are things the ENGINE does BETWEEN
      // steps, and neither may be mistaken for what a step IS.
      const col = e.kind === 'loop_back' ? 'var(--gv-loop)'
        : (e.kind === 'lane' || e.kind === 'lane-exit') ? 'var(--gv-lanes)'
        : (e.kind === 'route' || e.kind === 'proceed') ? 'var(--gv-route)'
        : e.tint === 'lane' ? 'var(--gv-lanes)'
        : e.tint === 'route' ? 'var(--gv-route)' : 'var(--gv-edge)';
      const dash = e.kind === 'proceed' ? '2 6' : '';
      const ek = e.from + '>' + e.to + '>' + e.kind;
      // GEOMETRIC pts, never drawPts: this list is what the furniture packer
      // charges proximity against, and drawPts[0] is a marker's settled place
      // from the PREVIOUS pass. Packing on it would make every chip's position
      // depend on where chips landed last time — the self-reference with no
      // fixed point that the anchoring comment above exists to forbid. Drawing
      // uses drawPts; layout uses this.
      edgePolys.push({ ei: ei, pts: pts });
      const dpath = roundedPath(drawPts, 10);
      s += '<g class="gv-e' + (selEdge === ek ? ' on' : '') + '" style="color:' + col + '">' +
           '<path class="gv-hit" data-ek="' + esc(ek) + '" d="' + dpath + '" fill="none" stroke="transparent" stroke-width="15"/>' +
           '<path d="' + dpath + '" fill="none" stroke="' + col +
           '" stroke-width="' + (e.kind === 'route' ? 2 : 1.6) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') +
           ' marker-end="url(#gvArrow)" opacity="' + (e.kind === 'proceed' ? 0.6 : 0.92) + '"/></g>';
      if (junction[e.from] && e.kind !== 'loop_back')
        s += '<circle cx="' + drawPts[0].x + '" cy="' + drawPts[0].y + '" r="4.5" fill="var(--bg-card)" ' +
             'stroke="var(--gv-route)" stroke-width="2"/>';
      // The lane fork point: same junction idea, the lanes hue — several lines
      // leaving one exit must read as ONE fork, not coincident starts.
      if (laneJunction[e.from] && e.kind === 'lane')
        s += '<circle cx="' + drawPts[0].x + '" cy="' + drawPts[0].y + '" r="4.5" fill="var(--bg-card)" ' +
             'stroke="var(--gv-lanes)" stroke-width="2"/>';
      // JOIN BARRIER — the one genuinely new drawing lanes need: a short
      // tick across each lane's approach to the shared join point, so the
      // convergence reads as a barrier the run must clear, not as lines that
      // happen to share a target. The LAST point of the polyline is the
      // arrival; the tick sits just before it, perpendicular to the approach.
      // Keyed on the barrier METADATA, not on the edge kind: a lane can also be
      // closed by a route's 'no branch' edge, which keeps the route hue but
      // still crosses the barrier. Anything carrying a fork is an approach.
      if (e.fork) {
        const pEnd = drawPts[drawPts.length - 1], pPrev = drawPts[drawPts.length - 2] || pEnd;
        const vx = pEnd.x - pPrev.x, vy = pEnd.y - pPrev.y;
        const vl = Math.hypot(vx, vy) || 1;
        const bx = pEnd.x - (vx / vl) * 16, by = pEnd.y - (vy / vl) * 16; // 16px before arrival
        const nx = -(vy / vl) * 8, ny = (vx / vl) * 8; // half-width 8 perpendicular
        s += '<path d="M ' + (bx - nx) + ',' + (by - ny) + ' L ' + (bx + nx) + ',' + (by + ny) +
             '" stroke="var(--gv-lanes)" stroke-width="3" stroke-linecap="round"/>';
        // The policy, written once per fork at the first barrier tick drawn.
        if (!anchorUsed['join:' + e.fork]) {
          anchorUsed['join:' + e.fork] = true;
          labelPlan.push({ text: 'join: ' + (e.join || 'all'), cls: 'gv-elab',
            style: 'fill:var(--gv-lanes)', x: bx, y: by, dy: 16,
            seg: [pPrev, pEnd] });
        }
      }
      /* The lane's name, written just BEFORE its line turns away.
         Every lane leaves the SAME fork, so the opening stretch of each line
         is shared: a label at that segment's midpoint lands on top of every
         other lane's label (live review — "research lane" over "review lane",
         both over the loop marker). The lines separate only where they bend
         off to their own column, so the last stretch before the bend is the
         first place the name can belong to one line and be read.
         Set back from the corner by half the text plus the bend radius, so it
         stops short of the turn instead of riding around it — and never past
         the middle of a short run, where setting back would undo itself. */
      if (e.kind === 'lane') {
        const txtL = (e.lane || '') + ' lane';
        /* Walk back from the LAST bend to the first run long enough to hold
           the name. Not the first run: lanes share their stem out of the fork
           (measured: two lanes both run 124,665 -> 124,816 and separate only
           afterwards), so a label there names the fork, not the lane. The run
           that carries a lane to its own column is where it becomes its own
           line — and its far end is where the eye is already going. */
        let si = -1;
        for (let k = drawPts.length - 2; k >= 1; k--) {
          const d = Math.hypot(drawPts[k].x - drawPts[k - 1].x, drawPts[k].y - drawPts[k - 1].y);
          if (d >= 40) { si = k; break; }
        }
        const turnsL = si > 0;                    // a bend to sit before at all
        if (!turnsL) si = 1;                      // straight line: keep the midpoint
        const p0l = drawPts[si - 1] || drawPts[0], p1l = drawPts[si] || p0l;
        const horizL = Math.abs(p1l.x - p0l.x) >= Math.abs(p1l.y - p0l.y);
        const runL = Math.hypot(p1l.x - p0l.x, p1l.y - p0l.y);
        const backL = turnsL ? Math.min(txtL.length * 3.2 + 14, runL / 2) : runL / 2;
        const tL = runL ? (runL - backL) / runL : 0.5;
        const ql = { x: p0l.x + (p1l.x - p0l.x) * tL, y: p0l.y + (p1l.y - p0l.y) * tL };
        labelPlan.push({ text: txtL, cls: 'gv-elab',
          style: 'fill:var(--gv-lanes)', x: horizL ? ql.x : ql.x + 8, y: ql.y,
          dy: horizL ? -11 : 4, seg: [p0l, p1l] });
      }
      // Which branch this line IS — written on the line itself, close to where
      // it arrives. A label, not a control: the control that edits the branches
      // is the single one back at the junction.
      if (e.kind === 'route' || e.kind === 'proceed') {
        /* On the LONGEST straight run of the line, offset clear of it. At a
           fixed fraction the label landed on whatever happened to be there —
           usually a corner, with the line struck through the text. */
        let best = 0, bl = -1;
        for (let k = 1; k < drawPts.length; k++) {
          const d = Math.hypot(drawPts[k].x - drawPts[k - 1].x, drawPts[k].y - drawPts[k - 1].y);
          if (d > bl) { bl = d; best = k; }
        }
        const p0 = drawPts[best - 1], p1 = drawPts[best];
        const horiz = Math.abs(p1.x - p0.x) >= Math.abs(p1.y - p0.y);
        const q = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
        // Above a horizontal run; beside a vertical one, where "above" would
        // simply put the text back on the line.
        const dy = horiz ? -11 : 4;
        if (!horiz) q.x += 8;
        const lk = 'elab:' + e.from + ':' + (e.kind === 'route' ? e.route : 'proceed');
        const plan = { text: (e.kind === 'route' ? e.route + ' branch' : 'no branch'),
          cls: 'gv-elab gv-elab-click', dataK: lk, x: q.x, y: q.y, dy: dy,
          seg: [p0, p1] };
        labelPlan.push(plan);
        // What this path IS, told at the label that names it. The card renders
        // only while its key is open, so the canvas stays quiet otherwise.
        // The card follows the PLAN object — the placement pass may move it.
        if (state.ui.gvOpen.has(lk)) {
          const who = e.deciders && e.deciders.length ? e.deciders.join(' + ') : '';
          elabCards.push({ key: lk, plan: plan, x: q.x, y: q.y + dy,
            title: e.kind === 'route' ? '"' + e.route + '" branch' : 'no branch — proceed',
            body: e.kind === 'route'
              ? 'Taken when the engine picks this branch' + (who ? ', decided by <b>' + esc(who) + '</b>' : '') +
                '. Its steps run in line, then control returns to the main flow.'
              : 'The path when the engine picks NONE of the branches' +
                (who ? ' (the same deciders — <b>' + esc(who) + '</b> — return the reserved verdict “proceed”)' : '') +
                '. Nothing extra runs: the workflow continues straight to the next step of the main flow.' });
        }
      }

      // ── Edge mechanisms ───────────────────────────────────────────────
      // Everything that is NOT a step but describes how you get from one step
      // to the next is a marker ON the line, the same round shape as the + that
      // inserts a step — one icon per mechanism. Collapsed it is just the icon;
      // clicking opens it in place, and past the expand threshold they are all
      // open at once. Nothing is ever raised as a dialog over the canvas.
      plan[ei].forEach(function (f) {
        const el = document.createElement('div');
        let icon, label, count = null, cls = '', body = '', key = '', title = '';
        if (f.kind === 'add') {
          icon = 'plus'; label = 'add step'; cls = 'm-add';
          title = 'Insert a step on this connection';
        } else if (f.kind === 'gate') {
          const L = f.layer;
          icon = L ? L.ic : 'gate-structural';
          label = L ? L.lbl + ' gate' : 'no gate';
          cls = 'm-gate ' + (L ? 'g-' + L.k : 'ghost');
          key = f.addr + '|gate:' + (L ? L.k : 'none');
          title = L ? 'The ' + L.lbl + ' gate — this step must pass it before the run moves on'
            : 'This step passes straight through — open to add a check';
          if (L && L.k === 'human' && isCondHuman(f.gate.human)) {
            label = 'human gate?';
            title = 'CONDITIONAL human gate — a script decides at gate time whether this run needs approval';
          }
          // One gate layer per row; the human row carries WHERE its question
          // goes (the channel is part of that gate, not a separate concern).
          body = '<div class="gv-mech-gates">' + GATE_LAYERS.map(function (x) {
            const on = !!f.gate[x.k];
            const slot = '<button class="gv-gslot ' + x.cls + (on ? ' on' : ' off') + '" data-l="' + x.k + '" title="' +
              (on ? 'Remove the ' + x.lbl + ' gate from this step' : 'Add a ' + x.lbl + ' gate to this step') +
              '">' + ico(x.ic) + x.lbl + '</button>';
            if (x.k !== 'human') return '<div class="gv-gate-row">' + slot + '</div>';
            const stG = (resolveStepByPath(f.addr) || {}).gate || {};
            const wfCh = (state.workflow.gate || {}).human_channel || 'terminal';
            // The script line IS the conditionality (same rule as the Form):
            // empty → plain always-on gate, a command → the engine decides at
            // gate time. An inherited workflow-level script shows as the
            // placeholder; typing creates a step override.
            const wfHuman = (state.workflow.gate || {}).human;
            const inhScript = (stG.human == null && isCondHuman(wfHuman)) ? wfHuman.script : '';
            const scriptLine = f.gate.human
              ? '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">script</span>' +
                '<input value="' + esc(isCondHuman(stG.human) ? stG.human.script : '') + '" placeholder="' +
                (inhScript ? esc('inherited: ' + inhScript) : 'conditional: prints {&quot;human&quot;: true|false}') +
                '" onchange="updateStepGateHumanScript(\'' + f.addr + '\', this.value)"></div>'
              : '';
            return '<div class="gv-gate-row">' + slot +
              viaPillsHtml('step', f.addr, stG.human_channel != null ? stG.human_channel : null,
                wfCh, !!f.gate.human) +
              '</div>' + scriptLine;
          }).join('') + '</div>' +
          '<div class="gv-mech-hint">Evaluated in this order; every one of them must pass.' +
          ((resolveStepByPath(f.addr) || {}).subagent === false
            ? ' This step is inline: the semantic gate never fires, and a human gate counts only on external|both — there the engine still refuses to complete it without a fresh answer.'
            : '') + '</div>';
        } else if (f.kind === 'branch') {
          icon = 'route'; label = 'branch'; cls = 'm-route' + (f.has ? '' : ' ghost');
          key = f.addr + '|routes';
          count = f.has ? (resolveStepByPath(f.addr).routes.define.length) : null;
          title = f.has ? 'This step branches — open it to change the branches or how one is chosen'
            : 'Send the run down one of several named branches from here';
        } else if (f.kind === 'lanesblk') {
          icon = 'lanes'; label = 'lanes'; cls = 'm-lanes' + (f.has ? '' : ' ghost');
          key = f.addr + '|lanes';
          count = f.has ? (resolveStepByPath(f.addr).lanes.define.length) : null;
          title = f.has ? 'This step forks into parallel lanes — open it to change them or the join policy'
            : 'Run several step sequences AT THE SAME TIME from here (they rejoin at a barrier)';
        } else if (f.kind === 'io') {
          const has = f.list.length;
          icon = f.dir === 'out' ? 'out' : 'in';
          label = f.dir === 'out' ? 'outputs' : 'inputs';
          cls = 'm-' + f.dir + (has ? '' : ' ghost'); count = has || null;
          key = f.addr + '|' + label;
          title = (has ? 'Edit the ' : 'Attach the first ') + label.replace(/s$/, '') +
            ' — data flow is configured here, on the connection';
        } else if (f.kind === 'loop') {
          icon = 'loop'; label = 'loop back'; key = f.addr + '|loop';
          cls = 'm-loop' + (f.has ? '' : ' ghost') + (f.blocked ? ' blocked' : '');
          title = f.has ? 'Repeats from here — open it to change the target or the conditions'
            : f.blocked ? 'This workflow already repeats from "' + f.owner +
                '", and v1 allows one loop back per sequence — a route is its own sequence'
            : 'Repeat an earlier slice of the workflow from here';
        } else {
          // Nothing else reaches here: routes and proceed are drawn as labels on
          // their own lines, not as controls (see draw()).
          icon = 'route'; cls = 'm-route'; label = 'branch';
        }
        // The marker routes to the same explanation its panel edits, so hovering
        // the round button in the Graph says what hovering its Form twin says.
        const helpKey = f.kind === 'io' ? (f.dir === 'out' ? 'output.path' : 'input.path')
          : f.kind === 'loop' ? 'step.loop_back'
          : f.kind === 'branch' ? 'step.routes'
          : f.kind === 'lanesblk' ? 'step.lanes'
          : f.kind === 'gate' ? (f.layer ? 'step.gate' : 'step.gate')
          : '';
        const open = !!key && (exp || state.ui.gvOpen.has(key));
        el.className = 'gv-mech ' + cls + (open ? ' open' : '');
        if (key) el.dataset.slot = key;
        const panel = !open ? ''
          : f.kind === 'io' ? popBody(f.addr, label)
          : f.kind === 'branch' ? (f.has ? popBody(f.addr, 'routes')
              : '<div class="gv-pop-empty">This step does not branch: the run always continues ' +
                'to the next step.</div>' +
                '<button class="gv-pop-add" onclick="GV.io(&quot;' + f.addr + '&quot;,&quot;routes&quot;)">' +
                '+ Branch from this step</button>')
          : f.kind === 'lanesblk' ? (f.has ? popBody(f.addr, 'lanes')
              : '<div class="gv-pop-empty">No parallel lanes here: the run continues as one ' +
                'sequence.</div>' +
                '<button class="gv-pop-add" onclick="GV.io(&quot;' + f.addr + '&quot;,&quot;lanes&quot;)">' +
                '+ Fork into lanes from this step</button>')
          : f.kind === 'loop' ? (f.has ? popBody(f.addr, 'loop')
              : f.blocked ? '<div class="gv-pop-empty">This part of the flow already repeats from <b>' +
                  esc(f.owner) + '</b>. Version 1 allows one loop back per SEQUENCE — the main flow ' +
                  'and each route count separately — so either remove that one, or put this loop ' +
                  'inside a route, which is a sequence of its own.</div>'
              : '<div class="gv-pop-empty">Nothing repeats here yet.</div>' +
                '<button class="gv-pop-add" onclick="GV.io(&quot;' + f.addr + '&quot;,&quot;loop&quot;)">' +
                '+ Repeat from this step</button>')
          : body;
        el.innerHTML = '<button class="gv-mech-b"' + (helpKey ? ' data-help="' + helpKey + '"' : '') +
          ' title="' + esc(title) + '">' + ico(icon) +
          '<span class="gv-mech-t">' + esc(label) + '</span>' +
          (count != null ? '<i>' + count + '</i>' : '') + '</button>' +
          (open ? '<div class="gv-mech-p">' + panel + '</div>' : '');
        el.querySelector('.gv-mech-b').onclick = function (ev) {
          ev.stopPropagation();
          if (f.kind === 'add') { GV.add(e.from, e.to); return; }
          if (f.kind === 'loop' && !f.has && !f.blocked && !open) { GV.io(f.addr, 'loop'); return; }
          if (f.kind === 'branch' && !f.has && !open) { GV.io(f.addr, 'routes'); return; }
          if (f.kind === 'lanesblk' && !f.has && !open) { GV.io(f.addr, 'lanes'); return; }
          GV.toggleMech(key);
        };
        if (f.kind === 'gate') el.addEventListener('click', function (ev) {
          const btn = ev.target.closest('.gv-gslot');
          if (!btn) return;
          ev.stopPropagation();
          GV.gate(f.addr, btn.dataset.l);
        });
        surface.appendChild(el);
        furnItems.push({ el: el, pts: pts, ei: ei, slot: el.dataset.slot,
          side: (f.kind === 'add' || (f.kind === 'io' && f.dir === 'in')) ? 'in' : 'out' });
      });
    });
    svg.innerHTML = s;

    // ── Nothing may overlap ────────────────────────────────────────────────
    // Each chip is positioned on its OWN edge with no knowledge of the others,
    // so where two edges converge (a route rejoining the spine) their furniture
    // can land on the same spot. Now that everything is measurable, walk the
    // pieces in order and slide each one along its own flow axis until it is
    // clear of every card and every chip already settled.
    const slotAt = {};
    const needRedo = (function () {
      const rect = (x, y, w, h) => ({ x: x - w / 2, y: y - h / 2, w: w, h: h });
      const pad = (r, p) => ({ x: r.x - p, y: r.y - p, w: r.w + p * 2, h: r.h + p * 2 });
      const over = function (a, b) {
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        return ox > 0 && oy > 0 ? ox * oy : 0;
      };
      // Pass A — pack each edge's own furniture along its line by MEASURED size
      // rather than at even fractions. Even fractions gave a 24px button and a
      // three-part gate strip the same room, so on a busy edge the small ones
      // floated in space while the big ones touched.
      const groups = new Map(), measured = {};
      furnItems.forEach(function (it) {
        it.h = it.el.offsetHeight; it.w = it.el.offsetWidth;
        it.ext = vertical ? it.h : it.w;
        if (!groups.has(it.pts)) groups.set(it.pts, []);
        groups.get(it.pts).push(it);
      });
      // Room kept clear at each end of a connection: a little where it leaves the
      // source, and enough at the head for the arrow to be seen ARRIVING. A
      // marker parked on the arrowhead is what made an edge look unterminated.
      const TAIL = 12, HEAD = 26;
      groups.forEach(function (items, pts) {
        const L = polyLen(pts);
        let total = 0;
        items.forEach(function (it) { total += it.ext; });
        total += SLOT_GAP * (items.length - 1);
        // What this edge REALLY needs, now that its markers have been measured.
        const ed = g.edges[items[0].ei], pa = pos[ed.from], pb = pos[ed.to];
        if (pa && pb && pb.rank === pa.rank + 1)
          measured[pa.rank] = Math.max(measured[pa.rank] || 0, total + TAIL + HEAD + 8);
        // Centre the run on the line; if it cannot fit, share the shortfall out
        // evenly rather than letting the ends pile onto the two cards.
        const room = Math.max(24, L - TAIL - HEAD);
        const squeeze = total > room ? (total - room) / items.length : 0;
        // Which END each piece belongs to. What a step PRODUCES and what it must
        // pass on the way out hangs near the step it leaves; what a step READS
        // hangs near the step it enters. The insert control sits between them.
        const tailward = items.filter(function (it) { return it.side === 'in'; });
        const headward = items.filter(function (it) { return it.side !== 'in'; });
        const extOf = function (list) {
          let n = 0; list.forEach(function (it) { n += it.ext; });
          return n + SLOT_GAP * Math.max(0, list.length - 1);
        };
        const slack = Math.max(0, room - total);
        // Everything still fits between the ends; the spare length goes in the
        // MIDDLE, which is what pushes each group towards its own card.
        let d = TAIL;
        headward.forEach(function (it) {
          it.d = d + it.ext / 2; it.len = L;
          const q = pointAtLen(pts, it.d);
          it.x = q.x; it.y = q.y;
          d += it.ext + SLOT_GAP - squeeze;
        });
        d += slack;
        tailward.forEach(function (it) {
          it.d = d + it.ext / 2; it.len = L;
          const q = pointAtLen(pts, it.d);
          it.x = q.x; it.y = q.y;
          d += it.ext + SLOT_GAP - squeeze;
        });
        void extOf;
      });
      // Pass B — edges that converge still know nothing of each other, so slide
      // each chip along its own flow axis to the least-conflicted spot near its
      // slot. Keeping the BEST candidate rather than the last one tried is what
      // matters: an exhausted search used to leave a chip wherever it happened
      // to stop, which is how one ended up in the middle of a card.
      const settled = Object.keys(box).map(function (id) {
        const b = box[id]; return { x: b.x, y: b.y, w: b.w, h: b.h };
      }).concat(satBoxes);
      // Correct the reservation and redraw once if the estimate was off. Ranks
      // no longer carrying furniture are dropped so a folded mechanism gives its
      // room back instead of leaving a permanent hole.
      let off = false;
      Object.keys(measured).forEach(function (r) {
        if (Math.abs((furnNeed[r] || 0) - measured[r]) > 3) { furnNeed[r] = measured[r]; off = true; }
      });
      Object.keys(furnNeed).forEach(function (r) {
        if (measured[r] == null) { delete furnNeed[r]; off = true; }
      });
      if (off && !furnPass) return true;

      // Distance from a point to a segment — the line-proximity half of the
      // collision cost below.
      const segDist = function (px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const l2 = dx * dx + dy * dy;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * dx + (py - y1) * dy) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      };
      furnItems.forEach(function (it) {
        const stepPx = it.ext + 8;
        const clearR = Math.max(it.w, it.h) / 2 + 2;
        // Foreign-line proximity is a TIE-BREAKER, never a reason to leave the
        // marker's own connection: in a dense fan-out two lines run close
        // together, and charging it into the box cost pushed chips SIDEWAYS
        // off their edge into empty space ("levitating icons", live review).
        // Along-the-line candidates with zero box cost are ranked by how
        // clear of foreign lines they sit; the sideways escapes below still
        // use the box cost alone.
        const lineCost = function (x, y) {
          let a = 0;
          for (let j = 0; j < edgePolys.length; j++) {
            const ep = edgePolys[j];
            if (ep.ei === it.ei) continue;
            const q = ep.pts;
            for (let k = 1; k < q.length; k++) {
              const d = segDist(x, y, q[k - 1].x, q[k - 1].y, q[k].x, q[k].y);
              if (d < clearR) a += clearR - d;
            }
          }
          return a;
        };
        const cost = function (x, y) {
          const r = pad(rect(x, y, it.w, it.h), 2);
          let a = 0;
          for (let j = 0; j < settled.length; j++) a += over(r, settled[j]);
          return a;
        };
        let best = null;
        const offer = function (x, y) {
          const a = cost(x, y);
          if (!best || a < best.area) best = { x: x, y: y, area: a };
          return a === 0;
        };
        // Search ALONG the line first — a chip belongs to its connection, and a
        // bent or long-span edge curves around the cards its straight chord
        // would cut through. Among box-clear spots on the line, prefer the one
        // clearest of foreign lines (nearest to the packed slot wins ties by
        // search order).
        let lineBest = null;
        const lo = TAIL + it.ext / 2, hi = it.len - HEAD - it.ext / 2;
        for (let k = 0; k < 15; k++) {
          const off = Math.ceil(k / 2) * stepPx * (k % 2 ? -1 : 1);
          // Clamped to the SAME reserve the packing used. Clamping to the bare
          // ends let the search slide a marker onto the arrowhead — which is
          // how an arriving edge lost its point again.
          const q = pointAtLen(it.pts, Math.max(lo, Math.min(Math.max(lo, hi), it.d + off)));
          const a = cost(q.x, q.y);
          if (!best || a < best.area) best = { x: q.x, y: q.y, area: a };
          if (a === 0) {
            const lc = lineCost(q.x, q.y);
            if (!lineBest || lc < lineBest.lc) lineBest = { x: q.x, y: q.y, lc: lc };
            if (lc === 0) break; // clear of boxes AND of foreign lines — done
          }
        }
        if (lineBest) best = { x: lineBest.x, y: lineBest.y, area: 0 };
        // Only if the whole line is blocked does the chip step sideways off it —
        // and then it jumps CLEAR of whatever is actually in the way. Inching by
        // a fixed stride never escaped an expanded card, which is 720px wide.
        for (let pass = 0; pass < 4 && best.area; pass++) {
          const r = pad(rect(best.x, best.y, it.w, it.h), 2);
          let worst = null, wa = 0;
          for (let j = 0; j < settled.length; j++) {
            const a = over(r, settled[j]);
            if (a > wa) { wa = a; worst = settled[j]; }
          }
          if (!worst) break;
          const was = best, bx = best.x, by = best.y;
          if (vertical) {
            const hi = worst.x + worst.w + it.w / 2 + 7, lo = worst.x - it.w / 2 - 7;
            const near = Math.abs(hi - bx) <= Math.abs(lo - bx) ? [hi, lo] : [lo, hi];
            if (offer(near[0], by) || offer(near[1], by)) break;
          } else {
            const hi = worst.y + worst.h + it.h / 2 + 7, lo = worst.y - it.h / 2 - 7;
            const near = Math.abs(hi - by) <= Math.abs(lo - by) ? [hi, lo] : [lo, hi];
            if (offer(bx, near[0]) || offer(bx, near[1])) break;
          }
          if (best === was) break;   // no candidate improved on it — stop trying
        }
        // A chip that jumped clear of a CARD can land on another chip that made
        // the same jump. Cards are large and chips are small, so one last local
        // slide around wherever it ended up settles those between themselves.
        if (best.area) {
          const bx = best.x, by = best.y;
          for (let k = 1; k <= 10 && best.area; k++) {
            const off = Math.ceil(k / 2) * stepPx * (k % 2 ? -1 : 1);
            offer(vertical ? bx : bx + off, vertical ? by + off : by);
          }
        }
        it.el.style.left = best.x + 'px'; it.el.style.top = best.y + 'px';
        settled.push(rect(best.x, best.y, it.w, it.h));
        if (it.slot) slotAt[it.slot] = { x: best.x, y: best.y, w: it.w, h: it.h,
          pts: it.pts, len: it.len };
      });
      return false;
    })();
    // A route line is drawn from where its marker SETTLED, which is only known
    // now — so publish the settled positions before deciding whether another
    // pass is owed. Publishing first is what makes the extra pass converge:
    // the pass re-reads these, and the marker's own place no longer depends on
    // them (furniture packs on geometry), so the second pass is the last one.
    const anchorStale = Object.keys(anchorUsed).some(function (from) {
      const now = slotAt[from + '|routes'], was = anchorUsed[from];
      return !now || Math.abs(now.x - was.x) > 1 || Math.abs(now.y - was.y) > 1;
    });
    lastSlotPos = slotAt;
    lastSatPos = satPosNow;
    if (needRedo || ((routeAnchorMissing || anchorStale) && !furnPass)) {
      furnPass = true; draw(); furnPass = false; return;
    }

    /* Backward arcs, now that their markers have stopped moving. The arc leaves
       the loop marker itself rather than the side of the card, so the control
       that creates the repetition and the line that shows it are the same
       place — which is what makes the loop readable at a glance. */
    let arcs = '';
    loopArcs.forEach(function (e) {
      const a = box[e.from], b = box[e.to]; if (!a || !b) return;
      const m = slotAt[e.from + '|loop'];
      const from = m ? { x: m.x, y: m.y } : { x: a.cx, y: a.y + a.h };
      const r = m ? Math.max(m.w, m.h) / 2 + 3 : 0;
      // Leave the loop chip SIDEWAYS, straight into the gutter. The arc used to
      // first run along the marker's own connection to a turn point in the
      // arrowhead gap — which walked it down past the branch / add / inputs
      // chips, so repetition appeared to start at the INPUTS chip instead of at
      // the loop chip that owns it. The gutter lane is empty by construction, so
      // a straight sideways exit crosses nothing.
      // If a SIBLING chip sits between this marker and the gutter on the exit
      // level, the straight exit would pass under it and the arc would read
      // as leaving that chip. Jog the exit one chip-height aside first, so
      // the line visibly hangs off ITS OWN marker before crossing the row.
      const exitBlocked = function (x1, y1, x2, y2) {
        for (let j = 0; j < furnItems.length; j++) {
          const o = furnItems[j];
          if (m && o.slot === e.from + '|loop') continue; // the marker itself
          const ox = parseFloat(o.el.style.left), oy = parseFloat(o.el.style.top);
          const hw = o.w / 2 + 4, hh = o.h / 2 + 4;
          if (vertical) {
            if (Math.abs(oy - y1) <= hh && ox + hw > Math.min(x1, x2) && ox - hw < Math.max(x1, x2)) return true;
          } else {
            if (Math.abs(ox - x1) <= hw && oy + hh > Math.min(y1, y2) && oy - hh < Math.max(y1, y2)) return true;
          }
        }
        return false;
      };
      let pts;
      if (vertical) {
        const gx = gutter.min - 38;
        if (m && exitBlocked(from.x - r, from.y, gx, from.y)) {
          const jog = from.y + (m.h / 2 + 12);
          pts = [{ x: from.x, y: from.y + r }, { x: from.x, y: jog }, { x: gx, y: jog }, { x: gx, y: b.cy }, { x: b.x, y: b.cy }];
        } else {
          pts = [{ x: from.x - r, y: from.y }, { x: gx, y: from.y }, { x: gx, y: b.cy }, { x: b.x, y: b.cy }];
        }
      } else {
        const gy = gutter.min - 38;
        if (m && exitBlocked(from.x, from.y - r, from.x, gy)) {
          const jog = from.x - (m.w / 2 + 12);
          pts = [{ x: from.x - r, y: from.y }, { x: jog, y: from.y }, { x: jog, y: gy }, { x: b.cx, y: gy }, { x: b.cx, y: b.y }];
        } else {
          pts = [{ x: from.x, y: from.y - r }, { x: from.x, y: gy }, { x: b.cx, y: gy }, { x: b.cx, y: b.y }];
        }
      }
      pts[pts.length - 1] = clipToBox({ x: b.x, y: b.y, w: b.w, h: b.h },
        pts[pts.length - 2], 6);
      // Solid: the loop is a real path the engine takes, exactly like the forward
      // ones. Only `proceed` stays dotted, because that one is the ABSENCE of a
      // choice rather than a route of its own.
      const ek = e.from + '>' + e.to + '>loop_back', dpath = roundedPath(simplify(pts, 2), 12);
      arcs += '<g class="gv-e' + (selEdge === ek ? ' on' : '') + '" style="color:var(--gv-loop)">' +
        '<path class="gv-hit" data-ek="' + esc(ek) + '" d="' + dpath + '" fill="none" stroke="transparent" stroke-width="15"/>' +
        '<path d="' + dpath + '" fill="none" stroke="var(--gv-loop)" stroke-width="1.8" ' +
        'marker-end="url(#gvArrow)" opacity="0.92"/></g>';
      minX = Math.min(minX, vertical ? gutter.min - 38 : minX);
      minY = Math.min(minY, vertical ? minY : gutter.min - 38);
    });
    if (arcs) svg.insertAdjacentHTML('beforeend', arcs);
    // ── Label placement — AFTER the furniture settled ──
    // A label owns a segment of its line; if the packed spot is covered by a
    // chip or a card, slide it along that segment (then bump it off the line)
    // until it reads. Labels never move anything else — text yields, controls
    // do not.
    if (labelPlan.length) {
      const obstacles = furnItems.map(function (it) {
        return { x: parseFloat(it.el.style.left) - it.w / 2, y: parseFloat(it.el.style.top) - it.h / 2, w: it.w, h: it.h };
      }).concat(Object.keys(box).map(function (id) {
        const b = box[id]; return { x: b.x, y: b.y, w: b.w, h: b.h };
      }));
      const hits = function (x, y, w, h) {
        let a = 0;
        for (let j = 0; j < obstacles.length; j++) {
          const o = obstacles[j];
          const ox = Math.min(x + w / 2, o.x + o.w) - Math.max(x - w / 2, o.x);
          const oy = Math.min(y + h / 2, o.y + o.h) - Math.max(y - h / 2, o.y);
          if (ox > 0 && oy > 0) a += ox * oy;
        }
        return a;
      };
      let lbl = '';
      labelPlan.forEach(function (L) {
        const w = L.text.length * 6.4 + 8, h = 14;
        const p0 = L.seg[0], p1 = L.seg[1];
        const dx = p1.x - p0.x, dy2 = p1.y - p0.y;
        let bx = L.x, by = L.y, ba = hits(L.x, L.y + L.dy, w, h);
        if (ba > 0) {
          // Candidates: along the segment at several fractions, each also
          // tried with a perpendicular bump to the other side of the line.
          const fr = [0.5, 0.35, 0.65, 0.22, 0.78, 0.1, 0.9];
          const ln = Math.hypot(dx, dy2) || 1;
          const nx = (-dy2 / ln) * 14, ny = (dx / ln) * 14;
          for (let i = 0; i < fr.length && ba > 0; i++) {
            const cx = p0.x + dx * fr[i], cy = p0.y + dy2 * fr[i];
            const cands = [[cx, cy], [cx + nx, cy + ny], [cx - nx, cy - ny]];
            for (let c = 0; c < cands.length; c++) {
              const a = hits(cands[c][0], cands[c][1] + L.dy, w, h);
              if (a < ba) { ba = a; bx = cands[c][0]; by = cands[c][1]; }
              if (ba === 0) break;
            }
          }
        }
        // A placed label becomes an obstacle for the ones after it. Without
        // this, two labels overlapping each other cost NOTHING — only markers
        // and cards were charged — so sibling lines leaving one fork stacked
        // their names in the same spot and read as one smudge.
        obstacles.push({ x: bx - w / 2, y: by + L.dy - h / 2, w: w, h: h });
        L.x = bx; L.y = by; // elabCards follow via the shared plan object
        lbl += '<text class="' + L.cls + '"' +
          (L.style ? ' style="' + L.style + '"' : '') +
          (L.dataK ? ' data-k="' + esc(L.dataK) + '"' : '') +
          ' x="' + bx + '" y="' + by + '" dy="' + L.dy + '">' + esc(L.text) + '</text>';
      });
      svg.insertAdjacentHTML('beforeend', lbl);
      elabCards.forEach(function (c) {
        if (c.plan) { c.x = c.plan.x; c.y = c.plan.y + c.plan.dy; }
      });
    }
    // The problems of a marked card, told beside it once its badge is clicked.
    if (valMarks) Object.keys(valMarks.byAddr).forEach(function (addr) {
      if (!state.ui.gvOpen.has('err:' + addr)) return;
      const b = box[addr]; if (!b) return;
      const el = document.createElement('div');
      el.className = 'gv-errpop';
      el.style.left = (b.x + b.w + 16) + 'px'; el.style.top = b.y + 'px';
      el.innerHTML = '<div class="gv-errpop-h">' + ico('warn') +
        (valMarks.source === 'engine' ? 'problems · engine' : 'problems · editor checks') +
        '<button title="Close" onclick="GV.errs(event,\'' + addr + '\')">&times;</button></div>' +
        valMarks.byAddr[addr].map(function (m) { return '<div class="gv-errpop-m">' + esc(m) + '</div>'; }).join('') +
        (valMarks.note ? '<div class="gv-errpop-note">' + esc(valMarks.note) + '</div>' : '');
      surface.appendChild(el);
    });
    // Explanation cards for clicked path labels — the same in-place panel the
    // mechanisms use, grown from the label's own spot.
    elabCards.forEach(function (c) {
      const el = document.createElement('div');
      el.className = 'gv-mech m-route open gv-einfo';
      el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
      el.innerHTML = '<button class="gv-mech-b" title="Close">' + ico('route') +
        '<span class="gv-mech-t">' + esc(c.title) + '</span></button>' +
        '<div class="gv-mech-p"><div class="gv-mech-hint">' + c.body + '</div></div>';
      el.querySelector('.gv-mech-b').onclick = function (ev) { ev.stopPropagation(); GV.toggleMech(c.key); };
      surface.appendChild(el);
    });
    paintEdgeSel();

    // Content bounds include the loop gutter, which sits OUTSIDE the node band.
    const x0 = vertical ? Math.min(minX, gutter.min - 70) : minX;
    const y0 = vertical ? minY : Math.min(minY, gutter.min - 70);
    const cw = Math.max(1, maxX - x0), ch = Math.max(1, maxY - y0);
    svg.setAttribute('width', maxX + 200); svg.setAttribute('height', maxY + 200);
    surface.style.width = (maxX + 200) + 'px'; surface.style.height = (maxY + 200) + 'px';

    if (needsCenter) {
      const vp = document.getElementById('gvCanvas');
      if (vp && vp.clientWidth) {
        const aw = vp.clientWidth, ah = vp.clientHeight;
        // An overview stays COMPACT: never auto-zoom past the expand threshold,
        // which would silently switch every card to its detailed form on load.
        scale = Math.min(1, Math.max(MIN_SCALE, Math.min((aw - 90) / cw, (ah - 90) / ch)));
        tx = (aw - cw * scale) / 2 - x0 * scale;
        ty = (ah - ch * scale) / 2 - y0 * scale;
      }
      needsCenter = false;
      // The cards above were built for the scale we had BEFORE auto-fit. If the
      // fit crossed the expand threshold the layout no longer matches what is on
      // screen — that is how a first load ended up at 30% with every card still
      // expanded. Rebuild once at the settled scale.
      if ((scale >= EXPAND_AT) !== exp && !reflow) { reflow = true; draw(); reflow = false; return; }
    }
    apply();
  }

  /* ── The edge editor ──────────────────────────────────────────────────────
     Data flow and repetition are properties of the CONNECTION, so they are
     configured on it. The panel writes through the same mutators the Form view
     uses (addInput/updateOutput/updateLoopBack/…), which is what keeps the two
     views editing one model rather than two copies of it. */
  function popBody(addr, what) {
    const st = resolveStepByPath(addr);
    if (!st) return '';
    normalizeStepForEdit(st);   // route steps are normalised lazily by the form
    const q = "'" + addr + "'";
    if (what === 'loop') {
      const lb = st.loop_back;
      if (!lb) return '<div class="gv-pop-empty">No loop back on this step.</div>';
      const p = parentSeqOf(addr), seq = p.seq, idx = p.idx;
      const opts = seq.slice(0, idx + 1).map(function (x, j) {
        const label = x.name ? (j === idx ? x.name + ' (this step — self redo)' : x.name) : '(step ' + (j + 1) + ' — unnamed)';
        return '<option value="' + esc(x.name) + '"' + (x.name && x.name === lb.to ? ' selected' : '') +
          (x.name ? '' : ' disabled') + '>' + esc(label) + '</option>';
      }).join('');
      const missing = lb.to && !seq.slice(0, idx + 1).some(function (x) { return x.name === lb.to; });
      return '<div class="gv-pop-row"><div class="gv-pop-line">' +
          '<span style="font-size:11px;color:var(--text-muted);min-width:52px">back to</span>' +
          '<select data-help="step.loop_back.to" title="' + esc(HELP['step.loop_back.to'] || '') +
          '" onchange="updateLoopBack(' + q + ',\'to\',this.value)">' +
          (missing ? '<option value="' + esc(lb.to) + '" selected>' + esc(lb.to) + ' (not found!)</option>' : '') +
          opts + '</select></div>' +
        '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">max iter</span>' +
          '<input type="number" min="1" max="1000" data-help="step.loop_back.max_iterations" title="' +
          esc(HELP['step.loop_back.max_iterations'] || '') + '" value="' + (lb.max_iterations != null ? lb.max_iterations : '') + '"' +
          ' onchange="updateLoopBack(' + q + ',\'max_iterations\',this.value?parseInt(this.value):null)"></div></div>' +
        '<div class="gv-pop-row" data-help="step.loop_back.when"><div style="font:700 9.5px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)">when — all must agree ' +
        helpBtn('step.loop_back.when') + '</div>' +
          '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">script</span>' +
          '<input value="' + esc(lb.when.script) + '" placeholder=\'prints {"loop": true|false}\' onchange="updateLoopBackWhen(' + q + ',\'script\',this.value)"></div>' +
          '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">semantic</span>' +
          '<input value="' + esc(lb.when.semantic) + '" placeholder="condition judged on the outputs" onchange="updateLoopBackWhen(' + q + ',\'semantic\',this.value)"></div>' +
          '<div class="gv-pop-line"><label><input type="checkbox"' + (lb.when.human ? ' checked' : '') +
          ' onchange="updateLoopBackWhen(' + q + ',\'human\',this.checked)"> human decides each iteration</label></div>' +
          (lb.when.human
            ? '<div class="gv-pop-line">' + viaPillsHtml('loop', addr, lb.when.human_channel || null) + '</div>'
            : '') + '</div>' +
        '<button class="gv-pop-add" style="border-color:var(--red);color:var(--red)" onclick="toggleLoopBack(' + q + ')">Remove the loop back</button>' +
        '<div class="gv-pop-hint">Evaluated after every gate passes. On "loop" the engine resets each step from the target through this one and moves the cursor back. Several loops may live in one flow, as long as their ranges nest or stay separate — a partial overlap is refused.</div>';
    }
    if (what === 'routes') {
      const r = st.routes;
      if (!r || !(r.define || []).length) return '<div class="gv-pop-empty">No branches here.</div>';
      const w = r.when || {};
      return r.define.map(function (rt, i) {
        return '<div class="gv-pop-row"><div class="gv-pop-line">' +
          '<input data-help="step.routes.define" title="' + esc(HELP['step.routes.define'] || '') +
          '" value="' + esc(rt.id || '') + '" placeholder="branch id" ' +
          'onchange="updateRouteId(' + q + ',' + i + ',this.value)">' +
          '<button class="gv-pop-x" title="Remove this branch" onclick="removeRoute(' + q + ',' + i + ')">&times;</button></div>' +
          '<div class="gv-pop-hint" style="margin:0">' + (rt.steps || []).length + ' step' +
          ((rt.steps || []).length === 1 ? '' : 's') + ' — they run in line, then control returns here</div></div>';
      }).join('') +
        '<button class="gv-pop-add" onclick="addRoute(' + q + ')">+ Add a branch</button>' +
        '<div class="gv-pop-row" style="margin-top:9px"><div style="font:700 9.5px var(--font);letter-spacing:.09em;' +
        'text-transform:uppercase;color:var(--accent)">when — which branch is picked ' +
        helpBtn('step.routes.when') + '</div>' +
        '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">script</span>' +
        '<input value="' + esc(w.script || '') + '" placeholder=\'prints {"route": "id"}\' ' +
        'onchange="updateRoutesWhen(' + q + ',\'script\',this.value)"></div>' +
        '<div class="gv-pop-line"><span style="font-size:11px;color:var(--text-muted);min-width:52px">semantic</span>' +
        '<input value="' + esc(w.semantic || '') + '" placeholder="condition judged on the outputs" ' +
        'onchange="updateRoutesWhen(' + q + ',\'semantic\',this.value)"></div>' +
        '<div class="gv-pop-line"><label><input type="checkbox"' + (w.human ? ' checked' : '') +
        ' onchange="updateRoutesWhen(' + q + ',\'human\',this.checked)"> human picks the branch</label></div>' +
        (w.human
          ? '<div class="gv-pop-line">' + viaPillsHtml('routes', addr, w.human_channel || null) + '</div>'
          : '') + '</div>' +
        '<button class="gv-pop-add" style="border-color:var(--red);color:var(--red)" ' +
        'onclick="toggleRoutes(' + q + ')">Remove the branching</button>' +
        '<div class="gv-pop-hint">Exactly one branch runs — or none, which is the <b>proceed</b> path. ' +
        'Add steps to a branch in the Form view.</div>';
    }
    if (what === 'lanes') {
      const L = st.lanes;
      if (!L || !(L.define || []).length) return '<div class="gv-pop-empty">No lanes here.</div>';
      const req = (L.join && L.join.require === 'any') ? 'any' : 'all';
      return L.define.map(function (ln, i) {
        return '<div class="gv-pop-row"><div class="gv-pop-line">' +
          '<input data-help="step.lanes.define" title="' + esc(HELP['step.lanes.define'] || '') +
          '" value="' + esc(ln.id || '') + '" placeholder="lane id" ' +
          'onchange="updateLaneId(' + q + ',' + i + ',this.value)">' +
          '<button class="gv-pop-x" title="Remove this lane" onclick="removeLane(' + q + ',' + i + ')">&times;</button></div>' +
          '<div class="gv-pop-hint" style="margin:0">' + (ln.steps || []).length + ' step' +
          ((ln.steps || []).length === 1 ? '' : 's') + ' — all lanes run AT THE SAME TIME, then rejoin</div></div>';
      }).join('') +
        '<button class="gv-pop-add" onclick="addLane(' + q + ')">+ Add a lane</button>' +
        '<div class="gv-pop-row" style="margin-top:9px"><div style="font:700 9.5px var(--font);letter-spacing:.09em;' +
        'text-transform:uppercase;color:var(--mech-lanes)">join — when may the run continue ' +
        helpBtn('step.lanes.require') + '</div>' +
        '<div class="gv-pop-line">' +
        '<label><input type="radio" name="lanereq' + esc(addr) + '"' + (req === 'all' ? ' checked' : '') +
        ' onchange="updateLanesRequire(' + q + ',\'all\')"> all lanes must complete</label></div>' +
        '<div class="gv-pop-line">' +
        '<label><input type="radio" name="lanereq' + esc(addr) + '"' + (req === 'any' ? ' checked' : '') +
        ' onchange="updateLanesRequire(' + q + ',\'any\')"> any one completing is enough</label></div></div>' +
        '<button class="gv-pop-add" style="border-color:var(--red);color:var(--red)" ' +
        'onclick="toggleLanes(' + q + ')">Remove the lanes</button>' +
        '<div class="gv-pop-hint">The barrier always waits for EVERY lane to finish — the policy only ' +
        'changes the verdict. Merge the results in the step after the fork. ' +
        'Add steps to a lane in the Form view.</div>';
    }
    if (what === 'outputs') {
      const perIter = (state.workflow.steps || []).some(function (x) { return x.loop_back; });
      const WP = [['', 'wp: default'], ['required', 'required'], ['all_members_fresh', 'all_fresh'],
        ['any_member', 'any_member'], ['off', 'off']];
      const rows = st.outputs.map(function (o, j) {
        return '<div class="gv-pop-row"><div class="gv-pop-line">' +
          '<input data-help="output.path" title="' + esc(HELP['output.path'] || '') + '" ' +
          'value="' + esc(o.path) + '" placeholder="data/output.json" onchange="updateOutput(' + q + ',' + j + ',\'path\',this.value)">' +
          '<button class="gv-pop-x" title="Remove this output" onclick="removeOutput(' + q + ',' + j + ')">&times;</button></div>' +
          // Two named lines instead of one long one: relying on flex wrapping
          // clipped the last control (per-iter) at some panel widths.
          '<div class="gv-pop-line">' +
          structDropdown(o.struct, 'handleStructSelect(this, ' + q + ', ' + j + ', \'output\')')
            .replace('class="field-select"', 'class="field-select" data-help="output.struct"') +
          // The freshness axis: the form card has always offered it, so the edge
          // must too — moving the section here must not drop a setting.
          '<select data-help="output.write_proof" title="' + esc(HELP['output.write_proof'] || '') +
          '" onchange="updateOutput(' + q + ',' + j + ',\'write_proof\',this.value)">' +
          WP.map(function (wp) {
            return '<option value="' + wp[0] + '"' +
              ((wp[0] === '' ? !o.write_proof : o.write_proof === wp[0]) ? ' selected' : '') +
              '>' + wp[1] + '</option>';
          }).join('') + '</select></div>' +
          '<div class="gv-pop-line gv-pop-flags">' +
          '<label data-help="output.optional" title="' + esc(HELP['output.optional'] || '') + '">' +
          '<input type="checkbox"' + (o.optional ? ' checked' : '') +
          ' onchange="updateOutput(' + q + ',' + j + ',\'optional\',this.checked)"> optional</label>' +
          (perIter ? '<label data-help="output.per_iteration" title="' + esc(HELP['output.per_iteration'] || '') + '">' +
            '<input type="checkbox"' + (o.per_iteration ? ' checked' : '') +
            ' onchange="updateOutput(' + q + ',' + j + ',\'per_iteration\',this.checked)"> per-iteration</label>' : '') +
          '</div>' +
          // Artifact handoff — only a delegation step has a child to copy from.
          (st.delegate_to ? '<div class="gv-pop-line"><span style="font-size:11px;color:var(--amber);min-width:52px" ' +
            'data-help="output.from_delegated" title="' + esc(HELP['output.from_delegated'] || '') + '">from child</span>' +
            '<input value="' + esc(o.from_delegated || '') + '" placeholder="data/{run_id}-report.json (child params)" ' +
            'onchange="updateOutput(' + q + ',' + j + ',\'from_delegated\',this.value)"></div>' : '') +
          '</div>';
      }).join('');
      // param_bindings travels on the way OUT: it reads a value from one of
      // these output files and writes it into a workflow param that later steps
      // read. Same direction, same panel — its syntax even names an output path.
      const pbKeys = Object.keys(st.param_bindings || {});
      const bindings = (pbKeys.length || st.outputs.length)
        ? '<div class="gv-pop-row" style="margin-top:9px"><div style="font:700 9.5px var(--font);letter-spacing:.09em;' +
          'text-transform:uppercase;color:var(--accent)">param bindings ' + helpBtn('step.param_bindings') + '</div>' +
          pbKeys.map(function (k) {
            return '<div class="gv-pop-line">' +
              '<input value="' + esc(k) + '" placeholder="param_name" style="max-width:110px" ' +
              'onchange="renameParamBinding(' + q + ',\'' + esc(k) + '\',this.value)">' +
              '<input value="' + esc(st.param_bindings[k]) + '" placeholder="data/output.json::field" ' +
              'onchange="updateParamBinding(' + q + ',\'' + esc(k) + '\',this.value)">' +
              '<button class="gv-pop-x" title="Remove this binding" onclick="removeParamBinding(' + q + ',\'' + esc(k) + '\')">&times;</button></div>';
          }).join('') +
          '<button class="gv-pop-add" onclick="addParamBinding(' + q + ')">+ Bind a param from an output</button>' +
          '<div class="gv-pop-hint" style="margin:6px 0 0">Runs after the gate passes: reads <code>file::field</code> and updates the workflow param, so later steps read the discovered value.</div></div>'
        : '';
      return (rows || '<div class="gv-pop-empty">Nothing is produced here yet. A step with no outputs skips structural gate validation.</div>') +
        '<button class="gv-pop-add" onclick="addOutput(' + q + ')">+ Add an output</button>' + bindings;
    }
    const rows = st.inputs.map(function (o, j) {
      return '<div class="gv-pop-row"><div class="gv-pop-line">' +
        '<input data-help="input.path" title="' + esc(HELP['input.path'] || '') + '" ' +
        'value="' + esc(o.path) + '" placeholder="data/**/*.json" onchange="updateInput(' + q + ',' + j + ',\'path\',this.value)">' +
        '<button class="gv-pop-x" title="Remove this input" onclick="removeInput(' + q + ',' + j + ')">&times;</button></div>' +
        '<div class="gv-pop-line"><select data-help="input.inject" title="' + esc(HELP['input.inject'] || '') +
        '" onchange="updateInput(' + q + ',' + j + ',\'inject\',this.value)">' +
        ['file', 'file_if_exists', 'reference'].map(function (m) {
          return '<option value="' + m + '"' + (o.inject === m ? ' selected' : '') + '>' + m + '</option>';
        }).join('') + '</select>' +
        structDropdown(o.struct, 'handleStructSelect(this, ' + q + ', ' + j + ', \'input\')')
          .replace('class="field-select"', 'class="field-select" data-help="input.struct"') +
        '</div></div>';
    }).join('');
    return (rows || '<div class="gv-pop-empty">Nothing is read here yet.</div>') +
      '<button class="gv-pop-add" onclick="addInput(' + q + ')">+ Add an input</button>';
  }

  /* Ease the viewport to an offset instead of cutting to it. Anything that
     moves the canvas on the author's behalf uses this — a cut leaves them
     working out where they ended up. */
  let gliding = 0;
  function glideTo(nx, ny, ms) {
    const x0 = tx, y0 = ty, t0 = performance.now(), dur = ms || 420, id = ++gliding;
    (function step(now) {
      if (id !== gliding) return;
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      tx = x0 + (nx - x0) * e; ty = y0 + (ny - y0) * e;
      apply();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function renderTrail() {
    const host = document.getElementById('gvTrail'); if (!host) return;
    if (!trail.length) { host.className = 'gv-trail'; host.innerHTML = ''; return; }
    host.className = 'gv-trail on';
    host.innerHTML = trail.map(function (n, i) {
      return '<button title="Back to ' + esc(n) + '" onclick="GV.ascend(' + i + ')">' + esc(n) + '</button>' +
        '<span class="gv-trail-s">' + ico('enter') + '</span>';
    }).join('') + '<span class="gv-trail-here">' + esc(state.workflow.name || '(unnamed)') + '</span>';
  }

  function apply() {
    const s = document.getElementById('gvSurface'); if (!s) return;
    tx = Math.round(tx); ty = Math.round(ty);   // whole-pixel offsets = crisp text
    s.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    // The grid belongs to the canvas and travels with the content (flow-trace
    // model) — pan shifts it, zoom scales its pitch.
    const c = document.getElementById('gvCanvas');
    if (c) {
      const g = 28 * scale;
      c.style.backgroundSize = g + 'px ' + g + 'px';
      c.style.backgroundPosition = (tx % g) + 'px ' + (ty % g) + 'px';
    }
    // Shown relative to the most detailed view there is, so the top of the range
    // reads as 100%. The internal scale runs past 1 because an expanded card is
    // drawn larger than a compact one; that is an implementation detail and
    // "110%" only ever raised the question of what the missing 10% would be.
    const z = document.getElementById('gvZoom');
