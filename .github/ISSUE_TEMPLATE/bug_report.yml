name: Bug report
description: Something behaves differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two commands answer a surprising share of reports faster than a thread:

        - `riglane doctor` — checks the whole install chain.
        - `/riglane-run-workflow gate-hook-check` — proves whether the gate fires
          on your harness at all.

        The most common cause of "it does not work" is a harness that was not
        restarted after `riglane init-workflow`. Worth ruling out first.

        **Security problems do not belong here** — use private reporting
        (Security → Report a vulnerability). See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        The run stopped at step 'audit' with BLOCKED_OUT_OF_ORDER.
        I expected it to continue to 'report', which the docs say happens after a passing gate.
    validations:
      required: true

  - type: input
    id: riglane-version
    attributes:
      label: Riglane version
      description: Output of `riglane --version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: dropdown
    id: harness
    attributes:
      label: Which agent harness
      description: >
        This is load-bearing, not bookkeeping. The six harnesses differ in hook
        contracts, subagent spawning and tool scoping — the same symptom has
        different causes on different ones.
      options:
        - Claude Code
        - Cursor (IDE)
        - Cursor (cursor-agent CLI)
        - Codex
        - OpenCode
        - GitHub Copilot
        - Gemini CLI
        - Other / not sure
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: Harness version
      description: Upstream contracts change without notice, so the version matters.
      placeholder: "Claude Code 2.1.4"
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: The workflow that misbehaved
      description: >
        Paste the `workflow.yaml` — or the smallest version of it that still
        misbehaves. Without it, most engine reports cannot be reproduced.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: gate-output
    attributes:
      label: What the gate or the engine said
      description: The error text, the returned action, or the gate's failure details.
      render: text

  - type: textarea
    id: trace
    attributes:
      label: The trace, if the run wrote one
      description: >
        `.riglane/local/workflow_runs/<run_id>/trace.json`, or the part around
        the failure. This is the single most useful attachment: it records what
        the engine actually verified, rather than what anyone remembers. Strip
        anything sensitive first.
      render: json

  - type: textarea
    id: doctor
    attributes:
      label: "`riglane doctor` output"
      description: Optional, but it rules out a whole class of cause in one paste.
      render: text
